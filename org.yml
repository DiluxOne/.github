# Who the organisation is, for the scripts (#191): its name, the repository
# that holds this configuration and its App. A
# script reads these through scripts/org.py instead of writing them in; an
# organisation that adopts these workflows changes this file. The `uses:`
# lines of the workflows still name the organisation: GitHub reads them
# before any file, so they cannot come from here.
org: DiluxOne
central: DiluxOne/.github
bot:
  app: dilux-bot
  id: 333187390
# The private repository where security work happens (#194, #287): the
# advisories' fixes, the patches, the nightly review, and where a
# vulnerability posted in a public issue is moved, out of sight.
security: DiluxOne/security
# Its maintainers (#568): trusted authors in every repository
# (scripts/policy.py adds them to the review policy's `trusted-authors`),
# who may run scripts/sync-repos.py for the org-sync lane (scripts/
# autonomy.py, when the lane names no `people`), and who a security report
# posted in public mentions (scripts/triage-act.sh).
maintainers: [soydiloreto]
# The catalog each kind publishes its releases to (#552, #568): a pack's
# `release.publishes-to: "{catalog}"` is this, for its kind
# (scripts/release-issue.py, plugin-publish-ai.yml). A kind with none here
# publishes nowhere.
catalogs:
  ai-agent-plugin: diluxone-plugins-ai
# The merge queue (#451, scripts/sync-repos.py merge-queue): `auto` turns it
# on wherever GitHub gives one (every public repository; a private one only
# on GitHub Enterprise Cloud) and leaves the others ready for the day it
# does; `on` requires it and fails where it cannot be; `off` never. A
# repository's exception is repos.yml `merge-queue`.
merge-queue: auto
# `make pre-pr`, the one check before a pull request in every repository
# (#479, scripts/pre-pr.py): `optional` lists a repository without one in
# the daily drift check; `required` also fails its pull requests in the
# conventions check. It turns `required` only once every repository has one,
# so no open pull request is stopped by the release that brings the check.
# A repository that has none by design is repos.yml `pre-pr`.
pre-pr: optional
# Who signs what (#491, scripts/credits.py): a model is never a co-author.
# `warn` lets a pull request whose commits or description name one as a
# `Co-authored-by` pass with a warning; `required` fails it in the
# conventions check, with the `Assisted-by:` line to use. It turns
# `required` once the repositories are in step, so no open pull request is
# stopped by the release that brings the check.
attribution: warn
# Who decides (#588, scripts/deciders.py): whose answers the autopilot
# takes as a maintainer's once an issue is accepted, and who may add
# `accepted`, `autopilot:continue`, `/coauthor` and `/uncoauthor`. Anyone
# else's comment is data, summarised for them (#287). `codeowners`: the
# code owners of the files the change touches (the diff of the open pull
# request that closes the issue when the autopilot opened it, never a
# person's, else the Spec's files while its seal still matches, else the
# catch-all rule's owners), from the repository's
# CODEOWNERS on its default branch (a repository without one is
# `writers`); `acceptor`: whoever accepted the issue (anyone with write
# gives the first acceptance); `writers`: anyone with write access. Each
# keeps its action's floor (write; maintain for the credits) and an admin
# always decides. A repository's exception is repos.yml `who-decides`.
who-decides: codeowners
# The organisation's test repository (#563, scripts/org.py test-repo), of
# kind `engine-test` (kinds/engine-test/): the release lane plays every
# scenario of tests/release/scenarios.yml there, at `v7-next`, before `v7`
# moves. Absent, `<org lowercased>-test`.
test-repo: diluxone-test
# The engine's core (#563, #568, scripts/org.py core), globs: while an open
# autopilot pull request touches one of these files, the autopilot starts no
# other issue whose Spec touches one, and says on it which pull request it
# waits for (scripts/autopilot.py next_step, wait `core`).
core:
  - scripts/autopilot.py
  - scripts/sync-repos.py
  - scripts/deciders.py
  - scripts/settings.py
  - scripts/org.py
  - .github/workflows/autopilot.yml
  - .github/workflows/autopilot-sweep.yml
  - .github/workflows/issues.yml
  - .github/workflows/issue-triage.yml
  - .github/workflows/org-pull-request.yml
  - policy/settings-schema.yml
# The custom property of the organisation that says a repository is adopted
# (#562, scripts/sync-repos.py rulesets): `true` on every repository
# repos.yml lists, written by the sync, and the organisation's rulesets
# cover the repositories that have it instead of a list of names.
adopted-property: dx-adopted
# A repository's own commit rules that contradict the organisation's (#562,
# scripts/sync-repos.py check): each pattern is matched against its
# commit-msg hook (.githooks/, .husky/), its commitlint configuration, and
# the lines of its AGENTS.md (the dx:org block aside) and CONTRIBUTING.md
# that speak of commits or trailers; a line that says "never" or "not" of it
# is no contradiction. The daily drift check lists each one found. `listed`
# and `kept` are its fixtures: lines it must find, and lines it must not.
conventions-contradictions:
  - pattern: '(?i)\bAI-assisted:\s*(yes|true)\b'
    says: "an `AI-assisted: yes` trailer, where the organisation's is `Assisted-by: <model> (<maker>)`"
    listed: ["Every commit an agent helped with ends with `AI-assisted: yes`.", "grep -q '^AI-assisted: yes$' \"$1\" || exit 1"]
    kept: ["End it with `Assisted-by: Claude Opus 5.5 (Anthropic)`.", "Never write `AI-assisted: yes`."]
  - pattern: '(?i)\bCo-authored-by:\s*(Claude|ChatGPT|GPT-?\d|Copilot|Gemini|Codex)\b'
    says: "a model named as a `Co-authored-by`, which the conventions check refuses (a model is `Assisted-by:`)"
    listed: ["Add `Co-authored-by: Claude <noreply@anthropic.com>` to the commit."]
    kept: ["Co-authored-by: Ana <1+ana@users.noreply.github.com>", "A model is never a `Co-authored-by: Claude`."]
  - pattern: '(?i)\bGenerated with\b'
    says: 'a "Generated with …" footer, where the organisation''s is the AI line (`🤖 AI-generated · <model> (<maker>)`)'
    listed: ["End the commit body with 🤖 Generated with Claude Code."]
    kept: ["Never \"Generated with …\".", "End it with `🤖 AI-generated · Claude Opus 5.5 (Anthropic)`."]
