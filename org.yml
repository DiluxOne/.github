# Who the organisation is, for the scripts (#191): its name, the repository
# that holds this configuration and its App. A
# script reads these through scripts/org.py instead of writing them in; an
# organisation that adopts these workflows changes this file. The `uses:`
# lines of the workflows still name the organisation: GitHub reads them
# before any file, so they cannot come from here.
org: DiluxOne
central: DiluxOne/.github
bot:
  app: dilux-bot
  id: 333187390
# The private repository where security work happens (#194, #287): the
# advisories' fixes, the patches, the nightly review, and where a
# vulnerability posted in a public issue is moved, out of sight.
security: DiluxOne/security
# The merge queue (#451, scripts/sync-repos.py merge-queue): `auto` turns it
# on wherever GitHub gives one (every public repository; a private one only
# on GitHub Enterprise Cloud) and leaves the others ready for the day it
# does; `on` requires it and fails where it cannot be; `off` never. A
# repository's exception is repos.yml `merge-queue`.
merge-queue: auto
# `make pre-pr`, the one check before a pull request in every repository
# (#479, scripts/pre-pr.py): `optional` lists a repository without one in
# the daily drift check; `required` also fails its pull requests in the
# conventions check. It turns `required` only once every repository has one,
# so no open pull request is stopped by the release that brings the check.
# A repository that has none by design is repos.yml `pre-pr`.
pre-pr: optional
