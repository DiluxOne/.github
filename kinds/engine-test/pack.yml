# The engine-test kind (#563): the organisation's test repository, org.yml
# `test-repo` (scripts/org.py test-repo), where the release lane plays every
# scenario of tests/release/scenarios.yml at `v7-next` before `v7` moves
# (scripts/release-scenarios.py run). It is no product: nothing is published
# from it, and the daily drift check fails when a repository of this kind is
# also of a product kind or listed in org.yml `catalogs` (scripts/
# sync-repos.py check). What each key means: kinds/README.md.

name: The engine's test repository

aliases: []

# No battery of its own: no product's checks, releases or publishing run
# here.
workflows: []

# The commands its `make pre-pr` needs that a bare runner may not have
# (#682, scripts/pre-pr.py tools): none.
pre-pr-tools: []

# The shipped callers (workflow-templates/) the test repository has, which
# scripts/install.py writes there, beside org-pull-request.yml, the
# organisation's required workflow. A scenario plays only what these wire (scripts/release-scenarios.py
# coverage); every other caller is held to the engine statically
# (scripts/caller-contract.py check). While the lane tries a candidate they
# move to `v7-next` through a pull request the bot opens there and queues
# itself in the merge queue once its checks pass, after checking that it
# changes nothing but the engine's ref in them (the auto-merge decision never
# merges a change to .github/workflows), and are put back after the same way, with a token minted
# after the scenarios (scripts/release-scenarios.py point_callers, back):
# nothing writes the test repository's main.
callers:
  - issues.yml
  - pull-request-comments.yml

# No checks of its own to run, so no engines.
adapters: []

# The test identity (#563, the Spec's option A): a machine user, an outside
# collaborator with write on the test repository only, whose fine-grained
# token is the secret `secret` of the `release` environment of the
# organisation's `.github`. It may accept issues in a repository of this
# kind and nowhere else: scripts/deciders.py counts it only here, and the
# daily drift check fails when it has more than read anywhere else. `{org}`
# is the organisation's login, lowercased.
identity:
  secret: DX_TEST_TOKEN
  login: "{org}-test-bot"

# The autopilot in a fixed change that calls no model: for each criterion,
# one file (`file`, `{n}` the issue's number, `{id}` the criterion's,
# `{scenario}` the scenario of the issue's `dx-scenario` mark) and one
# ticked box, so the scenarios try the flow, never the model.
autopilot: fixed-change
fixed-change:
  file: "scenarios/{scenario}/{n}.md"

# Its bugs reproduced with a fixed test that calls no model either (#707,
# scripts/repro-ways.py `fixed`): issue-repro.yml copies repro-fixed.py,
# `{n}` the issue's number and `{scenario}` its release scenario, where the
# writer would run, and runs it as any command way. It fails while
# scenarios/<scenario>/greeting.md says "helo" (what `bug-reproduced` lands
# on main first), so `bug-reproduced` gets `bug:confirmed` and
# `bug-not-reproduced`, which lands none, stays `bug:unconfirmed`. One way
# for every layer: whatever the triage labels, a bug here never lacks one.
repro:
  ways:
    fixed:
      layer: [logic, browser, cli, api, workflow]
      noun: fixed test
      test: "tests/repro/test_issue_{n}.py"
      fixed: "{kind}/repro-fixed.py"
      run: "python3 {test}"
      junit: "build/repro-{n}.xml"
      minutes: 5

# Its own core (org.yml `core` names the engine's paths, which no change
# here touches): the directory of `core-one-at-a-time` alone (#709). A fixed
# change writes under scenarios/<its scenario>/, so only that scenario's two
# issues touch the core and wait on each other, and every other scenario's
# Spec touches none, so it never waits (scripts/autopilot.py core_busy) and
# plays at once (scripts/release-scenarios.py core_problems).
core:
  - "scenarios/core-one-at-a-time/**"

# After each run of the scenarios, its issues are closed and locked, its pull
# requests closed and their branches deleted (scripts/release-scenarios.py
# cleanup).
cleanup: after-run

# Nothing is ever published from it: no release, no catalog.
publishes: never
