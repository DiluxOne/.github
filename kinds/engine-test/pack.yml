# The engine-test kind (#563): the organisation's test repository, org.yml
# `test-repo` (scripts/org.py test-repo), where the release lane plays every
# scenario of tests/release/scenarios.yml at `v7-next` before `v7` moves
# (scripts/release-scenarios.py run). It is no product: nothing is published
# from it, and the daily drift check fails when a repository of this kind is
# also of a product kind or listed in org.yml `catalogs` (scripts/
# sync-repos.py check). What each key means: kinds/README.md.

name: The engine's test repository

aliases: []

# No battery of its own: no product's checks, releases or publishing run
# here.
workflows: []

# The commands its `make pre-pr` needs that a bare runner may not have
# (#682, scripts/pre-pr.py tools): none.
pre-pr-tools: []

# The shipped callers (workflow-templates/) the test repository has, which
# scripts/install.py and scripts/sync-repos.py callers write there (#748).
# test-pull-request.yml is its pull-request pipeline, the jobs of
# org-pull-request.yml, the required workflow, which runs at `v7` in every
# other repository and leaves this one out ("org: required workflow"): its
# calls are this repository's, so they move to the candidate. A scenario plays only what these wire (scripts/release-scenarios.py
# coverage); every other caller is held to the engine statically
# (scripts/caller-contract.py check). While the lane tries a candidate they
# move to `v7-next` through a pull request the bot opens there and queues
# itself in the merge queue once its checks pass, after checking that it
# changes nothing but the engine's ref in them (the auto-merge decision never
# merges a change to .github/workflows), and are put back after the same way, with a token minted
# after the scenarios (scripts/release-scenarios.py point_callers, back):
# nothing writes the test repository's main.
callers:
  - issues.yml
  - pull-request-comments.yml
  - test-pull-request.yml

# No checks of its own to run, so no engines.
adapters: []

# The test identity (#563, the Spec's option A): a machine user, an outside
# collaborator with write on the test repository only, whose fine-grained
# token is the secret `secret` of the `release` environment of the
# organisation's `.github`. Its login is written nowhere (#739): it is the
# token's owner, which the release lane reads from GitHub (scripts/org.py
# test-identity --from-token) and every other script takes from
# DX_TEST_LOGIN (scripts/org.py test_identity). It may accept issues in a
# repository of this kind and nowhere else: scripts/deciders.py counts it
# only here, and the daily drift check fails when it has more than read
# anywhere else.
identity:
  secret: DX_TEST_TOKEN

# The autopilot in a fixed change that calls no model: for each criterion,
# one file (`file`, `{n}` the issue's number, `{id}` the criterion's,
# `{scenario}` the scenario of the issue's `dx-scenario` mark) and one
# ticked box, so the scenarios try the flow, never the model. The file is
# named `*.test.*` so that G6 (scripts/autopilot.py TESTISH) counts it as
# its criterion's test, and a person's Normal Bug merges by policy (#835);
# no required check runs it (`scenarios/**` is among `test-first.not-tests`),
# so G7 meets it by being written and changed by the pull request, and asks
# no check of it (#860: autopilot.py check_evidence `fixed`, criteria_unmet).
# The review there is fixed too (#943, scripts/fixed-review.py): a scenario
# that does not say `review: model` in tests/release/scenarios.yml gets the
# policy floor's risk, not blocking, with no model.
autopilot: fixed-change
fixed-change:
  # A pull request made only of files under this file's directory keeps its
  # title's type in the review (#895, scripts/review-type.sh --title
  # --fixed, the pattern autopilot.py fixed finds by the repository).
  file: "scenarios/{scenario}/{n}.test.md"
  # A PRD that carries this phrase makes the fixed Spec stop, as a model
  # asking would, until someone who decides answers in a comment (#696,
  # scripts/autopilot.py fixed_asks); every other PRD goes on as before.
  ask: "the fixed change asks first"

# Its bugs reproduced with a fixed test that calls no model either (#707,
# scripts/repro-ways.py `fixed`): issue-repro.yml copies repro-fixed.py,
# `{n}` the issue's number and `{scenario}` its release scenario, where the
# writer would run, and runs it as any command way. It fails while
# scenarios/<scenario>/greeting.md says "helo" (what `bug-reproduced` lands
# on main first), so `bug-reproduced` gets `bug:confirmed` and
# `bug-not-reproduced` and `bug-by-person-merges`, which land a file of
# their own that shows no bug (#764: a notice, a footer, each a defect no
# other bug body describes, #881, #916), get `needs-info` (#801). One way
# for every layer: whatever layer the triage puts on the board, a bug here
# never lacks one.
repro:
  ways:
    fixed:
      layer: [logic, browser, cli, api, workflow]
      noun: fixed test
      test: "tests/repro/test_issue_{n}.py"
      fixed: "{kind}/repro-fixed.py"
      run: "python3 {test}"
      junit: "build/repro-{n}.xml"
      minutes: 5

# The "Test first" check (#734, scripts/test-first.py, kinds/README.md): a
# test is a Python file under tests/repro/, run by the fixed way. A
# scenario's file (`fixed-change`'s scenarios/<scenario>/<n>.test.md) is never
# one, so a scenario's `feat` pull request has its "Test first" red; no
# scenario's `expect` reads it, and the `pipeline` check decides on the
# organisation's gates alone (org.yml `pipeline-gates`). G7 asks no required
# check of that file (#860); any other test here still needs its own green.
test-first:
  setup: []
  tests:
    - paths: ["tests/repro/test_*.py"]
      way: fixed
  not-tests: ["scenarios/**"]

# Its own core (org.yml `core` names the engine's paths, which no change
# here touches): the directory of `core-one-at-a-time` alone (#709). A fixed
# change writes under scenarios/<its scenario>/, so only that scenario's two
# issues touch the core and wait on each other, and every other scenario's
# Spec touches none, so it never waits (scripts/autopilot.py core_busy) and
# plays at once (scripts/release-scenarios.py core_problems).
core:
  - "scenarios/core-one-at-a-time/**"

# After each run of the scenarios, its issues are closed and locked, its pull
# requests closed and their branches deleted, and so are the pull requests
# that close its issues, the autopilot's among them (scripts/release-scenarios.py
# cleanup).
cleanup: after-run

# Nothing is ever published from it: no release, no catalog.
publishes: never
