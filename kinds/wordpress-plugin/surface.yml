# What a pull request that is not a feat may not add to a WordPress plugin
# when its author is not trusted (#144): the plugin's public surface, which
# needs a Feature issue a maintainer accepted. scripts/surface.py reads it,
# from the conventions check; what each key means is in its header and in
# kinds/README.md ("Public surface"). `python3 scripts/surface.py --test`
# runs every fixture.
#
# Patterns are Python regular expressions over a whole file (a call may span
# lines); `(?i)`, since PHP's function names are not case-sensitive.
# What it does not read, by choice: files that are not .php (.inc, .phtml),
# a comment between a function's name and its `(`, and registrations not
# listed below (register_block_type, register_rest_field, add_rewrite_rule,
# WP-CLI commands); an entry is added here, with fixtures, when one matters.
# A `name` group: new when the name appears nowhere in the base's
# files (a hook moved or fired again is not new). No `name` group: new when
# the changed files hold more matches than at the base (a call changed in
# place, or moved, is not new). Conservative on purpose: this check is
# required in every repository of the kind, so a pattern that is unsure
# says nothing, and the human merge still reads the change.

# Added to the organisation's docs-paths (policy/review-policy.default.yml):
# what a `docs` pull request may change. Shell `case` globs.
docs-paths:
  - readme.txt

files: ["**/*.php"]
# Dependencies at any depth (a bundled library is not the plugin's surface);
# tests and hidden folders at the root only, so a folder of that name deeper
# in cannot hide surface.
exclude:
  - "**/vendor/**"
  - "**/node_modules/**"
  - "tests/**"
  - "test/**"
  - ".*/**"

surface:
  - id: setting
    what: a setting (register_setting)
    pattern: '(?i)(?<![\w$>:])register_setting\s*\(\s*(?:''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*"|[A-Za-z_\\$][\w\\:$>-]*)\s*,\s*(?P<name>''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*"|[A-Za-z_\\$][\w\\:$>-]*)'
    fixtures:
      fail:
        - "<?php\nregister_setting( 'dx_group', 'dx_new_option' );\n"
        - "<?php\n\\register_setting(\n  self::GROUP,\n  self::NEW_OPTION\n);\n"
      pass:
        - base: "<?php\nregister_setting( 'dx_group', 'dx_option', array( 'type' => 'string' ) );\n"
          head: "<?php\nregister_setting( 'dx_group', 'dx_option', array( 'type' => 'boolean' ) );\n"
        - files:
            includes/a.php:
              base: "<?php\nconst OPTION = 'dx_option';\nregister_setting( 'dx_group', self::OPTION );\n"
              head: "<?php\nconst OPTION = 'dx_option';\n"
            includes/b.php:
              head: "<?php\nregister_setting( 'dx_group', self::OPTION );\n"

  - id: option
    what: an option (add_option)
    pattern: '(?i)(?<![\w$>:])(?<!function )add_(?:site_)?option\s*\(\s*(?P<name>''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*"|[A-Za-z_\\$][\w\\:$>-]*)'
    fixtures:
      fail:
        - "<?php\nadd_option( 'dx_new_option', 1 );\n"
        - "<?php\nadd_site_option( \"dx_network_thing\", array() );\n"
      pass:
        - base: "<?php\n$v = get_option( 'dx_version' );\n"
          head: "<?php\n$v = get_option( 'dx_version' );\nif ( false === $v ) { add_option( 'dx_version', '1.0' ); }\n"
        - "<?php\n$this->add_option( 'whatever' );\n"
        - "<?php\nfunction add_option( $name ) {}\n"

  - id: rest-route
    what: a REST route (register_rest_route)
    pattern: '(?i)(?<![\w$>:])register_rest_route\s*\('
    fixtures:
      fail:
        - "<?php\nregister_rest_route( 'dx/v1', '/items', array( 'methods' => 'GET' ) );\n"
        - "<?php\nREGISTER_REST_ROUTE( 'dx/v1', '/shout', array() );\n"
        - path: includes/test/rest.php
          head: "<?php\nregister_rest_route( 'dx/v1', '/hidden', array() );\n"
        - base: "<?php\nregister_rest_route( 'dx/v1', '/items', array() );\n"
          head: "<?php\nregister_rest_route( 'dx/v1', '/items', array() );\nregister_rest_route( 'dx/v1', '/items/(?P<id>\\d+)', array() );\n"
      pass:
        - path: includes/lib/vendor/x/rest.php
          head: "<?php\nregister_rest_route( 'x/v1', '/y', array() );\n"
        - base: "<?php\nregister_rest_route( 'dx/v1', '/items', array( 'permission_callback' => '__return_true' ) );\n"
          head: "<?php\nregister_rest_route( 'dx/v1', '/items', array( 'permission_callback' => array( $this, 'can' ) ) );\n"
        - files:
            includes/a.php:
              base: "<?php\nregister_rest_route( 'dx/v1', '/items', array() );\n"
            includes/rest/items.php:
              head: "<?php\nregister_rest_route( $this->namespace, '/' . $this->rest_base, array() );\n"
        - "<?php\n$server->register_rest_route_x();\n"

  - id: admin-page
    what: an admin page (add_menu_page, add_submenu_page and the like)
    pattern: '(?i)(?<![\w$>:])add_(?:menu|submenu|object|utility|options|management|theme|users|dashboard|posts|media|links|pages|comments|plugins)_page\s*\('
    fixtures:
      fail:
        - "<?php\nadd_submenu_page( 'dx', 'Reports', 'Reports', 'manage_options', 'dx-reports', 'cb' );\n"
        - "<?php\nadd_options_page( 'DX', 'DX', 'manage_options', 'dx', 'cb' );\n"
      pass:
        - base: "<?php\nadd_menu_page( 'DX', 'DX', 'manage_options', 'dx', 'cb', 'dashicons-groups', 22 );\n"
          head: "<?php\nadd_menu_page(\n  'DX',\n  'DX',\n  'manage_options',\n  'dx',\n  'cb',\n  'dashicons-groups'\n);\n"
        - "<?php\nremove_submenu_page( 'dx', 'dx-old' );\n"

  - id: hook
    what: a hook (do_action, apply_filters)
    pattern: '(?i)(?<![\w$>:])(?:do_action|do_action_ref_array|apply_filters|apply_filters_ref_array)\s*\(\s*(?P<name>''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*")'
    fixtures:
      fail:
        - "<?php\n$v = apply_filters( 'dx_new_filter', $v );\n"
        - "<?php\ndo_action( \"dx_{$type}_saved\", $id );\n"
        - base: "<?php\ndo_action( 'dx_old_name' );\n"
          head: "<?php\ndo_action( 'dx_new_name' );\n"
      pass:
        - files:
            includes/a.php:
              base: "<?php\ndo_action( 'dx_saved', $id );\n"
              head: "<?php\ndo_action( 'dx_saved', $id );\n"
            includes/b.php:
              base: "<?php\nfunction b() {}\n"
              head: "<?php\nfunction b() { do_action( 'dx_saved', 0 ); }\n"
        - files:
            includes/a.php:
              base: "<?php\napply_filters( 'dx_title', $t );\n"
            includes/b.php:
              head: "<?php\napply_filters( 'dx_title', $t );\n"
        - "<?php\ndo_action( $hook, $args );\n"
        - "<?php\ndo_action_deprecated( 'dx_old', array(), '2.0', 'dx_new' );\n"
        - base: "<?php\nadd_action( 'init', 'dx_boot' );\n"
          head: "<?php\nadd_action( 'init', 'dx_boot' );\ndo_action( 'init' );\n"

  - id: shortcode
    what: a shortcode (add_shortcode)
    pattern: '(?i)(?<![\w$>:])add_shortcode\s*\(\s*(?P<name>''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*"|[A-Za-z_\\$][\w\\:$>-]*)'
    fixtures:
      fail:
        - "<?php\nadd_shortcode( 'dx_gallery', 'dx_gallery_cb' );\n"
      pass:
        - base: "<?php\nadd_shortcode( 'dx_gallery', 'dx_gallery_cb' );\n"
          head: "<?php\nadd_shortcode( 'dx_gallery', array( $this, 'render' ) );\n"
        - "<?php\nremove_shortcode( 'gallery' );\n"

  - id: post-type
    what: a post type (register_post_type)
    pattern: '(?i)(?<![\w$>:])register_post_type\s*\(\s*(?P<name>''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*"|[A-Za-z_\\$][\w\\:$>-]*)'
    fixtures:
      fail:
        - "<?php\nregister_post_type( 'dx_ticket', array( 'public' => true ) );\n"
      pass:
        - base: "<?php\nregister_post_type( 'dx_ticket', array( 'public' => true ) );\n"
          head: "<?php\nregister_post_type( 'dx_ticket', array( 'public' => false ) );\n"

  - id: taxonomy
    what: a taxonomy (register_taxonomy)
    pattern: '(?i)(?<![\w$>:])register_taxonomy\s*\(\s*(?P<name>''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*"|[A-Za-z_\\$][\w\\:$>-]*)'
    fixtures:
      fail:
        - "<?php\nregister_taxonomy( 'dx_topic', 'dx_ticket' );\n"
      pass:
        - base: "<?php\nregister_taxonomy( 'dx_topic', 'dx_ticket' );\n"
          head: "<?php\nregister_taxonomy( 'dx_topic', array( 'dx_ticket', 'post' ) );\n"

  - id: endpoint
    what: an AJAX or admin-post endpoint (wp_ajax_, admin_post_)
    pattern: '(?i)(?<![\w$>:])add_action\s*\(\s*(?P<name>''(?:wp_ajax_|admin_post_)[^'']*''|"(?:wp_ajax_|admin_post_)[^"]*")'
    fixtures:
      fail:
        - "<?php\nadd_action( 'wp_ajax_dx_export', 'dx_export' );\n"
        - "<?php\nadd_action( \"admin_post_nopriv_dx_form\", array( $this, 'save' ) );\n"
      pass:
        - base: "<?php\nadd_action( 'wp_ajax_dx_export', 'dx_export' );\n"
          head: "<?php\nadd_action( 'wp_ajax_dx_export', array( $this, 'export' ) );\n"
        - "<?php\nadd_action( 'admin_init', 'dx_boot' );\n"

  - id: block
    what: a block (a new block.json)
    files: ["**/block.json"]
    # One match per file: a block.json added counts, one changed or moved does not.
    pattern: '\A\s*\{'
    fixtures:
      fail:
        - path: src/blocks/gallery/block.json
          head: "{\n  \"name\": \"dx/gallery\"\n}\n"
      pass:
        - path: src/blocks/form/block.json
          base: "{\n  \"name\": \"dx/form\",\n  \"title\": \"Form\"\n}\n"
          head: "{\n  \"name\": \"dx/form\",\n  \"title\": \"Contact form\",\n  \"styles\": [ { \"name\": \"outline\" } ]\n}\n"
        - files:
            blocks/form/block.json:
              base: "{\n  \"name\": \"dx/form\"\n}\n"
            src/blocks/form/block.json:
              head: "{\n  \"name\": \"dx/form\"\n}\n"

# Security-sensitive code (#287): an autopilot's change that adds or removes
# a line that matches one of these is merged by a person, whatever its
# issue's Type and whatever the review rated its risk. Decided by code, never by the review.
# A pattern is a Python regular expression over one line; `when: removed` for
# what only weakens when it goes (an escape, a sanitiser), so adding one does
# not stop a fix. Conservative on purpose: a person reading more is the
# cost of a false hit, an unread change to who may do what is the cost of a
# missed one.
sensitive:
  - id: capability
    what: a permission check or a capability (current_user_can, roles, caps)
    pattern: '(?i)\b(?:current_user_can|user_can|author_can|current_user_can_for_blog|map_meta_cap|add_cap|remove_cap|add_role|remove_role|set_role|grant_super_admin|is_super_admin|permission_callback|wp_ajax_nopriv_\w*|admin_post_nopriv_\w*)\b'
    fixtures:
      fail:
        - base: "<?php\nif ( ! current_user_can( 'manage_options' ) ) { return; }\n"
          head: "<?php\n"
        - base: "<?php\nfunction a() {}\n"
          head: "<?php\nfunction a() {}\n$role->add_cap( 'edit_dx' );\n"
      pass:
        - base: "<?php\n$title = 'x';\n"
          head: "<?php\n$title = 'y';\n"
  - id: nonce
    what: a nonce or a referer check (wp_verify_nonce, check_admin_referer)
    pattern: '(?i)\b(?:wp_verify_nonce|check_admin_referer|check_ajax_referer|wp_create_nonce|wp_nonce_field|wp_nonce_url)\b'
    fixtures:
      fail:
        - base: "<?php\ncheck_admin_referer( 'dx_save' );\nsave();\n"
          head: "<?php\nsave();\n"
      pass:
        - base: "<?php\ncheck_admin_referer( 'dx_save' );\nsave();\n"
          head: "<?php\ncheck_admin_referer( 'dx_save' );\nsave_all();\n"
  - id: sql
    what: SQL ($wpdb)
    pattern: '(?i)\$wpdb\s*->|\bdbDelta\s*\('
    fixtures:
      fail:
        - base: "<?php\nfunction a() {}\n"
          head: "<?php\nfunction a() {}\n$wpdb->query( \"DELETE FROM {$wpdb->posts} WHERE ID = $id\" );\n"
      pass:
        - base: "<?php\n$posts = get_posts();\n"
          head: "<?php\n$posts = get_posts( array( 'numberposts' => 5 ) );\n"
  - id: auth
    what: authentication or a user's password (wp_set_auth_cookie, wp_set_current_user)
    pattern: '(?i)\b(?:wp_set_auth_cookie|wp_set_current_user|wp_signon|wp_authenticate|wp_set_password|wp_hash_password|wp_check_password|wp_clear_auth_cookie|is_user_logged_in|application_password)\b'
    fixtures:
      fail:
        - base: "<?php\nfunction a() {}\n"
          head: "<?php\nfunction a() {}\nwp_set_auth_cookie( $user_id );\n"
      pass:
        - "<?php\n$user = wp_get_current_user();\n"
  - id: execution
    what: code or commands run, a file read or written, or a remote call (eval, exec, unserialize, files, wp_remote_*, an include of a variable)
    pattern: '(?i)(?:(?<![\w$>:])(?:eval|assert|create_function|exec|shell_exec|system|passthru|proc_open|popen|unserialize|maybe_unserialize|base64_decode|move_uploaded_file|file_put_contents|file_get_contents|readfile|file|fread|fputs|fopen|fwrite|unlink|rename|copy|mkdir|rmdir|chmod|touch|wp_delete_file|wp_handle_upload|wp_remote_\w+|wp_safe_remote_\w+|curl_init|curl_exec|fsockopen|call_user_func|call_user_func_array)\s*\(|\bWP_Filesystem\b|\b(?:include|require)(?:_once)?\s*\(?\s*\$|->exec\s*\()'
    fixtures:
      fail:
        - base: "<?php\nfunction a() {}\n"
          head: "<?php\nfunction a() {}\n$data = unserialize( $_POST['x'] );\n"
        - "<?php\ninclude $_GET['page'];\n"
        - "<?php\n$r = wp_remote_get( $url );\n"
        - "<?php\n$x = file_get_contents( $_GET['f'] );\n"
        - "<?php\n$c = curl_init( $url );\n"
      pass:
        - "<?php\n$this->exec_later();\n"
        - "<?php\nrequire_once __DIR__ . '/includes/a.php';\n"
  - id: escape-removed
    what: an escape or a sanitiser taken out (esc_*, sanitize_*, wp_kses)
    when: removed
    pattern: '(?i)\b(?:esc_(?:html|attr|url|js|textarea|sql)\w*|sanitize_\w+|wp_kses\w*|absint|intval|wp_unslash)\s*\('
    fixtures:
      fail:
        - base: "<?php\necho esc_html( $title );\n"
          head: "<?php\necho $title;\n"
      pass:
        - base: "<?php\necho $title;\n"
          head: "<?php\necho esc_html( $title );\n"
