# The wordpress-plugin kind: a plugin published on wordpress.org.
# A repository opts in with `kind: wordpress-plugin` in its
# .github/review-policy.yml. What each key means: kinds/README.md.

name: WordPress plugin

# Names a caller may still pass as `profile:` for this kind (the review
# profile's name before kinds existed). One-line lists.
aliases: [plugin-wp]

# The reusable workflows that make up this kind's battery, in
# .github/workflows/. GitHub cannot choose a reusable workflow from data, so
# a repository's caller names them (workflow-templates/plugin-checks-wp.yml
# and release-wp.yml); they read their rules and settings from this pack.
workflows:
  - plugin-checks-wp.yml
  - plugin-tests-wp.yml
  - plugin-release-wp.yml

# What a repository of this kind requires of its own jobs, beside the
# organisation's pipeline: a repository ruleset named "own checks"
# (docs/migrating.md). A repository needs one when a workflow of its calls
# one of `callers-of`; scripts/sync-repos.py creates it from the check runs
# of its last merged pull request whose job is one of `jobs` ("checks / PHPStan"),
# leaving out the names in `skip`, plus every check its old default-branch
# rulesets required. One that exists is never rewritten: a repository adds
# its own suites to it by hand (Offload's real-storage ones).
own-checks:
  callers-of: [plugin-checks-wp.yml, plugin-tests-wp.yml]
  jobs: [checks, tests]
  skip: [What changed]

# The engines this kind's checks run, and the language adapter of each.
adapters:
  - engine: scripts/review-rules.php
    rules: rules.yml
    languages: [php]

# What the workflows read from here. A repository can add to a list in its
# own policy (`kind-settings:`), never replace a value: it adds an
# exception, it does not turn a gate off (scripts/policy.py).
settings:
  plugin-check:
    # Every warning fails, as it does for the reviewer.
    strict: true
    categories: [plugin_repo, security, performance, accessibility, general]
    include-experimental: true
    # Codes that can never be right on the tree the checks build:
    # stable_tag_mismatch, because the checkout's markers are held to the
    # released version by the readme job, and checked again before SVN.
    ignore-codes: [stable_tag_mismatch]

# How a version of this kind is released (#82; kinds/README.md). A person
# accepts the issue "Release X.Y.Z"; the release pull request is then this
# `prepare` command run on the default branch (issue-accepted.yml, through
# scripts/release-issue.py, which knows nothing of WordPress), and once it
# merges `workflow` publishes the version to `publishes-to`, after checking
# that a person accepted that issue (scripts/release-gate.py).
#   publishes-to  where a release goes, for people (the pull request says it)
#   workflow      the reusable workflow that publishes; the repository's
#                 caller of it holds the inputs the command reads (its `with:`)
#   prepare       the command, one argument per item, run at the repository's
#                 root: {version} is the release, {central} the checkout of
#                 DiluxOne/.github, any other {name} the caller's input
#   defaults      an input the caller leaves out or empty, as the workflow
#                 itself defaults it
release:
  publishes-to: wordpress.org
  workflow: plugin-release-wp.yml
  prepare: [bash, "{central}/scripts/release-markers.sh", prepare, ., "{version}", "{main-file}", "{version-constant}"]
  defaults:
    main-file: "{slug}.php"
    version-constant: ""
