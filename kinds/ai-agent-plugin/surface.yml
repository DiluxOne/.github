# What a `docs` pull request may change in a plugin for coding agents (#552),
# beside the organisation's docs-paths (policy/review-policy.default.yml).
# Shell `case` globs: `*` crosses directories. A skill's Markdown is what the
# agent reads, and the kind's review rules (rules.yml) run on it whatever the
# pull request's type. scripts/surface.py reads it; kinds/README.md, "Public
# surface". No `surface` entries yet: an untrusted author's pull request is
# read by the human merge.
docs-paths:
  - README.md
  - docs/*
  - skills/*.md

# The kind's part of the threat trigger (#958, scripts/impact.py threats),
# added to the organisation's (policy/threats.yml, add-only): a Spec or a
# change that touches one of these needs its `Spec: threats` section at G3,
# whatever its issue's Type. A hook runs a command on the agent's events, an
# MCP server is a process or a remote the agent calls, and the tools a skill,
# an agent or a command may use are its permissions.
threats:
  - id: agent-hook
    what: a hook (a command the agent runs on its events)
    paths: ["**/hooks/**", "**/hooks.json"]
    fixtures:
      fail:
        - path: hooks/hooks.json
        - path: plugins/x/hooks/pre-tool.sh
      pass:
        - path: skills/write/SKILL.md
  - id: agent-mcp
    what: an MCP server
    paths: ["**/.mcp.json"]
    pattern: '(?i)\bmcpServers\b'
    fixtures:
      fail:
        - path: .mcp.json
        - '"mcpServers": { "x": { "command": "npx" } }'
      pass:
        - path: README.md
  - id: agent-permissions
    what: the tools or permissions an agent, a skill or a command is allowed
    pattern: '(?i)\b(?:allowed-tools|allowedTools|disallowedTools|bypassPermissions|dangerously-skip-permissions|permissionMode)\b'
    fixtures:
      fail:
        - "allowed-tools: Bash(git:*), Read"
        - '"permissionMode": "bypassPermissions"'
      pass:
        - "description: Writes the changelog."
