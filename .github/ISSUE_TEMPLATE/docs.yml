name: 📝 Documentation
description: Something in the docs is missing, wrong or unclear.
type: Docs
body:
  - type: textarea
    id: where
    attributes:
      label: Where?
      description: The page, file or section, with a link if you have one.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is missing, wrong or unclear?
      description: What you expected to find, and what you found instead.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Optional. How you would solve it. If the change uses it, you are credited as its co-author.
  - type: checkboxes
    id: claim
    attributes:
      label: Who works on it
      description: Tick it to claim the issue (as `/claim` does). Your claim is recorded now; its clock starts when a maintainer accepts the issue, and the autopilot does not start on it while you hold it. See CONTRIBUTING.md.
      options:
        - label: I want to work on this myself
          required: false
