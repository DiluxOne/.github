name: 🐛 Bug report
description: Something is broken or behaves unexpectedly.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Before you start: a security vulnerability goes through **private vulnerability reporting** (the Security tab), never here. A question about using a product goes to its support channel (see SUPPORT.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version you are running, and the platform if it matters (PHP, WordPress, browser, OS).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Anything that shows the problem. Remove keys, passwords and personal data first.
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Optional. How you would solve it. If the change uses it, you are credited as its co-author.
  - type: checkboxes
    id: claim
    attributes:
      label: Who works on it
      description: Tick it to claim the issue (as `/claim` does). Your claim is recorded now; its clock starts when a maintainer accepts the issue, and the autopilot does not start on it while you hold it. See CONTRIBUTING.md.
      options:
        - label: I want to work on this myself
          required: false
