name: ✨ Feature request
description: Something the product should do and does not.
type: Feature
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The situation you are in, not the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
  - type: checkboxes
    id: claim
    attributes:
      label: Who works on it
      description: Tick it to claim the issue (as `/claim` does). Your claim is recorded now; its clock starts when a maintainer accepts the issue, and the autopilot does not start on it while you hold it. See CONTRIBUTING.md.
      options:
        - label: I want to work on this myself
          required: false
