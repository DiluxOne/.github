# The actions these workflows use are pinned by commit; Dependabot keeps the
# pins current. Titles come out as "ci(deps): Bump …", which conventions.yml
# accepts.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Argentina/Buenos_Aires
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
  # The runner image's base (runner/Dockerfile), pinned by digest. Only the
  # digest of the Ubuntu release it is on moves by itself: a new Ubuntu
  # release (24.04 to 26.04) is a decision of ours, taken when what the jobs
  # install on it is published for it (above all what setup-php installs
  # from: the ondrej/php PPA and php-builder's prebuilt builds, which the
  # runner-image.yml smoke test sets PHP up from), and then made by hand in
  # the Dockerfile.
  - package-ecosystem: docker
    directory: /runner
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Argentina/Buenos_Aires
    ignore:
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: ci
      include: scope
