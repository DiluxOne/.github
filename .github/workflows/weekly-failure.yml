name: Weekly failure

# Called by a repository's pull-request workflow when its scheduled run fails:
# opens one issue with the link to the run, or adds the link to the issue that
# is already open, so a suite that breaks on a Monday is recorded where the
# work is and nobody has to read the Actions tab. The label `ci:weekly` marks
# the issue; closing it ends the thread and the next failure opens a new one.
# The issue has the Type Bug (#375), set too on an open one that has none, so
# the `fix` that closes it passes the conventions gate with nobody setting it
# by hand; a Type a person set stays. GitHub drops, without an error, a Type
# sent by a token without push access, so the issue is written with
# dilux-bot's token when the caller passes the bot's key; without it, the
# caller's token still records the failure and a Type that did not stick is a
# warning. The logic is scripts/weekly-failure.sh, with its self-test.
#
#   weekly-failure:
#     needs: [checks, tests]
#     if: ${{ !cancelled() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
#     permissions:
#       contents: read
#       issues: write
#     uses: DiluxOne/.github/.github/workflows/weekly-failure.yml@v7-next
#     secrets:
#       DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}

on:
  workflow_call:
    inputs:
      central-ref:
        description: The ref of DiluxOne/.github whose script runs. Empty (the default) means the very commit this workflow runs from, job.workflow_sha (#287).
        type: string
        default: ''
    secrets:
      DILUX_BOT_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  report:
    name: Record the failure
    runs-on: ${{ vars.DX_RUNNER_HEAVY != '' && !((github.event.pull_request.user.login == vars.DX_BOT_LOGIN && (startsWith(github.event.pull_request.head.ref, 'test/repro-issue-') || (contains(github.event.pull_request.head.ref, '/') && contains(github.event.pull_request.head.ref, '-the-bug-reproduced-from-')))) || (github.event.issue.user.login == vars.DX_BOT_LOGIN && (github.event.issue.pull_request || startsWith(github.event.issue.title, 'The bug reproduced from ')))) && fromJSON(vars.DX_RUNNER_HEAVY) || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      HAS_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY != '' }}
    steps:
      - name: The script
        env:
          REF: ${{ inputs.central-ref || job.workflow_sha }}
        run: |
          set -euo pipefail
          mkdir -p .dx-central/scripts
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/DiluxOne/.github/$REF/scripts/weekly-failure.sh" -o .dx-central/scripts/weekly-failure.sh

      # The bot's token sets the Type; failing to mint it leaves the caller's,
      # which still records the failure.
      - name: App token
        id: bot
        if: env.HAS_KEY == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write

      - name: Record the failure
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: bash .dx-central/scripts/weekly-failure.sh
