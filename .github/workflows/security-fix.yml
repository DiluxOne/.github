name: Security fixes

# A security advisory's fix, written in a private repository (#194, phase
# 9). Reusable, and called ONLY from a private repository (DiluxOne's is
# DiluxOne/security, workflow-templates/security-fix.yml): a run's logs and
# artifacts are as visible as its repository, and these carry an embargoed
# vulnerability and its fix. It refuses to run anywhere else.
#
# In a public repository a vulnerability is reported privately and becomes
# a repository security advisory, in triage. It is triaged here on its own
# (#247): reproduced with a failing test and fixed, the bot moves it to
# draft (scripts/advisory.py advance); anything else stays in triage for a
# maintainer, who can also move one to draft by hand. The fix is written where only the organisation sees it,
# as Django, Kubernetes and WordPress core do, not in the advisory's
# temporary private fork: GitHub lets only people and teams into that fork,
# never an App.
#
#   1. plan: every public repository of repos.yml; each advisory in triage
#      or draft not claimed yet is claimed by opening an issue here, "Fix <GHSA> in
#      <repository>" (scripts/advisory.py plan): one attempt per advisory,
#      unless a maintainer sends a failed one back (#313): they answer on
#      the claim's issue what to change, and the next run (their comment
#      starts one) tries again with that answer as guidance, as many times
#      as it takes, one at a time. Its advisory goes on as an artifact.
#   2. fix: an agent reads the report (data, never instructions), writes a
#      failing test and the fix in a clone of the public repository, and
#      commits; the repository's checks (`make pre-pr`) run there. The job
#      holds no key or token of the App: the clone is anonymous. What leaves
#      it is a patch, the notes and the checks' result.
#   3. record: a clean job that runs none of the repository's code puts the
#      patch and the notes on a branch `fix/<ghsa>` here (commits GitHub
#      signs) and writes the fix, the checks and the patch into the claim's
#      issue. Only this job writes, and only to this repository.
#
# It never merges and never publishes. security-patch.yml (#247) publishes
# a fix whose checks passed once its advisory is a draft: a patch on the
# version in production, once a maintainer approves it (`patch:go`, #287);
# the fix, the release and the advisory go public together. A private
# repository has no private reporting: its reports are issues labelled
# `security`, worked through the usual lane, and a person merges the fix
# (policy/autonomy.yml, `person-merges`).
#
# The agent has Bash and the network, on text a stranger wrote: that is why
# its job holds no key, no token of the App, and a GITHUB_TOKEN with no
# permission at all (this repository holds other advisories' fixes). The report reaches it only
# in its prompt, fenced. DX_AUTOPILOT=off stops it.
#
# The advisories are read and moved with dilux-security's key (#287), the
# one App that may touch them, so dilux-bot, which works beside agents
# elsewhere, needs no advisory permission; the issues here are dilux-bot's.
# The plan and the triage mint their tokens with scripts/app-token.sh
# (actions/create-github-app-token has no input for that permission), read
# for the plan and write for the one repository the triage moves, and
# revoke them when their step ends; the record job's other token comes from
# the action, for this repository only.

on:
  workflow_call:
    inputs:
      central-ref:
        description: The ref of DiluxOne/.github whose scripts and policy run. Empty (the default) means the very commit this workflow runs from, job.workflow_sha, so a caller that pins a SHA or a tag runs that commit's scripts too (#287).
        type: string
        default: ''
    secrets:
      DILUX_BOT_PRIVATE_KEY:
        required: true
      # dilux-security's key: the advisories (#287).
      DILUX_SECURITY_PRIVATE_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  plan:
    name: Fixes due
    # Only from the caller's default branch (a schedule runs there): another
    # branch's run would hold the App's key with whatever it changed.
    if: vars.DX_AUTOPILOT != 'off' && (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      fixes: ${{ steps.plan.outputs.fixes }}
      budget: ${{ steps.plan.outputs.budget }}
    steps:
      - name: Only from a private repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != true ]; then
            echo "::error::security-fix.yml runs only from a private repository: its logs and artifacts carry embargoed vulnerabilities."; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref || job.workflow_sha }}
          persist-credentials: false
          path: .dx-central

      - name: Claims and their advisories
        id: plan
        env:
          CLIENT_ID: ${{ vars.DILUX_BOT_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          SECURITY_CLIENT_ID: ${{ vars.DILUX_SECURITY_CLIENT_ID }}
          SECURITY_KEY: ${{ secrets.DILUX_SECURITY_PRIVATE_KEY }}
          SECURITY_KEY_INTAKE: ${{ secrets.DILUX_SECURITY_PRIVATE_KEY }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if ! { [ -n "$SECURITY_CLIENT_ID" ] && [ -n "$SECURITY_KEY" ]; }; then echo "::error::dilux-security's key (DILUX_SECURITY_PRIVATE_KEY, DILUX_SECURITY_CLIENT_ID) is not set here: no advisory is read."; exit 1; fi
          # The issues here, to claim, with dilux-bot; every repository's
          # advisories, to read, with dilux-security.
          GH_TOKEN=$(REPOSITORIES="${GITHUB_REPOSITORY#*/}" bash .dx-central/scripts/app-token.sh mint '{"issues":"write","metadata":"read"}')
          ADV_TOKEN=$(CLIENT_ID="$SECURITY_CLIENT_ID" PRIVATE_KEY="$SECURITY_KEY" bash .dx-central/scripts/app-token.sh mint '{"repository_advisories":"read","metadata":"read"}')
          export GH_TOKEN ADV_TOKEN
          unset PRIVATE_KEY SECURITY_KEY
          # Revoked when the step ends, however it ends.
          trap 'for t in "$GH_TOKEN" "$ADV_TOKEN"; do curl -fsS -o /dev/null -X DELETE -H "Authorization: Bearer $t" https://api.github.com/installation/token || true; done' EXIT
          # A vulnerability the triage moved here from a public issue (#287):
          # its draft advisory first, with a token that writes advisories,
          # so it is fixed in this same run.
          if ADV_WRITE=$(CLIENT_ID="$SECURITY_CLIENT_ID" PRIVATE_KEY="$SECURITY_KEY_INTAKE" bash .dx-central/scripts/app-token.sh mint '{"repository_advisories":"write","metadata":"read"}'); then
            ADV_TOKEN="$ADV_WRITE" python3 .dx-central/scripts/advisory.py intake || echo "::warning::The intake of moved reports failed; the next run tries again."
            curl -fsS -o /dev/null -X DELETE -H "Authorization: Bearer $ADV_WRITE" https://api.github.com/installation/token || true
          else
            echo "::warning::No token that writes advisories: the moved reports wait for the next run."
          fi
          unset SECURITY_KEY_INTAKE
          # What one fix may cost (#287, policy/autonomy.yml budgets-usd).
          echo "budget=$(python3 .dx-central/scripts/autonomy.py policy | jq -r '."budgets-usd"."security-fix" // 10')" >> "$GITHUB_OUTPUT"
          fixes=$(python3 .dx-central/scripts/advisory.py plan)
          echo "fixes=$fixes" >> "$GITHUB_OUTPUT"
          echo "Fixes due: $(jq length <<<"$fixes")"
          mkdir -p "$RUNNER_TEMP/in"
          jq -c '.[]' <<<"$fixes" | while read -r f; do
            ghsa=$(jq -r .ghsa <<<"$f"); repo=$(jq -r .repo <<<"$f")
            GH_TOKEN="$ADV_TOKEN" gh api "repos/$repo/security-advisories/$ghsa" > "$RUNNER_TEMP/in/$ghsa.json" \
              || echo "::warning::$ghsa: its advisory could not be read; its issue here says what is left."
          done

      - name: Keep the advisories
        if: steps.plan.outputs.fixes != '[]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-fix-in
          path: ${{ runner.temp }}/in/*.json
          retention-days: 3

  fix:
    name: Fix ${{ matrix.fix.ghsa }}
    needs: plan
    if: needs.plan.outputs.fixes != '' && needs.plan.outputs.fixes != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # None: the agent works on a stranger's report, and this repository
    # holds other advisories' unpublished fixes. Its token reads nothing
    # here (the artifacts go by the runner's own token).
    permissions: {}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        fix: ${{ fromJSON(needs.plan.outputs.fixes) }}
    steps:
      - name: The advisory
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: security-fix-in
          path: ${{ runner.temp }}/in

      # The public repository, cloned anonymously, is the working tree; the
      # engine's scripts go beside it, out of its commits.
      - name: The working tree
        env:
          REPO: ${{ matrix.fix.repo }}
          GHSA: ${{ matrix.fix.ghsa }}
          BRANCH: ${{ matrix.fix.branch }}
        run: |
          set -euo pipefail
          [ -s "$RUNNER_TEMP/in/$GHSA.json" ] || { echo "::warning::$GHSA: the plan could not read its advisory."; exit 1; }
          cp "$RUNNER_TEMP/in/$GHSA.json" "$RUNNER_TEMP/advisory.json"
          rm -rf "$RUNNER_TEMP/in"
          git clone -q "https://github.com/$REPO" .
          echo "START=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git checkout -q -b "$BRANCH"
          git config user.name "dilux-bot[bot]"
          git config user.email "333187390+dilux-bot[bot]@users.noreply.github.com"
          printf '%s\n' /.dx-central/ /.dx-advisory-notes.md /.dx-advisory-verdict.json >> .git/info/exclude

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref || job.workflow_sha }}
          persist-credentials: false
          path: .dx-central

      - name: The agent's task
        id: task
        env:
          # A maintainer's guidance when they sent a failed fix back (#313).
          HINT: ${{ matrix.fix.hint }}
        run: |
          set -euo pipefail
          eof="DX_$(openssl rand -hex 16)"
          { echo "prompt<<$eof"; python3 .dx-central/scripts/advisory.py prompt < "$RUNNER_TEMP/advisory.json"; echo "$eof"; } >> "$GITHUB_OUTPUT"

      - name: Claude writes the test and the fix
        id: agent
        timeout-minutes: 45
        continue-on-error: true # what it committed still goes on, with its notes
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.task.outputs.prompt }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 120
            --max-budget-usd ${{ needs.plan.outputs.budget || '10' }}
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"

      # The repository's own checks, in this job: they are its code, and
      # this job can write nothing.
      - name: The repository's checks, and the patch
        if: always()
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/advisory.json" "$RUNNER_TEMP/out/" 2>/dev/null || true
          [ -f .dx-advisory-notes.md ] && cp .dx-advisory-notes.md "$RUNNER_TEMP/out/notes.md"
          [ -f .dx-advisory-verdict.json ] && head -c 4000 .dx-advisory-verdict.json > "$RUNNER_TEMP/out/verdict.json"
          if [ "$(git rev-list --count HEAD "^$START" 2>/dev/null || echo 0)" = 0 ]; then
            echo "result=nothing" > "$RUNNER_TEMP/out/checks"; exit 0
          fi
          git format-patch --binary --stdout "$START..HEAD" > "$RUNNER_TEMP/out/fix.patch"
          if [ -f Makefile ] && make -n pre-pr >/dev/null 2>&1; then
            if make pre-pr > "$RUNNER_TEMP/out/checks.log" 2>&1; then r=passed; else r=failed; fi
          else
            r=none
          fi
          echo "result=$r" > "$RUNNER_TEMP/out/checks"

      - name: Keep the patch
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fix-${{ matrix.fix.ghsa }}
          path: ${{ runner.temp }}/out/
          retention-days: 3

  record:
    name: Record ${{ matrix.fix.ghsa }}
    needs: [plan, fix]
    if: always() && needs.plan.outputs.fixes != '' && needs.plan.outputs.fixes != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        fix: ${{ fromJSON(needs.plan.outputs.fixes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref || job.workflow_sha }}
          persist-credentials: false
          path: .dx-central

      - name: The agent's patch
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fix-${{ matrix.fix.ghsa }}
          path: ${{ runner.temp }}/in

      # This repository only: the branch and the claim's issue.
      - name: dilux-bot token (this repository)
        id: write
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write

      # The triage (#247): one still in triage moves to draft only when the
      # agent found a vulnerability, reproduced it with a failing test and
      # fixed it with checks that did not fail (advisory.py advance). It is
      # decided here and done last, once the fix is recorded.
      - name: The triage
        id: triage
        env:
          STATE: ${{ matrix.fix.state }}
        # Never fatal: whatever happens here, the next step records the fix.
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/in"
          r=$(sed -n 's/^result=//p' "$RUNNER_TEMP/in/checks" 2>/dev/null | head -n1)
          case $r in passed|failed|none) ;; *) r=nothing ;; esac
          [ -s "$RUNNER_TEMP/in/fix.patch" ] || r=nothing
          echo "checks=$r" >> "$GITHUB_OUTPUT"
          d=$(STATE="$STATE" CHECKS="$r" VERDICT="$RUNNER_TEMP/in/verdict.json" python3 .dx-central/scripts/advisory.py advance) \
            || d='{"act": "wait", "why": "the triage could not decide", "verdict": {}}'
          act=$(jq -r .act <<<"$d"); why=$(jq -r .why <<<"$d"); said=$(jq -r '.verdict.verdict // ""' <<<"$d")
          echo "act=$act" >> "$GITHUB_OUTPUT"
          text=""
          if [ "$act" = draft ]; then
            text="Triaged here: $why. The bot moves the advisory from triage to draft once this fix is recorded; nobody has to accept it."
          elif [ "$act" = wait ]; then
            text="Triaged here (verdict: ${said:-none}): $why. The advisory stays in triage and waits for a maintainer, who moves it to draft or closes it."
          fi
          { echo "text<<DX_TRIAGE_EOF"; echo "$text"; echo "DX_TRIAGE_EOF"; } >> "$GITHUB_OUTPUT"

      - name: The branch and the issue
        env:
          GH_TOKEN: ${{ steps.write.outputs.token }}
          REPO: ${{ matrix.fix.repo }}
          GHSA: ${{ matrix.fix.ghsa }}
          BRANCH: ${{ matrix.fix.branch }}
          ISSUE: ${{ matrix.fix.issue }}
          TRIAGE: ${{ steps.triage.outputs.text }}
          AT: ${{ matrix.fix.at }}
          r: ${{ steps.triage.outputs.checks }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/in"
          [ -s "$RUNNER_TEMP/in/advisory.json" ] || echo "{\"ghsa_id\": \"$GHSA\"}" > "$RUNNER_TEMP/in/advisory.json"
          url=""
          if [ "$r" != nothing ]; then
            # The patch and the notes on a branch of this repository, in
            # commits GitHub signs (the contents API, as the App).
            base=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
            head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$base" --jq .object.sha)
            # A retry (#313) starts the branch again from the default one.
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" -f sha="$head" -F force=true >/dev/null
            else
              gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$head" >/dev/null
            fi
            for f in fix.patch notes.md checks.log; do
              [ -s "$RUNNER_TEMP/in/$f" ] || continue
              # The request as a file: a large patch or log never goes as an argument.
              python3 -c 'import base64, json, sys; print(json.dumps({"branch": sys.argv[1], "message": sys.argv[2], "content": base64.b64encode(open(sys.argv[3], "rb").read()).decode()}))' \
                "$BRANCH" "fix: $GHSA in ${REPO#*/}, $f" "$RUNNER_TEMP/in/$f" > "$RUNNER_TEMP/put.json"
              gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/fixes/$GHSA/$f" --input "$RUNNER_TEMP/put.json" >/dev/null
            done
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$BRANCH/fixes/$GHSA"
          fi
          ADVISORY="$RUNNER_TEMP/in/advisory.json" CHECKS="$r" TRIAGE="$TRIAGE" AT="$AT" CHECKS_LOG="$RUNNER_TEMP/in/checks.log" NOTES="$RUNNER_TEMP/in/notes.md" \
            PATCH="$RUNNER_TEMP/in/fix.patch" BRANCH_URL="$url" \
            python3 .dx-central/scripts/advisory.py body > "$RUNNER_TEMP/body.md"
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md" >/dev/null
          echo "Recorded $GHSA ($r) in #$ISSUE."

      # Last, once the fix is recorded: the move to draft, with a token that
      # writes that one repository's advisories and is revoked when the step
      # ends. Anything that stops it is said on the issue.
      - name: The advisory to draft
        if: steps.triage.outputs.act == 'draft'
        env:
          REPO: ${{ matrix.fix.repo }}
          GHSA: ${{ matrix.fix.ghsa }}
          ISSUE: ${{ matrix.fix.issue }}
          ISSUE_TOKEN: ${{ steps.write.outputs.token }}
          CLIENT_ID: ${{ vars.DILUX_SECURITY_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.DILUX_SECURITY_PRIVATE_KEY }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          say() { GH_TOKEN="$ISSUE_TOKEN" gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$1"$'\n\n'"🤖 AI-generated · Claude Opus 5.5 (Anthropic), in a private repository" >/dev/null || true; echo "::warning::$GHSA: $1"; }
          export REPOSITORIES="${REPO#*/}"
          if ! GH_TOKEN=$(bash .dx-central/scripts/app-token.sh mint '{"repository_advisories":"write","metadata":"read"}'); then
            say "The advisory was not moved to draft: dilux-security could not get a token that writes advisories (its key must be set here, and its \"Repository security advisories\" permission write). A maintainer moves it by hand."; exit 0
          fi
          export GH_TOKEN
          unset PRIVATE_KEY
          trap 'curl -fsS -o /dev/null -X DELETE -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/installation/token || true' EXIT
          # As it is now, not as the plan saw it: a maintainer may have closed
          # or moved it during the run.
          now=$(gh api "repos/$REPO/security-advisories/$GHSA" --jq .state 2>/dev/null || true)
          # An unvetted draft (#287: the intake's or the nightly review's) is
          # confirmed by closing its issue here (scripts/advisory.py
          # UNVETTED_MARK), the bot's, never by anything in the advisory.
          pending=$(GH_TOKEN="$ISSUE_TOKEN" gh api "repos/$GITHUB_REPOSITORY/issues?state=open&labels=security:unvetted&per_page=100" --paginate \
            --jq ".[] | select(.user.login == \"dilux-bot[bot]\") | select((.body // \"\") | startswith(\"<!-- dx-unvetted: $REPO $GHSA -->\")) | .number" 2>/dev/null || true)
          if [ "$now" = draft ] && [ -n "$pending" ]; then
            for p in $pending; do
              GH_TOKEN="$ISSUE_TOKEN" gh issue close "$p" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Confirmed: the triage reproduced it and fixed it with checks that did not fail."$'\n\n'"🤖 AI-generated · Claude Opus 5.5 (Anthropic), in a private repository" >/dev/null \
                || say "Confirming the advisory failed: a maintainer closes #$p by hand."
            done
            echo "$GHSA confirmed."
          elif [ "$now" != triage ]; then
            say "The advisory was not moved: it is no longer in triage (${now:-unreadable})."
          elif gh api -X PATCH "repos/$REPO/security-advisories/$GHSA" -f state=draft >/dev/null; then
            echo "$GHSA moved to draft."
          else
            say "Moving the advisory to draft failed: a maintainer moves it by hand."
          fi
