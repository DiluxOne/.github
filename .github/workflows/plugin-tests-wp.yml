name: WordPress plugin tests (slow)

# Reusable. The slow suites for a WordPress plugin, on wp-env: PHPUnit
# integration tests and Playwright E2E, each target its own job and its own
# status check. Separate from plugin-checks-wp.yml so they run alongside the
# review instead of in front of it. A suite a repository does not have is
# turned off with its input; its job then shows as skipped (a skipped job
# counts as passing for a required check).
#
# What runs (scripts/test-targets.py turns the inputs into the jobs):
#
#   integration-targets  '["single","network"]': one job per target, checks
#                        "Integration (single site)" and "Integration (network)".
#                        A target is a name, or {name, timeout?} to give its
#                        job more (or fewer) minutes than the default 40: on
#                        the organisation's VM, where four runners share four
#                        cores, the network suite can take twice what it
#                        takes on GitHub's. Left out, the old single job
#                        "Integration tests (wp-env)", on the network unless
#                        `multisite: false`.
#   e2e-suites           a JSON list of {name, site, run, results?, timeout?}:
#                        one job per suite, check "E2E (<name>)". `site` single
#                        is the development site with the plugin activated;
#                        network is the tests site turned into a subdirectory
#                        network (WordPress's rewrite rules written, the plugin
#                        network-activated). `run` is the command, from the
#                        checkout (`npx playwright test -c playwright.network.config.ts`,
#                        `DU_SNAPSHOTS=1 npx playwright test --project=visual`);
#                        `results` the folder kept when it fails (default
#                        build/e2e-results). Left out, the old single job
#                        "E2E (Playwright)": `npx playwright test` on the
#                        development site.
#
# The ports, the mu-plugins and the PHP version are the repository's
# `.wp-env.json`; nothing here knows them. Each job is a fresh runner, so a
# single-site target needs no throwaway environment of its own. On the
# organisation's VM each runner has ports of its own (WP_ENV_PORT,
# WP_ENV_TESTS_PORT, which wp-env obeys), and the suites get their addresses
# from them: WP_BASE_URL, the development site, and WP_NETWORK_URL, the tests
# site, overriding any the runner's environment sets. A repository's
# Playwright configs read those two and default to its own ports.
#
# The calling repository provides `.wp-env.json`, `phpunit-integration.xml`,
# the npm dependencies (`@wordpress/env`, `@playwright/test`) and Playwright
# configs that write their results where `results` says; wp-env mounts the
# checkout under the repository's name. A suite's command runs with Node 20
# and, when the repository has a composer.json, PHP 8.5 and Composer, on
# GitHub's runners and on the organisation's alike (#140).
#
# A plugin that needs another to run (an add-on and its free plugin) names
# it in `requires-plugins-from`, as for plugin-checks-wp.yml: one
# `<slug>=<owner>/<repo>@<ref>` per line, repositories of this organisation,
# read with dilux-bot (the caller passes DILUX_BOT_PRIVATE_KEY). Its shipped
# tree is fetched once, in a job of its own, and every suite mounts it as
# wp-content/plugins/<slug> (merged into the repository's
# `.wp-env.override.json`, scripts/required-plugins.sh) and activates it,
# network-activated on a network, before the plugin under test. A required
# plugin that cannot be fetched fails the suite, naming its repository;
# none is ever tested without it. Left empty, nothing of this runs.
#
#   jobs:
#     tests:
#       uses: DiluxOne/.github/.github/workflows/plugin-tests-wp.yml@v5
#       with:                                   # all optional
#         integration-targets: '["single","network"]'
#         e2e-suites: >-
#           [{"name":"single","site":"single","run":"npx playwright test"},
#            {"name":"network","site":"network","run":"npx playwright test -c playwright.network.config.ts","results":"build/e2e-network-results"}]
#         requires-plugins-from: diluxone-users=DiluxOne/diluxone-users-wordpress@main
#       secrets:
#         DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}   # with requires-plugins-from

on:
  workflow_call:
    inputs:
      integration:
        description: Run PHPUnit integration tests on wp-env.
        type: boolean
        default: true
      multisite:
        description: With integration-targets left out, run the one integration job on a network (true) or a single site (false).
        type: boolean
        default: true
      e2e:
        description: Run Playwright end-to-end tests on wp-env.
        type: boolean
        default: true
      integration-targets:
        description: 'JSON list of where the integration suite runs, "single" and/or "network" (a name, or {name, timeout?}, the job''s minutes, default 40), one job each. Empty keeps the old single job (on the network unless multisite is false).'
        type: string
        default: ''
      e2e-suites:
        description: 'JSON list of end-to-end suites, {name, site (single|network), run, results?, timeout?}, one job each, named "E2E (<name>)". Empty keeps the old single "E2E (Playwright)" job.'
        type: string
        default: ''
      requires-plugins-from:
        description: The plugins this one needs to run (Requires Plugins), one `<slug>=<owner>/<repo>@<ref>` per line, from repositories of this organisation. Every suite mounts their shipped tree as wp-content/plugins/<slug> and activates them before this plugin. Needs the DILUX_BOT_PRIVATE_KEY secret.
        type: string
        default: ''
      central-ref:
        description: Ref of DiluxOne/.github to read the policy from.
        type: string
        default: v5
    secrets:
      # Only with requires-plugins-from: a token that reads those repositories.
      DILUX_BOT_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    # The slow, paid part of a pull request runs only when it changes code:
    # the `code` and `plugin-check` lists of the policy (the organisation's
    # defaults plus the repository's .github/review-policy.yml, read from
    # the base branch so a change cannot exempt itself). Anything else
    # (docs, translations, a readme) gets the fast checks and the review.
    # A push to main runs everything unless the commit is the squash merge of a
    # pull request of this repository whose checks ran on this very tree; a
    # weekly scheduled run covers drift. The gates below run on !cancelled()
    # and treat a missing answer as "run", so this job failing (or an older
    # central without the script) never skips a suite; a job skipped by
    # the answer satisfies the ruleset.
    runs-on: ${{ vars.DX_RUNNER == 'self-hosted' && fromJSON('["self-hosted","linux","x64","diluxone"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the pull request behind a push to main
      checks: read # and the checks of its head
    outputs:
      code: ${{ steps.changes.outputs.code }}
      integration: ${{ steps.plan.outputs.integration }}
      e2e: ${{ steps.plan.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its two parents: enough for the diff.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref }}
          path: .dx-central
          persist-credentials: false
      - name: The jobs to run (one per target and suite)
        id: plan
        env:
          INTEGRATION: ${{ inputs.integration }}
          MULTISITE: ${{ inputs.multisite }}
          INTEGRATION_TARGETS: ${{ inputs.integration-targets }}
          E2E: ${{ inputs.e2e }}
          E2E_SUITES: ${{ inputs.e2e-suites }}
        run: python3 .dx-central/scripts/test-targets.py
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_POLICY: .dx-central/policy/review-policy.default.yml
        run: bash .dx-central/scripts/changes.sh

  required-plugins:
    name: Required plugins (from the organisation)
    # Opt-in (`requires-plugins-from`), as in plugin-checks-wp.yml: the
    # shipped tree of each plugin this one needs, fetched with a dilux-bot
    # token that reads those repositories alone, in a job that never checks
    # out the code under test: the key never shares a job with a pull
    # request's code. A fork's pull request gets no secret, and this job
    # fails for it. It runs when a suite does.
    needs: changes
    if: ${{ !cancelled() && inputs.requires-plugins-from != '' && (inputs.integration || inputs.e2e) && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ vars.DX_RUNNER == 'self-hosted' && fromJSON('["self-hosted","linux","x64","diluxone"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref }}
          path: .dx-central
          persist-credentials: false
      - name: The repositories
        id: repos
        env:
          REQUIRES: ${{ inputs.requires-plugins-from }}
          OWNER: ${{ github.repository_owner }}
          HAS_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != true ]; then
            echo "::error::requires-plugins-from needs the DILUX_BOT_PRIVATE_KEY secret (secrets: in the caller; a fork's pull request gets none)."
            exit 1
          fi
          list=$(bash .dx-central/scripts/required-plugins.sh repos)
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - name: dilux-bot token (read those repositories)
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repos.outputs.list }}
          permission-contents: read
      - name: Their shipped trees
        env:
          REQUIRES: ${{ inputs.requires-plugins-from }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: bash .dx-central/scripts/required-plugins.sh fetch "$RUNNER_TEMP/required-plugins"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Not plugin-checks-wp.yml's name: a caller runs both in one run.
          name: required-plugins-tests
          path: ${{ runner.temp }}/required-plugins
          # A re-run of the failed jobs alone reuses this attempt's artifact.
          retention-days: 7
          include-hidden-files: true
          # A re-run of every job uploads it again under the same name.
          overwrite: true

  integration:
    name: ${{ matrix.target.check }}
    needs: [changes, required-plugins]
    # Always there, so its check carries the name a ruleset requires (a job
    # skipped before its matrix expands reports an unexpanded name). When
    # the suite is off, or no code changed, every step is skipped and the
    # job is green.
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.DX_RUNNER == 'self-hosted' && fromJSON('["self-hosted","linux","x64","diluxone"]') || 'ubuntu-latest' }}
    # The target's minutes, from the plan (40 unless the caller says; 40 too
    # when an older central-ref's plan carries none).
    timeout-minutes: ${{ matrix.target.timeout || 40 }}
    strategy:
      fail-fast: false
      matrix:
        # The plan comes from the `changes` job; if that job failed there is
        # none, and one entry that fails loudly stands in for it (its name is
        # no check a ruleset requires, so the pull request stays blocked).
        target: ${{ fromJSON(needs.changes.outputs.integration || '[{"check":"No test plan (What changed failed)","enabled":false,"timeout":5,"noplan":true}]') }}
    env:
      GO: ${{ matrix.target.enabled && needs.changes.outputs.code != 'false' }}
    steps:
      - if: matrix.target.noplan
        run: |
          echo "::error::The What changed job failed, so there is no test plan: fix it and re-run."
          exit 1
      - if: env.GO != 'true'
        run: echo "Nothing to run here (suite off, or no code changed)."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.GO == 'true'
        with:
          node-version: '20'
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: env.GO == 'true'
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
        if: env.GO == 'true'
      - run: npm install --no-audit --no-fund
        if: env.GO == 'true'
      # The plugins this one needs (`requires-plugins-from`): from the
      # required-plugins job (a skipped job there would pass the suite
      # without them), mounted beside it before wp-env starts.
      - name: The required plugins arrived
        if: inputs.requires-plugins-from != '' && env.GO == 'true'
        env:
          RESULT: ${{ needs.required-plugins.result }}
          REQUIRES: ${{ inputs.requires-plugins-from }}
        run: |
          [ "$RESULT" = success ] || { echo "::error::The required plugins ($(printf '%s' "$REQUIRES" | tr '\n' ' ')) could not be fetched (the Required plugins job: $RESULT; its log names the repository). The suite does not run without them."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.requires-plugins-from != '' && env.GO == 'true'
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref }}
          path: .dx-central
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: required-download
        if: inputs.requires-plugins-from != '' && env.GO == 'true'
        continue-on-error: true
        with:
          name: required-plugins-tests
          path: ${{ runner.temp }}/required-plugins
      - name: Mount the required plugins beside it
        id: required
        if: inputs.requires-plugins-from != '' && env.GO == 'true'
        env:
          DOWNLOAD: ${{ steps.required-download.outcome }}
          REQUIRES: ${{ inputs.requires-plugins-from }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          [ "$DOWNLOAD" = success ] || { echo "::error::The required plugins' artifact could not be downloaded: gone (it lasts 7 days, and a re-run of the failed jobs alone reuses the first attempt's) or a download error. Re-run all jobs."; exit 1; }
          bash .dx-central/scripts/required-plugins.sh mount "$RUNNER_TEMP/required-plugins"
          echo "slugs=$(bash .dx-central/scripts/required-plugins.sh slugs)" >> "$GITHUB_OUTPUT"
      - run: npx wp-env start
        if: env.GO == 'true'
      - name: The required plugins, active (single site)
        if: inputs.requires-plugins-from != '' && env.GO == 'true' && matrix.target.site == 'single'
        env:
          SLUGS: ${{ steps.required.outputs.slugs }}
        run: |
          read -ra slugs <<<"$SLUGS"
          npx wp-env run tests-cli wp plugin activate "${slugs[@]}"
      - name: Multisite network
        if: env.GO == 'true' && matrix.target.site == 'network'
        # Converted, then checked: on a database that already holds a network's
        # tables (a runner that kept the last job's wp-env volumes) WP-CLI says
        # "The network already exists." and writes no constant, and the suite
        # would fail three steps later saying the site is not a network.
        env:
          REPO: ${{ github.event.repository.name }}
          SLUGS: ${{ steps.required.outputs.slugs }}
        run: |
          set -euo pipefail
          npx wp-env run tests-cli wp core is-installed --network >/dev/null 2>&1 \
            || npx wp-env run tests-cli wp core multisite-convert --title="Tests network"
          npx wp-env run tests-cli wp core is-installed --network >/dev/null 2>&1 \
            || { echo "::error::The tests site is not a network after converting it. WP-CLI's output above says why; the usual cause is a database that is not fresh (a runner that kept the last run's wp-env volume, whose network already exists)."; exit 1; }
          # The plugins it needs first (requires-plugins-from), or WordPress
          # refuses it for its Requires Plugins header.
          read -ra slugs <<<"$SLUGS"
          [ "${#slugs[@]}" -eq 0 ] || npx wp-env run tests-cli wp plugin activate "${slugs[@]}" --network
          npx wp-env run tests-cli wp plugin activate "$REPO" --network
      - name: PHPUnit (integration)
        if: env.GO == 'true'
        # wp-env mounts the checkout under the repository's name.
        env:
          REPO: ${{ github.event.repository.name }}
        run: npx wp-env run tests-cli sh -c "cd wp-content/plugins/$REPO && php vendor/bin/phpunit -c phpunit-integration.xml"
      - if: always() && env.GO == 'true'
        run: npx wp-env stop

  e2e:
    name: ${{ matrix.suite.check }}
    needs: [changes, required-plugins]
    # Always there, like the integration jobs, for the same reason.
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.DX_RUNNER == 'self-hosted' && fromJSON('["self-hosted","linux","x64","diluxone"]') || 'ubuntu-24.04' }}
    timeout-minutes: ${{ matrix.suite.timeout }}
    strategy:
      fail-fast: false
      matrix:
        # The plan comes from the `changes` job; if that job failed there is
        # none, and one entry that fails loudly stands in for it (its name is
        # no check a ruleset requires, so the pull request stays blocked).
        suite: ${{ fromJSON(needs.changes.outputs.e2e || '[{"check":"No test plan (What changed failed)","enabled":false,"timeout":5,"noplan":true}]') }}
    env:
      GO: ${{ matrix.suite.enabled && needs.changes.outputs.code != 'false' }}
    steps:
      - if: matrix.suite.noplan
        run: |
          echo "::error::The What changed job failed, so there is no test plan: fix it and re-run."
          exit 1
      - if: env.GO != 'true'
        run: echo "Nothing to run here (suite off, or no code changed)."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.GO == 'true'
        with:
          node-version: '20'
      # A suite's command may rely on PHP and Composer, as it can on GitHub's
      # runners: the organisation's runner image carries neither by design
      # (#140), so they are set up here when the repository has a
      # composer.json; a repository without one gets no PHP and loses no time.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: env.GO == 'true' && hashFiles('composer.json') != ''
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: npm install --no-audit --no-fund
        if: env.GO == 'true'
      - name: Chromium
        if: env.GO == 'true'
        # On GitHub's runners every job has a machine of its own, and installs
        # Chromium's system libraries with apt. The organisation's VM runs a
        # dozen jobs on one system, where apt takes one at a time: it carries
        # those libraries, provisioned on every boot, and a job there fetches
        # the browser alone, into its user's cache.
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          if [ "$RUNNER_KIND" = self-hosted ]; then npx playwright install chromium
          else npx playwright install --with-deps chromium; fi
      # The plugins this one needs (`requires-plugins-from`): from the
      # required-plugins job (a skipped job there would pass the suite
      # without them), mounted beside it before wp-env starts.
      - name: The required plugins arrived
        if: inputs.requires-plugins-from != '' && env.GO == 'true'
        env:
          RESULT: ${{ needs.required-plugins.result }}
          REQUIRES: ${{ inputs.requires-plugins-from }}
        run: |
          [ "$RESULT" = success ] || { echo "::error::The required plugins ($(printf '%s' "$REQUIRES" | tr '\n' ' ')) could not be fetched (the Required plugins job: $RESULT; its log names the repository). The suite does not run without them."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.requires-plugins-from != '' && env.GO == 'true'
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref }}
          path: .dx-central
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: required-download
        if: inputs.requires-plugins-from != '' && env.GO == 'true'
        continue-on-error: true
        with:
          name: required-plugins-tests
          path: ${{ runner.temp }}/required-plugins
      - name: Mount the required plugins beside it
        id: required
        if: inputs.requires-plugins-from != '' && env.GO == 'true'
        env:
          DOWNLOAD: ${{ steps.required-download.outcome }}
          REQUIRES: ${{ inputs.requires-plugins-from }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          [ "$DOWNLOAD" = success ] || { echo "::error::The required plugins' artifact could not be downloaded: gone (it lasts 7 days, and a re-run of the failed jobs alone reuses the first attempt's) or a download error. Re-run all jobs."; exit 1; }
          bash .dx-central/scripts/required-plugins.sh mount "$RUNNER_TEMP/required-plugins"
          echo "slugs=$(bash .dx-central/scripts/required-plugins.sh slugs)" >> "$GITHUB_OUTPUT"
      - run: npx wp-env start
        if: env.GO == 'true'
      - name: Activate the plugin (single site)
        if: env.GO == 'true' && matrix.suite.site == 'single'
        # The plugins it needs first (requires-plugins-from), in one call.
        env:
          REPO: ${{ github.event.repository.name }}
          SLUGS: ${{ steps.required.outputs.slugs }}
        run: |
          read -ra slugs <<<"$SLUGS"
          npx wp-env run cli wp plugin activate "${slugs[@]}" "$REPO"
      - name: A subdirectory network on the tests site, the plugin network-activated
        if: env.GO == 'true' && matrix.suite.site == 'network'
        # WordPress's own rewrite rules for a subdirectory network: without
        # them a site's /wp-admin/ is a 404 and a browser cannot reach the
        # other sites of the network.
        env:
          REPO: ${{ github.event.repository.name }}
          SLUGS: ${{ steps.required.outputs.slugs }}
        run: |
          set -euo pipefail
          npx wp-env run tests-cli wp core is-installed --network >/dev/null 2>&1 \
            || npx wp-env run tests-cli wp core multisite-convert --title="Tests network"
          # Checked, as in the integration job: a database that already holds a
          # network's tables converts to nothing, and the suite would only say
          # so three steps later.
          npx wp-env run tests-cli wp core is-installed --network >/dev/null 2>&1 \
            || { echo "::error::The tests site is not a network after converting it. WP-CLI's output above says why; the usual cause is a database that is not fresh (a runner that kept the last run's wp-env volume, whose network already exists)."; exit 1; }
          # Written into the checkout, which wp-env mounts as the plugin's
          # folder, and copied from there inside the container.
          mkdir -p build
          cat > build/dx-network.htaccess <<'HTACCESS'
          # BEGIN WordPress Multisite
          RewriteEngine On
          RewriteBase /
          RewriteRule ^index\.php$ - [L]
          RewriteRule ^([_0-9a-zA-Z-]+/)?wp-admin$ $1wp-admin/ [R=301,L]
          RewriteCond %{REQUEST_FILENAME} -f [OR]
          RewriteCond %{REQUEST_FILENAME} -d
          RewriteRule ^ - [L]
          RewriteRule ^([_0-9a-zA-Z-]+/)?(wp-(content|admin|includes).*) $2 [L]
          RewriteRule ^([_0-9a-zA-Z-]+/)?(.*\.php)$ $2 [L]
          RewriteRule . index.php [L]
          # END WordPress Multisite
          HTACCESS
          npx wp-env run tests-cli bash -c "cp /var/www/html/wp-content/plugins/$REPO/build/dx-network.htaccess /var/www/html/.htaccess"
          # The plugins it needs first (requires-plugins-from), or WordPress
          # refuses it for its Requires Plugins header.
          read -ra slugs <<<"$SLUGS"
          [ "${#slugs[@]}" -eq 0 ] || npx wp-env run tests-cli wp plugin activate "${slugs[@]}" --network
          npx wp-env run tests-cli wp plugin activate "$REPO" --network
      - name: Run the suite
        if: env.GO == 'true'
        env:
          CI: 'true'
          RUN: ${{ matrix.suite.run }}
        # A runner with ports of its own (the organisation's VM, one pair per
        # runner, so suites side by side never share one) states them alone;
        # the addresses every suite reads come from them: WP_BASE_URL, the
        # development site, and WP_NETWORK_URL, the tests site. Elsewhere
        # neither port is set and each repository keeps its own defaults.
        run: |
          [ -z "${WP_ENV_PORT:-}" ] || export WP_BASE_URL="http://localhost:$WP_ENV_PORT"
          [ -z "${WP_ENV_TESTS_PORT:-}" ] || export WP_NETWORK_URL="http://localhost:$WP_ENV_TESTS_PORT"
          mkdir -p build
          bash -c "$RUN"
      - if: failure() && env.GO == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.suite.artifact }}
          path: ${{ matrix.suite.results }}
          retention-days: 7
      - if: always() && env.GO == 'true'
        run: npx wp-env stop
