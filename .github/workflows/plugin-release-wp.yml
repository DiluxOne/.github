name: WordPress plugin release

# Reusable. Publishes a WordPress plugin to wordpress.org as a deployment
# the maintainer approves, from the version the labels of what merged say
# is next; or from a tag X.Y.Z an administrator pushes by hand, which is
# the same pipeline with the version typed instead of computed.
#
# On a push to main, the `version` job runs scripts/next-version.py: the
# type:* labels of the pull requests merged since the last X.Y.Z tag give
# the bump (breaking → major, feat → minor, fix or perf → patch; a
# version:* label a person set wins). Nothing pending, or the policy's
# `release:` says `off` for that bump: the run ends there, green, and the
# summary says why. Something pending: the `release` job waits for the
# environment's reviewers (the summary shows the version, the bump and the
# pull requests that justify it), then stamps the three version markers to
# X.Y.Z in the checkout, validates them, commits trunk + tags/X.Y.Z +
# assets to SVN, then creates the tag and the GitHub release in one call
# with the release App's token, with the changelog and what was merged,
# grouped by type. Nothing is ever committed to main: the markers there
# stay at the last released version and every development build stamps
# itself. After the approval the job checks again that this is still the
# release to make: the tag does not exist, the labels still give this
# version, the commit is on the default branch. A push made while a run
# waited for approval queues behind it (one release at a time) and, once
# the first shipped, finds the tag and stops.
#
# On a tag X.Y.Z: the same, except that the tag is the version, it must be
# the one the labels say is next (a typed number cannot skip the pipeline),
# and the release is created on the existing tag. A tag this workflow
# created itself arrives with its release already there, so that run stops.
#
# The readme's newest changelog entry names the version: `= X.Y.Z =` equal to
# the computed one, or `= Unreleased =`, which the job renames in the build. A
# different number is a disagreement between the roadmap and the labels, and
# the job refuses until a person settles it with a version:* label or the
# readme. The same entry says whether the version is ready: while its first
# line is `Unreleased.` (scripts/release-ready.sh), the version job ends green with "Not ready"
# and no deployment waits for anyone, however many pull requests merged. The
# notes under that line are written as the changes merge; the pull request
# that removes the line is the decision to release. A tag pushed by hand is
# refused the same way.
#
# Every push to main also produces a development build, whatever the labels
# or the readme say: the tree that ships (minus .distignore) with the three
# markers stamped `<next>-dev.<N>` and a `Build: <commit>` header, as the
# run's artifact `<slug>-<next>-dev.<N>`, kept 30 days, for anyone to install
# and try what is coming. Nothing is committed or tagged for it.
#
# Release tags are permanent (tag protection): a failed deploy is fixed and
# re-run, never re-tagged. `dry-run: true` rehearses everything but the SVN
# commit, the tag and the release, and shows the release notes in the run's
# summary.
#
# The release job runs in the calling repository's environment
# (`environment`, default `wordpress-org`), and that is where the SVN
# credentials and the release App's key live: as environment secrets, never
# as repository or organisation secrets. The environment's deployment policy
# admits main and X.Y.Z tags, and its required reviewers are the approval.
# The caller passes `secrets: inherit`, which is why it runs only on main and
# on X.Y.Z tags, and calls this workflow at a fixed commit.
#
#   on:
#     push:
#       branches: [main]
#       tags: ['[0-9]+.[0-9]+.[0-9]+']
#   permissions:
#     contents: write
#     pull-requests: read # the labels of what merged decide the version
#   jobs:
#     release:
#       uses: DiluxOne/.github/.github/workflows/plugin-release-wp.yml@<sha> # vX.Y.Z
#       with:
#         slug: diluxone-offload
#         version-constant: DILUXONE_OFFLOAD_VERSION   # optional
#         dry-run: false                               # true rehearses without committing
#       secrets: inherit

on:
  workflow_call:
    inputs:
      slug:
        description: wordpress.org slug (the SVN path).
        type: string
        required: true
      main-file:
        description: Main plugin file. Defaults to <slug>.php.
        type: string
        default: ''
      version-constant:
        description: PHP constant that must equal the version. Empty to skip.
        type: string
        default: ''
      dry-run:
        description: Check out SVN and prepare the commit without committing it, create no tag and no release, show the notes in the summary. For rehearsing.
        type: boolean
        default: false
      environment:
        description: The repository environment the release job runs in. Its deployment policy should allow main and X.Y.Z tags, its required reviewers are the approval, and the SVN secrets and the release App's key live in it.
        type: string
        default: wordpress-org
      auto-environment:
        description: 'The environment used instead when the policy says release.<bump>: auto (same secrets, no reviewers). Empty means auto behaves like approve.'
        type: string
        default: ''
      central-ref:
        description: The ref of DiluxOne/.github whose scripts and policy to use.
        type: string
        default: v2
    outputs:
      version:
        description: The version released, or empty when nothing was.
        value: ${{ jobs.release.outputs.version }}
      dev:
        description: The development version of this commit, <next>-dev.<N>; the artifact of the development build is named <slug>-<dev>.
        value: ${{ jobs.version.outputs.dev }}

permissions:
  contents: write

jobs:
  version:
    name: What is next
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the labels of what merged
    outputs:
      version: ${{ steps.next.outputs.version }}
      environment: ${{ steps.next.outputs.environment }}
      dev: ${{ steps.next.outputs.dev }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref }}
          path: .dx-central
          persist-credentials: false
      - id: next
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ inputs.environment }}
          AUTO_ENVIRONMENT: ${{ inputs.auto-environment }}
          DEFAULT_POLICY: .dx-central/policy/review-policy.default.yml
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          { echo "version="; echo "dev="; echo "environment=$ENVIRONMENT"; } >> "$GITHUB_OUTPUT"
          # On a tag run the tag itself is already the newest X.Y.Z: it is
          # left out, so the labels are read from the last release before it.
          exclude=""; case "$GITHUB_REF" in refs/tags/*) exclude="${GITHUB_REF#refs/tags/}";; esac
          # A tag that already has its release (the job creates both in one
          # call) needs nothing: that is checked before anything else runs.
          if [ -n "$exclude" ]; then
            if ! [[ "$exclude" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag '$exclude' is not X.Y.Z; nothing runs for it."; exit 1
            fi
            if gh release view "$exclude" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
              echo "Release $exclude already exists: this tag was created together with the release that published it. Nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          next=$(python3 .dx-central/scripts/next-version.py --repo "$GITHUB_REPOSITORY" --base "$BASE" ${exclude:+--exclude-tag "$exclude"} --json)
          bump=$(jq -r .bump <<<"$next"); pending=$(jq -r .pending <<<"$next"); coming=$(jq -r .next <<<"$next"); last=$(jq -r .last <<<"$next")
          per_type=$(jq -r '.pulls | to_entries[] | "\(.key): " + (.value | map("#\(.)") | join(", "))' <<<"$next")
          jq -r '"dev=" + .dev' <<<"$next" >> "$GITHUB_OUTPUT"
          # The readme says whether the version is ready: the first line under
          # the newest changelog entry, exactly `Unreleased.`, holds it. The
          # notes below that line are written as the changes merge; the pull
          # request that removes the line is the decision to release.
          held=false
          if [ -f readme.txt ]; then
            rc=0; bash .dx-central/scripts/release-ready.sh readme.txt || rc=$?
            case "$rc" in 0|2) ;; 1) held=true ;; *) echo "::error::release-ready.sh failed ($rc)."; exit 1 ;; esac
          fi

          case "$GITHUB_REF" in
            refs/tags/*)
              tag="$exclude"
              if [ "$pending" != true ] || [ "$tag" != "$coming" ]; then
                if [ "$pending" = true ]; then expected="the labels say $coming is next"; else expected="nothing merged since $last asks for a version"; fi
                echo "::error::Tag $tag cannot be released: $expected. A typed number cannot skip the pipeline: label a merged pull request version:major, version:minor or version:patch so the labels reach $tag, then re-run."
                printf '%s\n' "$per_type" >&2
                exit 1
              fi
              if [ "$held" = true ]; then
                echo "::error file=readme.txt::Tag $tag cannot be released: the newest changelog entry still starts with 'Unreleased.'. A typed number cannot skip the readiness either: remove that line in a pull request, then re-run."
                exit 1
              fi
              version=$tag
              ;;
            *)
              # shellcheck disable=SC2016 # backticks in the Markdown of the summary, not commands.
              if [ "$pending" != true ]; then
                printf '## Nothing to release\n\nSince %s nothing merged asks for a version: no `type:breaking`, `type:feat`, `type:fix` or `type:perf` label, no `version:*` label.\n\n%s\n' "$last" "${per_type:-_no pull requests_}" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              # shellcheck disable=SC2016 # backticks in the Markdown of the summary, not commands.
              if [ "$held" = true ]; then
                printf '## Not ready\n\nThe labels of what merged give a **%s** release after %s (%s), but the newest changelog entry in `readme.txt` still starts with `Unreleased.`: the version is not ready and nothing waits for approval. Write the notes under that line as the changes merge; the pull request that removes the line releases it.\n\n%s\n' "$bump" "$last" "$coming" "$per_type" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              # The policy decides, per bump, whether a person approves.
              mode=$(python3 - "$DEFAULT_POLICY" .github/review-policy.yml "$bump" <<'PY'
          import sys; sys.path.insert(0, ".dx-central/scripts"); import policy
          d = policy.load_yaml(sys.argv[1]) or {}; r = policy.load_yaml(sys.argv[2]) or {}
          rel = {**(d.get("release") or {}), **(r.get("release") or {})}
          mode = str(rel.get(sys.argv[3], "approve"))
          if mode == "auto" and not d.get("auto-allowed", False):
              sys.stderr.write("::warning::release.%s: auto is not allowed by the organisation policy (auto-allowed: false); a person approves.\n" % sys.argv[3])
              mode = "approve"
          print(mode)
          PY
              )
              # shellcheck disable=SC2016 # backticks in the Markdown of the summary, not commands.
              case "$mode" in
                off) printf '## Not released\n\nA %s release (%s) is pending but the policy says `release.%s: off`.\n\n%s\n' "$bump" "$coming" "$bump" "$per_type" >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
                auto) [ -n "$AUTO_ENVIRONMENT" ] && echo "environment=$AUTO_ENVIRONMENT" >> "$GITHUB_OUTPUT" ;;
                approve) ;;
                *) echo "::error::release.$bump is '$mode'; it must be approve, auto or off."; exit 1 ;;
              esac
              version=$coming
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf '## Release %s\n\nA **%s** release after %s, from the labels of what merged:\n\n%s\n\nApprove the deployment to publish it; reject it and nothing happens. A later push to main computes again.\n' "$version" "$bump" "$last" "$per_type" >> "$GITHUB_STEP_SUMMARY"

  development-build:
    name: Development build
    # Every push to main, whatever the labels or the readme say, and
    # whatever happens to the version job: the tree that ships, stamped with
    # the version that is coming and the commit it was built from, for
    # anyone to install and try. It computes the development version itself
    # so that it does not depend on the release's job. Never on a tag: a
    # release is its own build. No secrets, no write: nothing is committed
    # or tagged for it.
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the labels of what merged
    env:
      SLUG: ${{ inputs.slug }}
      MAIN: ${{ inputs.main-file != '' && inputs.main-file || format('{0}.php', inputs.slug) }}
      CONSTANT: ${{ inputs.version-constant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref }}
          path: .dx-central
          persist-credentials: false

      - name: The development version
        id: dev
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          dev=$(python3 .dx-central/scripts/next-version.py --repo "$GITHUB_REPOSITORY" --base "$BASE" --json | jq -r .dev)
          [ -n "$dev" ] || { echo "::error::next-version.py gave no development version."; exit 1; }
          echo "dev=$dev" >> "$GITHUB_OUTPUT"
          # The central's checkout leaves before the tree is packed: nothing
          # that is not the plugin may end up in the build.
          rm -rf .dx-central

      - name: Stamp the development version and pack the tree
        env:
          DEV: ${{ steps.dev.outputs.dev }}
        # The same three markers the release stamps, to <next>-dev.<N>, plus
        # a `Build:` header line (absent in the tree) with the commit: a
        # site shows both under Plugins and wherever the plugin reads its
        # headers. The zip holds the plugin folder, named after the slug,
        # the way WordPress installs it.
        run: |
          set -euo pipefail
          build=${GITHUB_SHA:0:7}
          sed -i -E "s/^(\s*\*\s*Version:\s*).*$/\1$DEV\n * Build: $build/" "$MAIN"
          if [ -n "$CONSTANT" ]; then sed -i -E "s/^(define\(\s*'${CONSTANT}',\s*').*('\s*\);)$/\1$DEV\2/" "$MAIN"; fi
          sed -i -E "s/^(Stable tag:\s*).*$/\1$DEV/" readme.txt
          grep -qE "^\s*\*\s*Version:\s*$DEV$" "$MAIN" || { echo "::error file=$MAIN::The Version header did not take $DEV."; exit 1; }
          grep -qE "^Stable tag:\s*$DEV$" readme.txt || { echo "::error file=readme.txt::Stable tag did not take $DEV."; exit 1; }
          exclude=(); [ -f .distignore ] && exclude=(--exclude-from=.distignore)
          mkdir -p "$RUNNER_TEMP/dist"
          rsync -rc "${exclude[@]}" --exclude=.git --exclude=.github ./ "$RUNNER_TEMP/dist/$SLUG/" --delete
          # shellcheck disable=SC2016 # backticks in the Markdown of the summary, not commands.
          printf '## Development build %s\n\nThe tree that ships, stamped `%s` from commit `%s`, is the artifact **%s** of this run (download it from the summary of the run, unzip, install the `%s` folder as a plugin). Not a release: nothing was committed or tagged.\n' "$DEV" "$DEV" "$build" "$SLUG-$DEV" "$SLUG" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.slug }}-${{ steps.dev.outputs.dev }}
          path: ${{ runner.temp }}/dist
          retention-days: 30
          if-no-files-found: error

  release:
    name: Deploy to wordpress.org
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ needs.version.outputs.environment }}
    # One release at a time; a run waiting for approval is never cancelled by
    # a newer push (the approver decides), and a run deploying is never
    # cancelled at all.
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      version: ${{ needs.version.outputs.version }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MAIN: ${{ inputs.main-file != '' && inputs.main-file || format('{0}.php', inputs.slug) }}
      CONSTANT: ${{ inputs.version-constant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref }}
          path: .dx-central
          persist-credentials: false

      - name: Still the release to make
        # Time passed while a person decided. The version is computed again
        # and must be the one approved; the commit must be on the default
        # branch; and the tag must not exist yet (it does after a release
        # shipped from a run that waited ahead of this one: then there is
        # nothing left to do, and every step below is skipped).
        id: still
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          echo "go=true" >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF" in refs/tags/*) on_tag=true;; *) on_tag=false;; esac
          # The checkout has every tag (fetch-depth 0), so no call is needed.
          if [ "$on_tag" = false ] && git rev-parse -q --verify "refs/tags/$VERSION^{commit}" >/dev/null; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            printf '## Already released\n\nTag %s exists: a run that waited ahead of this one released it, without what this run merged. Re-run this workflow (or push to %s) to compute the next version from the labels again.\n' "$VERSION" "$BASE" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$BASE" || { echo "::error::$GITHUB_SHA is not on $BASE; a release is a commit of $BASE."; exit 1; }
          exclude=""; if [ "$on_tag" = true ]; then exclude="$VERSION"; fi
          again=$(python3 .dx-central/scripts/next-version.py --repo "$GITHUB_REPOSITORY" --base "$BASE" ${exclude:+--exclude-tag "$exclude"} --json | jq -r 'if .pending then .next else "" end')
          [ "$again" = "$VERSION" ] || { echo "::error::The labels now give '${again:-nothing}' where $VERSION was approved; something merged or was relabelled meanwhile. Nothing reached wordpress.org; the next push to $BASE computes again."; exit 1; }
          echo "Still $VERSION, on $BASE, no tag yet."
          # The central's checkout has done its work; it leaves the workspace
          # now, because the deploy action copies the workspace minus
          # .distignore into SVN, and nothing that is not the plugin may ship.
          rm -rf .dx-central

      - name: Stamp the version markers
        if: steps.still.outputs.go == 'true'
        # The checkout, never the repository: the three markers become the
        # version, and a readme entry headed `= Unreleased =` takes its number.
        run: |
          set -euo pipefail
          sed -i -E "s/^(\s*\*\s*Version:\s*).*$/\1$VERSION/" "$MAIN"
          if [ -n "$CONSTANT" ]; then sed -i -E "s/^(define\(\s*'${CONSTANT}',\s*').*('\s*\);)$/\1$VERSION\2/" "$MAIN"; fi
          sed -i -E "s/^(Stable tag:\s*).*$/\1$VERSION/" readme.txt
          sed -i -E "s/^= Unreleased =$/= $VERSION =/" readme.txt
          git --no-pager diff --stat

      - name: Version markers equal the version
        if: steps.still.outputs.go == 'true'
        run: |
          set -euo pipefail
          stable=$(grep -oP '^Stable tag:\s*\K\S+' readme.txt)
          version=$(grep -oP '^\s*\*\s*Version:\s*\K\S+' "$MAIN")
          fail=0
          [ "$stable" = "$VERSION" ] || { echo "::error file=readme.txt::Stable tag $stable is not $VERSION."; fail=1; }
          [ "$version" = "$VERSION" ] || { echo "::error file=$MAIN::Version $version is not $VERSION."; fail=1; }
          if [ -n "$CONSTANT" ]; then
            constant=$(grep -oP "${CONSTANT}',\s*'\K[^']+" "$MAIN")
            [ "$constant" = "$VERSION" ] || { echo "::error file=$MAIN::$CONSTANT $constant is not $VERSION."; fail=1; }
          fi
          [ "$fail" -eq 0 ] || { echo "::error::Nothing reached wordpress.org: a marker did not take the version. Fix the file's shape in a pull request."; exit 1; }

      - name: This version's changelog
        if: steps.still.outputs.go == 'true'
        # Before touching SVN: a release without its changelog stops here,
        # and so does a readme that announces another version.
        run: |
          set -euo pipefail
          newest=$(grep -m1 -oP '^= \K[0-9]+\.[0-9]+\.[0-9]+(?= =$)' readme.txt || true)
          if [ "$newest" != "$VERSION" ]; then
            echo "::error file=readme.txt::The newest changelog entry is '= ${newest:-none} =' but the labels of what merged give $VERSION. Either the readme announces a version the labels do not reach (add version:major, version:minor or version:patch to a merged pull request) or the labels went further than the readme (write the entry, or head it '= Unreleased ='). Nothing reached wordpress.org."
            exit 1
          fi
          awk -v head="= ${VERSION} =" '$0 == head { found = 1; next } found && /^=/ { exit } found { print }' readme.txt > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "::error file=readme.txt::The '= ${VERSION} =' changelog entry is empty."; exit 1; }
          if grep -qxE 'Unreleased\.?' "$RUNNER_TEMP/notes.md"; then
            echo "::error file=readme.txt::The '= ${VERSION} =' changelog entry still says 'Unreleased.': the version is not ready. Nothing reached wordpress.org."
            exit 1
          fi

      - name: What was merged, grouped by type
        if: steps.still.outputs.go == 'true'
        # Appended to the release notes: every commit since the nearest
        # release tag among this commit's ancestors (a hotfix on an older
        # line compares against that line), grouped by its Conventional
        # Commit type. Nobody writes the emoji; the type decides it.
        run: |
          prev=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' --exclude "$VERSION" HEAD 2>/dev/null || true)
          [ -n "$prev" ] || exit 0
          git log --format='%s' "$prev..HEAD" > "$RUNNER_TEMP/subjects.txt"
          groups=""
          for group in "feat|✨ Features" "fix|🐛 Fixes" "perf|⚡ Performance" "docs|📝 Documentation" "refactor|♻️ Refactoring" "test|✅ Tests" "build|📦 Build and dependencies" "ci|👷 CI" "chore|🔧 Maintenance" "revert|⏪ Reverts"; do
            type="${group%%|*}"; title="${group#*|}"
            lines=$(grep -E "^${type}(\\([^)]*\\))?!?: " "$RUNNER_TEMP/subjects.txt" | sed -E "s/^${type}(\\(([^)]*)\\))?(!?): /- \\3**\\2** /; s/^- !/- ⚠️ **breaking** /; s/\\*\\*\\*\\* //" || true)
            if [ -n "$lines" ]; then groups+=$(printf '\n### %s\n\n%s\n' "$title" "$lines")$'\n'; fi
          done
          if [ -n "$groups" ]; then
            printf '\n## What was merged since %s\n%s' "$prev" "$groups" >> "$RUNNER_TEMP/notes.md"
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Deploy to SVN
        if: steps.still.outputs.go == 'true'
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          generate-zip: true
          # The action runs `if $INPUT_DRY_RUN`: pass exactly true or false.
          dry-run: ${{ inputs.dry-run && 'true' || 'false' }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ${{ inputs.slug }}
          VERSION: ${{ needs.version.outputs.version }}

      - name: The release App's token
        # Only after SVN took the version, only on main, never in a rehearsal:
        # the one token that can create a release tag, held by the one step
        # that does it. The App has contents: write and nothing else, and its
        # key lives in the environment, so only an approved job ever sees it.
        if: ${{ steps.still.outputs.go == 'true' && !inputs.dry-run && startsWith(github.ref, 'refs/heads/') }}
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DILUX_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_RELEASE_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: The zip, when the deploy action made none
        # The deploy action stops early, with no zip, when SVN already has
        # tags/X.Y.Z: a re-run after the release step failed. The release
        # still needs its file, so it is built here the way the action
        # builds it (the checkout minus .distignore, when there is one).
        if: steps.still.outputs.go == 'true' && !inputs.dry-run && steps.deploy.outputs.zip-path == ''
        id: zip
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          exclude=(); [ -f .distignore ] && exclude=(--exclude-from=.distignore)
          rsync -rc "${exclude[@]}" --exclude=.git --exclude=.github ./ "$RUNNER_TEMP/$SLUG/" --delete
          (cd "$RUNNER_TEMP" && zip -qr "$SLUG.zip" "$SLUG")
          echo "path=$RUNNER_TEMP/$SLUG.zip" >> "$GITHUB_OUTPUT"

      - name: The release notes, in a rehearsal
        if: steps.still.outputs.go == 'true' && inputs.dry-run
        run: |
          printf '## Rehearsal of %s\n\nNothing was committed to SVN, no tag and no release were created. The notes would be:\n\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: GitHub release, and the tag with it
        # One API call creates the tag on the commit and the release, so no
        # tag ever exists without its release (the tag run this starts finds
        # the release and stops) and no release without its tag. If SVN took
        # the version but this step failed, Re-run jobs: the deploy action
        # sees tags/X.Y.Z already on SVN, the zip is rebuilt above, and the
        # release is created then.
        if: steps.still.outputs.go == 'true' && !inputs.dry-run
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.deploy.outputs.zip-path || steps.zip.outputs.path }}
          body_path: ${{ runner.temp }}/notes.md
          token: ${{ steps.app.outputs.token || github.token }}
