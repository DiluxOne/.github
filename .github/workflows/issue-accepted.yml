name: Issue accepted

# Reusable. When a person adds `accepted` to an issue: the issue lands on its
# product's public Project (repos.yml, `projects:`, in this repository) with
# Status Accepted, and the failed jobs of the organisation's pull request
# pipeline re-run on every open pull request that closes it. When an accepted
# issue closes as completed (by hand, or by the merge that closes it), its
# Status becomes Done; one closed as not planned is left where it is. The
# Project needs the bot's key; without it only the re-run happens. That pipeline is required from the organisation and GitHub does
# not start a required workflow on an edit of the description, so a pull
# request opened before its issue was accepted would otherwise stay red until
# its next push. A bot's label starts nothing, as the gate ignores it anyway.
# The same acceptance checks the issue's PRD against the issue schema (gate
# G1, policy/issue-schema.yml) and says on the issue whether it is ready,
# and removes `needs-triage`: a person has looked at the issue. It assigns
# the issue to the person who accepted it, unless it has an assignee
# already (#73; scripts/issue-assignee.sh): with the bot's key, like the
# comment. A lane's issue, accepted by policy and never labelled by a
# person, stays unassigned.
#
# A release issue (#82, "Release X.Y.Z", label `lane:release`) is not a PRD:
# its acceptance is the decision to publish that version. Instead of G1 and
# the seal, the `release` job opens the release pull request: it checks that
# the labels of what merged give that version (scripts/next-version.py),
# runs the command the repository's kind names for it (kinds/<kind>/pack.yml,
# `release.prepare`; for a plugin, scripts/release-markers.sh prepare, which
# removes the `Unreleased.` hold and sets the version markers) on a branch,
# and opens the pull request that closes the issue, as dilux-bot. It says on
# the issue, in one comment kept up to date, what it opened or why it did
# not. Only an acceptance by a person with the admin or maintain role on
# the repository opens one. It never publishes: the release workflow does, once that pull request
# merges, after checking the issue again (scripts/release-issue.py). It does
# nothing while DX_AUTOPILOT is off. No receipt is written for it: the tag
# and the GitHub release are the record.
#
# A reproduced bug's issue, which the `bugfix-reproduced` lane accepted
# (`accepted-by:policy`; its PRD sealed by issue-repro.yml, which opened it,
# #84), gets its receipt when it closes as completed, as an accepted one
# does. Other lanes' issues are not sealed and get none yet.
#
# When a lane's label (`lane:<name>`) is added to an issue, by a person or a
# bot, the `lane` job asks the autonomy policy whether that lane accepts it
# now (scripts/autonomy.py lane-announce, policy/autonomy.yml at
# `central-ref`, the repository's own .github/autonomy.yml stricter, or up to
# a lane's ceiling, which no sync lane has). A
# lane a person accepts, or one whose own workflow labels its issues
# (platform, bugfix-reproduced), is left alone. For a sync lane it says so on the issue, in
# one comment kept up to date that links the policy at the commit it read,
# and adds `accepted-by:policy` when the lane accepts it (removes it when
# not), which is what the weekly "Decided by policy" issues list. It decides
# nothing the gate relies on: the pull request's gate asks the policy again
# (scripts/issue-gate.sh). This is how a sync run's issue (lane org-sync,
# #155, opened by scripts/sync-repos.py) is accepted when it is opened.
#
#   on:
#     issues:
#       types: [labeled, closed]
#   jobs:
#     accepted:
#       permissions: { actions: write, issues: read, pull-requests: read }
#       uses: DiluxOne/.github/.github/workflows/issue-accepted.yml@v5
#       secrets:
#         DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}   # for the Project

on:
  workflow_call:
    inputs:
      label:
        description: The label that accepts an issue (the policy's issue-gate.label).
        type: string
        default: accepted
      workflow:
        description: The name of the pull request pipeline whose failed jobs are re-run.
        type: string
        default: Pull request (organisation)
      central-ref:
        description: Ref of DiluxOne/.github to read repos.yml (the Projects) from.
        type: string
        default: v5
    secrets:
      # Optional: a caller that does not pass it (one from before Projects)
      # keeps the re-run and skips the Project.
      DILUX_BOT_PRIVATE_KEY:
        required: false

# Nothing at the workflow level: a reusable workflow cannot ask for more than
# its caller's job grants, and the issues.yml template grants the accepted job
# actions: write, issues: read and pull-requests: read only. Each job asks for
# what it uses, within that.
permissions: {}

jobs:
  rerun:
    name: Re-run the gate
    runs-on: ${{ vars.DX_RUNNER == 'self-hosted' && !((github.event.pull_request.user.login == 'dilux-bot[bot]' && (startsWith(github.event.pull_request.head.ref, 'test/repro-issue-') || (contains(github.event.pull_request.head.ref, '/') && contains(github.event.pull_request.head.ref, '-the-bug-reproduced-from-')))) || (github.event.issue.user.login == 'dilux-bot[bot]' && (github.event.issue.pull_request || startsWith(github.event.issue.title, 'The bug reproduced from ')))) && fromJSON('["self-hosted","linux","x64","diluxone"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    # After the seal (the ready job): the gate compares the PRD with the
    # newest seal, so a re-acceptance after an edit must be sealed first.
    # always(): a failed or skipped seal still lets the re-run happen.
    needs: ready
    if: always() && github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == inputs.label && github.event.sender.type != 'Bot'
    permissions:
      actions: write # re-run the failed jobs
      issues: read
      pull-requests: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          WORKFLOW: ${{ inputs.workflow }}
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY%%/*}; name=${GITHUB_REPOSITORY#*/}
          # The open pull requests of this repository that will close the
          # issue: linked under Development, or by "Closes #n".
          # shellcheck disable=SC2016 # GraphQL variables, not shell ones.
          prs=$(gh api graphql -f query='query($o:String!,$n:String!,$i:Int!){repository(owner:$o,name:$n){issue(number:$i){timelineItems(itemTypes:[CONNECTED_EVENT,CROSS_REFERENCED_EVENT],last:50){nodes{__typename ... on ConnectedEvent{subject{... on PullRequest{number state headRefOid repository{nameWithOwner}}}} ... on CrossReferencedEvent{willCloseTarget source{... on PullRequest{number state headRefOid repository{nameWithOwner}}}}}}}}}' \
            -F o="$owner" -F n="$name" -F i="$NUMBER" \
            --jq "[.data.repository.issue.timelineItems.nodes[] | (.subject // (select(.willCloseTarget) | .source)) | select(. != null and .state == \"OPEN\" and .repository.nameWithOwner == \"$GITHUB_REPOSITORY\") | \"\(.number) \(.headRefOid)\"] | unique | .[]")
          if [ -z "$prs" ]; then echo "No open pull request closes #$NUMBER."; exit 0; fi
          while read -r pr sha; do
            # By name through the API: `gh run list --workflow` cannot find a
            # workflow the organisation requires, which no file here holds.
            if ! last=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&per_page=100" \
              --jq "[.workflow_runs[] | select(.name == \"$WORKFLOW\")] | sort_by(.created_at) | last | \"\(.id // \"\") \(.status // \"\") \(.conclusion // \"\")\""); then
              echo "::warning::#$pr: could not list its runs."; continue
            fi
            read -r run status conclusion <<< "$last"
            if [ -z "$run" ]; then
              echo "#$pr: no run of \"$WORKFLOW\" on its head."
            elif [ "$status" != completed ]; then
              echo "::warning::#$pr: its run $run is still $status; re-run it once it ends, or push."
            elif [ "$conclusion" = failure ]; then
              # The API, not `gh run rerun`: that looks the run's workflow up
              # in this repository and gets a 404 for the organisation's
              # required one.
              if gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/rerun-failed-jobs" >/dev/null; then
                echo "#$pr: re-ran the failed jobs of run $run."
              else
                echo "::warning::#$pr: could not re-run run $run."
              fi
            else
              echo "#$pr: its last run $run did not fail ($conclusion); nothing to re-run."
            fi
          done <<< "$prs"

  ready:
    name: Issue ready (G1)
    runs-on: ${{ vars.DX_RUNNER == 'self-hosted' && !((github.event.pull_request.user.login == 'dilux-bot[bot]' && (startsWith(github.event.pull_request.head.ref, 'test/repro-issue-') || (contains(github.event.pull_request.head.ref, '/') && contains(github.event.pull_request.head.ref, '-the-bug-reproduced-from-')))) || (github.event.issue.user.login == 'dilux-bot[bot]' && (github.event.issue.pull_request || startsWith(github.event.issue.title, 'The bug reproduced from ')))) && fromJSON('["self-hosted","linux","x64","diluxone"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    # When a person accepts it: is the issue's PRD complete, as the issue
    # schema says (policy/issue-schema.yml, gate G1)? One comment, kept up to
    # date, says it is ready or what is missing. It decides nothing yet: the
    # autopilot (#83) starts only on a ready issue. It also assigns the issue
    # to whoever accepted it, if nobody has it (#73). Needs the bot's key to
    # comment and assign; without it the check runs and only logs. Not on a
    # release issue (#82): the `release` job is its acceptance.
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == inputs.label && github.event.sender.type != 'Bot' && !contains(github.event.issue.labels.*.name, 'lane:release')
    # Nothing from the caller's token: the callers grant this workflow
    # actions: write, issues: read and pull-requests: read only, and the
    # schema and its script are read from this public repository.
    permissions: {}
    steps:
      - name: The issue schema and its script
        id: central
        env:
          REF: ${{ inputs.central-ref }}
        run: |
          set -euo pipefail
          mkdir -p .dx-central/scripts .dx-central/policy
          base="https://raw.githubusercontent.com/DiluxOne/.github/$REF"
          curl -fsSL --retry 3 "$base/scripts/issue-schema.py" -o .dx-central/scripts/issue-schema.py
          curl -fsSL --retry 3 "$base/scripts/receipts.py" -o .dx-central/scripts/receipts.py
          # The assignee is bookkeeping: a ref without the script skips it,
          # never the check and the seal.
          curl -fsSL --retry 3 "$base/scripts/issue-assignee.sh" -o .dx-central/scripts/issue-assignee.sh \
            || echo "::warning::scripts/issue-assignee.sh is not at $REF; the issue is not assigned."
          curl -fsSL --retry 3 "$base/policy/issue-schema.yml" -o .dx-central/policy/issue-schema.yml
          echo "ref=$(git ls-remote https://github.com/DiluxOne/.github "$REF" "$REF^{}" | tail -1 | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: dilux-bot token
        id: bot
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-contents: write # the receipts branch
      # Whoever accepted it works it (#73), unless someone already does: the
      # Project shows who owns each accepted issue. Only a person gets here
      # (the job skips a bot's label), and the script never assigns a bot; a
      # member's pull request that closes it later takes it over
      # (pull-request-assignee.yml).
      - name: Assign it to whoever accepted it
        if: steps.bot.outputs.token != '' && hashFiles('.dx-central/scripts/issue-assignee.sh') != ''
        # Never in the way of the check and the seal that follow.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          NUMBER: ${{ github.event.issue.number }}
          SENDER: ${{ github.event.sender.login }}
          SENDER_TYPE: ${{ github.event.sender.type }}
        run: bash .dx-central/scripts/issue-assignee.sh accepted
      - name: Check the PRD and say so on the issue
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BODY: ${{ github.event.issue.body }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # Exit 1 is "not ready" with its reasons (each in code, so text the
          # issue controls cannot mention anyone or render a link); anything else is the
          # checker failing, which must fail this job, not blame the issue.
          rc=0; result=$(printf '%s' "$BODY" | python3 .dx-central/scripts/issue-schema.py check) || rc=$?
          if [ "$rc" -gt 1 ] || ! jq -e 'has("ok")' <<<"$result" >/dev/null 2>&1; then
            echo "::error::The schema check itself failed (exit $rc); nothing said on the issue."; exit 1
          fi
          if [ "$(jq -r .ok <<<"$result")" = true ]; then
            text="**Issue ready (G1):** the PRD has every section of the schema ($(jq -r '.criteria | length' <<<"$result") acceptance criteria)."
          else
            text="**Issue not ready (G1):** the PRD does not follow the schema yet (policy/issue-schema.yml in DiluxOne/.github). The autopilot will not start until it does:"$'\n\n'"$(jq -r '.errors[] | "- `" + gsub("`"; "\u0027") + "`"' <<<"$result")"
          fi
          echo "$text"
          [ -n "$GH_TOKEN" ] || { echo "No bot key: the result stays in this log."; exit 0; }
          body="<!-- dx-g1 -->"$'\n'"$text"$'\n\n'"🤖 AI-generated · Claude Opus 5.5 (Anthropic)"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --paginate --jq '.[] | select(.user.type == "Bot" and (.user.login | startswith("dilux-bot")) and (.body | startswith("<!-- dx-g1 -->"))) | .id' | tail -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body" >/dev/null
          fi
      # Gate G2's seal (#81): the PRD's SHA-256, who accepted and when, in a
      # JSON file dilux-bot commits to the receipts branch (an organisation
      # ruleset lets only dilux-bot write there, and nobody delete or
      # rewrite it). The pull request gate compares the PRD with it.
      - name: Seal the PRD and update the issue's board
        if: steps.bot.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BODY_TEXT: ${{ github.event.issue.body }}
          NUMBER: ${{ github.event.issue.number }}
          ACCEPTED_BY: ${{ github.event.sender.login }}
          POLICY_REF: ${{ steps.central.outputs.ref }}
        run: |
          set -euo pipefail
          printf '%s' "$BODY_TEXT" > "$RUNNER_TEMP/body.md"
          # A person accepted it, so it was looked at: needs-triage goes.
          gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label needs-triage >/dev/null 2>&1 || true
          BODY="$RUNNER_TEMP/body.md" python3 .dx-central/scripts/receipts.py seal-prd
          board=$(BODY="$RUNNER_TEMP/body.md" python3 .dx-central/scripts/receipts.py board)
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --paginate --jq '.[] | select(.user.type == "Bot" and (.user.login | startswith("dilux-bot")) and (.body | startswith("<!-- dx-board -->"))) | .id' | tail -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$board" >/dev/null
          else gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$board" >/dev/null; fi

  receipt:
    name: The merge's receipt
    runs-on: ${{ vars.DX_RUNNER == 'self-hosted' && !((github.event.pull_request.user.login == 'dilux-bot[bot]' && (startsWith(github.event.pull_request.head.ref, 'test/repro-issue-') || (contains(github.event.pull_request.head.ref, '/') && contains(github.event.pull_request.head.ref, '-the-bug-reproduced-from-')))) || (github.event.issue.user.login == 'dilux-bot[bot]' && (github.event.issue.pull_request || startsWith(github.event.issue.title, 'The bug reproduced from ')))) && fromJSON('["self-hosted","linux","x64","diluxone"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    # When an accepted issue closes as completed by a merged pull request: the
    # receipt (#81), committed to the receipts branch, and the board updated.
    # A reproduced bug's issue (`lane:bugfix-reproduced`, #84) gets its
    # receipt too: its PRD was sealed when the lane accepted it. Other lanes'
    # issues (the platform's) are not sealed and get none yet.
    if: github.event_name == 'issues' && github.event.action == 'closed' && github.event.issue.state_reason == 'completed' && (contains(github.event.issue.labels.*.name, inputs.label) || (contains(github.event.issue.labels.*.name, 'accepted-by:policy') && contains(github.event.issue.labels.*.name, 'lane:bugfix-reproduced'))) && !contains(github.event.issue.labels.*.name, 'lane:release')
    permissions: {}
    steps:
      - name: The scripts
        id: central
        env:
          REF: ${{ inputs.central-ref }}
        run: |
          set -euo pipefail
          mkdir -p .dx-central/scripts .dx-central/policy
          base="https://raw.githubusercontent.com/DiluxOne/.github/$REF"
          for f in scripts/issue-schema.py scripts/receipts.py policy/issue-schema.yml; do curl -fsSL --retry 3 "$base/$f" -o ".dx-central/$f"; done
          echo "ref=$(git ls-remote https://github.com/DiluxOne/.github "$REF" "$REF^{}" | tail -1 | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: dilux-bot token
        id: bot
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-contents: write
          permission-pull-requests: read
          permission-checks: read
      - name: Write the receipt
        if: steps.bot.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BODY_TEXT: ${{ github.event.issue.body }}
          NUMBER: ${{ github.event.issue.number }}
          POLICY_REF: ${{ steps.central.outputs.ref }}
        run: |
          set -euo pipefail
          printf '%s' "$BODY_TEXT" > "$RUNNER_TEMP/body.md"
          # The merged pull request that closed it.
          # shellcheck disable=SC2016 # GraphQL variables, not shell ones.
          pr=$(gh api graphql -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){issue(number:$n){timelineItems(itemTypes:[CLOSED_EVENT],last:1){nodes{... on ClosedEvent{closer{... on PullRequest{number merged headRefOid mergeCommit{oid} mergedBy{login} labels(first:30){nodes{name}}}}}}}}}}' \
            -f o="${GITHUB_REPOSITORY%%/*}" -f r="${GITHUB_REPOSITORY#*/}" -F n="$NUMBER" \
            --jq '.data.repository.issue.timelineItems.nodes[0].closer // empty')
          if [ -z "$pr" ] || [ "$(jq -r .merged <<<"$pr")" != true ]; then echo "Not closed by a merged pull request: no receipt."; exit 0; fi
          head=$(jq -r .headRefOid <<<"$pr")
          PR_JSON=$(jq -c '{number, head: .headRefOid, merge: .mergeCommit.oid, merged_by: .mergedBy.login, labels: [.labels.nodes[].name]}' <<<"$pr")
          # The head commit's checks, counted by conclusion.
          CHECKS_JSON=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/check-runs" --paginate --jq '[.check_runs[].conclusion]' \
            | jq -sc 'add // [] | group_by(.) | map({((.[0] // "pending") | tostring): length}) | add // {}')
          export PR_JSON CHECKS_JSON
          BODY="$RUNNER_TEMP/body.md" python3 .dx-central/scripts/receipts.py merged
          board=$(BODY="$RUNNER_TEMP/body.md" python3 .dx-central/scripts/receipts.py board)
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --paginate --jq '.[] | select(.user.type == "Bot" and (.user.login | startswith("dilux-bot")) and (.body | startswith("<!-- dx-board -->"))) | .id' | tail -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$board" >/dev/null
          else gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$board" >/dev/null; fi

  release:
    name: The release pull request
    runs-on: ${{ vars.DX_RUNNER == 'self-hosted' && !((github.event.pull_request.user.login == 'dilux-bot[bot]' && (startsWith(github.event.pull_request.head.ref, 'test/repro-issue-') || (contains(github.event.pull_request.head.ref, '/') && contains(github.event.pull_request.head.ref, '-the-bug-reproduced-from-')))) || (github.event.issue.user.login == 'dilux-bot[bot]' && (github.event.issue.pull_request || startsWith(github.event.issue.title, 'The bug reproduced from ')))) && fromJSON('["self-hosted","linux","x64","diluxone"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    # A person accepts a release issue (#82): the release pull request, as
    # the header says. Everything goes through dilux-bot's token, so the
    # caller's grants are not touched; no code of the repository runs, only
    # the organisation's scripts on its files.
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == inputs.label && github.event.sender.type != 'Bot' && contains(github.event.issue.labels.*.name, 'lane:release')
    permissions: {}
    concurrency:
      group: release-pr-${{ github.repository }}
      cancel-in-progress: false
    steps:
      # Without the bot's key (an old caller) nothing is opened, and the log
      # says so: a person prepares the release by hand, as before.
      - name: dilux-bot token
        id: bot
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: No bot key
        if: steps.bot.outputs.token == ''
        run: echo "::warning::No dilux-bot key passed to issue-accepted.yml, so no release pull request is opened; a person prepares it by hand."

      # The default branch, with its tags; its credentials push the branch.
      - if: steps.bot.outputs.token != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.bot.outputs.token }}
          fetch-depth: 0

      - if: steps.bot.outputs.token != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref }}
          path: .dx-central
          persist-credentials: false

      - name: Open it, or say why not
        if: steps.bot.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          BASE: ${{ github.event.repository.default_branch }}
          DX_AUTOPILOT: ${{ vars.DX_AUTOPILOT }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail
          echo ".dx-central/" >> .git/info/exclude
          # One comment on the issue, kept up to date: what was opened, or why not.
          say() {
            local body id
            body="<!-- dx-release -->"$'\n'"$1"$'\n\n'"🤖 AI-generated · Claude Opus 5.5 (Anthropic)"
            echo "$1"
            id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --paginate --jq '.[] | select(.user.type == "Bot" and (.user.login | startswith("dilux-bot")) and (.body | startswith("<!-- dx-release -->"))) | .id' | tail -1)
            if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
            else gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body" >/dev/null; fi
          }
          if [ "$(tr '[:upper:]' '[:lower:]' <<<"${DX_AUTOPILOT:-}")" = off ]; then
            say "**No release pull request:** the organisation's \`DX_AUTOPILOT\` is off, which stops every autonomous action. A maintainer prepares it by hand (the kind's command, \`scripts/release-markers.sh prepare\` for a plugin) in a pull request that closes this issue."
            exit 0
          fi
          # Only the admin or maintain role approves a release (the release
          # workflow checks it again before publishing): no pull request for
          # anyone else's acceptance, nor when the role cannot be read.
          role=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$SENDER/permission" --jq .role_name 2>/dev/null || true)
          case "$role" in
            admin|maintain) ;;
            *) say "**No release pull request:** $SENDER accepted this issue with the role ${role:-unknown (it could not be read)} on the repository, and only a person with the admin or maintain role approves a release. One of them accepts it again (remove and add \`accepted\`)."; exit 0 ;;
          esac
          python3 .dx-central/scripts/next-version.py --repo "$GITHUB_REPOSITORY" --base "$BASE" --json > "$RUNNER_TEMP/next.json"
          rc=0
          TITLE="$TITLE" NUMBER="$NUMBER" NEXT_JSON="$RUNNER_TEMP/next.json" ROOT=. CENTRAL=.dx-central \
            python3 .dx-central/scripts/release-issue.py plan > "$RUNNER_TEMP/plan.json" || rc=$?
          if [ "$rc" -gt 1 ] || ! jq -e 'has("ok")' "$RUNNER_TEMP/plan.json" >/dev/null 2>&1; then
            echo "::error::release-issue.py plan failed (exit $rc)."; exit 1
          fi
          if [ "$(jq -r .ok "$RUNNER_TEMP/plan.json")" != true ]; then
            say "**No release pull request:** $(jq -r .why "$RUNNER_TEMP/plan.json")."
            exit 0
          fi
          version=$(jq -r .version "$RUNNER_TEMP/plan.json"); branch=$(jq -r .branch "$RUNNER_TEMP/plan.json")
          title=$(jq -r .title "$RUNNER_TEMP/plan.json"); where=$(jq -r .publishes_to "$RUNNER_TEMP/plan.json")
          if git rev-parse -q --verify "refs/tags/$version^{commit}" >/dev/null; then
            say "**No release pull request:** $version is already released (its tag exists)."; exit 0
          fi
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            found=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state all --json url,state --jq '.[0] | "\(.url // "") \(.state // "")"') \
              || { echo "::error::Could not list the pull requests of $branch."; exit 1; }
            read -r pr state <<<"$found"
            if [ "${state:-}" = MERGED ]; then
              say "**No release pull request:** the one for $version, $pr, already merged; the release run of that merge publishes $version (re-run it if it found no accepted issue then)."
            elif [ "${state:-}" = CLOSED ]; then
              say "**No release pull request:** the one for $version, $pr, was closed without merging and its branch \`$branch\` is still there. Delete that branch, then accept this issue again (remove and add \`accepted\`) for a new one."
            else
              say "**The release pull request** for $version is already there: ${pr:-the branch \`$branch\`}. Merging it publishes $version to $where."
            fi
            exit 0
          fi
          git config user.name "dilux-bot[bot]"
          git config user.email "333187390+dilux-bot[bot]@users.noreply.github.com"
          git checkout -q -b "$branch"
          mapfile -t argv < <(jq -r '.argv[]' "$RUNNER_TEMP/plan.json")
          if ! "${argv[@]}" > "$RUNNER_TEMP/prepare.log" 2>&1; then
            cat "$RUNNER_TEMP/prepare.log"
            say "**No release pull request:** preparing $version failed. If \`main\` already says $version (its pull request merged the old way), nothing needs preparing: re-run the last release run on \`main\`, which now finds this issue accepted. Otherwise the run says why: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            exit 0
          fi
          git add -A
          if git diff --cached --quiet; then
            say "**No release pull request:** preparing $version changed nothing, so \`main\` already says it: re-run the last release run on \`main\`, which now finds this issue accepted."
            exit 0
          fi
          git commit -q -m "$title"
          # Through the API, so GitHub signs the commit (#190).
          python3 .dx-central/scripts/api-commit.py push "$branch" --onto HEAD~1
          pr=$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE" --head "$branch" --title "$title" --body "$(jq -r .body "$RUNNER_TEMP/plan.json")")
          say "**The release pull request:** $pr. It goes through the checks and the review like any other; merging it publishes $version to $where, after the release workflow checks that a person accepted this issue and that its title still names $version."

  lane:
    name: Accepted by policy
    runs-on: ${{ vars.DX_RUNNER == 'self-hosted' && !((github.event.pull_request.user.login == 'dilux-bot[bot]' && (startsWith(github.event.pull_request.head.ref, 'test/repro-issue-') || (contains(github.event.pull_request.head.ref, '/') && contains(github.event.pull_request.head.ref, '-the-bug-reproduced-from-')))) || (github.event.issue.user.login == 'dilux-bot[bot]' && (github.event.issue.pull_request || startsWith(github.event.issue.title, 'The bug reproduced from ')))) && fromJSON('["self-hosted","linux","x64","diluxone"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    # A lane's label added to an issue: whether its lane accepts it, as the
    # header says. Reads with the caller's token (the issue, and the run
    # that opened a platform lane's issue); writes the label and the comment
    # with the bot's.
    if: github.event_name == 'issues' && github.event.action == 'labeled' && startsWith(github.event.label.name, 'lane:')
    permissions:
      actions: read # the workflow run a lane's issue names
      issues: read
    steps:
      # The commit first, then the files at that commit: the link the
      # comment gives is the policy that decided.
      - name: The autonomy policy and its script
        id: central
        env:
          REF: ${{ inputs.central-ref }}
        run: |
          set -euo pipefail
          sha=$(git ls-remote https://github.com/DiluxOne/.github "$REF" "$REF^{}" | tail -1 | cut -f1)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$REF is not a ref of DiluxOne/.github."; exit 1; }
          mkdir -p .dx-central/scripts .dx-central/policy
          base="https://raw.githubusercontent.com/DiluxOne/.github/$sha"
          for f in scripts/autonomy.py policy/autonomy.yml; do curl -fsSL --retry 3 "$base/$f" -o ".dx-central/$f"; done
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: dilux-bot token
        id: bot
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-contents: read # the repository's own .github/autonomy.yml

      - name: Ask the policy, and say so on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ steps.bot.outputs.token }}
          NUMBER: ${{ github.event.issue.number }}
          LANE: ${{ github.event.label.name }}
          DX_AUTOPILOT: ${{ vars.DX_AUTOPILOT }}
          POLICY_SHA: ${{ steps.central.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BOT_TOKEN" ]; then echo "No bot key: the policy's verdict would go nowhere, so it is not asked."; exit 0; fi
          # Only a sync lane is announced here (the organisation's policy
          # says which; a repository's file cannot add one): any other lane
          # is skipped before anything else is read.
          if ! python3 .dx-central/scripts/autonomy.py policy | jq -e --arg l "${LANE#lane:}" '.lanes[$l] | (.accept == "policy" and (.origin.runs // null) != null)' >/dev/null; then
            echo "$LANE: not a sync lane; nothing to say."; exit 0
          fi
          # The repository's own policy, from its default branch, stricter
          # only: missing is none; unreadable stops here rather than reads as none.
          if ! GH_TOKEN=$BOT_TOKEN gh api "repos/$GITHUB_REPOSITORY/contents/.github/autonomy.yml" -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/repo-autonomy.yml" 2> "$RUNNER_TEMP/err"; then
            grep -q "404" "$RUNNER_TEMP/err" || { echo "::error::Could not read .github/autonomy.yml: $(head -c 300 "$RUNNER_TEMP/err")"; exit 1; }
            : > "$RUNNER_TEMP/repo-autonomy.yml"
          fi
          REPO_AUTONOMY="$RUNNER_TEMP/repo-autonomy.yml" python3 .dx-central/scripts/autonomy.py lane-announce > "$RUNNER_TEMP/verdict.json"
          act=$(jq -r .act "$RUNNER_TEMP/verdict.json")
          if [ "$act" = skip ]; then echo "$LANE: a person accepts this lane's issues; nothing to say."; exit 0; fi
          text=$(jq -r .comment "$RUNNER_TEMP/verdict.json")
          echo "$text"
          export GH_TOKEN=$BOT_TOKEN
          if [ "$act" = accept ]; then
            gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label accepted-by:policy >/dev/null
          else
            gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label accepted-by:policy >/dev/null 2>&1 || true
          fi
          body="<!-- dx-lane-verdict -->"$'\n'"$text"$'\n\n'"🤖 AI-generated · Claude Opus 5.5 (Anthropic)"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --paginate --jq '.[] | select(.user.type == "Bot" and (.user.login | startswith("dilux-bot")) and (.body | startswith("<!-- dx-lane-verdict -->"))) | .id' | tail -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body" >/dev/null; fi

  decision:
    name: The decision's sub-issues
    # After the seal: what is carried out is the PRD a person accepted.
    needs: ready
    runs-on: ${{ vars.DX_RUNNER == 'self-hosted' && !((github.event.pull_request.user.login == 'dilux-bot[bot]' && (startsWith(github.event.pull_request.head.ref, 'test/repro-issue-') || (contains(github.event.pull_request.head.ref, '/') && contains(github.event.pull_request.head.ref, '-the-bug-reproduced-from-')))) || (github.event.issue.user.login == 'dilux-bot[bot]' && (github.event.issue.pull_request || startsWith(github.event.issue.title, 'The bug reproduced from ')))) && fromJSON('["self-hosted","linux","x64","diluxone"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    # When a person accepts an issue of DiluxOne/.github whose PRD names
    # Repositories (#189): a sub-issue in each repository its rules select,
    # opened by dilux-bot and linked to it, which the delegated lane accepts,
    # and one comment on it listing them (scripts/decision.py open). A
    # repository that matches later gets its own from the daily sync
    # (org-drift.yml). Nothing anywhere else.
    if: github.repository == 'DiluxOne/.github' && github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == inputs.label && github.event.sender.type != 'Bot'
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref }}
          persist-credentials: false
      - name: dilux-bot token (issues, every repository)
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-issues: write
          permission-contents: read
          permission-metadata: read
      - name: Open the sub-issues
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: python3 scripts/decision.py open

  project:
    name: The product's Project
    runs-on: ${{ vars.DX_RUNNER == 'self-hosted' && !((github.event.pull_request.user.login == 'dilux-bot[bot]' && (startsWith(github.event.pull_request.head.ref, 'test/repro-issue-') || (contains(github.event.pull_request.head.ref, '/') && contains(github.event.pull_request.head.ref, '-the-bug-reproduced-from-')))) || (github.event.issue.user.login == 'dilux-bot[bot]' && (github.event.issue.pull_request || startsWith(github.event.issue.title, 'The bug reproduced from ')))) && fromJSON('["self-hosted","linux","x64","diluxone"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    # The Projects go through the bot's own token; DiluxOne/.github is public,
    # so its checkout needs nothing from the workflow's.
    permissions: {}
    if: >-
      github.event_name == 'issues' && (
        (github.event.action == 'labeled' && github.event.label.name == inputs.label && github.event.sender.type != 'Bot') ||
        (github.event.action == 'closed' && github.event.issue.state_reason != 'not_planned' && contains(github.event.issue.labels.*.name, inputs.label)))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref }}
          path: .dx-central
          persist-credentials: false

      - name: The Project of this repository
        id: which
        env:
          REPO: ${{ github.event.repository.name }}
          HAS_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != true ]; then echo "No bot key passed: the Project is left alone."; exit 0; fi
          n=$(yq -r ".projects[\"$REPO\"] // \"\"" .dx-central/repos.yml)
          [[ "$n" =~ ^[0-9]+$ ]] && echo "number=$n" >> "$GITHUB_OUTPUT" || echo "$REPO puts its issues on no Project (repos.yml)."

      # Projects belong to the organisation: a token for its Projects alone.
      - name: dilux-bot token (organisation Projects)
        id: bot
        if: steps.which.outputs.number != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-organization-projects: write
          permission-issues: read

      - name: Add it, and set its Status
        if: steps.which.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          ORG: ${{ github.repository_owner }}
          PROJECT: ${{ steps.which.outputs.number }}
          ISSUE_ID: ${{ github.event.issue.node_id }}
          STATUS: ${{ github.event.action == 'closed' && 'Done' || 'Accepted' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # GraphQL variables, not shell ones.
          read -r project field option < <(gh api graphql -f query='query($o:String!,$n:Int!){organization(login:$o){projectV2(number:$n){id field(name:"Status"){... on ProjectV2SingleSelectField{id options{id name}}}}}}' \
            -F o="$ORG" -F n="$PROJECT" --jq ".data.organization.projectV2 | \"\(.id) \(.field.id // \"-\") \([(.field.options // [])[] | select(.name == \"$STATUS\")][0].id // \"\")\"")
          [ -n "$option" ] || { echo "::warning::Project $PROJECT has no Status \"$STATUS\"."; exit 0; }
          # Adding an item that is already there returns it: idempotent.
          # shellcheck disable=SC2016
          item=$(gh api graphql -f query='mutation($p:ID!,$c:ID!){addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id}}}' -f p="$project" -f c="$ISSUE_ID" --jq .data.addProjectV2ItemById.item.id)
          # shellcheck disable=SC2016
          gh api graphql -f query='mutation($p:ID!,$i:ID!,$f:ID!,$v:String!){updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$v}}){projectV2Item{id}}}' \
            -f p="$project" -f i="$item" -f f="$field" -f v="$option" >/dev/null
          echo "Project $PROJECT: Status $STATUS."
