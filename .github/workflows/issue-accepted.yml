name: Issue accepted

# Reusable. When a person adds `accepted` to an issue: the issue lands on its
# product's public Project (repos.yml, `projects:`, in this repository) with
# Status Accepted once the G1 check below lets the label stay (#372), and
# the failed jobs of the organisation's pull request pipeline re-run on
# every open pull request that closes it. When an accepted
# issue closes as completed (by hand, or by the merge that closes it), its
# Status becomes Done; one closed as not planned is left where it is. The
# Project needs the bot's key; without it only the re-run happens. That pipeline is required from the organisation and GitHub does
# not start a required workflow on an edit of the description, so a pull
# request opened before its issue was accepted would otherwise stay red until
# its next push. A bot's label starts nothing, as the gate ignores it anyway.
# Only a person `who-decides` allows may accept (#588, scripts/deciders.py:
# the code owners of what it touches, whoever accepted it last, or every
# writer; each with write access): anyone else's `accepted` comes off at
# once, with a comment that names who may add it, and nothing is checked,
# sealed nor started. The same acceptance checks the issue's PRD against
# the issue schema (gate G1, policy/issue-schema.yml) and says on the issue
# whether it is ready.
# The check runs before the decision too (#353):
# when a person opens an issue and every time a person edits one not
# accepted yet, it labels it `awaiting-acceptance` (complete, it waits for a
# maintainer) or `incomplete` (one comment, kept up to date, says exactly
# what is missing); not a bug the reproduction confirmed, which a lane fixes
# with no acceptance (#427). Accepting it removes `awaiting-acceptance`; accepting an
# `incomplete` one takes the label off with a comment that mentions who
# added it and says what is missing. A maintainer's answer to an open
# comment is read on the next edit or acceptance, not on its own. The
# acceptance removes `needs-triage`: a person has looked at the issue. It
# assigns the issue to the person who accepted it, unless it has an assignee
# already (#73; scripts/issue-assignee.sh): with the bot's key, like the
# comment. A lane's issue, accepted by policy and never labelled by a
# person, stays unassigned.
#
# An accepted issue whose PRD is edited after its seal is no longer accepted
# (#588, the `unseal` job): `accepted` comes off, `awaiting-acceptance` or
# `incomplete` goes on, and one comment says what changed since the seal
# (receipts.py sealed-prd, issue-schema.py diff) and who may accept it again.
#
# A release issue (#82, "Release X.Y.Z", label `lane:release`) is not a PRD:
# its acceptance is the decision to publish that version. Instead of G1 and
# the seal, the `release` job opens the release pull request: it checks that
# the labels of what merged give that version (scripts/next-version.py),
# runs the command the repository's kind names for it (kinds/<kind>/pack.yml,
# `release.prepare`; for a plugin, scripts/release-markers.sh prepare, which
# removes the `Unreleased.` hold and sets the version markers) on a branch,
# and opens the pull request that closes the issue, as dilux-bot. It says on
# the issue, in one comment kept up to date, what it opened or why it did
# not. Only an acceptance by a person with the admin or maintain role on
# the repository opens one. It never publishes: the release workflow does, once that pull request
# merges, after checking the issue again (scripts/release-issue.py). It does
# nothing while DX_AUTOPILOT is off. No receipt is written for it: the tag
# and the GitHub release are the record.
#
# A reproduced bug's issue, which the `bugfix-reproduced` lane accepted
# (`accepted-by:policy`; its PRD sealed by issue-repro.yml, which opened it,
# #84), gets its receipt when it closes as completed, as an accepted one
# does. Other lanes' issues are not sealed and get none yet.
#
# When a lane's label (`lane:<name>`) is added to an issue, by a person or a
# bot, the `lane` job asks the autonomy policy whether that lane accepts it
# now (scripts/autonomy.py lane-announce, policy/autonomy.yml at
# `central-ref`, the repository's own .github/autonomy.yml stricter, or up to
# a lane's ceiling, which no sync lane has). A
# lane a person accepts, or one whose own workflow labels its issues
# (platform, bugfix-reproduced), is left alone. For a sync lane it says so on the issue, in
# one comment kept up to date that links the policy at the commit it read,
# and adds `accepted-by:policy` when the lane accepts it (removes it when
# not), which is what the weekly "Decided by policy" issues list. It decides
# nothing the gate relies on: the pull request's gate asks the policy again
# (scripts/issue-gate.sh). This is how a sync run's issue (lane org-sync,
# #155, opened by scripts/sync-repos.py) is accepted when it is opened.
#
#   on:
#     issues:
#       types: [opened, edited, labeled, closed]
#   jobs:
#     accepted:
#       permissions: { actions: write, issues: read, pull-requests: read }
#       uses: DiluxOne/.github/.github/workflows/issue-accepted.yml@v7
#       secrets:
#         DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}   # for the Project

on:
  workflow_call:
    inputs:
      label:
        description: The label that accepts an issue (the policy's issue-gate.label).
        type: string
        default: accepted
      workflow:
        description: The name of the pull request pipeline whose failed jobs are re-run.
        type: string
        default: Pull request (organisation)
      central-ref:
        description: The ref of DiluxOne/.github whose scripts and policy run. Empty (the default) means the very commit this workflow runs from, job.workflow_sha, so a caller that pins a SHA or a tag runs that commit's scripts too (#287).
        type: string
        default: ''
    secrets:
      # Optional: a caller that does not pass it (one from before Projects)
      # keeps the re-run and skips the Project.
      DILUX_BOT_PRIVATE_KEY:
        required: false
      # The shaping's model (#588), with no tools: the maintainer's Claude
      # subscription, else the API key. Without either, nothing is rewritten.
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false

# Nothing at the workflow level: a reusable workflow cannot ask for more than
# its caller's job grants, and the issues.yml template grants the accepted job
# actions: write, issues: read and pull-requests: read only. Each job asks for
# what it uses, within that.
permissions: {}

# The organisation's App, as GitHub shows it (#197): the calling
# organisation's variables DX_BOT_LOGIN, DX_BOT_APP and DX_BOT_ID, which
# every organisation sets (#568): config-overlay.sh stops the run without them.
env:
  DX_BOT_LOGIN: ${{ vars.DX_BOT_LOGIN }}
  DX_BOT_APP: ${{ vars.DX_BOT_APP }}
  DX_BOT_ID: ${{ vars.DX_BOT_ID }}

jobs:
  rerun:
    name: Re-run the gate
    runs-on: ${{ vars.DX_RUNNER_HEAVY != '' && !((github.event.pull_request.user.login == vars.DX_BOT_LOGIN && (startsWith(github.event.pull_request.head.ref, 'test/repro-issue-') || (contains(github.event.pull_request.head.ref, '/') && contains(github.event.pull_request.head.ref, '-the-bug-reproduced-from-')))) || (github.event.issue.user.login == vars.DX_BOT_LOGIN && (github.event.issue.pull_request || startsWith(github.event.issue.title, 'The bug reproduced from ')))) && fromJSON(vars.DX_RUNNER_HEAVY) || 'ubuntu-latest' }}
    timeout-minutes: 5
    # After the seal (the ready job): the gate compares the PRD with the
    # newest seal, so a re-acceptance after an edit must be sealed first.
    # always(): a failed or skipped seal still lets the re-run happen.
    needs: ready
    if: always() && github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == inputs.label && github.event.sender.type != 'Bot'
    permissions:
      actions: write # re-run the failed jobs
      issues: read
      pull-requests: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          WORKFLOW: ${{ inputs.workflow }}
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY%%/*}; name=${GITHUB_REPOSITORY#*/}
          # The open pull requests of this repository that will close the
          # issue: linked under Development, or by "Closes #n".
          # shellcheck disable=SC2016 # GraphQL variables, not shell ones.
          prs=$(gh api graphql -f query='query($o:String!,$n:String!,$i:Int!){repository(owner:$o,name:$n){issue(number:$i){timelineItems(itemTypes:[CONNECTED_EVENT,CROSS_REFERENCED_EVENT],last:50){nodes{__typename ... on ConnectedEvent{subject{... on PullRequest{number state headRefOid repository{nameWithOwner}}}} ... on CrossReferencedEvent{willCloseTarget source{... on PullRequest{number state headRefOid repository{nameWithOwner}}}}}}}}}' \
            -F o="$owner" -F n="$name" -F i="$NUMBER" \
            --jq "[.data.repository.issue.timelineItems.nodes[] | (.subject // (select(.willCloseTarget) | .source)) | select(. != null and .state == \"OPEN\" and .repository.nameWithOwner == \"$GITHUB_REPOSITORY\") | \"\(.number) \(.headRefOid)\"] | unique | .[]")
          if [ -z "$prs" ]; then echo "No open pull request closes #$NUMBER."; exit 0; fi
          while read -r pr sha; do
            # By name through the API: `gh run list --workflow` cannot find a
            # workflow the organisation requires, which no file here holds.
            if ! last=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&per_page=100" \
              --jq "[.workflow_runs[] | select(.name == \"$WORKFLOW\")] | sort_by(.created_at) | last | \"\(.id // \"\") \(.status // \"\") \(.conclusion // \"\")\""); then
              echo "::warning::#$pr: could not list its runs."; continue
            fi
            read -r run status conclusion <<< "$last"
            if [ -z "$run" ]; then
              echo "#$pr: no run of \"$WORKFLOW\" on its head."
            elif [ "$status" != completed ]; then
              echo "::warning::#$pr: its run $run is still $status; re-run it once it ends, or push."
            elif [ "$conclusion" = failure ]; then
              # The API, not `gh run rerun`: that looks the run's workflow up
              # in this repository and gets a 404 for the organisation's
              # required one.
              if gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/rerun-failed-jobs" >/dev/null; then
                echo "#$pr: re-ran the failed jobs of run $run."
              else
                echo "::warning::#$pr: could not re-run run $run."
              fi
            else
              echo "#$pr: its last run $run did not fail ($conclusion); nothing to re-run."
            fi
          done <<< "$prs"

  ready:
    name: Issue ready (G1)
    runs-on: ${{ vars.DX_RUNNER_HEAVY != '' && !((github.event.pull_request.user.login == vars.DX_BOT_LOGIN && (startsWith(github.event.pull_request.head.ref, 'test/repro-issue-') || (contains(github.event.pull_request.head.ref, '/') && contains(github.event.pull_request.head.ref, '-the-bug-reproduced-from-')))) || (github.event.issue.user.login == vars.DX_BOT_LOGIN && (github.event.issue.pull_request || startsWith(github.event.issue.title, 'The bug reproduced from ')))) && fromJSON(vars.DX_RUNNER_HEAVY) || 'ubuntu-latest' }}
    timeout-minutes: 5
    # Whether the acceptance stands, for the Project (#372): read by the
    # `project` job, which sets Accepted only when it is true.
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    # When a person accepts it: is the issue's PRD complete, as the issue
    # schema says (policy/issue-schema.yml, gate G1), with no comment after
    # its last edit left without a maintainer's answer (#287)? One comment,
    # kept up to date, says it is ready or what is missing. Not ready, the
    # acceptance does not stand: the label comes off and nothing is sealed,
    # so the autopilot (#83) never starts on it. It also assigns the issue
    # to whoever accepted it, if nobody has it (#73). Needs the bot's key to
    # comment and assign; without it the check runs and only logs. Not on a
    # release issue (#82): the `release` job is its acceptance.
    # Before the decision (#353): when a person opens an issue, or edits one
    # that is not accepted yet, the same check labels it
    # `awaiting-acceptance` or `incomplete` and says what is missing; it
    # never touches `accepted` then; a maintainer's own complete Bug it
    # leaves to the triage, which accepts it with its writing (#564). A
    # bot's issue (a lane's) is left alone,
    # and so is a report the reproduction confirmed and handed to its lane
    # (#427): `bug:confirmed` with both labels taken off. With the lane
    # closed, the labels stay and the report still waits for a maintainer.
    if: >-
      github.event_name == 'issues' && github.event.sender.type != 'Bot' && !contains(github.event.issue.labels.*.name, 'lane:release') && (
        (github.event.action == 'labeled' && github.event.label.name == inputs.label) ||
        ((github.event.action == 'opened' || github.event.action == 'edited') && github.event.issue.user.type != 'Bot' && !contains(github.event.issue.labels.*.name, inputs.label) && !(contains(github.event.issue.labels.*.name, 'bug:confirmed') && !contains(github.event.issue.labels.*.name, 'awaiting-acceptance') && !contains(github.event.issue.labels.*.name, 'incomplete'))))
    # One check at a time per issue: a later edit waits for the earlier run
    # rather than racing it on the labels and the comment.
    concurrency:
      group: issue-g1-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    # Nothing from the caller's token: the callers grant this workflow
    # actions: write, issues: read and pull-requests: read only, and the
    # schema and its script are read from this public repository.
    permissions: {}
    steps:
      - name: The issue schema and its script
        id: central
        env:
          REF: ${{ inputs.central-ref || job.workflow_sha }}
        run: |
          set -euo pipefail
          # The organisation's scripts as one checkout at the ref, so whatever
          # a script loads is there (receipts.py loads autopilot.py for the
          # board of an autopilot pull request).
          git init -q .dx-central && git -C .dx-central fetch -q --depth 1 https://github.com/DiluxOne/.github "$REF" && git -C .dx-central checkout -q FETCH_HEAD
          test ! -f .dx-central/scripts/config-overlay.sh || bash .dx-central/scripts/config-overlay.sh .dx-central
          if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then echo "ref=${REF:0:12}" >> "$GITHUB_OUTPUT"; else echo "ref=$(git ls-remote https://github.com/DiluxOne/.github "$REF" "$REF^{}" | tail -1 | cut -c1-12)" >> "$GITHUB_OUTPUT"; fi
      - name: App token
        id: bot
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-contents: write # the receipts branch
          permission-pull-requests: read # the change's files, for who decides (#588)
      # Who may accept (#588, scripts/deciders.py), before anything else: a
      # person `who-decides` does not allow has the label taken off and a
      # comment that names who may add it; nothing is checked nor sealed.
      - name: Who may add the label
        id: guard
        if: github.event.action == 'labeled' && steps.bot.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          NUMBER: ${{ github.event.issue.number }}
          LABEL: ${{ inputs.label }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail
          rc=0; why=$(python3 .dx-central/scripts/deciders.py may accepted "$SENDER") || rc=$?
          echo "$why"
          [ "$rc" != 0 ] || exit 0
          # Exit 2 is "could not tell": refused too, never taken for yes.
          echo "refused=true" >> "$GITHUB_OUTPUT"
          gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$LABEL" >/dev/null
          [ "$rc" = 1 ] || why="Who may add it could not be read now; add it again in a while, or ask a maintainer."
          # shellcheck disable=SC2016 # Markdown's backticks, not a command.
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(printf '**Not accepted:** `%s` was taken off. %s\n\n🤖 AI-generated · Claude Opus 5.5 (Anthropic)' "$LABEL" "$why")" >/dev/null
      # Whoever accepted it works it (#73), unless someone already does: the
      # Project shows who owns each accepted issue. Only a person gets here
      # (the job skips a bot's label), and the script never assigns a bot; a
      # member's pull request that closes it later takes it over
      # (pull-request-assignee.yml).
      - name: Assign it to whoever accepted it
        if: github.event.action == 'labeled' && steps.bot.outputs.token != '' && steps.guard.outputs.refused != 'true' && hashFiles('.dx-central/scripts/issue-assignee.sh') != ''
        # Never in the way of the check and the seal that follow.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          NUMBER: ${{ github.event.issue.number }}
          SENDER: ${{ github.event.sender.login }}
          SENDER_TYPE: ${{ github.event.sender.type }}
        run: bash .dx-central/scripts/issue-assignee.sh accepted
      # Not ready (#287): the schema says something is missing, or a person
      # commented after the PRD's last edit and no maintainer answered yet.
      # Then the acceptance does not stand: the label comes off, the issue
      # says why and whose acceptance it was (#353), and nothing is sealed,
      # so nothing starts. Opened or edited (#353): the issue is labelled
      # `awaiting-acceptance` or `incomplete` and `accepted` is not touched.
      - name: Check the PRD and say so on the issue
        id: check
        if: steps.guard.outputs.refused != 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BODY: ${{ github.event.issue.body }}
          NUMBER: ${{ github.event.issue.number }}
          LABEL: ${{ inputs.label }}
          ACTION: ${{ github.event.action }}
          SENDER: ${{ github.event.sender.login }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          set -euo pipefail
          # Exit 1 is "not ready" with its reasons (each in code, so text the
          # issue controls cannot mention anyone or render a link); anything else is the
          # checker failing, which must fail this job, not blame the issue.
          rc=0; result=$(printf '%s' "$BODY" | python3 .dx-central/scripts/issue-schema.py check) || rc=$?
          if [ "$rc" -gt 1 ] || ! jq -e 'has("ok")' <<<"$result" >/dev/null 2>&1; then
            echo "::error::The schema check itself failed (exit $rc); nothing said on the issue."; exit 1
          fi
          open=""
          if [ -n "$GH_TOKEN" ]; then
            # The conversation, read from GitHub: when the body was last
            # edited, every comment since, and who of their authors decides
            # (#588, scripts/deciders.py), checked now.
            # shellcheck disable=SC2016 # GraphQL variables, not shell ones.
            edited=$(gh api graphql -F o="${GITHUB_REPOSITORY%/*}" -F n="${GITHUB_REPOSITORY#*/}" -F i="$NUMBER" \
              -f query='query($o:String!,$n:String!,$i:Int!){repository(owner:$o,name:$n){issue(number:$i){lastEditedAt createdAt}}}' \
              --jq '.data.repository.issue | .lastEditedAt // .createdAt')
            comments=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --paginate --jq '[.[] | {user: {login: .user.login, type: .user.type}, created_at, html_url}]' | jq -s 'add // []')
            # What decides that cannot be read stops the check: it must never
            # read as "not a maintainer".
            maintainers=$(jq -r '.[] | select(.user.type != "Bot") | .user.login' <<<"$comments" | sort -u | python3 .dx-central/scripts/deciders.py list answer) \
              || { echo "::error::Who decides could not be read; nothing said on the issue."; exit 1; }
            # Exit 1 is "open", with the comments; anything above is the
            # checker failing, which fails this job rather than seal.
            orc=0; open=$(COMMENTS="$comments" EDITED_AT="$edited" MAINTAINERS="$maintainers" python3 .dx-central/scripts/issue-schema.py conversation) || orc=$?
            if [ "$orc" -gt 1 ] || { [ "$orc" = 1 ] && [ -z "$open" ]; }; then echo "::error::The conversation check itself failed (exit $orc); nothing said on the issue."; exit 1; fi
          fi
          ready=false
          if [ "$(jq -r .ok <<<"$result")" = true ] && [ -z "$open" ]; then ready=true; fi
          missing=""
          if [ "$ready" != true ]; then
            if [ "$(jq -r .ok <<<"$result")" != true ]; then
              missing+="The PRD does not follow the schema yet (policy/issue-schema.yml in DiluxOne/.github):"$'\n\n'"$(jq -r '.errors[] | "- `" + gsub("`"; "\u0027") + "`"' <<<"$result")"$'\n'
              # The questions that fill it (#588): the author answers in a
              # comment, and the bot rewrites the issue with the answers.
              asked=$(printf '%s' "$BODY" | python3 .dx-central/scripts/issue-schema.py questions)
              if [ -n "$asked" ] && [ "$ACTION" != labeled ]; then
                missing+=$'\n'"To complete it, answer these in a comment (the author, or a maintainer); the bot rewrites the issue with the answers, for a maintainer to read before accepting it:"$'\n\n'"$asked"$'\n'
              fi
            fi
            if [ -n "$open" ]; then
              missing+=$'\n'"A comment after the PRD's last edit waits for a maintainer's answer (answer it, or settle it in the PRD):"$'\n\n'"$(while IFS= read -r u; do printf -- '- %s\n' "$u"; done <<<"$open")"$'\n'
            fi
          fi
          n=$(jq -r '.criteria | length' <<<"$result")
          if [ "$ACTION" = labeled ]; then
            if [ "$ready" = true ]; then
              text="**Issue ready (G1):** the PRD has every section of the schema ($n acceptance criteria)."
            else
              # Who accepted it is named, so the label that comes off is never
              # a silent change (#353). A login holds no markup.
              text="**Issue not ready (G1):** @$SENDER added \`$LABEL\`, but the issue is \`incomplete\`, so the label was taken off. What is missing:"$'\n\n'"$missing"$'\n'"Add \`$LABEL\` again once the issue is ready."
            fi
          elif [ "$ready" = true ]; then
            text="**Issue complete (G1):** the PRD has every section of the schema ($n acceptance criteria). It is \`awaiting-acceptance\`: the decision is a maintainer's."
          else
            text="**Issue incomplete (G1):** what is missing before a maintainer can accept it:"$'\n\n'"$missing"$'\n'"It is checked again every time the issue is edited."
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "$text"
          [ -n "$GH_TOKEN" ] || { echo "No bot key: the result stays in this log."; exit 0; }
          # A maintainer's own Bug, complete (C2, #564): the triage accepts
          # it with its writing (issue-triage.yml, the `own` job), so it is
          # never left `awaiting-acceptance` here.
          if [ "$ACTION" = opened ] && [ "$ready" = true ] && [ "$(bash .dx-central/scripts/triage-act.sh own-bug-check)" = yes ]; then
            echo "A maintainer's own Bug: the triage accepts it with its writing."; exit 0
          fi
          # The state's labels (#353), one of the two at a time, created where
          # the repository does not have them yet (labels.yml has them).
          for l in "awaiting-acceptance|FBCA04|The issue follows the schema; it waits for a maintainer's decision" "incomplete|D4C5F9|The issue does not follow the schema yet; a comment says what is missing"; do
            IFS='|' read -r ln lc ld <<<"$l"
            gh label create "$ln" --repo "$GITHUB_REPOSITORY" --color "$lc" --description "$ld" >/dev/null 2>&1 || true
          done
          # Which labels go on and come off: scripts/issue-schema.py g1-labels.
          { read -r add; read -r remove; } < <(python3 .dx-central/scripts/issue-schema.py g1-labels "$ACTION" "$ready" "$LABEL")
          if [ -n "$remove" ]; then
            # A label the issue does not have is no error: each comes off alone.
            IFS=',' read -ra rm <<<"$remove"
            for l in "${rm[@]}"; do
              if [ "$l" = "$LABEL" ]; then gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$LABEL" >/dev/null
              else gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$l" >/dev/null 2>&1 || true; fi
            done
          fi
          if [ -n "$add" ]; then gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$add" >/dev/null; fi
          body="<!-- dx-g1 -->"$'\n'"$text"$'\n\n'"🤖 AI-generated · Claude Opus 5.5 (Anthropic)"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --paginate --jq '.[] | select(.user.type == "Bot" and (.user.login | startswith(env.DX_BOT_APP)) and (.body | startswith("<!-- dx-g1 -->"))) | .id' | tail -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          elif [ "$ACTION" = labeled ] || [ "$ready" != true ]; then
            # A complete issue just opened needs no comment: its label says
            # so. One that was incomplete has its comment, updated above.
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body" >/dev/null
          fi
      # Gate G2's seal (#81): the PRD's SHA-256, who accepted and when, in a
      # JSON file dilux-bot commits to the receipts branch (an organisation
      # ruleset lets only dilux-bot write there, and nobody delete or
      # rewrite it). The pull request gate compares the PRD with it.
      - name: Seal the PRD and update the issue's board
        if: github.event.action == 'labeled' && steps.bot.outputs.token != '' && steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BODY_TEXT: ${{ github.event.issue.body }}
          NUMBER: ${{ github.event.issue.number }}
          ACCEPTED_BY: ${{ github.event.sender.login }}
          POLICY_REF: ${{ steps.central.outputs.ref }}
        run: |
          set -euo pipefail
          printf '%s' "$BODY_TEXT" > "$RUNNER_TEMP/body.md"
          # A person accepted it, so it was looked at: needs-triage goes.
          gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label needs-triage >/dev/null 2>&1 || true
          BODY="$RUNNER_TEMP/body.md" python3 .dx-central/scripts/receipts.py seal-prd
          board=$(BODY="$RUNNER_TEMP/body.md" python3 .dx-central/scripts/receipts.py board)
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --paginate --jq '.[] | select(.user.type == "Bot" and (.user.login | startswith(env.DX_BOT_APP)) and (.body | startswith("<!-- dx-board -->"))) | .id' | tail -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$board" >/dev/null
          else gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$board" >/dev/null; fi

  # An accepted issue edited after its seal (#588): its PRD is no longer the
  # one accepted, so the acceptance does not stand. `accepted` comes off,
  # `awaiting-acceptance` or `incomplete` goes on (the G1 check), and one
  # comment says what changed since the seal, section by section, and who
  # may accept it again. The autopilot stops as before, as the seal no
  # longer matches. An edit that leaves the PRD as sealed (the Spec the
  # autopilot appends, a report above it) changes nothing.
  unseal:
    name: Edited after its acceptance
    runs-on: ${{ vars.DX_RUNNER_HEAVY != '' && !((github.event.pull_request.user.login == vars.DX_BOT_LOGIN && (startsWith(github.event.pull_request.head.ref, 'test/repro-issue-') || (contains(github.event.pull_request.head.ref, '/') && contains(github.event.pull_request.head.ref, '-the-bug-reproduced-from-')))) || (github.event.issue.user.login == vars.DX_BOT_LOGIN && (github.event.issue.pull_request || startsWith(github.event.issue.title, 'The bug reproduced from ')))) && fromJSON(vars.DX_RUNNER_HEAVY) || 'ubuntu-latest' }}
    timeout-minutes: 5
    if: >-
      github.event_name == 'issues' && github.event.action == 'edited' &&
      contains(github.event.issue.labels.*.name, inputs.label) && !contains(github.event.issue.labels.*.name, 'lane:release')
    concurrency:
      group: issue-g1-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions: {}
    steps:
      - name: The scripts
        env:
          REF: ${{ inputs.central-ref || job.workflow_sha }}
        run: |
          set -euo pipefail
          git init -q .dx-central && git -C .dx-central fetch -q --depth 1 https://github.com/DiluxOne/.github "$REF" && git -C .dx-central checkout -q FETCH_HEAD
          test ! -f .dx-central/scripts/config-overlay.sh || bash .dx-central/scripts/config-overlay.sh
      - name: App token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-contents: read # the seal, and CODEOWNERS
          permission-pull-requests: read
      - name: Take the acceptance off and say what changed
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BODY_TEXT: ${{ github.event.issue.body }}
          NUMBER: ${{ github.event.issue.number }}
          LABEL: ${{ inputs.label }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail
          printf '%s' "$BODY_TEXT" > "$RUNNER_TEMP/body.md"
          export BODY="$RUNNER_TEMP/body.md"
          # Exit 2 is a seal that could not be read: never taken for a change.
          rc=0; verdict=$(python3 .dx-central/scripts/receipts.py verify-prd) || rc=$?
          if [ "$rc" -gt 1 ]; then echo "::error::The seal could not be read: $verdict"; exit 1; fi
          [ "$verdict" = changed ] || { echo "The PRD is the one sealed ($verdict): the acceptance stands."; exit 0; }
          ready=false; missing=""
          if result=$(python3 .dx-central/scripts/issue-schema.py check < "$BODY"); then ready=true
          else missing=$(jq -r '.errors[] | "- `" + gsub("`"; "\u0027") + "`"' <<<"$result"); fi
          { read -r add; read -r remove; } < <(python3 .dx-central/scripts/issue-schema.py g1-labels unsealed "$ready" "$LABEL")
          IFS=',' read -ra rm <<<"$remove"
          for l in "${rm[@]}"; do
            if [ "$l" = "$LABEL" ]; then gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$LABEL" >/dev/null
            else gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$l" >/dev/null 2>&1 || true; fi
          done
          gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$add" >/dev/null
          python3 .dx-central/scripts/receipts.py sealed-prd > "$RUNNER_TEMP/sealed.md" || : > "$RUNNER_TEMP/sealed.md"
          changed=$(python3 .dx-central/scripts/issue-schema.py diff "$RUNNER_TEMP/sealed.md" < "$BODY")
          who=$(python3 .dx-central/scripts/deciders.py who accepted) || who="those who-decides allows (org.yml, repos.yml)"
          # shellcheck disable=SC2016 # Markdown's backticks, not a command.
          state=$([ "$ready" = true ] && echo '`awaiting-acceptance`' || echo '`incomplete`')
          # shellcheck disable=SC2016 # Markdown's backticks, not a command.
          {
            printf '**Acceptance withdrawn (G2):** @%s edited the PRD after it was accepted, so it is no longer the one sealed: `%s` was taken off and the issue is %s. The autopilot does not go on until it is accepted again.\n\n' "$SENDER" "$LABEL" "$state"
            printf '**What changed since the seal:**\n\n%s\n\n' "$changed"
            [ -z "$missing" ] || printf '**What is missing before it can be accepted (G1):**\n\n%s\n\n' "$missing"
            printf 'Who may accept it again: %s.\n\n🤖 AI-generated · Claude Opus 5.5 (Anthropic)\n' "$who"
          } > "$RUNNER_TEMP/unseal.md"
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/unseal.md" >/dev/null
          cat "$RUNNER_TEMP/unseal.md"

  # The shaping (#588): an `incomplete` issue, before any acceptance, gets
  # the questions that fill what it misses (the G1 comment, above), and each
  # answer in a comment, by its author or by someone `who-decides` allows,
  # has a model with no tools and no key rewrite the body into the schema
  # from the body and those answers only. The rewrite is taken only when
  # issue-schema.py shape-check lets it (no text outside the sections, no
  # comment nor marker, no Spec, every section that was valid kept word for
  # word); the bot edits the body, comments what changed, and labels it
  # `awaiting-acceptance` once it passes. Anyone else's comment never
  # reaches the rewrite: it is summarised apart, as data (#287). Nothing is
  # coded from it: a person reads the text before accepting it.
  shape:
    name: Shape the issue (G1)
    runs-on: ubuntu-latest # fresh: it holds the key beside a model's work (#287)
    timeout-minutes: 10
    if: >-
      github.event_name == 'issue_comment' && github.event.action == 'created' && !github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' && !startsWith(github.event.comment.body, '/') &&
      contains(github.event.issue.labels.*.name, 'incomplete') && !contains(github.event.issue.labels.*.name, inputs.label) &&
      !contains(github.event.issue.labels.*.name, 'lane:release')
    concurrency:
      group: issue-g1-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    # The model's action reads the issue with the job's token, nothing more.
    permissions:
      issues: read
    steps:
      - name: The scripts
        env:
          REF: ${{ inputs.central-ref || job.workflow_sha }}
        run: |
          set -euo pipefail
          git init -q .dx-central && git -C .dx-central fetch -q --depth 1 https://github.com/DiluxOne/.github "$REF" && git -C .dx-central checkout -q FETCH_HEAD
          test ! -f .dx-central/scripts/config-overlay.sh || bash .dx-central/scripts/config-overlay.sh
      - name: App token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-contents: read # CODEOWNERS and the seal, for who decides
          permission-pull-requests: read
      # Whose words reach the rewrite: the author's and those who decide,
      # by the logins GitHub gives, never by what a comment says.
      - name: The answers, and the others
        id: who
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          NUMBER: ${{ github.event.issue.number }}
          LOGIN: ${{ github.event.comment.user.login }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER" --jq '.body // ""' > "$RUNNER_TEMP/body.md"
          gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --paginate \
            --jq '[.[] | select(.user.type != "Bot" and (.body | startswith("/") | not)) | {login: .user.login, body, url: .html_url}]' | jq -s 'add // []' > "$RUNNER_TEMP/comments.json"
          { echo "$AUTHOR"; jq -r '.[].login' "$RUNNER_TEMP/comments.json" | sort -u | python3 .dx-central/scripts/deciders.py list answer || true; } | sort -u > "$RUNNER_TEMP/answerers.txt"
          jq --rawfile a "$RUNNER_TEMP/answerers.txt" '[.[] | select(.login as $l | ($a | split("\n") | index($l)))] | .[-20:]' "$RUNNER_TEMP/comments.json" > "$RUNNER_TEMP/answers.json"
          jq --rawfile a "$RUNNER_TEMP/answerers.txt" '[.[] | select(.login as $l | ($a | split("\n") | index($l)) | not)] | .[-20:]' "$RUNNER_TEMP/comments.json" > "$RUNNER_TEMP/others.json"
          eof="DX_$(openssl rand -hex 16)"
          if grep -qxF "$LOGIN" "$RUNNER_TEMP/answerers.txt"; then
            echo "$LOGIN answers: the body is rewritten with the answers."
            { echo "rewrite<<$eof"; BODY="$RUNNER_TEMP/body.md" ANSWERS="$RUNNER_TEMP/answers.json" python3 .dx-central/scripts/issue-schema.py shape-prompt; echo "$eof"; } >> "$GITHUB_OUTPUT"
          else
            echo "$LOGIN neither wrote the issue nor decides here: their comment is summarised apart, as data."
            { echo "others<<$eof"; BODY="$RUNNER_TEMP/body.md" OTHERS="$RUNNER_TEMP/others.json" python3 .dx-central/scripts/issue-schema.py shape-others; echo "$eof"; } >> "$GITHUB_OUTPUT"
          fi
      - name: A model with no tools rewrites the body
        id: rewrite
        if: steps.who.outputs.rewrite != ''
        continue-on-error: true
        timeout-minutes: 5
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ github.token }}
          # The author may be anyone: this model has no tool to act with.
          allowed_non_write_users: '*'
          prompt: ${{ steps.who.outputs.rewrite }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 2
            --max-budget-usd 0.3
            --allowedTools ""
            --disallowedTools "Bash,Read,Write,Edit,MultiEdit,Glob,Grep,WebFetch,WebSearch,NotebookEdit,Task"
            --json-schema '{"type":"object","additionalProperties":false,"required":["body"],"properties":{"body":{"type":"string","maxLength":20000}}}'
      - name: A model with no tools summarises the others
        id: summary
        if: steps.who.outputs.others != ''
        continue-on-error: true
        timeout-minutes: 5
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ github.token }}
          allowed_non_write_users: '*'
          prompt: ${{ steps.who.outputs.others }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 2
            --max-budget-usd 0.3
            --allowedTools ""
            --disallowedTools "Bash,Read,Write,Edit,MultiEdit,Glob,Grep,WebFetch,WebSearch,NotebookEdit,Task"
            --json-schema '{"type":"object","additionalProperties":false,"required":["points"],"properties":{"points":{"type":"array","maxItems":30,"items":{"type":"object","additionalProperties":false,"required":["i","argument"],"properties":{"i":{"type":"integer"},"argument":{"type":"string","maxLength":400}}}}}}'
      - name: The rewrite, checked, on the issue
        if: steps.rewrite.outputs.structured_output != ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          NUMBER: ${{ github.event.issue.number }}
          LOGIN: ${{ github.event.comment.user.login }}
          OUT: ${{ steps.rewrite.outputs.structured_output }}
        run: |
          set -euo pipefail
          jq -r '.body // ""' <<<"$OUT" > "$RUNNER_TEMP/new.md"
          [ -s "$RUNNER_TEMP/new.md" ] || { echo "The model wrote no body."; exit 0; }
          # Written with a model's help: the AI line closes it (CONTRIBUTING.md).
          ai="🤖 AI-assisted · Claude Sonnet 5.5 (Anthropic)"
          if ! tail -n 1 "$RUNNER_TEMP/new.md" | grep -q '^🤖 AI-'; then printf '\n%s\n' "$ai" >> "$RUNNER_TEMP/new.md"; fi
          rc=0; verdict=$(python3 .dx-central/scripts/issue-schema.py shape-check "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/new.md") || rc=$?
          if [ "$rc" != 0 ]; then
            why=$(jq -r '.why // "the check failed"' <<<"$verdict" 2>/dev/null || echo "the check failed")
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(printf '**The answers were not written into the issue:** the rewrite was refused (%s). The issue stays as it is; edit it by hand, or answer again.\n\n🤖 AI-generated · Claude Opus 5.5 (Anthropic)' "$why")" >/dev/null
            exit 0
          fi
          changed=$(python3 .dx-central/scripts/issue-schema.py diff "$RUNNER_TEMP/body.md" < "$RUNNER_TEMP/new.md")
          gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/new.md" >/dev/null
          gh label create awaiting-acceptance --repo "$GITHUB_REPOSITORY" --color FBCA04 --description "The issue follows the schema; it waits for a maintainer's decision" >/dev/null 2>&1 || true
          add=$(jq -r '.add | join(",")' <<<"$verdict")
          for l in $(jq -r '.remove[]' <<<"$verdict"); do gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$l" >/dev/null 2>&1 || true; done
          gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$add" >/dev/null
          if [ "$(jq -r .ready <<<"$verdict")" = true ]; then
            state="It now follows the schema and is \`awaiting-acceptance\`: a maintainer reads it and decides; nothing is coded before."
            g1="**Issue complete (G1):** the PRD has every section of the schema. It is \`awaiting-acceptance\`: the decision is a maintainer's."
          else
            asked=$(python3 .dx-central/scripts/issue-schema.py questions < "$RUNNER_TEMP/new.md")
            state="It is still \`incomplete\`. What it still needs:"$'\n\n'"$asked"
            g1="**Issue incomplete (G1):** what is missing before a maintainer can accept it:"$'\n\n'"$asked"$'\n\n'"It is checked again every time the issue is edited or answered."
          fi
          {
            printf '**The issue, rewritten with the answers (G1):** after @%s'"'"'s comment, a model with no tools wrote the answers of the author and the maintainers into the schema'"'"'s sections, checked before it was saved. Anyone else'"'"'s comment was left out.\n\n' "$LOGIN"
            printf '**What changed:**\n\n%s\n\n%s\n\n🤖 AI-generated · Claude Opus 5.5 (Anthropic)\n' "$changed" "$state"
          } > "$RUNNER_TEMP/shaped.md"
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/shaped.md" >/dev/null
          # The G1 comment, kept up to date: the bot's own edit runs no check.
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --paginate --jq '.[] | select(.user.type == "Bot" and (.user.login | startswith(env.DX_BOT_APP)) and (.body | startswith("<!-- dx-g1 -->"))) | .id' | tail -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="<!-- dx-g1 -->"$'\n'"$g1"$'\n\n'"🤖 AI-generated · Claude Opus 5.5 (Anthropic)" >/dev/null; fi
      - name: The others' summary, on the issue
        if: steps.summary.outputs.structured_output != ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          NUMBER: ${{ github.event.issue.number }}
          POINTS: ${{ steps.summary.outputs.structured_output }}
        run: |
          set -euo pipefail
          OTHERS="$RUNNER_TEMP/others.json" python3 .dx-central/scripts/issue-schema.py shape-others-comment > "$RUNNER_TEMP/others.md"
          [ -s "$RUNNER_TEMP/others.md" ] || { echo "Nothing argued about the issue."; exit 0; }
          # One comment, kept up to date.
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --paginate --jq '.[] | select(.user.type == "Bot" and (.user.login | startswith(env.DX_BOT_APP)) and (.body | startswith("<!-- dx-autopilot-others -->"))) | .id' | tail -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$RUNNER_TEMP/others.md" >/dev/null
          else gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/others.md" >/dev/null; fi

  receipt:
    name: The merge's receipt
    runs-on: ${{ vars.DX_RUNNER_HEAVY != '' && !((github.event.pull_request.user.login == vars.DX_BOT_LOGIN && (startsWith(github.event.pull_request.head.ref, 'test/repro-issue-') || (contains(github.event.pull_request.head.ref, '/') && contains(github.event.pull_request.head.ref, '-the-bug-reproduced-from-')))) || (github.event.issue.user.login == vars.DX_BOT_LOGIN && (github.event.issue.pull_request || startsWith(github.event.issue.title, 'The bug reproduced from ')))) && fromJSON(vars.DX_RUNNER_HEAVY) || 'ubuntu-latest' }}
    timeout-minutes: 5
    # When an accepted issue closes as completed by a merged pull request: the
    # receipt (#81), committed to the receipts branch, and the board updated.
    # A reproduced bug's issue (`lane:bugfix-reproduced`, #84) gets its
    # receipt too: its PRD was sealed when the lane accepted it. Other lanes'
    # issues (the platform's) are not sealed and get none yet.
    if: github.event_name == 'issues' && github.event.action == 'closed' && github.event.issue.state_reason == 'completed' && (contains(github.event.issue.labels.*.name, inputs.label) || (contains(github.event.issue.labels.*.name, 'accepted-by:policy') && contains(github.event.issue.labels.*.name, 'lane:bugfix-reproduced'))) && !contains(github.event.issue.labels.*.name, 'lane:release')
    permissions: {}
    steps:
      - name: The scripts
        id: central
        env:
          REF: ${{ inputs.central-ref || job.workflow_sha }}
        run: |
          set -euo pipefail
          # The organisation's scripts as one checkout at the ref, so whatever
          # a script loads is there (receipts.py loads autopilot.py for the
          # board of an autopilot pull request).
          git init -q .dx-central && git -C .dx-central fetch -q --depth 1 https://github.com/DiluxOne/.github "$REF" && git -C .dx-central checkout -q FETCH_HEAD
          test ! -f .dx-central/scripts/config-overlay.sh || bash .dx-central/scripts/config-overlay.sh .dx-central
          if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then echo "ref=${REF:0:12}" >> "$GITHUB_OUTPUT"; else echo "ref=$(git ls-remote https://github.com/DiluxOne/.github "$REF" "$REF^{}" | tail -1 | cut -c1-12)" >> "$GITHUB_OUTPUT"; fi
      - name: App token
        id: bot
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-contents: write
          permission-pull-requests: read
          permission-checks: read
      - name: Write the receipt
        id: receipt
        if: steps.bot.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BODY_TEXT: ${{ github.event.issue.body }}
          NUMBER: ${{ github.event.issue.number }}
          POLICY_REF: ${{ steps.central.outputs.ref }}
        run: |
          set -euo pipefail
          printf '%s' "$BODY_TEXT" > "$RUNNER_TEMP/body.md"
          # The merged pull request that closed it.
          # shellcheck disable=SC2016 # GraphQL variables, not shell ones.
          pr=$(gh api graphql -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){issue(number:$n){timelineItems(itemTypes:[CLOSED_EVENT],last:1){nodes{... on ClosedEvent{closer{... on PullRequest{number merged headRefOid mergeCommit{oid} mergedBy{login} labels(first:30){nodes{name}}}}}}}}}}' \
            -f o="${GITHUB_REPOSITORY%%/*}" -f r="${GITHUB_REPOSITORY#*/}" -F n="$NUMBER" \
            --jq '.data.repository.issue.timelineItems.nodes[0].closer // empty')
          if [ -z "$pr" ] || [ "$(jq -r .merged <<<"$pr")" != true ]; then echo "Not closed by a merged pull request: no receipt."; exit 0; fi
          head=$(jq -r .headRefOid <<<"$pr")
          echo "pr=$(jq -r .number <<<"$pr")" >> "$GITHUB_OUTPUT"
          PR_JSON=$(jq -c '{number, head: .headRefOid, merge: .mergeCommit.oid, merged_by: .mergedBy.login, labels: [.labels.nodes[].name]}' <<<"$pr")
          # The head commit's checks, counted by conclusion.
          CHECKS_JSON=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/check-runs" --paginate --jq '[.check_runs[].conclusion]' \
            | jq -sc 'add // [] | group_by(.) | map({((.[0] // "pending") | tostring): length}) | add // {}')
          export PR_JSON CHECKS_JSON
          BODY="$RUNNER_TEMP/body.md" python3 .dx-central/scripts/receipts.py merged
          board=$(BODY="$RUNNER_TEMP/body.md" python3 .dx-central/scripts/receipts.py board)
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --paginate --jq '.[] | select(.user.type == "Bot" and (.user.login | startswith(env.DX_BOT_APP)) and (.body | startswith("<!-- dx-board -->"))) | .id' | tail -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$board" >/dev/null
          else gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$board" >/dev/null; fi
      # A reproduced bug's fix merged (#271): the report it came from is
      # closed as completed, naming the pull request. The report's number is
      # read from the lane issue's sealed PRD (repro-lane.py evidence), never
      # from its title, and only on an issue dilux-bot opened for the lane.
      - name: Close the report it came from
        if: steps.receipt.outputs.pr != '' && github.event.issue.user.login == vars.DX_BOT_LOGIN && contains(github.event.issue.labels.*.name, 'lane:bugfix-reproduced') && contains(github.event.issue.labels.*.name, 'accepted-by:policy')
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BODY_TEXT: ${{ github.event.issue.body }}
          NUMBER: ${{ github.event.issue.number }}
          PR: ${{ steps.receipt.outputs.pr }}
        run: |
          set -euo pipefail
          printf '%s' "$BODY_TEXT" > "$RUNNER_TEMP/lane.md"
          report=$(BODY="$RUNNER_TEMP/lane.md" python3 .dx-central/scripts/repro-lane.py evidence | jq -r '.report // empty' || true)
          [ -n "$report" ] || { echo "::warning::#$NUMBER names no report in its PRD; nothing closed."; exit 0; }
          if [ "$(gh issue view "$report" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" != OPEN ]; then echo "#$report is already closed."; exit 0; fi
          gh issue close "$report" --repo "$GITHUB_REPOSITORY" --reason completed --comment "$(printf 'Fixed by #%s, through #%s: the test this report became passes there, and it ships with the next release.\n\n🤖 AI-generated · Claude Opus 5.5 (Anthropic)' "$PR" "$NUMBER")" >/dev/null
          echo "Closed #$report (fixed by #$PR)."

  release:
    name: The release pull request
    runs-on: ${{ vars.DX_RUNNER_HEAVY != '' && !((github.event.pull_request.user.login == vars.DX_BOT_LOGIN && (startsWith(github.event.pull_request.head.ref, 'test/repro-issue-') || (contains(github.event.pull_request.head.ref, '/') && contains(github.event.pull_request.head.ref, '-the-bug-reproduced-from-')))) || (github.event.issue.user.login == vars.DX_BOT_LOGIN && (github.event.issue.pull_request || startsWith(github.event.issue.title, 'The bug reproduced from ')))) && fromJSON(vars.DX_RUNNER_HEAVY) || 'ubuntu-latest' }}
    timeout-minutes: 10
    # A person accepts a release issue (#82): the release pull request, as
    # the header says. Or the plan accepted it (#247): dilux-bot opened it on
    # its version's milestone and marked it `accepted-by:policy`
    # (scripts/milestones.py, `planned-release: auto`); publishing checks the
    # planner's role again (scripts/release-issue.py verify). Everything goes
    # through dilux-bot's token, so the caller's grants are not touched; no
    # code of the repository runs, only the organisation's scripts on its files.
    if: >-
      github.event_name == 'issues' && github.event.action == 'labeled' && contains(github.event.issue.labels.*.name, 'lane:release') &&
      ((github.event.label.name == inputs.label && github.event.sender.type != 'Bot') ||
       (github.event.label.name == 'accepted-by:policy' && github.event.sender.login == vars.DX_BOT_LOGIN && github.event.issue.user.login == vars.DX_BOT_LOGIN && github.event.issue.milestone != null))
    permissions: {}
    concurrency:
      group: release-pr-${{ github.repository }}
      cancel-in-progress: false
    steps:
      # Without the bot's key (an old caller) nothing is opened, and the log
      # says so: a person prepares the release by hand, as before.
      - name: App token
        id: bot
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: No bot key
        if: steps.bot.outputs.token == ''
        run: echo "::warning::No App key passed to issue-accepted.yml, so no release pull request is opened; a person prepares it by hand."

      # The default branch, with its tags; its credentials push the branch.
      - if: steps.bot.outputs.token != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.bot.outputs.token }}
          fetch-depth: 0

      - if: steps.bot.outputs.token != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref || job.workflow_sha }}
          path: .dx-central
          persist-credentials: false

      - name: The organisation's configuration (#197)
        if: steps.bot.outputs.token != ''
        run: test ! -f .dx-central/scripts/config-overlay.sh || bash .dx-central/scripts/config-overlay.sh

      - name: Open it, or say why not
        if: steps.bot.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          BASE: ${{ github.event.repository.default_branch }}
          DX_AUTOPILOT: ${{ vars.DX_AUTOPILOT }}
          SENDER: ${{ github.event.sender.login }}
          # On the planned path (#247) the decision is the milestone's planner's.
          PLANNED: ${{ github.event.label.name == 'accepted-by:policy' }}
          PLANNER: ${{ github.event.issue.milestone.creator.login }}
        run: |
          set -euo pipefail
          echo ".dx-central/" >> .git/info/exclude
          # One comment on the issue, kept up to date: what was opened, or why not.
          say() {
            local body id
            body="<!-- dx-release -->"$'\n'"$1"$'\n\n'"🤖 AI-generated · Claude Opus 5.5 (Anthropic)"
            echo "$1"
            id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --paginate --jq '.[] | select(.user.type == "Bot" and (.user.login | startswith(env.DX_BOT_APP)) and (.body | startswith("<!-- dx-release -->"))) | .id' | tail -1)
            if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
            else gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body" >/dev/null; fi
          }
          if [ "$(tr '[:upper:]' '[:lower:]' <<<"${DX_AUTOPILOT:-}")" = off ]; then
            say "**No release pull request:** the organisation's \`DX_AUTOPILOT\` is off, which stops every autonomous action. A maintainer prepares it by hand (the kind's command, \`scripts/release-markers.sh prepare\` for a plugin) in a pull request that closes this issue."
            exit 0
          fi
          # Only the admin or maintain role approves a release (the release
          # workflow checks it again before publishing): no pull request for
          # anyone else's acceptance, nor when the role cannot be read.
          who=$SENDER; [ "$PLANNED" != true ] || who=$PLANNER
          role=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$who/permission" --jq .role_name 2>/dev/null || true)
          case "$role" in
            admin|maintain) ;;
            *) say "**No release pull request:** $who $([ "$PLANNED" = true ] && echo "planned this version" || echo "accepted this issue") with the role ${role:-unknown (it could not be read)} on the repository, and only a person with the admin or maintain role approves a release. One of them accepts it (add \`accepted\`)."; exit 0 ;;
          esac
          python3 .dx-central/scripts/next-version.py --repo "$GITHUB_REPOSITORY" --base "$BASE" --json > "$RUNNER_TEMP/next.json"
          rc=0
          TITLE="$TITLE" NUMBER="$NUMBER" NEXT_JSON="$RUNNER_TEMP/next.json" ROOT=. CENTRAL=.dx-central \
            python3 .dx-central/scripts/release-issue.py plan > "$RUNNER_TEMP/plan.json" || rc=$?
          if [ "$rc" -gt 1 ] || ! jq -e 'has("ok")' "$RUNNER_TEMP/plan.json" >/dev/null 2>&1; then
            echo "::error::release-issue.py plan failed (exit $rc)."; exit 1
          fi
          if [ "$(jq -r .ok "$RUNNER_TEMP/plan.json")" != true ]; then
            say "**No release pull request:** $(jq -r .why "$RUNNER_TEMP/plan.json")."
            exit 0
          fi
          version=$(jq -r .version "$RUNNER_TEMP/plan.json"); branch=$(jq -r .branch "$RUNNER_TEMP/plan.json")
          title=$(jq -r .title "$RUNNER_TEMP/plan.json"); where=$(jq -r .publishes_to "$RUNNER_TEMP/plan.json")
          if git rev-parse -q --verify "refs/tags/$version^{commit}" >/dev/null; then
            say "**No release pull request:** $version is already released (its tag exists)."; exit 0
          fi
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            found=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state all --json url,state --jq '.[0] | "\(.url // "") \(.state // "")"') \
              || { echo "::error::Could not list the pull requests of $branch."; exit 1; }
            read -r pr state <<<"$found"
            if [ "${state:-}" = MERGED ]; then
              say "**No release pull request:** the one for $version, $pr, already merged; the release run of that merge publishes $version (re-run it if it found no accepted issue then)."
            elif [ "${state:-}" = CLOSED ]; then
              say "**No release pull request:** the one for $version, $pr, was closed without merging and its branch \`$branch\` is still there. Delete that branch, then accept this issue again (remove and add \`accepted\`) for a new one."
            else
              say "**The release pull request** for $version is already there: ${pr:-the branch \`$branch\`}. Merging it publishes $version to $where."
            fi
            exit 0
          fi
          git config user.name "$DX_BOT_LOGIN"
          git config user.email "$DX_BOT_ID+$DX_BOT_LOGIN@users.noreply.github.com"
          git checkout -q -b "$branch"
          mapfile -t argv < <(jq -r '.argv[]' "$RUNNER_TEMP/plan.json")
          if ! "${argv[@]}" > "$RUNNER_TEMP/prepare.log" 2>&1; then
            cat "$RUNNER_TEMP/prepare.log"
            say "**No release pull request:** preparing $version failed. If \`main\` already says $version (its pull request merged the old way), nothing needs preparing: re-run the last release run on \`main\`, which now finds this issue accepted. Otherwise the run says why: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            exit 0
          fi
          git add -A
          if git diff --cached --quiet; then
            say "**No release pull request:** preparing $version changed nothing, so \`main\` already says it: re-run the last release run on \`main\`, which now finds this issue accepted."
            exit 0
          fi
          git commit -q -m "$title"
          # Through the API, so GitHub signs the commit (#190).
          python3 .dx-central/scripts/api-commit.py push "$branch" --onto HEAD~1
          pr=$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE" --head "$branch" --title "$title" --body "$(jq -r .body "$RUNNER_TEMP/plan.json")")
          say "**The release pull request:** $pr. It goes through the checks and the review like any other; merging it publishes $version to $where, after the release workflow checks that a person accepted this issue and that its title still names $version."

  lane:
    name: Accepted by policy
    runs-on: ${{ vars.DX_RUNNER_HEAVY != '' && !((github.event.pull_request.user.login == vars.DX_BOT_LOGIN && (startsWith(github.event.pull_request.head.ref, 'test/repro-issue-') || (contains(github.event.pull_request.head.ref, '/') && contains(github.event.pull_request.head.ref, '-the-bug-reproduced-from-')))) || (github.event.issue.user.login == vars.DX_BOT_LOGIN && (github.event.issue.pull_request || startsWith(github.event.issue.title, 'The bug reproduced from ')))) && fromJSON(vars.DX_RUNNER_HEAVY) || 'ubuntu-latest' }}
    timeout-minutes: 5
    # A lane's label added to an issue: whether its lane accepts it, as the
    # header says. Reads with the caller's token (the issue, and the run
    # that opened a platform lane's issue); writes the label and the comment
    # with the bot's.
    if: github.event_name == 'issues' && github.event.action == 'labeled' && startsWith(github.event.label.name, 'lane:')
    permissions:
      actions: read # the workflow run a lane's issue names
      issues: read
    steps:
      # The commit first, then the files at that commit: the link the
      # comment gives is the policy that decided.
      - name: The autonomy policy and its script
        id: central
        env:
          REF: ${{ inputs.central-ref || job.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then sha=$REF; else sha=$(git ls-remote https://github.com/DiluxOne/.github "$REF" "$REF^{}" | tail -1 | cut -f1); fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$REF is not a ref of DiluxOne/.github."; exit 1; }
          mkdir -p .dx-central/scripts .dx-central/policy
          base="https://raw.githubusercontent.com/DiluxOne/.github/$sha"
          # autonomy.py reads the organisation from org.yml, through org.py (#191);
          # the overlay merges with settings.py by the schema (#568).
          for f in scripts/autonomy.py scripts/org.py scripts/repos_conf.py scripts/settings.py org.yml policy/autonomy.yml policy/settings-schema.yml; do curl -fsSL --retry 3 "$base/$f" -o ".dx-central/$f"; done
          # The organisation's configuration over those (#197); a ref from
          # before the overlay has none.
          code=$(curl -sSL --retry 3 -w '%{http_code}' "$base/scripts/config-overlay.sh" -o .dx-central/scripts/config-overlay.sh || echo 000)
          case "$code" in 200) ;; 404) rm -f .dx-central/scripts/config-overlay.sh ;; *) echo "::error::scripts/config-overlay.sh could not be fetched ($code)."; exit 1 ;; esac
          test ! -f .dx-central/scripts/config-overlay.sh || bash .dx-central/scripts/config-overlay.sh .dx-central
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: App token
        id: bot
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-contents: read # the repository's own .github/autonomy.yml

      - name: Ask the policy, and say so on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ steps.bot.outputs.token }}
          NUMBER: ${{ github.event.issue.number }}
          LANE: ${{ github.event.label.name }}
          DX_AUTOPILOT: ${{ vars.DX_AUTOPILOT }}
          POLICY_SHA: ${{ steps.central.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BOT_TOKEN" ]; then echo "No bot key: the policy's verdict would go nowhere, so it is not asked."; exit 0; fi
          # Only a sync lane is announced here (the organisation's policy
          # says which; a repository's file cannot add one): any other lane
          # is skipped before anything else is read.
          if ! python3 .dx-central/scripts/autonomy.py policy | jq -e --arg l "${LANE#lane:}" '.lanes[$l] | (.accept == "policy" and (.origin.runs // null) != null)' >/dev/null; then
            echo "$LANE: not a sync lane; nothing to say."; exit 0
          fi
          # The repository's own policy, from its default branch, stricter
          # only: missing is none; unreadable stops here rather than reads as none.
          if ! GH_TOKEN=$BOT_TOKEN gh api "repos/$GITHUB_REPOSITORY/contents/.github/autonomy.yml" -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/repo-autonomy.yml" 2> "$RUNNER_TEMP/err"; then
            grep -q "404" "$RUNNER_TEMP/err" || { echo "::error::Could not read .github/autonomy.yml: $(head -c 300 "$RUNNER_TEMP/err")"; exit 1; }
            : > "$RUNNER_TEMP/repo-autonomy.yml"
          fi
          REPO_AUTONOMY="$RUNNER_TEMP/repo-autonomy.yml" python3 .dx-central/scripts/autonomy.py lane-announce > "$RUNNER_TEMP/verdict.json"
          act=$(jq -r .act "$RUNNER_TEMP/verdict.json")
          if [ "$act" = skip ]; then echo "$LANE: a person accepts this lane's issues; nothing to say."; exit 0; fi
          text=$(jq -r .comment "$RUNNER_TEMP/verdict.json")
          echo "$text"
          export GH_TOKEN=$BOT_TOKEN
          if [ "$act" = accept ]; then
            gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label accepted-by:policy >/dev/null
          else
            gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label accepted-by:policy >/dev/null 2>&1 || true
          fi
          body="<!-- dx-lane-verdict -->"$'\n'"$text"$'\n\n'"🤖 AI-generated · Claude Opus 5.5 (Anthropic)"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --paginate --jq '.[] | select(.user.type == "Bot" and (.user.login | startswith(env.DX_BOT_APP)) and (.body | startswith("<!-- dx-lane-verdict -->"))) | .id' | tail -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body" >/dev/null; fi

  decision:
    name: The decision's sub-issues
    # After the seal: what is carried out is the PRD a person accepted.
    needs: ready
    runs-on: ${{ vars.DX_RUNNER_HEAVY != '' && !((github.event.pull_request.user.login == vars.DX_BOT_LOGIN && (startsWith(github.event.pull_request.head.ref, 'test/repro-issue-') || (contains(github.event.pull_request.head.ref, '/') && contains(github.event.pull_request.head.ref, '-the-bug-reproduced-from-')))) || (github.event.issue.user.login == vars.DX_BOT_LOGIN && (github.event.issue.pull_request || startsWith(github.event.issue.title, 'The bug reproduced from ')))) && fromJSON(vars.DX_RUNNER_HEAVY) || 'ubuntu-latest' }}
    timeout-minutes: 15
    # When a person accepts an issue of DiluxOne/.github whose PRD names
    # Repositories (#189): a sub-issue in each repository its rules select,
    # opened by dilux-bot and linked to it, which the delegated lane accepts,
    # and one comment on it listing them (scripts/decision.py open). A
    # repository that matches later gets its own from the daily sync
    # (org-drift.yml). Nothing anywhere else.
    if: github.repository == 'DiluxOne/.github' && github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == inputs.label && github.event.sender.type != 'Bot'
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref || job.workflow_sha }}
          persist-credentials: false
      - name: App token (issues, every repository)
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-issues: write
          permission-contents: read
          permission-metadata: read
      - name: Open the sub-issues
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: python3 scripts/decision.py open

  project:
    name: The product's Project
    runs-on: ${{ vars.DX_RUNNER_HEAVY != '' && !((github.event.pull_request.user.login == vars.DX_BOT_LOGIN && (startsWith(github.event.pull_request.head.ref, 'test/repro-issue-') || (contains(github.event.pull_request.head.ref, '/') && contains(github.event.pull_request.head.ref, '-the-bug-reproduced-from-')))) || (github.event.issue.user.login == vars.DX_BOT_LOGIN && (github.event.issue.pull_request || startsWith(github.event.issue.title, 'The bug reproduced from ')))) && fromJSON(vars.DX_RUNNER_HEAVY) || 'ubuntu-latest' }}
    timeout-minutes: 5
    # The Projects go through the bot's own token; DiluxOne/.github is public,
    # so its checkout needs nothing from the workflow's.
    permissions: {}
    # After the G1 check (#372): an acceptance it takes back (the issue is
    # `incomplete`) never shows as Accepted on the Project. A release issue
    # (#82) is not checked by it, and its acceptance stands. always(): the
    # check is skipped on a close, which still sets Done.
    needs: ready
    if: >-
      always() && github.event_name == 'issues' && (
        (github.event.action == 'labeled' && github.event.label.name == inputs.label && github.event.sender.type != 'Bot' &&
          (needs.ready.outputs.ready == 'true' || contains(github.event.issue.labels.*.name, 'lane:release'))) ||
        (github.event.action == 'closed' && github.event.issue.state_reason != 'not_planned' && contains(github.event.issue.labels.*.name, inputs.label)))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref || job.workflow_sha }}
          path: .dx-central
          persist-credentials: false

      - name: The organisation's configuration (#197)
        run: test ! -f .dx-central/scripts/config-overlay.sh || bash .dx-central/scripts/config-overlay.sh

      - name: The Project of this repository
        id: which
        env:
          REPO: ${{ github.event.repository.name }}
          HAS_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != true ]; then echo "No bot key passed: the Project is left alone."; exit 0; fi
          # Its entry's `project` (#562); an organisation's repos.yml of the older shape, its `projects`.
          n=$(yq -r ".repos[\"$REPO\"].project // .projects[\"$REPO\"] // \"\"" .dx-central/repos.yml)
          [[ "$n" =~ ^[0-9]+$ ]] && echo "number=$n" >> "$GITHUB_OUTPUT" || echo "$REPO puts its issues on no Project (repos.yml)."

      # Projects belong to the organisation: a token for its Projects alone.
      - name: App token (organisation Projects)
        id: bot
        if: steps.which.outputs.number != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-organization-projects: write
          permission-issues: read

      - name: Add it, and set its Status
        if: steps.which.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          ORG: ${{ github.repository_owner }}
          PROJECT: ${{ steps.which.outputs.number }}
          ISSUE_ID: ${{ github.event.issue.node_id }}
          STATUS: ${{ github.event.action == 'closed' && 'Done' || 'Accepted' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # GraphQL variables, not shell ones.
          read -r project field option < <(gh api graphql -f query='query($o:String!,$n:Int!){organization(login:$o){projectV2(number:$n){id field(name:"Status"){... on ProjectV2SingleSelectField{id options{id name}}}}}}' \
            -F o="$ORG" -F n="$PROJECT" --jq ".data.organization.projectV2 | \"\(.id) \(.field.id // \"-\") \([(.field.options // [])[] | select(.name == \"$STATUS\")][0].id // \"\")\"")
          [ -n "$option" ] || { echo "::warning::Project $PROJECT has no Status \"$STATUS\"."; exit 0; }
          # Adding an item that is already there returns it: idempotent.
          # shellcheck disable=SC2016
          item=$(gh api graphql -f query='mutation($p:ID!,$c:ID!){addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id}}}' -f p="$project" -f c="$ISSUE_ID" --jq .data.addProjectV2ItemById.item.id)
          # shellcheck disable=SC2016
          gh api graphql -f query='mutation($p:ID!,$i:ID!,$f:ID!,$v:String!){updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$v}}){projectV2Item{id}}}' \
            -f p="$project" -f i="$item" -f f="$field" -f v="$option" >/dev/null
          echo "Project $PROJECT: Status $STATUS."
