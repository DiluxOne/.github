name: Issue accepted

# Reusable. When a person adds `accepted` to an issue: the issue lands on its
# product's public Project (repos.yml, `projects:`, in this repository) with
# Status Accepted, and the failed jobs of the organisation's pull request
# pipeline re-run on every open pull request that closes it. When an accepted
# issue closes as completed (by hand, or by the merge that closes it), its
# Status becomes Done; one closed as not planned is left where it is. The
# Project needs the bot's key; without it only the re-run happens. That pipeline is required from the organisation and GitHub does
# not start a required workflow on an edit of the description, so a pull
# request opened before its issue was accepted would otherwise stay red until
# its next push. A bot's label starts nothing, as the gate ignores it anyway.
#
#   on:
#     issues:
#       types: [labeled, closed]
#   jobs:
#     accepted:
#       permissions: { actions: write, issues: read, pull-requests: read }
#       uses: DiluxOne/.github/.github/workflows/issue-accepted.yml@v5
#       secrets:
#         DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}   # for the Project

on:
  workflow_call:
    inputs:
      label:
        description: The label that accepts an issue (the policy's issue-gate.label).
        type: string
        default: accepted
      workflow:
        description: The name of the pull request pipeline whose failed jobs are re-run.
        type: string
        default: Pull request (organisation)
      central-ref:
        description: Ref of DiluxOne/.github to read repos.yml (the Projects) from.
        type: string
        default: v5
    secrets:
      # Optional: a caller that does not pass it (one from before Projects)
      # keeps the re-run and skips the Project.
      DILUX_BOT_PRIVATE_KEY:
        required: false

# Nothing at the workflow level: a reusable workflow cannot ask for more than
# its caller's job grants, and the issues.yml template grants the accepted job
# actions: write, issues: read and pull-requests: read only. Each job asks for
# what it uses, within that.
permissions: {}

jobs:
  rerun:
    name: Re-run the gate
    runs-on: ${{ vars.DX_RUNNER == 'self-hosted' && fromJSON('["self-hosted","linux","x64","diluxone"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == inputs.label && github.event.sender.type != 'Bot'
    permissions:
      actions: write # re-run the failed jobs
      issues: read
      pull-requests: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          WORKFLOW: ${{ inputs.workflow }}
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY%%/*}; name=${GITHUB_REPOSITORY#*/}
          # The open pull requests of this repository that will close the
          # issue: linked under Development, or by "Closes #n".
          # shellcheck disable=SC2016 # GraphQL variables, not shell ones.
          prs=$(gh api graphql -f query='query($o:String!,$n:String!,$i:Int!){repository(owner:$o,name:$n){issue(number:$i){timelineItems(itemTypes:[CONNECTED_EVENT,CROSS_REFERENCED_EVENT],last:50){nodes{__typename ... on ConnectedEvent{subject{... on PullRequest{number state headRefOid repository{nameWithOwner}}}} ... on CrossReferencedEvent{willCloseTarget source{... on PullRequest{number state headRefOid repository{nameWithOwner}}}}}}}}}' \
            -F o="$owner" -F n="$name" -F i="$NUMBER" \
            --jq "[.data.repository.issue.timelineItems.nodes[] | (.subject // (select(.willCloseTarget) | .source)) | select(. != null and .state == \"OPEN\" and .repository.nameWithOwner == \"$GITHUB_REPOSITORY\") | \"\(.number) \(.headRefOid)\"] | unique | .[]")
          if [ -z "$prs" ]; then echo "No open pull request closes #$NUMBER."; exit 0; fi
          while read -r pr sha; do
            # By name through the API: `gh run list --workflow` cannot find a
            # workflow the organisation requires, which no file here holds.
            if ! last=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&per_page=100" \
              --jq "[.workflow_runs[] | select(.name == \"$WORKFLOW\")] | sort_by(.created_at) | last | \"\(.id // \"\") \(.status // \"\") \(.conclusion // \"\")\""); then
              echo "::warning::#$pr: could not list its runs."; continue
            fi
            read -r run status conclusion <<< "$last"
            if [ -z "$run" ]; then
              echo "#$pr: no run of \"$WORKFLOW\" on its head."
            elif [ "$status" != completed ]; then
              echo "::warning::#$pr: its run $run is still $status; re-run it once it ends, or push."
            elif [ "$conclusion" = failure ]; then
              # The API, not `gh run rerun`: that looks the run's workflow up
              # in this repository and gets a 404 for the organisation's
              # required one.
              if gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/rerun-failed-jobs" >/dev/null; then
                echo "#$pr: re-ran the failed jobs of run $run."
              else
                echo "::warning::#$pr: could not re-run run $run."
              fi
            else
              echo "#$pr: its last run $run did not fail ($conclusion); nothing to re-run."
            fi
          done <<< "$prs"

  project:
    name: The product's Project
    runs-on: ${{ vars.DX_RUNNER == 'self-hosted' && fromJSON('["self-hosted","linux","x64","diluxone"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    # The Projects go through the bot's own token; DiluxOne/.github is public,
    # so its checkout needs nothing from the workflow's.
    permissions: {}
    if: >-
      github.event_name == 'issues' && (
        (github.event.action == 'labeled' && github.event.label.name == inputs.label && github.event.sender.type != 'Bot') ||
        (github.event.action == 'closed' && github.event.issue.state_reason != 'not_planned' && contains(github.event.issue.labels.*.name, inputs.label)))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref }}
          path: .dx-central
          persist-credentials: false

      - name: The Project of this repository
        id: which
        env:
          REPO: ${{ github.event.repository.name }}
          HAS_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != true ]; then echo "No bot key passed: the Project is left alone."; exit 0; fi
          n=$(yq -r ".projects[\"$REPO\"] // \"\"" .dx-central/repos.yml)
          [[ "$n" =~ ^[0-9]+$ ]] && echo "number=$n" >> "$GITHUB_OUTPUT" || echo "$REPO puts its issues on no Project (repos.yml)."

      # Projects belong to the organisation: a token for its Projects alone.
      - name: dilux-bot token (organisation Projects)
        id: bot
        if: steps.which.outputs.number != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-organization-projects: write
          permission-issues: read

      - name: Add it, and set its Status
        if: steps.which.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          ORG: ${{ github.repository_owner }}
          PROJECT: ${{ steps.which.outputs.number }}
          ISSUE_ID: ${{ github.event.issue.node_id }}
          STATUS: ${{ github.event.action == 'closed' && 'Done' || 'Accepted' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # GraphQL variables, not shell ones.
          read -r project field option < <(gh api graphql -f query='query($o:String!,$n:Int!){organization(login:$o){projectV2(number:$n){id field(name:"Status"){... on ProjectV2SingleSelectField{id options{id name}}}}}}' \
            -F o="$ORG" -F n="$PROJECT" --jq ".data.organization.projectV2 | \"\(.id) \(.field.id // \"-\") \([(.field.options // [])[] | select(.name == \"$STATUS\")][0].id // \"\")\"")
          [ -n "$option" ] || { echo "::warning::Project $PROJECT has no Status \"$STATUS\"."; exit 0; }
          # Adding an item that is already there returns it: idempotent.
          # shellcheck disable=SC2016
          item=$(gh api graphql -f query='mutation($p:ID!,$c:ID!){addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id}}}' -f p="$project" -f c="$ISSUE_ID" --jq .data.addProjectV2ItemById.item.id)
          # shellcheck disable=SC2016
          gh api graphql -f query='mutation($p:ID!,$i:ID!,$f:ID!,$v:String!){updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$v}}){projectV2Item{id}}}' \
            -f p="$project" -f i="$item" -f f="$field" -f v="$option" >/dev/null
          echo "Project $PROJECT: Status $STATUS."
