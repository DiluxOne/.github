name: AI evaluation

# Not reusable. Every AI step is measured (#735), by hand only (#941): a
# maintainer runs it for one step when a change to that step (its workflow,
# the prompts it reads, its model in policy/autonomy.yml, its set under
# evals/<step>/) should be scored. It never runs on a pull request: replaying
# whole autopilot rounds on every push spent most of the engine's model use.
# scripts/evals.py says which paths count for which step (`evals.py steps`). Each case of
# evals/<step>/cases.json, a real one of the public repositories, is
# replayed in a job of its own, with its step's time (`evals.py matrix`,
# `evals.py run <step> <case>`), with the step as this pull request has it,
# and graded deterministically where a grade exists; then one job per step
# merges its cases' results (`evals.py merge`) and scores them against
# evals/<step>/baseline.json (`evals.py score`): worse by more than one case
# (by rate, passed / cases, so a set of another size compares fairly) fails the check "AI evaluation (<step>)", and the table says which cases.
# A case left not replayed (its job ran out of time or failed) fails the
# check by its name, as the runner's failure, never the step's score. The
# review is one of the steps, but its set is run by its own workflow,
# review-eval.yml (scripts/review-eval.py, 3 plays per case, #847), whose
# `paths:` are the review's; this one never runs it.
#
# Before any case is replayed, `evals.py validate` (#840) holds every case
# of the sets to the rule of docs/testing-and-quality.md: it passes on its
# merged fix, fails on an assertion at its base, and asserts none of the
# fix's own literals; a case that does not fails the job "The cases are
# valid" by its name, and nothing is replayed nor scored: the score job
# then fails with no score, no results and no baseline. The autopilot's replay is
# the production's loop: the work, then the review (local-review.sh) and
# its fix rounds, up to policy/autonomy.yml's `autopilot-rounds`.
#
# Paid: each case is one model run (the autopilot's, a whole work round
# and the review and fix rounds after it).
# It runs only by hand, for one step, on a branch of this repository (a
# fork's code never runs with the keys). The first job
# lists the steps with no secret; private repositories are never cases.
#
# The slack is none when the baseline is not above it (autopilot's 1 of 6
# fails at 0). A baseline that cannot be read, is not JSON or has the
# wrong shape fails the check, and so does a missing or pending one for a
# step in evals.py's BASELINED (spec, autopilot; and the review's, in
# review-eval.yml). Only a step never
# baselined with no baseline (missing, or pending) passes with a warning, and
# its summary and log carry the whole run's results between the lines
# `--- baseline <step> ---` and `--- end ---`: saved as FILE,
# `scripts/evals.py baseline <step> FILE` writes the baseline, in a commit
# a person reviews; nothing here pushes. A change that should move a score
# does the same from its run's results (the artifact evals-<step>).
#
# By hand with `mode: collect` (#840), for one step, it first writes a new
# set: `evals.py collect <step> 6`, with the job's read-only token, keeps
# the set's valid cases first and fills up to six from the history, each
# valid. That set is validated and replayed as above, and kept, never
# scored against the old baseline, as the artifact evals-<step>-collect:
# the new cases only (new-cases.json, those not already in the set),
# the whole cases.json, and the run's results (results.json) for
# `evals.py baseline <step> FILE`. Nothing here pushes them: a person
# commits them in a pull request.

on:
  workflow_dispatch:
    inputs:
      step:
        description: The step whose set runs
        required: true
        type: choice
        options:
          - triage
          - repro
          - spec
          - autopilot
          - reply
      mode:
        description: "eval: score the set as it is; collect: write a new set of six valid cases, replay it and keep it with its results"
        type: choice
        options: [eval, collect]
        default: eval

permissions:
  contents: read

concurrency:
  group: evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  steps:
    name: Which steps
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      steps: ${{ steps.list.outputs.steps }}
      cases: ${{ steps.list.outputs.cases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The steps the change touches
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          STEP: ${{ inputs.step }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          DEFAULT_POLICY: policy/review-policy.default.yml
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            # A step with no set yet runs nothing, and says so.
            : > "$RUNNER_TEMP/steps.txt"
            if [ -f "evals/$STEP/cases.json" ]; then printf '%s\n' "$STEP" > "$RUNNER_TEMP/steps.txt"; else echo "::notice::$STEP has no set yet (evals/$STEP/cases.json)."; fi
          else
            # No file listed is "could not tell" (this only runs when one
            # matched `paths:`): evals.py steps then fails, and pipefail
            # fails the check rather than skip every set.
            python3 scripts/pr-files.py | python3 scripts/evals.py steps > "$RUNNER_TEMP/steps.txt"
          fi
          steps=$(jq -Rnc '[inputs | select(length > 0)]' < "$RUNNER_TEMP/steps.txt")
          # One replay job per case, so each case gets its job's whole time.
          cases=$(python3 scripts/evals.py matrix < "$RUNNER_TEMP/steps.txt")
          echo "steps=$steps" >> "$GITHUB_OUTPUT"
          echo "cases=$cases" >> "$GITHUB_OUTPUT"
          echo "Steps to evaluate: $steps ($(jq length <<< "$cases") cases)" | tee -a "$GITHUB_STEP_SUMMARY"

  # A new set, by hand (#840): the set's valid cases first, then the
  # history's, six valid ones; fewer fails the job (the floor is six), after
  # keeping what it found.
  collect:
    name: A new set
    needs: steps
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'collect' && needs.steps.outputs.steps != '[]' && needs.steps.outputs.steps != '' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      cases: ${{ steps.collect.outputs.cases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Collect the cases
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          STEP: ${{ inputs.step }}
        run: |
          set -euo pipefail
          git config --global user.name evals
          git config --global user.email evals@localhost
          set_=evals/$STEP/cases.json
          cp "$set_" "$RUNNER_TEMP/old-cases.json"
          python3 scripts/evals.py collect "$STEP" 6
          # The new cases only: those whose id the set did not have.
          jq --slurpfile old "$RUNNER_TEMP/old-cases.json" '[.[] | select(.id as $i | $old[0] | map(.id) | index($i) | not)]' "$set_" > "evals/$STEP/new-cases.json"
          n=$(jq length "$set_")
          echo "$n cases in the new set, $(jq length "evals/$STEP/new-cases.json") of them new." | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$n" -lt 6 ]; then
            echo "::error::$STEP: only $n valid cases, fewer than the six a set holds: nothing is replayed."
            exit 1
          fi
          echo "cases=$(python3 scripts/evals.py matrix "$STEP")" >> "$GITHUB_OUTPUT"

      - name: Keep the new set
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evals-${{ inputs.step }}-set
          path: |
            evals/${{ inputs.step }}/cases.json
            evals/${{ inputs.step }}/new-cases.json
          retention-days: 30

  # The cases measure the task (#840), before any is paid for: each passes
  # on its merged fix, fails on an assertion at its base, and asserts none
  # of the fix's own literals (`evals.py validate`, no model and no secret).
  # A case that does not fails this job by its name, and no set is replayed.
  validate:
    name: The cases are valid
    needs:
      - steps
      - collect  # order: by hand with `mode: collect`, it validates the new set.
    if: always() && needs.steps.result == 'success' && (needs.collect.result == 'success' || needs.collect.result == 'skipped') && needs.steps.outputs.cases != '[]' && needs.steps.outputs.cases != '' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The new set
        if: needs.collect.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evals-${{ inputs.step }}-set
          path: evals/${{ inputs.step }}


      - name: Validate the sets
        env:
          STEPS: ${{ needs.steps.outputs.steps }}
        run: |
          set -euo pipefail
          git config --global user.name evals
          git config --global user.email evals@localhost
          mapfile -t steps < <(jq -r '.[]' <<< "$STEPS")
          python3 scripts/evals.py validate "${steps[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

  replay:
    name: Replay (${{ matrix.step }} ${{ matrix.case }})
    needs:
      - steps
      - collect  # order: by hand with `mode: collect`, its matrix is the new set's.
      - validate  # order: a set is replayed only once its cases are valid.
    if: always() && needs.validate.result == 'success' && needs.steps.outputs.cases != '[]' && needs.steps.outputs.cases != '' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # The step's limit for one case, and the job's own (evals.py matrix).
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.collect.outputs.cases || needs.steps.outputs.cases) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The new set
        if: needs.collect.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evals-${{ inputs.step }}-set
          path: evals/${{ inputs.step }}

      - name: The Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.302

      # The replay reads each case's pinned issue title and body from its
      # cases.json and never calls gh for the issue (b2a2e8c). The job's own
      # token stays read-only, and the model never gets it (evals.py drops
      # it from the CLI's environment).
      - name: Replay the case
        env:
          STEP: ${{ matrix.step }}
          CASE: ${{ matrix.case }}
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          DX_BOT_LOGIN: ${{ vars.DX_BOT_LOGIN }}
          DX_BOT_ID: ${{ vars.DX_BOT_ID }}
        run: |
          set -euo pipefail
          git config --global user.name "$DX_BOT_LOGIN"
          git config --global user.email "$DX_BOT_ID+$DX_BOT_LOGIN@users.noreply.github.com"
          python3 scripts/evals.py run "$STEP" "$CASE" > "$RUNNER_TEMP/results.json"

      # Named by the case's place in its set: a case's id is no artifact name.
      - name: Keep the case's result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evals-${{ matrix.step }}-case-${{ matrix.n }}
          path: ${{ runner.temp }}/results.json
          retention-days: 30

  eval:
    name: AI evaluation (${{ matrix.step }})
    needs:
      - steps
      - collect  # order: by hand with `mode: collect`, it merges the new set's results and keeps them.
      - replay  # order: it scores the evals-<step>-case-<n> artifacts the replay jobs upload.
      - validate  # order: a set that fails validate gets no score, no results and no baseline (#840).
    # It scores whatever its cases' jobs left: a job that ran out of time
    # leaves its case not replayed, which fails the check by its name. A set
    # that failed validate stops it first (skipped only when it has no case).
    if: ${{ !cancelled() && needs.steps.result == 'success' && needs.collect.result != 'failure' && needs.steps.outputs.steps != '[]' && needs.steps.outputs.steps != '' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        step: ${{ fromJSON(needs.steps.outputs.steps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Only a valid set is scored
        if: needs.validate.result != 'success' && needs.validate.result != 'skipped'
        env:
          RESULT: ${{ needs.validate.result }}
        run: |
          echo "**Not scored:** the set did not pass \`evals.py validate\` ($RESULT), so it gets no score, no results and no baseline (#840)." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: The new set
        if: needs.collect.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evals-${{ inputs.step }}-set
          path: evals/${{ inputs.step }}

      # None at all (every job of the step failed) is every case not
      # replayed, which the score says by name: it never stops here.
      - name: The cases' results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: evals-${{ matrix.step }}-case-*
          path: ${{ runner.temp }}/cases

      - name: The results, in the set's order
        env:
          STEP: ${{ matrix.step }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cases"
          find "$RUNNER_TEMP/cases" -name results.json -print0 | xargs -0 python3 scripts/evals.py merge "$STEP" > "$RUNNER_TEMP/results.json"

      - name: Score against the baseline
        if: needs.collect.result != 'success'
        env:
          STEP: ${{ matrix.step }}
        run: |
          set -uo pipefail
          python3 scripts/evals.py score "$STEP" "$RUNNER_TEMP/results.json" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      - name: Keep the results
        if: always() && needs.validate.result == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evals-${{ matrix.step }}
          path: ${{ runner.temp }}/results.json
          retention-days: 30

      # By hand with `mode: collect`: the new set and its run, for a pull
      # request to commit (`evals.py baseline <step> results.json`).
      - name: The run's results beside the new set
        if: needs.collect.result == 'success'
        env:
          STEP: ${{ matrix.step }}
        run: cp "$RUNNER_TEMP/results.json" "evals/$STEP/results.json"

      - name: Keep the new set and its results
        if: needs.collect.result == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evals-${{ matrix.step }}-collect
          path: |
            evals/${{ matrix.step }}/new-cases.json
            evals/${{ matrix.step }}/cases.json
            evals/${{ matrix.step }}/results.json
          retention-days: 30
