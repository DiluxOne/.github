name: Auto-merge

# Reusable. Turns GitHub's native auto-merge on for a pull request the review
# rated low risk and low complexity, and off for any other. GitHub then
# squash-merges it on its own once every required check is green and every
# review conversation is resolved: this workflow never merges directly.
#
# It also sets the commit body to the PR description verbatim (GitHub's own
# squash message hard-wraps it at 72 columns). The body is taken when
# auto-merge is enabled, so org-pull-request.yml runs this on `edited` too, or a later
# edit of the description would not reach main.
#
# All of these must hold, or a human merges:
#   - the policy says `auto-merge: true` (the review passes it on as `enabled`);
#   - the policy floor is low (only low-risk-eligible paths changed);
#   - the review rated it low risk, low complexity, not blocking;
#   - the review found the description to match the code (and nobody edited
#     the description after that review);
#   - the author is in the policy's trusted-authors list;
#   - (whatever the path) auto-merge is tied to the head commit the decision
#     was made on (--match-head-commit): a later push merges nothing until
#     it is decided again;
#   - no issue it closes carries a label of the autonomy policy's
#     `person-merges` (`security`, #194): that holds every path here but the
#     autopilot's, which checks it itself, and the revert's, which closes no
#     such issue.
#
# A pull request dilux-bot opened and labelled `autopilot` (#83) is decided
# by the autonomy policy instead, gate G7 (scripts/autopilot.py decide, from
# DiluxOne/.github at `central-ref`): it closes exactly one issue, which is
# not Critical and carries no label of the policy's `person-merges`
# (`security`, #194); no protected path changes (every file, renames by their old
# path too); it touches no security-sensitive code of its kind (surface.yml
# `sensitive`, scripts/surface.py --sensitive, #287; not knowing counts as
# touching); the review does not block and its description is true, and it
# found every acceptance criterion met at this head (G6, its record); risk and
# complexity are within the caps of the lane it was worked under
# (`scripts/autopilot.py lane`: a lane's own issue, that lane; one a person
# accepted, `human-issue`); the Spec is the one sealed at G3; every
# criterion's test is a test file the pull request adds or changes; and, for
# a reproduced bug (`bugfix-reproduced`), the reproduction test is in the
# pull request with the SHA-256 the PRD sealed, the test that failed.
# It is labelled `merged-by:policy`. Auto-merge is switched off before that
# decision, so a failure leaves nothing set to merge.
#
# A revert dilux-bot opened when a merge turned the default branch red
# (gate G8, revert-on-red.yml: label `revert`, a `revert/` branch) is decided
# by scripts/revert.py decide: only within the `platform` lane of
# policy/autonomy.yml (its repositories and caps, no protected path, the
# review not blocking, its description true), labelled `merged-by:policy`;
# otherwise its issue says why it waits and the action with its URL, in one
# comment kept up to date.
#
# A pull request that closes one issue of a sync lane (org-sync, #155: the
# Task issue scripts/sync-repos.py opens) is decided by the autonomy policy
# as well (scripts/autonomy.py lane-merge): the lane accepts the issue and
# the pull request (opened by the run's account, from its branch, only the
# files it wrote); every file is what the commit of DiluxOne/.github the
# issue names holds (CODEOWNERS as repos.yml, AGENTS.md's dx:org block, each
# caller job a template's job but the repository's own inputs); no job
# changes its permissions or the secrets it passes (high risk: a person);
# the review does not block, its description is true, and risk and
# complexity are within the lane's caps. It is labelled `merged-by:policy`.
# Never in DiluxOne/.github, and nothing while DX_AUTOPILOT is off.
#
# A release pull request (#247: it closes one issue `Release X.Y.Z` with
# `lane:release`) merges once proved: the release issue is accepted, by a
# maintainer or by a maintainer's plan (scripts/release-issue.py verify);
# the pull request is dilux-bot's single commit on its base, whose tree is
# exactly what the kind's command makes of that base for the version
# (scripts/release-issue.py argv, run again here on a clone); the review does
# not block and its description is true. It is labelled `merged-by:policy`.
# Anything short of that, a person merges it.
#
# The dilux-bot App enables it, so the resulting push to main triggers the
# post-merge workflows (a GITHUB_TOKEN merge would not).
#
#   Called by org-pull-request.yml, the organisation's required pipeline,
#   for every repository, and by this repository's own pull-request.yml;
#   read either for the call and its permissions.

on:
  workflow_call:
    inputs:
      central-ref:
        description: The ref of DiluxOne/.github whose scripts and policy run. Empty (the default) means the very commit this workflow runs from, job.workflow_sha, so a caller that pins a SHA or a tag runs that commit's scripts too (#287).
        type: string
        default: ''
      risk:
        type: string
        default: ''
      complexity:
        type: string
        default: ''
      floor:
        type: string
        default: ''
      trusted:
        type: string
        default: 'false'
      blocking:
        type: string
        default: 'true'
      enabled:
        description: The policy's auto-merge setting, from the review's outputs.
        type: string
        default: 'false'
      description-ok:
        description: Whether the review found the description to match the code, from the review's outputs. A pull request whose text misdescribes its diff is never merged on its own; a caller that does not pass this never auto-merges either.
        type: string
        default: ''
    secrets:
      DILUX_BOT_PRIVATE_KEY:
        required: true

permissions:
  contents: read

# The organisation's App, as GitHub shows it (#197): the calling
# organisation's variables DX_BOT_LOGIN, DX_BOT_APP and DX_BOT_ID, or
# DiluxOne's dilux-bot when it sets none.
env:
  DX_BOT_LOGIN: ${{ vars.DX_BOT_LOGIN || 'dilux-bot[bot]' }}
  DX_BOT_APP: ${{ vars.DX_BOT_APP || 'dilux-bot' }}
  DX_BOT_ID: ${{ vars.DX_BOT_ID || '333187390' }}

jobs:
  decide:
    name: Auto-merge decision
    runs-on: ${{ vars.DX_RUNNER_HEAVY != '' && !((github.event.pull_request.user.login == (vars.DX_BOT_LOGIN || 'dilux-bot[bot]') && (startsWith(github.event.pull_request.head.ref, 'test/repro-issue-') || (contains(github.event.pull_request.head.ref, '/') && contains(github.event.pull_request.head.ref, '-the-bug-reproduced-from-')))) || (github.event.issue.user.login == (vars.DX_BOT_LOGIN || 'dilux-bot[bot]') && (github.event.issue.pull_request || startsWith(github.event.issue.title, 'The bug reproduced from ')))) && fromJSON(vars.DX_RUNNER_HEAVY) || 'ubuntu-latest' }}
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: dilux-bot token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read # the issue an autopilot pull request closes
          permission-actions: read # the run that opened a lane's issue

      # A pull request the autopilot opened is decided by the autonomy
      # policy instead (gate G7, scripts/autopilot.py decide): never a
      # Critical issue, one labelled security, or a protected path, never new public surface for an
      # issue that is not a Feature (#193), never while the review blocks,
      # never before the review found every acceptance criterion met (G6),
      # within the lane's caps, with a test for every criterion at the head.
      - name: An autopilot pull request
        id: autopilot
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          CENTRAL_REF: ${{ inputs.central-ref || job.workflow_sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          DX_AUTOPILOT: ${{ vars.DX_AUTOPILOT }}
          RISK: ${{ inputs.risk }}
          COMPLEXITY: ${{ inputs.complexity }}
          BLOCKING: ${{ inputs.blocking }}
          DESCRIPTION_OK: ${{ inputs.description-ok }}
        run: |
          set -euo pipefail
          # Only a pull request dilux-bot opened and labelled autopilot;
          # anyone else's goes through the usual decision below.
          case ",$LABELS," in *,autopilot,*) ;; *) echo "handled=false" >> "$GITHUB_OUTPUT"; exit 0 ;; esac
          [ "$AUTHOR" = "$DX_BOT_LOGIN" ] || { echo "handled=false" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "handled=true" >> "$GITHUB_OUTPUT"
          # Off first: if anything below fails, nothing stays set to merge.
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto >/dev/null 2>&1 || true
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label merged-by:policy >/dev/null 2>&1 || true
          { git init -q "$RUNNER_TEMP/central" && git -C "$RUNNER_TEMP/central" fetch -q --depth 1 https://github.com/DiluxOne/.github "$CENTRAL_REF" && git -C "$RUNNER_TEMP/central" checkout -q FETCH_HEAD; }
          issues=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json closingIssuesReferences --jq '[.closingIssuesReferences[].number] | join(" ")')
          if [ "$(wc -w <<<"$issues")" -ne 1 ]; then echo "A human merges this one: it closes ${issues:-no issue}, not exactly one."; exit 0; fi
          issue=$issues
          gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/body.md"
          # Every file, paginated (gh pr view stops at 100), with a renamed
          # file's old path too, so a protected path cannot leave by a rename.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/files"
          gh api "repos/$GITHUB_REPOSITORY/git/trees/$HEAD?recursive=1" --jq '.tree[] | select(.type == "blob") | .path' > "$RUNNER_TEMP/head"
          export NUMBER="$issue"
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/autonomy.yml?ref=$BASE" --jq .content 2>/dev/null | base64 -d > "$RUNNER_TEMP/repo-autonomy.yml" || : > "$RUNNER_TEMP/repo-autonomy.yml"
          if [ "$(wc -l < "$RUNNER_TEMP/files")" -ge 3000 ]; then echo "A human merges this one: the file list may be cut at the API's 3000."; exit 0; fi
          export BODY="$RUNNER_TEMP/body.md" FILES="$RUNNER_TEMP/files" HEAD_FILES="$RUNNER_TEMP/head" REPO_AUTONOMY="$RUNNER_TEMP/repo-autonomy.yml"
          # The Spec decided on must be the one the autopilot sealed at G3.
          if ! spec=$(NUMBER="$issue" python3 "$RUNNER_TEMP/central/scripts/receipts.py" verify-spec); then
            echo "A human merges this one: the Spec is not the one sealed at G3 ($spec)."; exit 0
          fi
          # The lane it was worked under, read from GitHub's history: its
          # caps apply. A reproduced bug's test must be, at the head, the
          # one that failed: its SHA-256 against the sealed PRD's.
          if ! LANE=$(python3 "$RUNNER_TEMP/central/scripts/autopilot.py" lane); then
            echo "A human merges this one: $LANE."; exit 0
          fi
          export LANE REPRO_SHA256=""
          if [ "$LANE" = bugfix-reproduced ] && repro_test=$(python3 "$RUNNER_TEMP/central/scripts/repro-lane.py" evidence | jq -r .test); then
            REPRO_SHA256=$(gh api "repos/$GITHUB_REPOSITORY/contents/$repro_test?ref=$HEAD" --jq .content 2>/dev/null | base64 -d | sha256sum | cut -c1-64) || REPRO_SHA256=""
          fi
          # Escalation (#193): what the change adds to its kind's public
          # surface (scripts/surface.py, read from git objects only), and the
          # issue's Type; only a Feature carries new surface in on its own.
          # Anything that cannot be told counts as surface.
          ISSUE_TYPE=$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue" --jq '.type.name // ""' 2>/dev/null || true)
          # The kind from repos.yml: an unclassified repository, or a kind
          # whose pack names no surface, has none to add; one repos.yml does
          # not list, or with several kinds, cannot be told.
          kinds=$(yq -r ".repos[\"${GITHUB_REPOSITORY#*/}\"] | select(. != null) | (.kinds // []) | map(.kind) | join(\" \")" "$RUNNER_TEMP/central/repos.yml" 2>/dev/null || echo "?")
          listed=$(yq -r ".repos | has(\"${GITHUB_REPOSITORY#*/}\")" "$RUNNER_TEMP/central/repos.yml" 2>/dev/null || echo false)
          kind=$kinds
          : > "$RUNNER_TEMP/surface"
          if [ "$listed" != true ] || [ "$(wc -w <<<"$kinds")" -gt 1 ] || [ "$kinds" = "?" ]; then
            echo unknown > "$RUNNER_TEMP/surface"
          elif [ -n "$kind" ] && [ -f "$RUNNER_TEMP/central/kinds/$kind/surface.yml" ]; then
            if git clone -q --filter=blob:none --no-checkout "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" "$RUNNER_TEMP/repo" \
               && git -C "$RUNNER_TEMP/repo" fetch -q origin "$BASE" "$HEAD"; then
              rc=0; (cd "$RUNNER_TEMP/repo" && python3 "$RUNNER_TEMP/central/scripts/surface.py" --check "$kind" "$BASE" "$HEAD") > "$RUNNER_TEMP/surface" || rc=$?
              case $rc in
                0) : > "$RUNNER_TEMP/surface" ;;           # adds nothing
                1) [ -s "$RUNNER_TEMP/surface" ] || echo unknown > "$RUNNER_TEMP/surface" ;; # its lines say what it adds; none: it crashed
                *) echo unknown > "$RUNNER_TEMP/surface" ;; # could not tell
              esac
            else
              echo unknown > "$RUNNER_TEMP/surface"
            fi
          fi
          # Security-sensitive code (#287): what a line the change adds or
          # removes touches of its kind's sensitive list (scripts/surface.py
          # --sensitive). A person merges it; not knowing counts as touching.
          echo unknown > "$RUNNER_TEMP/sensitive"
          if [ "$listed" = true ] && [ "$(wc -w <<<"$kinds")" -le 1 ] && [ "$kinds" != "?" ]; then
            if [ -z "$kind" ] || [ ! -f "$RUNNER_TEMP/central/kinds/$kind/surface.yml" ]; then
              : > "$RUNNER_TEMP/sensitive"
            elif [ -d "$RUNNER_TEMP/repo/.git" ] || git clone -q --filter=blob:none --no-checkout "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" "$RUNNER_TEMP/repo"; then
              if git -C "$RUNNER_TEMP/repo" fetch -q origin "$BASE" "$HEAD"; then
                rc=0; (cd "$RUNNER_TEMP/repo" && python3 "$RUNNER_TEMP/central/scripts/surface.py" --sensitive "$kind" "$BASE" "$HEAD") > "$RUNNER_TEMP/sensitive" || rc=$?
                case $rc in
                  0) : > "$RUNNER_TEMP/sensitive" ;;
                  1) [ -s "$RUNNER_TEMP/sensitive" ] || echo unknown > "$RUNNER_TEMP/sensitive" ;;
                  *) echo unknown > "$RUNNER_TEMP/sensitive" ;;
                esac
              fi
            fi
          fi
          export SURFACE="$RUNNER_TEMP/surface" SENSITIVE="$RUNNER_TEMP/sensitive" ISSUE_TYPE
          # The issue's labels: one the policy lists in person-merges
          # (security, #194) leaves the merge to a person.
          gh api "repos/$GITHUB_REPOSITORY/issues/$issue" --jq '.labels[].name' > "$RUNNER_TEMP/issue-labels"
          export ISSUE_LABELS="$RUNNER_TEMP/issue-labels"
          # G6 (#193): the review's verdict on each acceptance criterion, from
          # its record on the pull request, only when it judged this head.
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            | jq -r '.[] | select(.user.login == env.DX_BOT_LOGIN and (.body | startswith("<!-- dx-review -->"))) | .body' \
            | grep -oP '<!-- dx-review-record \K.*(?= -->)' | tail -1 \
            | jq -c --arg head "$HEAD" 'select(.sha == $head)' > "$RUNNER_TEMP/review-record.json" 2>/dev/null || : > "$RUNNER_TEMP/review-record.json"
          export CRITERIA_VERDICT="$RUNNER_TEMP/review-record.json"
          if why=$(python3 "$RUNNER_TEMP/central/scripts/autopilot.py" decide); then
            body=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body | tr -d '\r')
            # Tied to the head decided on: a later push merges nothing until it is decided again.
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$HEAD" --body "$body"
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label merged-by:policy >/dev/null
            echo "Auto-merge enabled by policy: $why."
          else
            echo "A human merges this one: $why."
          fi

      # A revert's issue gets a comment when the revert waits for a person:
      # a token of its own, since that needs issues: write.
      - name: dilux-bot token (a revert's issue)
        id: revert-bot
        if: contains(github.event.pull_request.labels.*.name, 'revert') && github.event.pull_request.user.login == (vars.DX_BOT_LOGIN || 'dilux-bot[bot]') && startsWith(github.event.pull_request.head.ref, 'revert/') && steps.autopilot.outputs.handled != 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write

      # A revert of a merge that turned the default branch red (gate G8,
      # scripts/revert.py decide): within the `platform` lane only.
      - name: A revert pull request (G8)
        id: revert
        if: steps.revert-bot.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          ISSUE_TOKEN: ${{ steps.revert-bot.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          CENTRAL_REF: ${{ inputs.central-ref || job.workflow_sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          DX_AUTOPILOT: ${{ vars.DX_AUTOPILOT }}
          RISK: ${{ inputs.risk }}
          COMPLEXITY: ${{ inputs.complexity }}
          BLOCKING: ${{ inputs.blocking }}
          DESCRIPTION_OK: ${{ inputs.description-ok }}
        run: |
          set -euo pipefail
          echo "handled=true" >> "$GITHUB_OUTPUT"
          # Off first: if anything below fails, nothing stays set to merge.
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto >/dev/null 2>&1 || true
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label merged-by:policy >/dev/null 2>&1 || true
          { git init -q "$RUNNER_TEMP/central" && git -C "$RUNNER_TEMP/central" fetch -q --depth 1 https://github.com/DiluxOne/.github "$CENTRAL_REF" && git -C "$RUNNER_TEMP/central" checkout -q FETCH_HEAD; }
          # Every file, renames by their old path too, so a protected path
          # cannot leave by a rename.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/files"
          # The repository's own autonomy policy: none only when the file is
          # not there; a read that fails otherwise leaves the merge to a person.
          read_ok=true
          if content=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/autonomy.yml?ref=$BASE" --jq .content 2>"$RUNNER_TEMP/autonomy.err"); then
            printf '%s' "$content" | base64 -d > "$RUNNER_TEMP/repo-autonomy.yml"
          elif grep -qE '404|Not Found' "$RUNNER_TEMP/autonomy.err"; then
            : > "$RUNNER_TEMP/repo-autonomy.yml"
          else
            read_ok=false
          fi
          export FILES="$RUNNER_TEMP/files" REPO_AUTONOMY="$RUNNER_TEMP/repo-autonomy.yml"
          ok=false
          if [ "$read_ok" = false ]; then
            why="the repository's .github/autonomy.yml could not be read"
          elif [ "$(wc -l < "$FILES")" -ge 3000 ]; then
            why="the file list may be cut at the API's 3000"
          elif why=$(python3 "$RUNNER_TEMP/central/scripts/revert.py" decide); then
            ok=true
          fi
          why=${why:-the G8 decision could not be made}
          if [ "$ok" = true ]; then
            body=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body | tr -d '\r')
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$HEAD_SHA" --body "$body"
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label merged-by:policy >/dev/null
            echo "Auto-merge enabled by policy: $why."
          else
            echo "A human merges this one: $why."
          fi
          # The issue's one comment: the action and its URL while the revert
          # waits for a person; once it no longer does, it says so.
          issue=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json closingIssuesReferences --jq '.closingIssuesReferences[0].number // empty')
          [ -n "$issue" ] || exit 0
          id=$(GH_TOKEN="$ISSUE_TOKEN" gh api "repos/$GITHUB_REPOSITORY/issues/$issue/comments" --paginate --jq '.[] | select(.user.login == env.DX_BOT_LOGIN and (.body | startswith("<!-- dx-revert-wait -->"))) | .id' | tail -n1)
          [ "$ok" = false ] || [ -n "$id" ] || exit 0
          comment=$(WHY="$why" MERGING="$ok" python3 "$RUNNER_TEMP/central/scripts/revert.py" wait-comment)
          if [ -n "$id" ]; then
            GH_TOKEN="$ISSUE_TOKEN" gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$comment" >/dev/null
          else
            GH_TOKEN="$ISSUE_TOKEN" gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$comment" >/dev/null
          fi

      # An issue labelled with one of the policy's `person-merges` (security,
      # #194) is merged by a person, whoever opened the pull request that
      # closes it: neither the sync lane nor the usual decision below sets
      # auto-merge for it. A label that cannot be read holds it too.
      - name: Labels a person merges
        id: held
        if: steps.autopilot.outputs.handled != 'true' && steps.revert.outputs.handled != 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          CENTRAL_REF: ${{ inputs.central-ref || job.workflow_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          held=""
          # Each closed issue in its own repository, by its URL.
          if ! labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json closingIssuesReferences --jq '.closingIssuesReferences[].url' \
               | while read -r url; do gh api "repos/${url#https://github.com/}" --jq '.labels[].name' || exit 1; done); then
            held="(the closed issues' labels could not be read)"
          elif ! { git init -q "$RUNNER_TEMP/central-held" && git -C "$RUNNER_TEMP/central-held" fetch -q --depth 1 https://github.com/DiluxOne/.github "$CENTRAL_REF" && git -C "$RUNNER_TEMP/central-held" checkout -q FETCH_HEAD; }; then
            held="(the policy could not be read)"
          # The repository's own policy: none only when the file is not there.
          elif { content=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/autonomy.yml?ref=$BASE_SHA" --jq .content 2>"$RUNNER_TEMP/held.err") \
                 && printf '%s' "$content" | base64 -d > "$RUNNER_TEMP/held-autonomy.yml"; } \
               || { grep -qE '404|Not Found' "$RUNNER_TEMP/held.err" && : > "$RUNNER_TEMP/held-autonomy.yml"; }; then
            if ! listed=$(REPO_AUTONOMY="$RUNNER_TEMP/held-autonomy.yml" python3 "$RUNNER_TEMP/central-held/scripts/autonomy.py" policy 2>/dev/null | jq -er '."person-merges" | .[]'); then
              held="(the policy in force could not be read)"
            else
              held=$(grep -Fxf <(printf '%s\n' "$listed") <<<"$labels" | head -n1 || true)
            fi
          else
            held="(the repository's .github/autonomy.yml could not be read)"
          fi
          echo "label=$held" >> "$GITHUB_OUTPUT"
          if [ -n "$held" ]; then
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto >/dev/null 2>&1 || true
            echo "A human merges this one: it closes an issue labelled $held."
          fi

      # A release pull request (#247): the decision to publish was taken when
      # the release issue was accepted, by a maintainer or by the plan a
      # maintainer approved as its milestone (scripts/release-issue.py
      # verify, read from GitHub). What is left is mechanical, and proved
      # here: one commit by dilux-bot on the base, whose tree is exactly what
      # the kind's command makes of that base for the version (the
      # organisation's scripts, run again on a clone; no code of the
      # repository runs). With the review not blocking and its description
      # true, it merges once the checks are green. Anything else: a person.
      - name: A release pull request
        id: release
        if: steps.autopilot.outputs.handled != 'true' && steps.revert.outputs.handled != 'true' && steps.held.outputs.label == ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CENTRAL_REF: ${{ inputs.central-ref || job.workflow_sha }}
          DX_AUTOPILOT: ${{ vars.DX_AUTOPILOT }}
          BLOCKING: ${{ inputs.blocking }}
          DESCRIPTION_OK: ${{ inputs.description-ok }}
        run: |
          set -euo pipefail
          issues=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json closingIssuesReferences --jq '[.closingIssuesReferences[].number] | join(" ")')
          [ "$(wc -w <<<"$issues")" -eq 1 ] || { echo "handled=false" >> "$GITHUB_OUTPUT"; exit 0; }
          # A read that fails holds the run: never decided as something else.
          title=$(gh issue view "$issues" --repo "$GITHUB_REPOSITORY" --json title,labels --jq 'select([.labels[].name] | index("lane:release")) | .title') \
            || { echo "::error::#$issues could not be read; a human merges this one."; gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto >/dev/null 2>&1 || true; exit 1; }
          [[ "$title" =~ ^Release\ ([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "handled=false" >> "$GITHUB_OUTPUT"; exit 0; }
          version=${BASH_REMATCH[1]}
          # From here it is a release pull request: it merges by this proof
          # or a person merges it.
          echo "handled=true" >> "$GITHUB_OUTPUT"
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto >/dev/null 2>&1 || true
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label merged-by:policy >/dev/null 2>&1 || true
          person() { echo "A human merges this one: $1."; exit 0; }
          [ "$(tr '[:upper:]' '[:lower:]' <<<"${DX_AUTOPILOT:-}")" != off ] || person "DX_AUTOPILOT is off"
          [ "$PR_AUTHOR" = "$DX_BOT_LOGIN" ] || person "the release pull request was not opened by dilux-bot"
          [ "$BLOCKING" = false ] || person "the review is blocking"
          [ "$DESCRIPTION_OK" = true ] || person "the description does not match the code, or changed after the review"
          commits=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --paginate --jq '.[] | [.sha, .author.login // "", (.parents | length | tostring), .parents[0].sha] | @tsv')
          [ "$(wc -l <<<"$commits")" -eq 1 ] || person "it has more than one commit"
          IFS=$'\t' read -r sha author nparents base <<<"$commits"
          if [ "$sha" != "$HEAD_SHA" ] || [ "$author" != "$DX_BOT_LOGIN" ] || [ "$nparents" != 1 ]; then person "its commit is not dilux-bot's single commit at the head"; fi
          { git init -q "$RUNNER_TEMP/central" && git -C "$RUNNER_TEMP/central" fetch -q --depth 1 https://github.com/DiluxOne/.github "$CENTRAL_REF" && git -C "$RUNNER_TEMP/central" checkout -q FETCH_HEAD; }
          # The decision: the release issue accepted by a person with the
          # admin or maintain role, or by a maintainer's plan.
          VERSION="$version" LABEL=accepted python3 "$RUNNER_TEMP/central/scripts/release-issue.py" verify > "$RUNNER_TEMP/verify.json" || true
          [ "$(jq -r .ok "$RUNNER_TEMP/verify.json" 2>/dev/null)" = true ] || person "the release issue is not accepted ($(jq -r .why "$RUNNER_TEMP/verify.json" 2>/dev/null || echo unreadable))"
          # The acceptance is the one of the issue this pull request closes.
          [ "$(jq -r .issue "$RUNNER_TEMP/verify.json")" = "$issues" ] || person "the accepted release issue is #$(jq -r .issue "$RUNNER_TEMP/verify.json"), not #$issues, the one it closes"
          # The proof: the kind's command, run again on the base, makes the
          # same tree (file modes kept from the base).
          git init -q "$RUNNER_TEMP/repo"
          cd "$RUNNER_TEMP/repo"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=$auth" fetch -q --depth 1 "https://github.com/$GITHUB_REPOSITORY" "$base"
          git checkout -q --detach FETCH_HEAD
          argv=$(ROOT=. VERSION="$version" CENTRAL="$RUNNER_TEMP/central" python3 "$RUNNER_TEMP/central/scripts/release-issue.py" argv | jq -r '.[]') || person "the kind's release command could not be read"
          mapfile -t cmd <<<"$argv"
          "${cmd[@]}" >/dev/null || person "the kind's release command failed on the base"
          git -c core.fileMode=false add -A
          made=$(git write-tree)
          want=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$HEAD_SHA" --jq .tree.sha)
          [ "$made" = "$want" ] || person "its tree is not what the release command makes of the base ($made, not $want)"
          body=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body | tr -d '\r')
          # Tied to the head proved: a later push merges nothing until it is proved again.
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$HEAD_SHA" --body "$body"
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label merged-by:policy >/dev/null
          echo "Auto-merge enabled: release $version, $(jq -r .why "$RUNNER_TEMP/verify.json"), and its tree is the release command's."

      # A sync run's pull request (lane org-sync, #155: scripts/sync-repos.py
      # opened it and its issue) is decided by the autonomy policy too
      # (scripts/autonomy.py lane-merge): the lane accepts its issue, it
      # changes only what the run wrote, every file is what the commit of
      # DiluxOne/.github its issue names holds, no job changes its
      # permissions or secrets, the review does not block and its
      # description is true, within the lane's caps. Any other pull request
      # goes on to the usual decision.
      - name: A sync run's pull request
        id: lane
        if: steps.autopilot.outputs.handled != 'true' && steps.revert.outputs.handled != 'true' && steps.release.outputs.handled != 'true' && steps.held.outputs.label == ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CENTRAL_REF: ${{ inputs.central-ref || job.workflow_sha }}
          DX_AUTOPILOT: ${{ vars.DX_AUTOPILOT }}
          RISK: ${{ inputs.risk }}
          COMPLEXITY: ${{ inputs.complexity }}
          BLOCKING: ${{ inputs.blocking }}
          DESCRIPTION_OK: ${{ inputs.description-ok }}
        run: |
          set -euo pipefail
          issues=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json closingIssuesReferences --jq '[.closingIssuesReferences[].number] | join(" ")')
          if [ "$(wc -w <<<"$issues")" -ne 1 ]; then echo "handled=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Only an issue with a lane's label is worth asking the policy about.
          lanes=$(gh issue view "$issues" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name | select(startswith("lane:"))] | length' 2>/dev/null || echo 0)
          if [ "$lanes" = 0 ]; then echo "handled=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          { git init -q "$RUNNER_TEMP/central" && git -C "$RUNNER_TEMP/central" fetch -q --depth 1 https://github.com/DiluxOne/.github "$CENTRAL_REF" && git -C "$RUNNER_TEMP/central" checkout -q FETCH_HEAD; }
          # The repository's own autonomy policy: none only when the file is
          # not there; a read that fails otherwise leaves the merge to a person.
          rc=0
          if content=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/autonomy.yml?ref=$BASE_SHA" --jq .content 2>"$RUNNER_TEMP/autonomy.err"); then
            printf '%s' "$content" | base64 -d > "$RUNNER_TEMP/repo-autonomy.yml"
          elif grep -qE '404|Not Found' "$RUNNER_TEMP/autonomy.err"; then
            : > "$RUNNER_TEMP/repo-autonomy.yml"
          else
            rc=1; why="the repository's .github/autonomy.yml could not be read"
          fi
          if [ "$rc" = 0 ]; then
            why=$(NUMBER=$issues REPO_AUTONOMY="$RUNNER_TEMP/repo-autonomy.yml" python3 "$RUNNER_TEMP/central/scripts/autonomy.py" lane-merge) || rc=$?
          fi
          if [ "$rc" = 2 ]; then echo "handled=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "handled=true" >> "$GITHUB_OUTPUT"
          # Off first: whatever the verdict, nothing stays set to merge from before.
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto >/dev/null 2>&1 || true
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label merged-by:policy >/dev/null 2>&1 || true
          if [ "$rc" = 0 ]; then
            body=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body | tr -d '\r')
            # Tied to the head decided on: a later push merges nothing until it is decided again.
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$HEAD_SHA" --body "$body"
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label merged-by:policy >/dev/null
            echo "Auto-merge enabled by policy: $why."
          elif [ "$rc" = 1 ]; then
            echo "A human merges this one: $why."
          else
            echo "::error::The lane's decision failed (exit $rc); a human merges this one."; exit 1
          fi

      - name: Enable or disable
        if: steps.autopilot.outputs.handled != 'true' && steps.revert.outputs.handled != 'true' && steps.release.outputs.handled != 'true' && steps.lane.outputs.handled != 'true' && steps.held.outputs.label == ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SWITCH: ${{ inputs.enabled }}
          RISK: ${{ inputs.risk }}
          COMPLEXITY: ${{ inputs.complexity }}
          FLOOR: ${{ inputs.floor }}
          TRUSTED: ${{ inputs.trusted }}
          BLOCKING: ${{ inputs.blocking }}
          DESCRIPTION_OK: ${{ inputs.description-ok }}
        run: |
          set -euo pipefail
          why=""
          [ "$SWITCH" = true ] || why="the policy has auto-merge off"
          [ -n "$why" ] || [ "$FLOOR" = low ] || why="policy floor is ${FLOOR:-unknown}"
          [ -n "$why" ] || [ "$RISK" = low ] || why="risk is ${RISK:-unknown}"
          [ -n "$why" ] || [ "$COMPLEXITY" = low ] || why="complexity is ${COMPLEXITY:-unknown}"
          [ -n "$why" ] || [ "$BLOCKING" = false ] || why="the review is blocking"
          [ -n "$why" ] || [ "$TRUSTED" = true ] || why="the author is not in trusted-authors"
          [ -n "$why" ] || [ -n "$DESCRIPTION_OK" ] || why="the caller does not pass the review's description verdict (description-ok)"
          [ -n "$why" ] || [ "$DESCRIPTION_OK" = true ] || why="the description does not match the code, or changed after the review"
          if [ -z "$why" ]; then
            # The description goes in verbatim: GitHub's own squash message
            # hard-wraps it at 72 columns. Disabling first refreshes it after
            # an edit (every edit re-runs this job).
            # Descriptions edited in the web UI come back with CRLF endings.
            body=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body | tr -d '\r')
            # Keep the branch commits' co-authors, as GitHub's own message does.
            # Same as scripts/squash-merge.sh, which maintainers use by hand.
            messages=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --paginate --jq '.[].commit.message')
            coauthors=$(printf '%s\n' "$messages" | tr -d '\r' | grep -iE '^co-authored-by:' | awk '!seen[tolower($0)]++' || true)
            if [ -n "$coauthors" ]; then
              if [ -n "$body" ]; then body+=$'\n\n'; fi
              body+=$'---------\n\n'"$coauthors"
            fi
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto >/dev/null 2>&1 || true
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$HEAD_SHA" --body "$body"
            echo "Auto-merge enabled: GitHub merges once every required check is green."
          else
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto >/dev/null 2>&1 || true
            echo "A human merges this one: $why."
          fi
