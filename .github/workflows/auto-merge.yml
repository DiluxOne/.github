name: Auto-merge

# Reusable. Turns GitHub's native auto-merge on for a pull request the review
# rated low risk and low complexity, and off for any other. GitHub then
# squash-merges it on its own once every required check is green and every
# review conversation is resolved: this workflow never merges directly.
#
# It also sets the commit body to the PR description verbatim (GitHub's own
# squash message hard-wraps it at 72 columns). The body is taken when
# auto-merge is enabled, so org-pull-request.yml runs this on `edited` too, or a later
# edit of the description would not reach main.
#
# All of these must hold, or a human merges:
#   - the policy says `auto-merge: true` (the review passes it on as `enabled`);
#   - the policy floor is low (only low-risk-eligible paths changed);
#   - the review rated it low risk, low complexity, not blocking;
#   - the review found the description to match the code (and nobody edited
#     the description after that review);
#   - the author is in the policy's trusted-authors list.
#
# A pull request dilux-bot opened and labelled `autopilot` (#83) is decided
# by the autonomy policy instead, gate G7 (scripts/autopilot.py decide, from
# DiluxOne/.github at `central-ref`): it closes exactly one issue, which is
# not Critical; no protected path changes (every file, renames by their old
# path too); the review does not block and its description is true; risk and
# complexity are within the `human-issue` lane; the Spec is the one sealed at
# G3; every criterion's test is a test file the pull request adds or changes.
# It is labelled `merged-by:policy`. Auto-merge is switched off before that
# decision, so a failure leaves nothing set to merge.
#
# The dilux-bot App enables it, so the resulting push to main triggers the
# post-merge workflows (a GITHUB_TOKEN merge would not).
#
#   Called by org-pull-request.yml, the organisation's required pipeline,
#   for every repository, and by this repository's own pull-request.yml;
#   read either for the call and its permissions.

on:
  workflow_call:
    inputs:
      central-ref:
        description: Ref of DiluxOne/.github whose scripts decide an autopilot pull request.
        type: string
        default: v5
      risk:
        type: string
        default: ''
      complexity:
        type: string
        default: ''
      floor:
        type: string
        default: ''
      trusted:
        type: string
        default: 'false'
      blocking:
        type: string
        default: 'true'
      enabled:
        description: The policy's auto-merge setting, from the review's outputs.
        type: string
        default: 'false'
      description-ok:
        description: Whether the review found the description to match the code, from the review's outputs. A pull request whose text misdescribes its diff is never merged on its own; a caller that does not pass this never auto-merges either.
        type: string
        default: ''
    secrets:
      DILUX_BOT_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  decide:
    name: Auto-merge decision
    runs-on: ${{ vars.DX_RUNNER == 'self-hosted' && fromJSON('["self-hosted","linux","x64","diluxone"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: dilux-bot token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read # the issue an autopilot pull request closes

      # A pull request the autopilot opened is decided by the autonomy
      # policy instead (gate G7, scripts/autopilot.py decide): never a
      # Critical issue or a protected path, never while the review blocks,
      # within the lane's caps, with a test for every criterion at the head.
      - name: An autopilot pull request
        id: autopilot
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          CENTRAL_REF: ${{ inputs.central-ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          DX_AUTOPILOT: ${{ vars.DX_AUTOPILOT }}
          RISK: ${{ inputs.risk }}
          COMPLEXITY: ${{ inputs.complexity }}
          BLOCKING: ${{ inputs.blocking }}
          DESCRIPTION_OK: ${{ inputs.description-ok }}
        run: |
          set -euo pipefail
          # Only a pull request dilux-bot opened and labelled autopilot;
          # anyone else's goes through the usual decision below.
          case ",$LABELS," in *,autopilot,*) ;; *) echo "handled=false" >> "$GITHUB_OUTPUT"; exit 0 ;; esac
          [ "$AUTHOR" = "dilux-bot[bot]" ] || { echo "handled=false" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "handled=true" >> "$GITHUB_OUTPUT"
          # Off first: if anything below fails, nothing stays set to merge.
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto >/dev/null 2>&1 || true
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label merged-by:policy >/dev/null 2>&1 || true
          git clone -q --depth 1 --branch "$CENTRAL_REF" https://github.com/DiluxOne/.github "$RUNNER_TEMP/central"
          issues=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json closingIssuesReferences --jq '[.closingIssuesReferences[].number] | join(" ")')
          if [ "$(wc -w <<<"$issues")" -ne 1 ]; then echo "A human merges this one: it closes ${issues:-no issue}, not exactly one."; exit 0; fi
          issue=$issues
          gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/body.md"
          # Every file, paginated (gh pr view stops at 100), with a renamed
          # file's old path too, so a protected path cannot leave by a rename.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/files"
          gh api "repos/$GITHUB_REPOSITORY/git/trees/$HEAD?recursive=1" --jq '.tree[] | select(.type == "blob") | .path' > "$RUNNER_TEMP/head"
          export NUMBER="$issue"
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/autonomy.yml?ref=$BASE" --jq .content 2>/dev/null | base64 -d > "$RUNNER_TEMP/repo-autonomy.yml" || : > "$RUNNER_TEMP/repo-autonomy.yml"
          if [ "$(wc -l < "$RUNNER_TEMP/files")" -ge 3000 ]; then echo "A human merges this one: the file list may be cut at the API's 3000."; exit 0; fi
          export BODY="$RUNNER_TEMP/body.md" FILES="$RUNNER_TEMP/files" HEAD_FILES="$RUNNER_TEMP/head" REPO_AUTONOMY="$RUNNER_TEMP/repo-autonomy.yml"
          # The Spec decided on must be the one the autopilot sealed at G3.
          if ! spec=$(NUMBER="$issue" python3 "$RUNNER_TEMP/central/scripts/receipts.py" verify-spec); then
            echo "A human merges this one: the Spec is not the one sealed at G3 ($spec)."; exit 0
          fi
          if why=$(python3 "$RUNNER_TEMP/central/scripts/autopilot.py" decide); then
            body=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body | tr -d '\r')
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash --body "$body"
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label merged-by:policy >/dev/null
            echo "Auto-merge enabled by policy: $why."
          else
            echo "A human merges this one: $why."
          fi

      - name: Enable or disable
        if: steps.autopilot.outputs.handled != 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          SWITCH: ${{ inputs.enabled }}
          RISK: ${{ inputs.risk }}
          COMPLEXITY: ${{ inputs.complexity }}
          FLOOR: ${{ inputs.floor }}
          TRUSTED: ${{ inputs.trusted }}
          BLOCKING: ${{ inputs.blocking }}
          DESCRIPTION_OK: ${{ inputs.description-ok }}
        run: |
          set -euo pipefail
          why=""
          [ "$SWITCH" = true ] || why="the policy has auto-merge off"
          [ -n "$why" ] || [ "$FLOOR" = low ] || why="policy floor is ${FLOOR:-unknown}"
          [ -n "$why" ] || [ "$RISK" = low ] || why="risk is ${RISK:-unknown}"
          [ -n "$why" ] || [ "$COMPLEXITY" = low ] || why="complexity is ${COMPLEXITY:-unknown}"
          [ -n "$why" ] || [ "$BLOCKING" = false ] || why="the review is blocking"
          [ -n "$why" ] || [ "$TRUSTED" = true ] || why="the author is not in trusted-authors"
          [ -n "$why" ] || [ -n "$DESCRIPTION_OK" ] || why="the caller does not pass the review's description verdict (description-ok)"
          [ -n "$why" ] || [ "$DESCRIPTION_OK" = true ] || why="the description does not match the code, or changed after the review"
          if [ -z "$why" ]; then
            # The description goes in verbatim: GitHub's own squash message
            # hard-wraps it at 72 columns. Disabling first refreshes it after
            # an edit (every edit re-runs this job).
            # Descriptions edited in the web UI come back with CRLF endings.
            body=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body | tr -d '\r')
            # Keep the branch commits' co-authors, as GitHub's own message does.
            # Same as scripts/squash-merge.sh, which maintainers use by hand.
            messages=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --paginate --jq '.[].commit.message')
            coauthors=$(printf '%s\n' "$messages" | tr -d '\r' | grep -iE '^co-authored-by:' | awk '!seen[tolower($0)]++' || true)
            if [ -n "$coauthors" ]; then
              if [ -n "$body" ]; then body+=$'\n\n'; fi
              body+=$'---------\n\n'"$coauthors"
            fi
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto >/dev/null 2>&1 || true
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash --body "$body"
            echo "Auto-merge enabled: GitHub merges once every required check is green."
          else
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto >/dev/null 2>&1 || true
            echo "A human merges this one: $why."
          fi
