name: Publish to the catalog of plugins for coding agents

# Reusable. When a plugin for coding agents' release is published
# (plugin-release-ai.yml, #552), brings its entries in the organisation's
# catalog (org.yml `catalogs`, #568) up to that version: every catalog file that
# lists it (Claude Code's .claude-plugin/marketplace.json, Codex's
# .agents/plugins/marketplace.json; kinds/ai-agent-plugin/tools.yml) gets
# the version and the release's tag (scripts/agent-manifests.py bump). Never
# a push to the catalog's main: the App opens an issue there (Type Task)
# and a pull request that closes it, linked to the release, which merges
# like any other once a person accepts the issue. Its commit is made
# through the API, so GitHub signs it (scripts/api-commit.py). A re-run
# never opens a second issue or pull request: it reuses the issue an
# earlier run left without its pull request, and stops when a read of the
# open ones fails (scripts/agent-manifests.py publish-plan).
#
# The token is the organisation's App token scoped to the catalog alone,
# with contents, issues and pull requests to write; it runs only on a
# release published in a repository of the organisation (never a fork's
# code: nothing of the plugin is checked out), or by hand with a tag, and
# only where a catalog is configured: the `catalog` input, else the kind's
# pack (`release.publishes-to: "{catalog}"`, org.yml `catalogs`). With none,
# the run says so and publishes nothing.
#
#   jobs:
#     publish:
#       if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
#       uses: DiluxOne/.github/.github/workflows/plugin-publish-ai.yml@v7-next
#       with:
#         tag: ${{ inputs.tag || '' }}
#       secrets:
#         DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}

on:
  workflow_call:
    inputs:
      tag:
        description: The release to publish, X.Y.Z. Empty, the default, the release whose publishing started the run.
        type: string
        default: ''
      catalog:
        description: The catalog repository of the organisation. Empty (the default) is the ai-agent-plugin kind's, from its pack and org.yml `catalogs` (#568).
        type: string
        default: ''
      central-ref:
        description: The ref of DiluxOne/.github whose scripts run. Empty (the default) means the very commit this workflow runs from, job.workflow_sha (#287).
        type: string
        default: ''
    secrets:
      DILUX_BOT_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  bump:
    name: The catalog's entry at this version
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: The release to publish
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not a release X.Y.Z."; exit 1; }
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')
          [ "$draft" = false ] || { echo "::error::$TAG is a draft or a pre-release: the catalog only takes a published release."; exit 1; }
          { echo "tag=$TAG"; echo "version=${TAG#v}"; } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref || job.workflow_sha }}
          path: .dx-central
          persist-credentials: false
      - name: The organisation's configuration (#197)
        run: test ! -f .dx-central/scripts/config-overlay.sh || bash .dx-central/scripts/config-overlay.sh
      - name: The catalog
        id: catalog
        env:
          CATALOG: ${{ inputs.catalog }}
        run: |
          set -euo pipefail
          name=${CATALOG:-$(python3 .dx-central/scripts/org.py publishes-to ai-agent-plugin)}
          [ -n "$name" ] || { echo "No catalog is configured for plugins for coding agents (org.yml \`catalogs\`): nothing is published." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
          [[ "$name" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::'$name' is not a repository name."; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: The App's token, for the catalog alone
        id: app
        if: steps.catalog.outputs.name != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          repositories: ${{ steps.catalog.outputs.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.catalog.outputs.name != ''
        with:
          repository: ${{ github.repository_owner }}/${{ steps.catalog.outputs.name }}
          path: catalog
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
      - name: An issue and a pull request in the catalog
        if: steps.catalog.outputs.name != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CATALOG: ${{ github.repository_owner }}/${{ steps.catalog.outputs.name }}
          PLUGIN: ${{ github.repository }}
          TAG: ${{ steps.rel.outputs.tag }}
          VERSION: ${{ steps.rel.outputs.version }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.rel.outputs.tag }}
          DX_BOT_LOGIN: ${{ vars.DX_BOT_LOGIN }}
        run: |
          set -euo pipefail
          cd catalog
          name=${PLUGIN#*/}
          python3 ../.dx-central/scripts/agent-manifests.py bump "$VERSION" "$PLUGIN" . --ref "$TAG"
          if git diff --quiet; then echo "The catalog already lists $PLUGIN at $VERSION." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          # Safe to re-run (#552): an open pull request for this version stops
          # it, an open issue with none (a run that failed after opening it) is
          # reused, and a failed read stops it rather than reading as "none".
          gh issue list --repo "$CATALOG" --state open --limit 100 --search "\"$name $VERSION\" in:title" --json number,title > ../issues.json
          gh pr list --repo "$CATALOG" --state open --limit 100 --search "\"$name $VERSION\" in:title" --json number,title > ../prs.json
          read -r action n < <(python3 ../.dx-central/scripts/agent-manifests.py publish-plan "$name" "$VERSION" ../issues.json ../prs.json)
          case "$action" in
            done) echo "The pull request for $name $VERSION is already open: #$n." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0 ;;
            reuse) echo "The issue for $name $VERSION is already open, #$n: its pull request is opened now." | tee -a "$GITHUB_STEP_SUMMARY" ;;
            create) ;;
            *) echo "::error::No plan for $name $VERSION."; exit 1 ;;
          esac
          footer=$'\n\n🤖 AI-generated · plugin-publish-ai.yml (DiluxOne/.github)'
          body="### Problem"$'\n\n'"$PLUGIN released $VERSION ($RELEASE_URL); the catalog still installs an older version."$'\n\n'"### Scope"$'\n\n'"- Its entries in every catalog file brought up to $VERSION and the tag $TAG (scripts/agent-manifests.py bump)."$'\n\n'"### Out of scope"$'\n\n'"- Anything of another plugin."$'\n\n'"### Acceptance criteria"$'\n\n'"- C1: Given the catalog, when a person installs $name from it, then they get $VERSION."$'\n\n'"### Criticality"$'\n\n'"Normal$footer"
          if [ "$action" = create ]; then
            url=$(gh issue create --repo "$CATALOG" --title "Bring $name to $VERSION in the catalog" --body "$body")
            n=${url##*/}
            gh api -X PATCH "repos/$CATALOG/issues/$n" -f type=Task >/dev/null || echo "::warning::The issue's Type could not be set."
          fi
          branch="chore/$n-$name-$VERSION"
          branch=${branch//./-}
          git config user.name "$DX_BOT_LOGIN"
          git config user.email "$DX_BOT_LOGIN@users.noreply.github.com"
          base=$(git rev-parse --abbrev-ref HEAD)
          git checkout -q -b "$branch"
          git commit -q -am "chore(catalog): $name $VERSION" -m "Closes #$n. From the release $RELEASE_URL."
          # --force: the branch is this run's own; a run that failed before its
          # pull request may have left it, and it is made again from main.
          GITHUB_REPOSITORY="$CATALOG" python3 ../.dx-central/scripts/api-commit.py push "$branch" --onto "origin/$base" --force
          gh pr create --repo "$CATALOG" --head "$branch" --title "chore(catalog): $name $VERSION" \
            --body "## 📝 What changes"$'\n\n'"$PLUGIN at $VERSION ($TAG) in every catalog file that lists it."$'\n\n'"## 💡 Why"$'\n\n'"Closes #$n. $RELEASE_URL was published.$footer"
