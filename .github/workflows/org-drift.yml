name: Repositories in step

# Every day, and by hand, it first brings every repository in step on its
# own (#189), as dilux-bot: the labels (labels.yml, through the API) and the
# shared files (CODEOWNERS, the AGENTS.md block), each repository's as an
# issue and a pull request of the org-sync lane, which the autonomy policy
# accepts and merges when they hold only what main holds here
# (scripts/sync-repos.py labels and files), and opens the sub-issue of every
# accepted decision a repository now matches (scripts/decision.py sync),
# opens "Adopt <repository>" for each repository repos.yml does not list yet,
# with the kind detection proposes (scripts/detect.py adopt-issues, #562: a
# maintainer's `accepted` is the only step, org-adopt.yml does the rest),
# and opens "Release X.Y.Z" where a version milestone X.Y.Z closed
# (scripts/milestones.py open; accepting it stays a person's decision).
# What a run cannot do on its own
# (settings, rulesets, the Dependabot file, the workflow callers) stays a
# maintainer's run (`sync-repos.py adopt` for a new one), and the check below
# reports it.
#
# Then it compares every repository of the organisation with
# what this repository keeps for all of them (labels.yml, repos.yml,
# Dependabot's security updates among its settings, agents-block.md,
# .github/dependabot.yml against its kind's template, the workflow callers
# against workflow-templates/, the kind's "own checks" ruleset, the rulesets
# the organisation's cover, and a way to reproduce a bug, #377; the custom
# property the organisation's rulesets cover, the code security
# configuration for its visibility and the default for new repositories
# each one is (#603), the Project, #562; the test repository, never also a
# product nor a catalog, and the test identity, with more than read nowhere
# else, #563),
# through scripts/sync-repos.py check, and changes nothing.
# One issue here, "Repositories out of step", lists what differs: opened or
# updated when something does, closed when nothing does.

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One check at a time, so two runs never open two issues.
concurrency:
  group: org-drift
  cancel-in-progress: false

jobs:
  drift:
    name: Drift check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every repository the App is installed on, to write what the sync
      # brings: labels, and the shared files as an issue and a pull request.
      - name: App token (sync, every repository)
        id: sync
        if: github.ref == 'refs/heads/main'
        continue-on-error: true # without it the check below still runs
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-metadata: read

      # A failure in one repository is reported and the others go on; the
      # check below still runs and lists what is left.
      - name: Sync (labels, shared files, decisions, Adopt issues, releases)
        if: github.ref == 'refs/heads/main' && steps.sync.outputs.token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.sync.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Off, a done milestone's release issue waits for a person (#287).
          DX_AUTOPILOT: ${{ vars.DX_AUTOPILOT }}
        # Each part runs whatever the others did; the step fails if any did.
        run: |
          rc=0
          python3 scripts/sync-repos.py labels || rc=1
          python3 scripts/sync-repos.py files || rc=1
          python3 scripts/decision.py sync || rc=1
          python3 scripts/detect.py adopt-issues || rc=1
          python3 scripts/milestones.py open || rc=1
          exit "$rc"

      # Every repository the App is installed on, read-only, for the check.
      - name: App token (read, every repository)
        id: read
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          permission-issues: read
          permission-metadata: read
          # The organisation's rulesets, to tell which of a repository's own
          # they cover, and its code security configurations; the custom
          # property the rulesets cover, and each repository's attached
          # configuration (#562). Read-only.
          permission-organization-administration: read
          permission-organization-custom-properties: read
          permission-administration: read

      - name: Compare
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
        run: python3 scripts/sync-repos.py check --report "$RUNNER_TEMP/drift.md"

      - name: App token (issues, this repository)
        id: write
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write

      - name: The issue
        env:
          GH_TOKEN: ${{ steps.write.outputs.token }}
          TITLE: Repositories out of step
        run: |
          set -euo pipefail
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if grep -q '^Every repository is in step' "$RUNNER_TEMP/drift.md"; then
            if [ -n "$open" ]; then
              gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "Every repository is in step again." >/dev/null
              echo "In step; closed #$open."
            else
              echo "In step."
            fi
            exit 0
          fi
          printf '\n<sub>🤖 Daily drift check · %s</sub>\n' "$(date -u +%Y-%m-%d)" >> "$RUNNER_TEMP/drift.md"
          if [ -n "$open" ]; then
            gh issue edit "$open" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/drift.md" >/dev/null
            echo "Updated #$open."
          else
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/drift.md")
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/${url##*/}" -f type=Task >/dev/null 2>&1 || true
            echo "Opened $url."
          fi
