name: Review evaluation

# Not reusable. A change to the review is scored before it merges (#234,
# phase 13): the review's prompts, profiles, brief, model or verification.
# Every case of evals/review/cases.json, real pull requests of the public
# repositories (a bug the review found and was fixed, which it must find
# again; a clean one it must not block), is reviewed again with the rules of
# this pull request (scripts/local-review.sh, the same brief the review
# reads) and scored against evals/review/baseline.json
# (scripts/review-eval.py). Worse by more than one case on either side
# fails this check, and the table says which cases.
#
# Paid: each case is one review. It runs only when a pull request touches
# the review, from a branch of this repository (a fork's code never runs
# with the keys), and by hand. Private repositories are never cases: their
# code would show in this public repository's logs.
#
# A change that should move the score writes the new baseline from this
# run's results (the artifact): `scripts/review-eval.py baseline FILE`, in
# the same pull request, which a person merges.

on:
  pull_request:
    paths:
      - review-profiles/**
      - kinds/*/review-profile.md
      - kinds/*/rules.yml
      - policy/review-policy.default.yml
      - scripts/review-brief.sh
      - scripts/local-review.sh
      - scripts/review-verify.py
      - scripts/review-count.py
      - .github/workflows/claude-review.yml
      - evals/review/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Review evaluation
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.302

      - name: Review every case
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          DX_BOT_LOGIN: ${{ vars.DX_BOT_LOGIN }}
          DX_BOT_ID: ${{ vars.DX_BOT_ID }}
        run: |
          set -euo pipefail
          git config --global user.name "$DX_BOT_LOGIN"
          git config --global user.email "$DX_BOT_ID+$DX_BOT_LOGIN@users.noreply.github.com"
          python3 scripts/review-eval.py run > "$RUNNER_TEMP/results.json"

      - name: Score against the baseline
        run: |
          set -uo pipefail
          python3 scripts/review-eval.py score "$RUNNER_TEMP/results.json" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-eval
          path: ${{ runner.temp }}/results.json
          retention-days: 30
