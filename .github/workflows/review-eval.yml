name: Review evaluation

# Not reusable. A change to the review (#234, phase 13: its prompts,
# profiles, brief, model or verification) is scored once a week and by hand (#941):
# a maintainer runs it when such a change should be scored, never on every
# push to a pull request.
# Every case of evals/review/cases.json, real pull requests of the public
# repositories (a bug the review found and was fixed, which it must find
# again in the hunk its fix changed or within 10 lines of the lines it
# changed; a clean one it must not block), is reviewed again with the rules
# of this pull request the way production reviews a pull request (#930):
# the brief for its pull request in full mode, claude-review.yml's own
# review and verify steps (their prompts and args, read from it), and the
# verified output (scripts/review-eval.py run). The play's read-only
# token reads each case's closing issue for its criteria. It is scored
# against evals/review/baseline.json
# (scripts/review-eval.py). Worse by more than one case on either side
# fails this check, and so does finding fewer known bugs than the floor,
# policy/review-policy.default.yml's `review-eval.found-floor` (a share of
# them, never fewer than one), whatever the baseline (#930); the table
# says which cases. It is the review step
# of every AI step's evaluation (#735, scripts/evals.py, which runs
# review-eval.py's commands for the review and maps the review's paths,
# these, policy/autonomy.yml among them); evals.yml runs the other steps.
#
# The set is checked first, before any paid review: every flag case's
# review thread's hunk was changed by the commit that fixed it, and that
# commit is no docs, ci, chore, style or test commit nor docs alone, or the
# case is refused by its name; and it holds at least 10 cases of each kind
# (#844, #847). Each case is
# played 3 times, one job per play, and a last job scores each case's
# median (2 of 3 plays).
#
# Paid: each case is one review per play, and one verification when it
# raised a blocker or major (60 reviews for 20 cases). It runs once
# a week on main and by hand, on a branch of this repository (a fork's code never runs with
# the keys). Private
# repositories are never cases: their code would show in this public
# repository's logs.
#
# The table gives each flag case its reason per play (#930): found, a
# finding in the file outside the fixed lines and how far, one rejected by
# verification, no finding in the file, or not reviewed; a play whose
# answer does not examine every changed file the brief showed (its
# `examined`, scripts/review-examined.py, #953) did not finish: not
# reviewed ("did not examine every changed file"), never clean. The summary ends
# with this run's results as a baseline, between `--- baseline review ---`
# and `--- end ---`. A change that should move the score commits that new
# baseline (or writes it from the artifacts, `scripts/review-eval.py
# baseline FILE...`), in the same pull request, which a person merges. By hand with `mode:
# collect`, it first writes a new set (`review-eval.py collect`, the
# workflow's read-only token), plays it whole, and keeps the new
# cases.json and baseline.json as the `review-eval-set` artifact, for a
# pull request to commit.

on:
  # Once a week (#941), and by hand; never on a pull request.
  schedule:
    - cron: '11 7 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: "eval: score the set as it is; collect: write a new set and its baseline"
        type: choice
        options: [eval, collect]
        default: eval

permissions:
  contents: read

concurrency:
  group: review-eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    name: A new set
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'collect'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect the cases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/review-eval.py collect 10
          python3 scripts/review-eval.py check

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-eval-cases
          path: evals/review/cases.json
          retention-days: 30

  play:
    name: Review evaluation, play ${{ matrix.play }}
    needs: collect
    if: >-
      always() && (needs.collect.result == 'success' || needs.collect.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        play: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The new set
        if: needs.collect.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-eval-cases
          path: evals/review

      - name: The Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.302

      - name: Review every case
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          DX_BOT_LOGIN: ${{ vars.DX_BOT_LOGIN }}
          DX_BOT_ID: ${{ vars.DX_BOT_ID }}
          # Read-only (contents: read): each case's closing issue, for its
          # criteria, as the review's brief step reads them.
          GH_TOKEN: ${{ github.token }}
          PLAY: ${{ matrix.play }}
        run: |
          set -euo pipefail
          git config --global user.name "$DX_BOT_LOGIN"
          git config --global user.email "$DX_BOT_ID+$DX_BOT_LOGIN@users.noreply.github.com"
          python3 scripts/review-eval.py run --play "$PLAY" > "$RUNNER_TEMP/results-$PLAY.json"

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-eval-play-${{ matrix.play }}
          path: ${{ runner.temp }}/results-${{ matrix.play }}.json
          retention-days: 30

  score:
    name: Review evaluation
    needs: [collect, play]
    # A failed collect skips the plays; the check then fails, never shows skipped.
    if: >-
      always() && (needs.collect.result == 'failure' ||
      (needs.play.result != 'skipped' && needs.play.result != 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: A set that could not be written fails the check
        if: needs.collect.result == 'failure'
        run: |
          echo "::error::The new set was not written (the collect job failed): nothing was played."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The plays' results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: review-eval-play-*
          merge-multiple: true
          path: ${{ runner.temp }}/plays

      - name: Score each case's median against the baseline
        if: needs.collect.result != 'success'
        run: |
          set -uo pipefail
          # A play that left no results fails the score: never a pass on fewer plays.
          python3 scripts/review-eval.py score "$RUNNER_TEMP"/plays/results-{1,2,3}.json | tee -a "$GITHUB_STEP_SUMMARY"
          code="${PIPESTATUS[0]}"
          # This run's results as a baseline, for a pull request to commit
          # (#930); none below the found floor, nor from a partial run.
          { echo; echo '```'; echo '--- baseline review ---'
            python3 scripts/review-eval.py baseline "$RUNNER_TEMP"/plays/results-{1,2,3}.json 2>&1 || true
            echo '--- end ---'; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: The new set's baseline
        if: needs.collect.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-eval-cases
          path: evals/review

      - name: Write the new baseline
        if: needs.collect.result == 'success'
        run: python3 scripts/review-eval.py baseline "$RUNNER_TEMP"/plays/results-{1,2,3}.json

      - name: Keep the new set
        if: needs.collect.result == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-eval-set
          path: |
            evals/review/cases.json
            evals/review/baseline.json
          retention-days: 30
