name: Autopilot

# Reusable. The autopilot (#83, the plan in #78): an issue a person accepted,
# worked by Claude in the open, in a draft pull request, to a pull request
# ready for review; then its review's blocking points fixed, round after
# round, until the review is clean or the rounds run out (#109).
#
#   mode: start     called from issue-triage.yml when a person adds
#                   `accepted` or dilux-bot opens an accepted decision's
#                   sub-issue (#415), and from issue-repro.yml when the
#                   `bugfix-reproduced` lane accepted the issue it opened
#                   for a reproduced bug (#84). Who accepted it is read
#                   from GitHub (scripts/autopilot.py lane): a lane's own
#                   issue is worked under that lane, with its caps; one a
#                   person accepted, under `human-issue`; any other
#                   issue starts nothing. It starts only if the autopilot is on
#                   (policy/autonomy.yml, the repository's own
#                   .github/autonomy.yml, DX_AUTOPILOT) and the issue is
#                   ready (G1); a Bug, only in a repository that declares
#                   a way to reproduce one (#377, scripts/autopilot.py
#                   may-start), or the issue says which way to declare.
#                   First the agent writes the Spec, which this
#                   workflow appends to the issue (G3, sealed on the
#                   receipts branch). Then it opens the draft pull request,
#                   labelled `autopilot`: the Spec as a checklist, one box per
#                   criterion. Then the agent works the criteria in order,
#                   one commit each, each box ticked only once a commit names
#                   it (scripts/autopilot.py tick).
#   mode: continue  called from issue-triage.yml when `autopilot:continue` is
#                   added to the issue (by a person, or by this workflow when
#                   a run ran out of turns or time with criteria left): the
#                   agent resumes from the branch and the unticked boxes (or,
#                   every box ticked and still a draft, only runs the checks
#                   and finishes), up to `autopilot-runs` runs per issue (5).
#                   A person who took it back removes `needs-human` first.
#                   The agent runs every command in the foreground: the run
#                   ends when it stops, and nothing wakes it, so its steps
#                   have no Monitor and no background runs (#482,
#                   CLAUDE_CODE_DISABLE_BACKGROUND_TASKS), and a command may
#                   run as long as the step. A draft with every box ticked
#                   whose run ended without finishing continues once (a
#                   comment says so), then goes to a person. On a pull
#                   request already ready whose review blocks at its head
#                   (#504, scripts/autopilot.py continue-as), the continue
#                   runs one fix round instead, counted as a run: the
#                   rounds cap does not refuse it, the runs cap does.
#
# Before `finish ready` (#482) the agent reviews its own diff against the
# review's profiles and the kind's rules, fixing every blocker and major,
# and runs `autopilot.py check`, which runs `make pre-pr` at HEAD (every
# check the pull request and the merge queue run, #479): `finish ready`
# refuses a head where it did not pass in this run, where the Makefile has
# the target. The questions it needs answered are asked while it writes the
# Spec.
#   mode: fix       called from org-pull-request.yml, and in the
#                   organisation's own repository from its
#                   pull-request.yml (#504), when the review of an
#                   `autopilot` pull request blocks: one round of fixes,
#                   pushed to its branch, which runs the pipeline again. After
#                   `autopilot-rounds` rounds (3) it hands the pull request to
#                   a person (`needs-human`, with a summary).
#
# The agent holds no key (#287). A shell in a job that holds a secret can
# read it out of the runner's memory, whatever the token's scope, so the
# agent runs in jobs of its own (`spec`, `work`) that hold only the Claude
# subscription and the job's own token, which can only read this
# repository. It commits locally and leaves what it would do on GitHub (a
# decision, a ticked box, ready, a question, a stop, a reply to a review
# thread, the Spec) as intents in its outbox, through the same helper
# commands (scripts/autopilot.py). The jobs that hold dilux-bot's key
# (`prep`, `draft`, `apply`) run no agent and none of the repository's code,
# on GitHub's fresh runners: they decide whether it may run, write what the
# agent reads (the Spec, the pull request's body, the review's own words,
# never anyone else's), open the draft, push the agent's commits through
# the API so GitHub signs them (onto the branch's head, never over it,
# never touching .github/workflows except in the organisation's own
# repository, #498, where a person merges them), and apply each intent through the same
# checks a person's run uses. What the helpers check in the agent's job is
# only feedback to the agent.
#
# A run never ends in silence (scripts/autopilot.py end): the pull request is
# ready for review, or the agent said where it stopped and why (a comment and
# `needs-human`), or, in `guided` mode (policy/autonomy.yml, autopilot-mode,
# #247), it asked a maintainer a question and waits (`autopilot:waiting`):
# their answer, in their own words, brings it back (review-reply.yml) and
# reaches its prompt; or the run continues; otherwise this workflow says so
# itself, adds `needs-human` and fails. Every run writes a readable account
# to its job summary and keeps the agent's transcript, scrubbed of tokens,
# as an artifact, and the issue's board links the pull request, the run and
# the criteria done. The review (paid) runs only once the draft is marked
# ready.
#
# Whether it merges is auto-merge.yml's decision (scripts/autopilot.py
# decide, gate G7): never a Critical issue, never a change to the protected
# paths, never while the review blocks, and within the lane's caps.
#
# The agent's jobs run where the repository's jobs run (DX_RUNNER_HEAVY),
# except a reproduced bug's work, which runs on GitHub's fresh runners (the
# `where` job), as the reproduction does. When the end rule itself fails
# before it says its verdict, "The last resort" still comments and adds
# `needs-human`. A work step killed by its timeout leaves no execution log
# (the action writes it when the agent ends), so the account and the
# transcript fall back to the session the CLI kept as it went
# (scripts/autopilot.py work-log), and the end rule still counts it as a run
# out of time. Every input it reads from the issue is the PRD at its sealed
# text, fenced as data in the prompt.
#
# A reproduced bug (lane `bugfix-reproduced`): its failing test, written from
# an outsider's report, is untrusted code. It never enters the agent's
# working tree (a sparse checkout keeps it in the commits only, and the
# repository's own tests cannot pick it up); the draft's branch starts at the
# reproduction's commit, the test checked against the SHA-256 the PRD
# sealed; the agent runs it only in the sandbox, always against a clean copy
# of a commit, never the working tree, and `finish ready` refuses until it
# passes there: a unit test in scripts/repro-sandbox.sh (no network, no
# environment, no secret), any other way's (#397) the way it was written,
# through scripts/repro-run.sh with the way the sealed PRD carries
# (REPRO_SPEC, REPRO_THEME: its setup before the test is in the tree, then
# the test alone as a user of its own, with no environment and no network
# but the machine's). The job that marks it ready checks the test at the
# pushed head is the sealed one; the pull request's own checks run a unit
# test with the suite, and G7 (auto-merge.yml) runs another way's again at
# the head. A reproduced bug may be fixed in the paths that govern autonomy
# too (#397): the agent is told never to widen a permission, a lane or a
# limit, and G7 leaves any fix that does to a person
# (scripts/no-widening.py).

on:
  workflow_call:
    inputs:
      mode:
        description: start, continue or fix.
        type: string
        required: true
      issue:
        description: The issue (modes start and continue).
        type: string
        default: ''
      pr:
        description: The pull request (mode fix).
        type: string
        default: ''
      central-ref:
        type: string
        default: ''
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      DILUX_BOT_PRIVATE_KEY:
        required: false

permissions: {}

# One run per issue (a fix belongs to its pull request): a newer run never
# drops one waiting for another issue.
concurrency:
  group: autopilot-${{ github.repository }}-${{ inputs.issue || inputs.pr }}
  cancel-in-progress: false

# The organisation's App, as GitHub shows it (#197): the calling
# organisation's variables DX_BOT_LOGIN, DX_BOT_APP and DX_BOT_ID, or
# DiluxOne's dilux-bot when it sets none.
env:
  DX_BOT_LOGIN: ${{ vars.DX_BOT_LOGIN || 'dilux-bot[bot]' }}
  DX_BOT_APP: ${{ vars.DX_BOT_APP || 'dilux-bot' }}
  DX_BOT_ID: ${{ vars.DX_BOT_ID || '333187390' }}

jobs:
  where:
    name: Where the autopilot runs
    runs-on: ${{ vars.DX_RUNNER_HEAVY != '' && !((github.event.pull_request.user.login == (vars.DX_BOT_LOGIN || 'dilux-bot[bot]') && (startsWith(github.event.pull_request.head.ref, 'test/repro-issue-') || (contains(github.event.pull_request.head.ref, '/') && contains(github.event.pull_request.head.ref, '-the-bug-reproduced-from-')))) || (github.event.issue.user.login == (vars.DX_BOT_LOGIN || 'dilux-bot[bot]') && (github.event.issue.pull_request || startsWith(github.event.issue.title, 'The bug reproduced from ')))) && fromJSON(vars.DX_RUNNER_HEAVY) || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    outputs:
      github-hosted: ${{ steps.lane.outputs.github-hosted }}
    steps:
      - name: dilux-bot token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: read
          permission-pull-requests: read
      - name: A reproduced bug's work?
        id: lane
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          ISSUE: ${{ inputs.issue }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          [ -n "$ISSUE" ] || ISSUE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json closingIssuesReferences --jq '.closingIssuesReferences[0].number // empty')
          # Fails closed: when the labels cannot be read, GitHub's runner.
          hosted=true
          if [ -n "$ISSUE" ] && labels=$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(",")'); then
            case ",$labels," in *,lane:bugfix-reproduced,*) ;; *) hosted=false ;; esac
          fi
          echo "github-hosted=$hosted" >> "$GITHUB_OUTPUT"
          echo "On GitHub's runner: $hosted"


  # Whether it may run, and what the agent reads: with the key, no agent.
  prep:
    name: Autopilot (${{ inputs.mode }}) · may it run
    runs-on: ubuntu-latest # fresh: it holds the key beside an agent's work (#287)
    timeout-minutes: 15
    permissions: {}
    outputs:
      go: ${{ steps.may.outputs.go || 'false' }}
      # What it runs (#504): the mode it was called with, but `fix` for a
      # continue on a ready pull request whose review blocks.
      mode: ${{ steps.what.outputs.mode || inputs.mode }}
      issue: ${{ steps.what.outputs.issue }}
      pr: ${{ steps.what.outputs.pr }}
      branch: ${{ steps.what.outputs.branch }}
      round: ${{ steps.what.outputs.round }}
      runs: ${{ steps.what.outputs.runs }}
      lane: ${{ steps.may.outputs.lane }}
      repro-test: ${{ steps.may.outputs.repro-test }}
      repro-sha: ${{ steps.may.outputs.repro-sha }}
      repro-branch: ${{ steps.may.outputs.repro-branch }}
      repro-spec: ${{ steps.may.outputs.repro-spec }}
      repro-theme: ${{ steps.may.outputs.repro-theme }}
      started: ${{ steps.when.outputs.started }}
      head: ${{ steps.when.outputs.head }}
      default: ${{ steps.when.outputs.default }}
      budget-spec: ${{ steps.when.outputs.budget-spec }}
      budget-work: ${{ steps.when.outputs.budget-work }}
    steps:
      - name: dilux-bot token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-checks: read
          permission-actions: read

      - name: The organisation's scripts and policy
        id: central
        env:
          REF: ${{ inputs.central-ref || job.workflow_sha }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch "$REF" https://github.com/DiluxOne/.github .dx-central 2>/dev/null \
            || { git clone -q https://github.com/DiluxOne/.github .dx-central && git -C .dx-central checkout -q "$REF"; }
          test ! -f .dx-central/scripts/config-overlay.sh || bash .dx-central/scripts/config-overlay.sh
          echo "ref=$(git -C .dx-central rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          if [ -d .git ]; then printf '%s\n' /.dx-central/ /.dx-io/ /.dx-out/ >> .git/info/exclude; fi

      - name: What to work on
        id: what
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          MODE: ${{ inputs.mode }}
          ISSUE: ${{ inputs.issue }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          is_bot() { case "$1" in "$DX_BOT_APP"|"$DX_BOT_LOGIN"|"app/$DX_BOT_APP") return 0 ;; *) return 1 ;; esac; }
          if [ "$MODE" = continue ]; then
            # The label asked for one run: it goes now, so it can be asked again.
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "autopilot:continue" >/dev/null 2>&1 || true
            PR=""
            refs=$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json closedByPullRequestsReferences --jq '.closedByPullRequestsReferences[].number')
            for n in $refs; do
              if gh pr view "$n" --repo "$GITHUB_REPOSITORY" --json state,labels --jq '.state == "OPEN" and ([.labels[].name] | index("autopilot") != null)' | grep -qx true; then PR=$n; fi
            done
            [ -n "$PR" ] || { echo "No pull request closes #$ISSUE: nothing to continue."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; }
          fi
          if [ "$MODE" != start ]; then
            author=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json author --jq .author.login)
            is_bot "$author" || { echo "#$PR was opened by $author, not dilux-bot: the autopilot stays out."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; }
            [ "$MODE" = continue ] || ISSUE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json closingIssuesReferences --jq '.closingIssuesReferences[0].number // empty')
            branch=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)
            labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(",")')
            last() { tr ',' '\n' <<<"$labels" | sed -n "s/^autopilot:$1-\([0-9]*\)\$/\1/p" | sort -n | tail -1; }
            round=$(( $(last round) + 1 )); runs=$(( $(last run) + 1 ))
            { echo "pr=$PR"; echo "branch=$branch"; echo "round=$round"; echo "runs=$runs"; } >> "$GITHUB_OUTPUT"
          else
            echo "runs=1" >> "$GITHUB_OUTPUT"
          fi
          # A continue on a pull request already ready whose review blocks
          # at its head runs one fix round (#504): the review's last record,
          # read the way claude-review.yml reads it, from dilux-bot's own
          # summary comment only.
          as=$MODE
          if [ "$MODE" = continue ]; then
            state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isDraft,headRefOid --jq '"\(.isDraft) \(.headRefOid)"')
            # Unread, it is no record: the continue runs as it always did.
            # shellcheck disable=SC2016 # jq variable, not a shell one.
            { gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
              | jq -r --arg bot "$DX_BOT_LOGIN" '.[] | select(.user.login == $bot and (.body | startswith("<!-- dx-review -->"))) | .body' \
              | { grep -oP '<!-- dx-review-record \K.*(?= -->)' || true; } | tail -1; } > "$RUNNER_TEMP/record.json" || echo null > "$RUNNER_TEMP/record.json"
            as=$(IS_DRAFT="${state%% *}" HEAD="${state#* }" RECORD="$RUNNER_TEMP/record.json" python3 .dx-central/scripts/autopilot.py continue-as)
            [ "$as" != fix ] || echo "#$PR is ready and its review blocks at its head: this continue runs one fix round."
          fi
          echo "mode=$as" >> "$GITHUB_OUTPUT"
          [ -n "$ISSUE" ] || { echo "No issue to work on."; exit 1; }
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/body.md"
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/autonomy.yml" --jq .content 2>/dev/null | base64 -d > "$RUNNER_TEMP/repo-autonomy.yml" || : > "$RUNNER_TEMP/repo-autonomy.yml"
          # Its review policy, for whether it declares a way to reproduce a
          # bug (#377), read on a start only: none is an empty one; one
          # that cannot be read stops here rather than tell the issue it
          # declares none.
          : > "$RUNNER_TEMP/repo-policy.yml"
          if [ "$MODE" = start ] && ! gh api "repos/$GITHUB_REPOSITORY/contents/.github/review-policy.yml" -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/repo-policy.yml" 2> "$RUNNER_TEMP/repo-policy.err"; then
            grep -q "HTTP 404" "$RUNNER_TEMP/repo-policy.err" || { echo "::error::Could not read .github/review-policy.yml: $(head -c 200 "$RUNNER_TEMP/repo-policy.err")"; exit 1; }
            : > "$RUNNER_TEMP/repo-policy.yml"
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: May it start
        id: may
        if: steps.what.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          DX_AUTOPILOT: ${{ vars.DX_AUTOPILOT }}
          MODE: ${{ inputs.mode }}
          AS: ${{ steps.what.outputs.mode }}
          ISSUE: ${{ steps.what.outputs.issue }}
          PR: ${{ steps.what.outputs.pr }}
          ROUND: ${{ steps.what.outputs.round }}
          RUNS: ${{ steps.what.outputs.runs }}
        run: |
          set -euo pipefail
          export BODY="$RUNNER_TEMP/body.md" REPO_AUTONOMY="$RUNNER_TEMP/repo-autonomy.yml"
          # Who accepted it, read from GitHub's history (never from a label
          # alone): a lane's own issue that lane accepts is worked under the
          # lane, with its caps; one a person accepted, under human-issue.
          # A decision's sub-issue starts when it opens, and decision.py links
          # it to its parent a moment later (#415): a start that finds no lane
          # asks once more.
          if ! LANE=$(NUMBER="$ISSUE" python3 .dx-central/scripts/autopilot.py lane) \
            && { [ "$MODE" != start ] || ! { sleep 20; LANE=$(NUMBER="$ISSUE" python3 .dx-central/scripts/autopilot.py lane); }; }; then
            echo "The autopilot does not start: $LANE"
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          export LANE
          echo "lane=$LANE" >> "$GITHUB_OUTPUT"
          # A bug only in a repository that declares a way to reproduce
          # one (#377): may-start exits 2 and the issue says which way to
          # declare. Only on a start: a run that continues one has started.
          ISSUE_TYPE=""
          if [ "$MODE" = start ]; then
            ISSUE_TYPE=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --jq '.type.name // ""')
          fi
          rc=0
          why=$(ISSUE_TYPE="$ISSUE_TYPE" REPO_POLICY="$RUNNER_TEMP/repo-policy.yml" python3 .dx-central/scripts/autopilot.py may-start) || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "The autopilot does not start: $why"
            if [ "$rc" -eq 2 ]; then
              gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$why

          <sub>🤖 Autopilot</sub>" >/dev/null || true
            fi
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A reproduced bug: the test that failed, its SHA-256 and the
          # branch that holds it, from the sealed PRD (scripts/repro-lane.py);
          # for a test of any way but the unit one, the way it runs in and
          # the theme the report named (#397), empty for a unit test.
          if [ "$LANE" = bugfix-reproduced ]; then
            ev=$(python3 .dx-central/scripts/repro-lane.py evidence)
            { echo "repro-test=$(jq -r .test <<<"$ev")"; echo "repro-sha=$(jq -r .sha256 <<<"$ev")"; echo "repro-branch=$(jq -r .branch <<<"$ev")"
              echo "repro-spec=$(jq -c '.spec // empty' <<<"$ev")"; echo "repro-theme=$(jq -r '.theme // empty' <<<"$ev")"; } >> "$GITHUB_OUTPUT"
          fi
          # Every mode works only from the PRD that was accepted: its seal
          # (written by issue-accepted.yml, which runs alongside on a
          # person's acceptance, or by the reproduction when its lane
          # accepted it) must exist and match the issue now. Waits up to two
          # minutes for it, also while it reads "changed": a re-acceptance
          # after an edit meets the old seal before the new one is written
          # (#353). Says on the issue when it does not start.
          v=$(NUMBER="$ISSUE" python3 .dx-central/scripts/receipts.py verify-prd --wait 12 || true)
          # A person's acceptance that G1 took back (#287: not ready, the
          # label came off and nothing was sealed) already said why.
          if [ "$v" = unsealed ] && [ "$LANE" = human-issue ] \
            && [ "$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | index("accepted") == null')" = true ]; then
            echo "The acceptance was taken back (not ready): the autopilot does not start."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$v" != match ]; then
            msg="The autopilot did not run: the issue's PRD is not the one sealed when it was accepted ($v). A maintainer accepts it again (remove and add \`accepted\`) to seal the text as it stands."
            echo "$msg"
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$msg

          🤖 AI-generated · Claude Opus 5.5 (Anthropic)" >/dev/null || true
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$MODE" = start ]; then
            open_prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --search "linked:issue $ISSUE" --json number --jq 'length')
            if [ "$open_prs" != 0 ]; then
              echo "A pull request already closes #$ISSUE: nothing to start (\`autopilot:continue\` resumes the autopilot's)."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          else
            # A failed read stops the step: it must not count as "no label".
            human=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | index("needs-human") != null')
            if [ "$human" = true ]; then
              echo "#$PR is a person's now (needs-human): the autopilot stays out."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          if [ "$MODE" = continue ]; then
            # may-continue counts the runs before this one.
            # A continue's fix round (#504) counts as a run, against the
            # runs cap, never against the rounds cap: the label asked for it.
            if ! why=$(AS="$AS" RUNS=$((RUNS - 1)) python3 .dx-central/scripts/autopilot.py may-continue); then
              echo "No continue: $why"
              [[ "$why" != *"cap is"* ]] || gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "The autopilot does not continue: $why. A person takes it from here.

          🤖 AI-generated · Claude Opus 5.5 (Anthropic)" >/dev/null
              [[ "$why" != *"cap is"* ]] || gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label needs-human >/dev/null
              echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          if [ "$MODE" = fix ]; then
            max=$(python3 .dx-central/scripts/autonomy.py policy | jq -r '."autopilot-rounds" // 3')
            if [ "$ROUND" -gt "$max" ]; then
              gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label needs-human >/dev/null || true
              gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "The autopilot spent its $max rounds and the review still blocks: a person takes it from here. The review's open threads say what is left.

          🤖 AI-generated · Claude Opus 5.5 (Anthropic)" >/dev/null
              echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: When it starts
        id: when
        if: steps.may.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          MODE: ${{ steps.what.outputs.mode }}
          PR: ${{ steps.what.outputs.pr }}
        run: |
          set -euo pipefail
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # What the agent's run may cost (#287, policy/autonomy.yml
          # budgets-usd, the repository's file only lowering it).
          pol=$(REPO_AUTONOMY="$RUNNER_TEMP/repo-autonomy.yml" python3 .dx-central/scripts/autonomy.py policy)
          work_key=autopilot-work; [ "$MODE" != fix ] || work_key=autopilot-fix
          { echo "budget-spec=$(jq -r '."budgets-usd"."autopilot-spec" // 3' <<<"$pol")"; echo "budget-work=$(jq -r --arg k "$work_key" '."budgets-usd"[$k] // (if $k == "autopilot-fix" then 10 else 20 end)' <<<"$pol")"; } >> "$GITHUB_OUTPUT"
          echo "default=$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq .defaultBranchRef.name)" >> "$GITHUB_OUTPUT"
          # A fix round's head before it: the end rule tells a round that
          # pushed from one that did not.
          if [ -n "$PR" ]; then echo "head=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" >> "$GITHUB_OUTPUT"; fi

      # Counted before the agent runs: a round or run that fails or times out
      # after pushing still counts, so the caps hold. By the mode it was
      # called with: a continue's fix round (#504) is a run.
      - name: Count the round or the run
        if: steps.may.outputs.go == 'true' && inputs.mode != 'start'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          MODE: ${{ inputs.mode }}
          PR: ${{ steps.what.outputs.pr }}
          ROUND: ${{ steps.what.outputs.round }}
          RUNS: ${{ steps.what.outputs.runs }}
        run: |
          if [ "$MODE" = fix ]; then l="autopilot:round-$ROUND"; d="The autopilot's review rounds on this pull request"; else l="autopilot:run-$RUNS"; d="The autopilot's runs on this pull request"; fi
          gh label create "$l" --repo "$GITHUB_REPOSITORY" --color C5DEF5 --description "$d" 2>/dev/null || true
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label "$l" >/dev/null

      # What the agent reads, written here: its task, the Spec, the pull
      # request's body and, for a fix round, the review's own words.
      - name: The agent's task
        if: steps.may.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          MODE: ${{ steps.what.outputs.mode }}
          NUMBER: ${{ steps.what.outputs.issue }}
          PR: ${{ steps.what.outputs.pr }}
          BRANCH: ${{ steps.what.outputs.branch }}
          ROUND: ${{ steps.what.outputs.round }}
          LANE: ${{ steps.may.outputs.lane }}
          RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          set -euo pipefail
          export BODY="$RUNNER_TEMP/body.md" REPO_AUTONOMY="$RUNNER_TEMP/repo-autonomy.yml" DX_IO="$GITHUB_WORKSPACE/.dx-io"
          mkdir -p "$DX_IO"
          if [ "$MODE" = start ]; then
            # A Feature's Spec carries its phases too (#193).
            ISSUE_TYPE=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER" --jq '.type.name // ""' || true)  # G3 checks it again, failing closed
            export ISSUE_TYPE
            python3 .dx-central/scripts/autopilot.py prompt spec > "$DX_IO/prompt.md"
            exit 0
          fi
          python3 .dx-central/scripts/autopilot.py inputs "$MODE"
          if [ "$MODE" = fix ]; then
            python3 .dx-central/scripts/autopilot.py prompt fix > "$DX_IO/prompt.md"
            exit 0
          fi
          AUTOPILOT_RUN="$RUN_URL" python3 .dx-central/scripts/autopilot.py board
          # What maintainers answered its last question (#247, guided mode):
          # the comments after it, on the pull request and the issue, by
          # people with write access to the repository, checked now.
          gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "autopilot:waiting" >/dev/null 2>&1 || true
          { gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments --jq '.comments'; gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json comments --jq '.comments'; } \
            | jq -s 'add | map({body, createdAt, author: {login: .author.login}})' > "$RUNNER_TEMP/comments.json"
          : > "$RUNNER_TEMP/writers.txt"
          for login in $(jq -r '.[].author.login' "$RUNNER_TEMP/comments.json" | sort -u); do
            role=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$login/permission" --jq .role_name 2>/dev/null || echo none)
            case $role in admin|maintain|write) echo "$login" >> "$RUNNER_TEMP/writers.txt" ;; esac
          done
          COMMENTS="$RUNNER_TEMP/comments.json" WRITERS="$RUNNER_TEMP/writers.txt" python3 .dx-central/scripts/autopilot.py answers > "$RUNNER_TEMP/answers.md"
          ANSWERS="$RUNNER_TEMP/answers.md" python3 .dx-central/scripts/autopilot.py prompt work > "$DX_IO/prompt.md"

      - name: Hand it to the agent
        if: steps.may.outputs.go == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autopilot-in-${{ inputs.mode == 'start' && 'spec' || 'work' }}
          path: .dx-io
          include-hidden-files: true
          overwrite: true
          retention-days: 3

  # --- start: the Spec, by the agent, with no key ---------------------------
  spec:
    name: Autopilot · the Spec
    needs: [where, prep]
    if: ${{ !cancelled() && needs.prep.outputs.go == 'true' && inputs.mode == 'start' }}
    runs-on: ${{ (vars.DX_RUNNER_HEAVY != '' && needs.where.outputs.github-hosted == 'false') && fromJSON(vars.DX_RUNNER_HEAVY) || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.spec.outcome }}
    steps:
      # The working tree, with the job's token, which only reads; nothing
      # keeps it. A reproduced bug's test was written from an outsider's
      # report: git's sparse checkout keeps it in the commits and out of the
      # working tree, before any file is written, so the repository's own
      # tests cannot pick it up; the agent runs it only in the sandbox.
      - name: The working tree
        env:
          TOKEN: ${{ github.token }}
          BRANCH: ''
          DEFAULT: ${{ needs.prep.outputs.default }}
          REPRO_TEST: ${{ needs.prep.outputs.repro-test }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c "http.extraheader=$auth" fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          if [ -n "$REPRO_TEST" ]; then git sparse-checkout set --no-cone '/*' "!/$REPRO_TEST"; fi
          if [ -n "$BRANCH" ]; then git checkout -q -B "$BRANCH" "origin/$BRANCH"; else git checkout -q -B "$DEFAULT" "origin/$DEFAULT"; fi
          git config user.name "$DX_BOT_LOGIN"
          git config user.email "$DX_BOT_ID+$DX_BOT_LOGIN@users.noreply.github.com"

      - name: The organisation's scripts and policy
        id: central
        env:
          REF: ${{ inputs.central-ref || job.workflow_sha }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch "$REF" https://github.com/DiluxOne/.github .dx-central 2>/dev/null \
            || { git clone -q https://github.com/DiluxOne/.github .dx-central && git -C .dx-central checkout -q "$REF"; }
          test ! -f .dx-central/scripts/config-overlay.sh || bash .dx-central/scripts/config-overlay.sh
          echo "ref=$(git -C .dx-central rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          if [ -d .git ]; then printf '%s\n' /.dx-central/ /.dx-io/ /.dx-out/ >> .git/info/exclude; fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: autopilot-in-spec
          path: .dx-io

      - name: The Spec's task
        id: task
        run: |
          set -euo pipefail
          # A random delimiter: the PRD's text cannot end the output early.
          eof="DX_$(openssl rand -hex 16)"
          { echo "prompt<<$eof"; cat .dx-io/prompt.md; echo "$eof"; } >> "$GITHUB_OUTPUT"

      - name: Claude writes the Spec
        id: spec
        timeout-minutes: 20
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        env:
          DX_IO: ${{ github.workspace }}/.dx-io
          NUMBER: ${{ needs.prep.outputs.issue }}
          # Another way's test (#397): how scripts/repro-run.sh runs it.
          REPRO_SPEC: ${{ needs.prep.outputs.repro-spec }}
          REPRO_THEME: ${{ needs.prep.outputs.repro-theme }}
          # Nothing runs in the background (#482), as in the work.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          # The job's own token, which can only read this repository: the
          # agent holds nothing that writes (#287).
          github_token: ${{ github.token }}
          bot_name: ${{ vars.DX_BOT_LOGIN || 'dilux-bot[bot]' }}
          bot_id: ${{ vars.DX_BOT_ID || '333187390' }}
          allowed_bots: ${{ vars.DX_BOT_APP || 'dilux-bot' }}
          prompt: ${{ steps.task.outputs.prompt }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --max-budget-usd ${{ needs.prep.outputs.budget-spec || '3' }}
            --allowedTools "Bash,Read,Write,Glob,Grep"
            --disallowedTools "Monitor"

      - name: What the agent left
        if: always()
        env:
          LOG: ${{ steps.spec.outputs.execution_file }}
        run: |
          mkdir -p .dx-out/transcript
          cp .dx-io/outbox.jsonl .dx-out/ 2>/dev/null || true
          if [ -f "$LOG" ]; then cp "$LOG" .dx-out/transcript/1-spec.json; fi
          # The artifact of a public repository is public: the transcript
          # loses its tokens before it is kept.
          for f in .dx-out/transcript/*.json; do
            [ -f "$f" ] || continue
            python3 .dx-central/scripts/autopilot.py scrub "$f" || rm -f "$f"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: autopilot-out-spec
          path: .dx-out
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30

  # --- start: the Spec on the issue, and the draft, with the key ------------
  draft:
    name: Autopilot · the draft
    needs: [prep, spec]
    if: ${{ !cancelled() && needs.prep.outputs.go == 'true' && inputs.mode == 'start' }}
    runs-on: ubuntu-latest # fresh: it holds the key beside an agent's work (#287)
    timeout-minutes: 15
    permissions: {}
    outputs:
      pr: ${{ steps.draft.outputs.pr }}
      branch: ${{ steps.draft.outputs.branch }}
      why: ${{ steps.draft.outputs.why }}
    steps:
      - name: dilux-bot token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-checks: read
          permission-actions: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.bot.outputs.token }}
          fetch-depth: 0

      - name: The organisation's scripts and policy
        id: central
        env:
          REF: ${{ inputs.central-ref || job.workflow_sha }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch "$REF" https://github.com/DiluxOne/.github .dx-central 2>/dev/null \
            || { git clone -q https://github.com/DiluxOne/.github .dx-central && git -C .dx-central checkout -q "$REF"; }
          test ! -f .dx-central/scripts/config-overlay.sh || bash .dx-central/scripts/config-overlay.sh
          echo "ref=$(git -C .dx-central rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          if [ -d .git ]; then printf '%s\n' /.dx-central/ /.dx-io/ /.dx-out/ >> .git/info/exclude; fi

      - name: The repository's own policy
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/autonomy.yml" --jq .content 2>/dev/null | base64 -d > "$RUNNER_TEMP/repo-autonomy.yml" || : > "$RUNNER_TEMP/repo-autonomy.yml"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: autopilot-out-spec
          path: .dx-out

      # The Spec the agent wrote (only "### Spec: " sections, appended), or
      # its stop: nothing else of its outbox applies before a draft exists.
      - name: The agent's Spec
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          NUMBER: ${{ needs.prep.outputs.issue }}
          REPO_AUTONOMY: ${{ runner.temp }}/repo-autonomy.yml
        run: |
          git config user.name "$DX_BOT_LOGIN"
          git config user.email "$DX_BOT_ID+$DX_BOT_LOGIN@users.noreply.github.com"
          python3 .dx-central/scripts/autopilot.py apply .dx-out/outbox.jsonl spec,stop || true

      - name: The Spec (G3), sealed, and the draft pull request
        id: draft
        if: needs.spec.outputs.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          NUMBER: ${{ needs.prep.outputs.issue }}
          POLICY_REF: ${{ steps.central.outputs.ref }}
          STARTED: ${{ needs.prep.outputs.started }}
          RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          LANE: ${{ needs.prep.outputs.lane }}
          REPRO_TEST: ${{ needs.prep.outputs.repro-test }}
          REPRO_SHA: ${{ needs.prep.outputs.repro-sha }}
          REPRO_BRANCH: ${{ needs.prep.outputs.repro-branch }}
          REPO_AUTONOMY: ${{ runner.temp }}/repo-autonomy.yml
        run: |
          set -euo pipefail
          gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/body.md"
          stopped=$(gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json comments --jq '[.comments[] | select((.body | startswith("<!-- dx-autopilot-stop -->")) and (.author.login | test("^(app/)?" + env.DX_BOT_APP + "(\\[bot\\])?$")) and .createdAt >= env.STARTED)] | length')
          if [ "$stopped" != 0 ]; then echo "The agent stopped after the Spec; it said why on the issue."; exit 0; fi
          # G3 by the issue's Type: a Feature's Spec has its phases (#193).
          # A Type that cannot be read opens nothing.
          if ! type=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER" --jq '.type.name // ""'); then
            echo "why=The issue's Type could not be read, so G3 could not be checked; the draft pull request is not opened." >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! python3 .dx-central/scripts/issue-schema.py check --stage spec --type "$type" < "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/g3.json"; then
            echo "::warning::The Spec does not pass G3: $(jq -c .errors "$RUNNER_TEMP/g3.json")"
            echo "why=The Spec on the issue does not pass G3: $(jq -r '.errors | join("; ")' "$RUNNER_TEMP/g3.json" | head -c 300)" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BODY="$RUNNER_TEMP/body.md" python3 .dx-central/scripts/receipts.py seal-spec
          title=$(gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
          # No checklist, no draft: the end rule then stops the run with a
          # comment and `needs-human`, as it does when G3 fails.
          if ! BODY="$RUNNER_TEMP/body.md" ISSUE_TYPE="$type" TITLE="$title" python3 .dx-central/scripts/autopilot.py draft > "$RUNNER_TEMP/draft.json" 2> "$RUNNER_TEMP/draft.err"; then
            why=$(tr '\n' ' ' < "$RUNNER_TEMP/draft.err" | head -c 300)
            echo "::warning::$why"
            echo "why=The draft pull request was not opened: $why" >> "$GITHUB_OUTPUT"; exit 0
          fi
          branch=$(jq -r .branch "$RUNNER_TEMP/draft.json")
          jq -r .body "$RUNNER_TEMP/draft.json" > "$RUNNER_TEMP/draft.md"
          # A branch left by an earlier, failed attempt is not reused.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then branch="$branch-$GITHUB_RUN_ID"; fi
          if [ "$LANE" = bugfix-reproduced ]; then
            # A reproduced bug's branch starts at the reproduction's own
            # commit: the failing test, byte for byte the one the PRD sealed
            # (its SHA-256), committed but never written to the working tree.
            git fetch -q origin "$REPRO_BRANCH"
            if [ "$(git cat-file blob "FETCH_HEAD:$REPRO_TEST" 2>/dev/null | sha256sum | cut -c1-64)" != "$REPRO_SHA" ]; then
              echo "why=The reproduction test on $REPRO_BRANCH is not the one the PRD sealed; the draft pull request is not opened." >> "$GITHUB_OUTPUT"; exit 0
            fi
            git checkout -q -b "$branch" FETCH_HEAD
            onto=FETCH_HEAD
          else
            onto=$(git rev-parse HEAD)
            git checkout -q -b "$branch"
            git commit -q --allow-empty -m "chore(autopilot): start on #$NUMBER" -m "The draft pull request opens before any code: the Spec as its checklist."
          fi
          # Through the API, so GitHub signs the commit (#190).
          python3 .dx-central/scripts/api-commit.py push "$branch" --onto "$onto"
          url=$(gh pr create --repo "$GITHUB_REPOSITORY" --draft --base "$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq .defaultBranchRef.name)" \
            --head "$branch" --title "$(jq -r .title "$RUNNER_TEMP/draft.json")" --body-file "$RUNNER_TEMP/draft.md" --label autopilot)
          pr=${url##*/}
          gh label create "autopilot:run-1" --repo "$GITHUB_REPOSITORY" --color C5DEF5 --description "The autopilot's runs on this pull request" 2>/dev/null || true
          gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --add-label "autopilot:run-1" >/dev/null
          { echo "pr=$pr"; echo "branch=$branch"; } >> "$GITHUB_OUTPUT"
          AUTOPILOT_RUN="$RUN_URL" python3 .dx-central/scripts/autopilot.py board
          echo "Draft pull request #$pr opened for #$NUMBER: $url"
      - name: The work's task
        if: steps.draft.outputs.pr != ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          NUMBER: ${{ needs.prep.outputs.issue }}
          PR: ${{ steps.draft.outputs.pr }}
          BRANCH: ${{ steps.draft.outputs.branch }}
          LANE: ${{ needs.prep.outputs.lane }}
          REPO_AUTONOMY: ${{ runner.temp }}/repo-autonomy.yml
        run: |
          set -euo pipefail
          gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/body.md"
          export BODY="$RUNNER_TEMP/body.md" DX_IO="$GITHUB_WORKSPACE/.dx-io"
          mkdir -p "$DX_IO"
          python3 .dx-central/scripts/autopilot.py inputs start
          python3 .dx-central/scripts/autopilot.py prompt work > "$DX_IO/prompt.md"

      - name: Hand it to the agent
        if: steps.draft.outputs.pr != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autopilot-in-work
          path: .dx-io
          include-hidden-files: true
          overwrite: true
          retention-days: 3

  # --- the work, by the agent, with no key ----------------------------------
  work:
    name: Autopilot (${{ inputs.mode }}) · the work
    needs: [where, prep, draft]
    if: ${{ !cancelled() && needs.prep.outputs.go == 'true' && (inputs.mode != 'start' || needs.draft.outputs.pr != '') }}
    runs-on: ${{ (vars.DX_RUNNER_HEAVY != '' && needs.where.outputs.github-hosted == 'false') && fromJSON(vars.DX_RUNNER_HEAVY) || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.work.outcome }}
    steps:
      # The working tree, with the job's token, which only reads; nothing
      # keeps it. A reproduced bug's test was written from an outsider's
      # report: git's sparse checkout keeps it in the commits and out of the
      # working tree, before any file is written, so the repository's own
      # tests cannot pick it up; the agent runs it only in the sandbox.
      - name: The working tree
        env:
          TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.draft.outputs.branch || needs.prep.outputs.branch }}
          DEFAULT: ${{ needs.prep.outputs.default }}
          REPRO_TEST: ${{ needs.prep.outputs.repro-test }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c "http.extraheader=$auth" fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          if [ -n "$REPRO_TEST" ]; then git sparse-checkout set --no-cone '/*' "!/$REPRO_TEST"; fi
          if [ -n "$BRANCH" ]; then git checkout -q -B "$BRANCH" "origin/$BRANCH"; else git checkout -q -B "$DEFAULT" "origin/$DEFAULT"; fi
          git config user.name "$DX_BOT_LOGIN"
          git config user.email "$DX_BOT_ID+$DX_BOT_LOGIN@users.noreply.github.com"

      - name: The organisation's scripts and policy
        id: central
        env:
          REF: ${{ inputs.central-ref || job.workflow_sha }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch "$REF" https://github.com/DiluxOne/.github .dx-central 2>/dev/null \
            || { git clone -q https://github.com/DiluxOne/.github .dx-central && git -C .dx-central checkout -q "$REF"; }
          test ! -f .dx-central/scripts/config-overlay.sh || bash .dx-central/scripts/config-overlay.sh
          echo "ref=$(git -C .dx-central rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          if [ -d .git ]; then printf '%s\n' /.dx-central/ /.dx-io/ /.dx-out/ >> .git/info/exclude; fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: autopilot-in-work
          path: .dx-io

      - name: The work's task
        id: task
        env:
          DEFAULT: ${{ needs.prep.outputs.default }}
        run: |
          set -euo pipefail
          # What is new from here on goes to GitHub; tick reads the commits
          # since the default branch.
          { echo "start=$(git rev-parse HEAD)"; echo "base=$(git merge-base HEAD "origin/$DEFAULT")"; echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; } >> "$GITHUB_OUTPUT"
          eof="DX_$(openssl rand -hex 16)"
          { echo "prompt<<$eof"; cat .dx-io/prompt.md; echo "$eof"; } >> "$GITHUB_OUTPUT"

      - name: Claude works
        id: work
        # Under the job's timeout: what it committed still goes on.
        timeout-minutes: 75
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        env:
          DX_IO: ${{ github.workspace }}/.dx-io
          DX_BASE: ${{ steps.task.outputs.base }}
          NUMBER: ${{ needs.prep.outputs.issue }}
          PR: ${{ needs.draft.outputs.pr || needs.prep.outputs.pr }}
          BRANCH: ${{ needs.draft.outputs.branch || needs.prep.outputs.branch }}
          REPRO_TEST: ${{ needs.prep.outputs.repro-test }}
          REPRO_SHA: ${{ needs.prep.outputs.repro-sha }}
          # Another way's test (#397): how scripts/repro-run.sh runs it.
          REPRO_SPEC: ${{ needs.prep.outputs.repro-spec }}
          REPRO_THEME: ${{ needs.prep.outputs.repro-theme }}
          # Nothing runs in the background (#482): a run ends when the agent
          # stops, and nothing tells it a background task finished (FM
          # #227 left its suite running and never finished). And a command
          # may run as long as the step does: `make pre-pr` runs whole.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          BASH_MAX_TIMEOUT_MS: "4500000"
          BASH_DEFAULT_TIMEOUT_MS: "600000"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          # The job's own token, which can only read this repository: the
          # agent holds nothing that writes (#287).
          github_token: ${{ github.token }}
          bot_name: ${{ vars.DX_BOT_LOGIN || 'dilux-bot[bot]' }}
          bot_id: ${{ vars.DX_BOT_ID || '333187390' }}
          allowed_bots: ${{ vars.DX_BOT_APP || 'dilux-bot' }}
          prompt: ${{ steps.task.outputs.prompt }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 150
            --max-budget-usd ${{ needs.prep.outputs.budget-work || (needs.prep.outputs.mode == 'fix' && '10' || '20') }}
            --allowedTools "Bash,Read,Edit,MultiEdit,Write,Glob,Grep"
            --disallowedTools "Monitor"

      - name: What the agent left
        if: always()
        env:
          START: ${{ steps.task.outputs.start }}
          WORK_LOG: ${{ steps.work.outputs.execution_file }}
          WORK_STARTED: ${{ steps.task.outputs.at }}
        run: |
          mkdir -p .dx-out/transcript
          cp .dx-io/outbox.jsonl .dx-out/ 2>/dev/null || true
          # Its new commits, as a bundle the next job pushes.
          if [ -n "$START" ] && [ "$(git rev-parse HEAD)" != "$START" ]; then
            git bundle create -q .dx-out/work.bundle "$START..HEAD" || echo "::warning::The commits could not be bundled."
          fi
          # Best effort: the log wherever it is (the action's output, the
          # file it writes, or the CLI's session when the step was killed).
          WORK_LOG=$(python3 .dx-central/scripts/autopilot.py work-log) || WORK_LOG=""
          if [ -n "$WORK_LOG" ] && [ -f "$WORK_LOG" ]; then cp "$WORK_LOG" .dx-out/transcript/2-work.json; fi
          for f in .dx-out/transcript/*.json; do
            [ -f "$f" ] || continue
            python3 .dx-central/scripts/autopilot.py scrub "$f" || rm -f "$f"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: autopilot-out-work
          path: .dx-out
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30

  # --- every mode: the agent's work on GitHub, and the verdict --------------
  apply:
    name: Autopilot (${{ inputs.mode }}) · apply and end
    needs: [prep, spec, draft, work]
    if: ${{ always() && needs.prep.outputs.go == 'true' }}
    runs-on: ubuntu-latest # fresh: it holds the key beside an agent's work (#287)
    timeout-minutes: 30
    permissions: {}
    steps:
      - name: dilux-bot token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-checks: read
          permission-actions: read
          # The organisation's own repository (#498): its engine is the
          # work, so the agent's commits there may change a workflow, which
          # GitHub pushes only with this permission. Elsewhere it is empty,
          # so not asked for. A person merges every such change.
          permission-workflows: ${{ github.repository == format('{0}/.github', github.repository_owner) && 'write' || '' }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.bot.outputs.token }}
          fetch-depth: 0

      - name: The organisation's scripts and policy
        id: central
        env:
          REF: ${{ inputs.central-ref || job.workflow_sha }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch "$REF" https://github.com/DiluxOne/.github .dx-central 2>/dev/null \
            || { git clone -q https://github.com/DiluxOne/.github .dx-central && git -C .dx-central checkout -q "$REF"; }
          test ! -f .dx-central/scripts/config-overlay.sh || bash .dx-central/scripts/config-overlay.sh
          echo "ref=$(git -C .dx-central rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          if [ -d .git ]; then printf '%s\n' /.dx-central/ /.dx-io/ /.dx-out/ >> .git/info/exclude; fi

      - name: The repository's own policy
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/autonomy.yml" --jq .content 2>/dev/null | base64 -d > "$RUNNER_TEMP/repo-autonomy.yml" || : > "$RUNNER_TEMP/repo-autonomy.yml"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: autopilot-out-work
          path: .dx-out

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.mode == 'start'
        continue-on-error: true
        with:
          name: autopilot-out-spec
          path: .dx-out-spec

      # The agent's commits, onto the branch as GitHub has it (never over
      # it), and never a workflow outside the organisation's own repository
      # (#498): pushed through the API, so GitHub signs them. Then each intent, through the checks a person's run uses.
      - name: The agent's commits and intents
        id: applied
        if: needs.work.result != 'skipped'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          NUMBER: ${{ needs.prep.outputs.issue }}
          PR: ${{ needs.draft.outputs.pr || needs.prep.outputs.pr }}
          BRANCH: ${{ needs.draft.outputs.branch || needs.prep.outputs.branch }}
          REPO_AUTONOMY: ${{ runner.temp }}/repo-autonomy.yml
          ENGINE: ${{ github.repository == format('{0}/.github', github.repository_owner) }}
        run: |
          set -euo pipefail
          git config user.name "$DX_BOT_LOGIN"
          git config user.email "$DX_BOT_ID+$DX_BOT_LOGIN@users.noreply.github.com"
          if [ -f .dx-out/work.bundle ]; then
            git fetch -q .dx-out/work.bundle HEAD
            new=$(git rev-parse FETCH_HEAD)
            if ! git merge-base --is-ancestor "origin/$BRANCH" "$new"; then
              echo "::error::The agent's commits do not build on $BRANCH as GitHub has it: nothing is pushed."; exit 1
            fi
            # Read whole, then searched: a pipe into grep -q could end early
            # and, under pipefail, read as no match.
            changed=$(git diff --name-only "origin/$BRANCH" "$new")
            if grep -q '^\.github/workflows/' <<<"$changed" && [ "$ENGINE" != true ]; then
              echo "::error::The agent's commits change .github/workflows: nothing is pushed."; exit 1
            fi
            git checkout -q -B "$BRANCH" "$new"
            python3 .dx-central/scripts/autopilot.py push
            # The pull request shows a push a few seconds after the branch
            # moves; a tick read before then finds no commit (the sandbox's
            # first run, #287). Wait for it, a minute at most.
            # Read where tick reads it: the pull request's commits.
            pushed=$(git rev-parse HEAD); shown=false
            for _ in $(seq 1 30); do
              listed=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --paginate --jq '.[].sha' 2>/dev/null || true)
              if grep -qx "$pushed" <<<"$listed"; then shown=true; break; fi
              sleep 2
            done
            [ "$shown" = true ] || echo "::warning::#$PR does not show $pushed after a minute; a tick may find no commit (a continue run ticks it)."
          fi
          python3 .dx-central/scripts/autopilot.py apply .dx-out/outbox.jsonl

      # A fresh token for the verdict, however long the rest took.
      - name: dilux-bot token for the end
        id: bot-end
        if: always()
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-checks: read
          permission-actions: read

      - name: The end rule
        id: end
        if: always()
        env:
          GH_TOKEN: ${{ steps.bot-end.outputs.token }}
          MODE: ${{ needs.prep.outputs.mode }}
          NUMBER: ${{ needs.prep.outputs.issue }}
          PR: ${{ needs.draft.outputs.pr || needs.prep.outputs.pr }}
          RUNS: ${{ needs.prep.outputs.runs }}
          STARTED: ${{ needs.prep.outputs.started }}
          HEAD_BEFORE: ${{ needs.prep.outputs.mode == 'fix' && needs.prep.outputs.head || '' }}
          WORK_OUTCOME: ${{ needs.work.outputs.outcome || needs.work.result }}
          SPEC_OUTCOME: ${{ needs.spec.outputs.outcome || needs.spec.result }}
          WHY: ${{ needs.draft.outputs.why }}
          WORK_LOG: .dx-out/transcript/2-work.json
          RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          REPO_AUTONOMY: ${{ runner.temp }}/repo-autonomy.yml
        run: |
          set -euo pipefail
          export AUTOPILOT_RUN="$RUN_URL"
          python3 .dx-central/scripts/autopilot.py end

      # The end rule failed before it said its verdict (its log says why):
      # the run still leaves a comment and `needs-human`, with the fresh
      # token, or with the job's own when even that step failed.
      - name: The last resort
        id: last-resort
        if: always() && steps.end.outcome != 'success' && steps.end.outputs.verdict == ''
        env:
          GH_TOKEN: ${{ steps.bot-end.outputs.token || github.token }}
          NUMBER: ${{ needs.prep.outputs.issue }}
          PR: ${{ needs.draft.outputs.pr || needs.prep.outputs.pr }}
          RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          REPO_AUTONOMY: ${{ runner.temp }}/repo-autonomy.yml
        run: |
          export AUTOPILOT_RUN="$RUN_URL"
          python3 .dx-central/scripts/autopilot.py last-resort

      - name: The run's account
        if: always()
        run: |
          found=false
          for f in .dx-out-spec/transcript/*.json .dx-out/transcript/*.json; do
            [ -f "$f" ] || continue
            found=true
            case "$f" in *spec*) t="The autopilot's run: the Spec" ;; *) t="The autopilot's run: the work" ;; esac
            python3 .dx-central/scripts/autopilot.py account "$f" "$t" >> "$GITHUB_STEP_SUMMARY"
          done
          [ "$found" = true ] || printf '## The autopilot'"'"'s run\n\nThe agent did not run.\n' >> "$GITHUB_STEP_SUMMARY"
