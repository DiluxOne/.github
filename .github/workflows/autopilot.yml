name: Autopilot

# Reusable. The autopilot (#83, the plan in #78): an issue a person accepted,
# worked by Claude to a pull request, and its review's blocking points fixed,
# round after round, until the review is clean or the rounds run out.
#
#   mode: start  called from issue-triage.yml when a person adds `accepted`.
#                It starts only if the autopilot is on (policy/autonomy.yml,
#                the repository's own .github/autonomy.yml, DX_AUTOPILOT) and
#                the issue is ready (G1). The agent writes the Spec into the
#                issue (G3, sealed on the receipts branch), branches,
#                implements with one test per criterion, runs the
#                repository's checks and opens the pull request, labelled
#                `autopilot`. From there the organisation's pipeline runs as
#                on any pull request.
#   mode: fix    called from org-pull-request.yml when the review of an
#                `autopilot` pull request blocks: one round of fixes, pushed
#                to its branch, which runs the pipeline again. After
#                `autopilot-rounds` rounds (3) it hands the pull request to a
#                person (`needs-human`, with a summary).
#
# Whether it merges is auto-merge.yml's decision (scripts/autopilot.py
# decide, gate G7): never a Critical issue, never a change to the protected
# paths, never while the review blocks, and within the lane's caps.
#
# It acts as dilux-bot (its token for git and the API), never as a person, so
# its commits and pull requests are told apart from the maintainer's. It
# runs where the repository's jobs run (DX_RUNNER), one run per issue.
# Known limit: the agent holds dilux-bot's token, the same App that writes
# the receipts branch; a later step moves seals to an App of their own. Every input it reads from the issue is the PRD at its sealed
# text, fenced as data in the prompt (scripts/autopilot.py).

on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      issue:
        description: The issue (mode start).
        type: string
        default: ''
      pr:
        description: The pull request (mode fix).
        type: string
        default: ''
      central-ref:
        type: string
        default: v5
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      DILUX_BOT_PRIVATE_KEY:
        required: false

permissions: {}

# One run per issue (a fix belongs to its pull request): a newer run never
# drops one waiting for another issue.
concurrency:
  group: autopilot-${{ github.repository }}-${{ inputs.issue || inputs.pr }}
  cancel-in-progress: false

jobs:
  run:
    name: Autopilot (${{ inputs.mode }})
    runs-on: ${{ vars.DX_RUNNER == 'self-hosted' && fromJSON('["self-hosted","linux","x64","diluxone"]') || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions: {}
    steps:
      - name: dilux-bot token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-checks: read
          permission-actions: read

      # The repository at the workspace's root, where the agent works: its
      # default branch for a new issue, the pull request's branch for a fix.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.bot.outputs.token }}
          ref: ${{ inputs.mode == 'fix' && format('refs/pull/{0}/head', inputs.pr) || '' }}
          fetch-depth: 0

      - name: The organisation's scripts and policy
        id: central
        env:
          REF: ${{ inputs.central-ref }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch "$REF" https://github.com/DiluxOne/.github .dx-central 2>/dev/null \
            || { git clone -q https://github.com/DiluxOne/.github .dx-central && git -C .dx-central checkout -q "$REF"; }
          echo "ref=$(git -C .dx-central rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo ".dx-central/" >> .git/info/exclude

      - name: What to work on
        id: what
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          MODE: ${{ inputs.mode }}
          ISSUE: ${{ inputs.issue }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          if [ "$MODE" = fix ]; then
            author=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json author --jq .author.login)
            case "$author" in dilux-bot|"dilux-bot[bot]"|app/dilux-bot) ;; *) echo "#$PR was opened by $author, not dilux-bot: no autopilot round."; exit 1 ;; esac
            ISSUE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json closingIssuesReferences --jq '.closingIssuesReferences[0].number // empty')
            branch=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)
            labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(",")')
            round=$(( $(tr ',' '\n' <<<"$labels" | sed -n 's/^autopilot:round-\([0-9]*\)$/\1/p' | sort -n | tail -1) + 1 ))
            { echo "branch=$branch"; echo "round=$round"; } >> "$GITHUB_OUTPUT"
          fi
          [ -n "$ISSUE" ] || { echo "No issue to work on."; exit 1; }
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/body.md"
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/autonomy.yml" --jq .content 2>/dev/null | base64 -d > "$RUNNER_TEMP/repo-autonomy.yml" || : > "$RUNNER_TEMP/repo-autonomy.yml"

      - name: May it start
        id: may
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          DX_AUTOPILOT: ${{ vars.DX_AUTOPILOT }}
          MODE: ${{ inputs.mode }}
          ISSUE: ${{ steps.what.outputs.issue }}
          PR: ${{ inputs.pr }}
          ROUND: ${{ steps.what.outputs.round }}
        run: |
          set -euo pipefail
          export BODY="$RUNNER_TEMP/body.md" REPO_AUTONOMY="$RUNNER_TEMP/repo-autonomy.yml"
          if ! why=$(python3 .dx-central/scripts/autopilot.py may-start); then
            echo "The autopilot does not start: $why"
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$MODE" = start ]; then
            # The agent works only from the PRD a person accepted: its seal
            # (written by issue-accepted.yml, which runs alongside) must
            # exist and match the issue now. Waits up to two minutes for it.
            v=unsealed
            for _ in $(seq 1 12); do
              v=$(NUMBER="$ISSUE" python3 .dx-central/scripts/receipts.py verify-prd || true)
              [ "$v" = unsealed ] || break
              sleep 10
            done
            if [ "$v" != match ]; then
              echo "The autopilot does not start: the PRD is not the one sealed on acceptance ($v)."
              echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          if [ "$MODE" = fix ]; then
            # A failed read stops the step: it must not count as "no label".
            human=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | index("needs-human") != null')
          fi
          if [ "$MODE" = fix ] && [ "$human" = true ]; then
            echo "#$PR is a person's now (needs-human): the autopilot stays out."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$MODE" = fix ]; then
            max=$(python3 .dx-central/scripts/autonomy.py policy | jq -r '."autopilot-rounds" // 3')
            if [ "$ROUND" -gt "$max" ]; then
              gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label needs-human >/dev/null || true
              gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "The autopilot spent its $max rounds and the review still blocks: a person takes it from here. The review's open threads say what is left.

          🤖 AI-generated · Claude Opus 5.5 (Anthropic)" >/dev/null
              echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          else
            open_prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --search "linked:issue $ISSUE" --json number --jq 'length')
            if [ "$open_prs" != 0 ]; then
              echo "A pull request already closes #$ISSUE: nothing to start."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: The task
        id: task
        if: steps.may.outputs.go == 'true'
        env:
          MODE: ${{ inputs.mode }}
          NUMBER: ${{ steps.what.outputs.issue }}
          PR: ${{ inputs.pr }}
          ROUND: ${{ steps.what.outputs.round }}
          BRANCH: ${{ steps.what.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "dilux-bot[bot]"
          git config user.email "333187390+dilux-bot[bot]@users.noreply.github.com"
          # A fix works on the pull request's branch by name, so it can push.
          if [ "$MODE" = fix ]; then
            git fetch -q origin "$BRANCH"
            git checkout -q -B "$BRANCH" "origin/$BRANCH"
          fi
          export BODY="$RUNNER_TEMP/body.md" REPO_AUTONOMY="$RUNNER_TEMP/repo-autonomy.yml"
          # A random delimiter: the PRD's text cannot end the output early.
          eof="DX_$(openssl rand -hex 16)"
          {
            echo "prompt<<$eof"
            python3 .dx-central/scripts/autopilot.py prompt "$MODE"
            echo "$eof"
          } >> "$GITHUB_OUTPUT"

      # Counted before the agent runs: a round that fails or times out after
      # pushing still counts, so the cap holds.
      - name: Count the round
        if: steps.may.outputs.go == 'true' && inputs.mode == 'fix'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          PR: ${{ inputs.pr }}
          ROUND: ${{ steps.what.outputs.round }}
        run: |
          gh label create "autopilot:round-$ROUND" --repo "$GITHUB_REPOSITORY" --color C5DEF5 --description "The autopilot's review rounds on this pull request" 2>/dev/null || true
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label "autopilot:round-$ROUND" >/dev/null

      - name: Claude works
        if: steps.may.outputs.go == 'true'
        timeout-minutes: 75
        uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515 # v1.0.245
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ steps.bot.outputs.token }}
          bot_name: dilux-bot[bot]
          bot_id: '333187390'
          # A fix round runs from the pipeline the bot's own push started.
          allowed_bots: dilux-bot
          prompt: ${{ steps.task.outputs.prompt }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 150
            --allowedTools "Bash,Read,Edit,MultiEdit,Write,Glob,Grep"

      - name: The Spec (G3), sealed
        if: steps.may.outputs.go == 'true' && inputs.mode == 'start'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          NUMBER: ${{ steps.what.outputs.issue }}
          POLICY_REF: ${{ steps.central.outputs.ref }}
        run: |
          set -euo pipefail
          gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/body.md"
          if python3 .dx-central/scripts/issue-schema.py check --stage spec < "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/g3.json"; then
            BODY="$RUNNER_TEMP/body.md" python3 .dx-central/scripts/receipts.py seal-spec
          else
            echo "::warning::The Spec does not pass G3: $(jq -c .errors "$RUNNER_TEMP/g3.json")"
          fi
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --author "app/dilux-bot" --search "linked:issue $NUMBER" --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --add-label autopilot >/dev/null || true
            echo "Pull request #$pr opened for #$NUMBER."
          else
            echo "::warning::No pull request closes #$NUMBER after the run; the agent said why on the issue, or a person takes it."
          fi

