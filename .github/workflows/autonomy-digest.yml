name: Decided by policy

# Not reusable. Every Monday, and by hand: lists everything in the
# organisation that the autonomy policy (policy/autonomy.yml) accepted or
# merged instead of a person during the last seven days, as a comment on the
# issue "Decided by policy" of this repository (opened by the first run that
# needs it). The issues and pull requests carry `accepted-by:policy` or
# `merged-by:policy`; each line links one, with its repository and title. A
# week with nothing decided by policy says so. This is how the maintainer
# sees, in one place, what proceeded without them.

on:
  schedule:
    - cron: '41 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    name: The week's decisions by policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: dilux-bot token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-issues: write
          permission-pull-requests: read
          permission-metadata: read

      - name: Post the digest
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          since=$(date -u -d '7 days ago' +%Y-%m-%d)
          lines=""
          for label in accepted-by:policy merged-by:policy; do
            found=$(gh search issues --owner "$OWNER" --label "$label" --updated ">=$since" --include-prs --limit 200 \
              --json url,title,repository --jq '.[] | "- [\(.repository.nameWithOwner)] \(.title) (\(.url))"') || found=""
            [ -z "$found" ] || lines+="**${label}**"$'\n'"${found}"$'\n\n'
          done
          [ -n "$lines" ] || lines="Nothing was accepted or merged by policy since ${since}."
          title="Decided by policy"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ -z "$n" ]; then
            n=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "Every Monday, what the autonomy policy (policy/autonomy.yml) accepted or merged in the organisation instead of a person, by autonomy-digest.yml.

          🤖 AI-generated · Claude Opus 5.5 (Anthropic)" | sed 's#.*/##')
          fi
          gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "Week since ${since}:

          ${lines}"
