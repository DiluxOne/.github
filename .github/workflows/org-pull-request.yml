name: Pull request (organisation)

# The pull request pipeline of every DiluxOne repository, in one place. An
# organisation ruleset requires this workflow on every repository's default
# branch, so it runs on each pull request with no file in the repository:
# the conventions with the accepted-issue gate, then the Claude review and
# the auto-merge decision; beside them, the issues it closes go to its
# author when a member of the organisation (pull-request-assignee.yml, #73);
# and, in a private repository, a call that starts the organisation's VM its
# jobs wait for, instead of leaving them to runner-vm.yml's schedule
# (runner-wake.yml, #154).
# The job ids are the ones the repositories' own pull-request.yml used, so
# the check names stay "conventions / Conventions (branch, title, commits)",
# "conventions / Docs (links and names)" and "review / Claude review".
#
# Here, an edit of the title or description runs it too: the conventions check
# it, and the review spends nothing on a commit it already read
# (claude-review.yml keeps an edit in a concurrency group of its own, so
# nothing is cancelled). In the other repositories, where the ruleset runs it,
# only a push does: not an edit, and not a draft marked ready, so the
# autopilot pushes an empty commit once it marks one ready (#269). The `on:`
# types below still list them for this repository; elsewhere they gave no run
# (DiluxOne/diluxone-users-wordpress#62: marked ready, then edited).
#
# A repository's own checks of its kind (a WordPress plugin's Plugin Check
# and suites, its release) stay in its own workflow; the review does not
# wait for them yet (docs/plans/org-first.md, step 6). On a fork's pull
# request the conventions and the gate run with a read-only token and no
# secret; the review, which needs secrets, skips forks.
#
# This repository runs its own pipeline (pull-request.yml), which reviews
# changes to these workflows with the version in the pull request, so the
# jobs here skip DiluxOne/.github.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  conventions:
    if: github.repository != 'DiluxOne/.github'
    permissions:
      contents: read
      pull-requests: read # the pull request's timeline, for the base-branch check on `edited`
      issues: read # the issues it closes, for the accepted-issue gate
      actions: read # the run that opened a lane's issue (policy/autonomy.yml)
    uses: DiluxOne/.github/.github/workflows/conventions.yml@rc-v5

  # The issues it closes go to its author, when a member of the
  # organisation (#73); on open, reopen, ready and a changed description.
  assignee:
    if: github.repository != 'DiluxOne/.github'
    permissions: {}
    uses: DiluxOne/.github/.github/workflows/pull-request-assignee.yml@rc-v5
    secrets:
      DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}

  # The VM the private repositories' jobs run on is off while idle: start it
  # now (#154). On GitHub's runner, a few seconds; skipped where
  # DX_RUNNER_HEAVY names no self-hosted runner, so in every public repository. Not on `edited`: an
  # edit queues only the conventions, mostly right after the push or the
  # review that already woke the VM, and the schedule covers the rest, so
  # edits spend no minutes on it.
  wake-vm:
    if: github.repository != 'DiluxOne/.github' && github.event.action != 'edited'
    permissions: {}
    uses: DiluxOne/.github/.github/workflows/runner-wake.yml@rc-v5
    secrets:
      DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}

  review:
    needs: [conventions]
    if: github.repository != 'DiluxOne/.github'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: DiluxOne/.github/.github/workflows/claude-review.yml@rc-v5
    with:
      # The repository's kind (kind: in .github/review-policy.yml) adds its
      # own profile to the general one.
      profile: general
    secrets: inherit

  auto-merge:
    needs: review
    if: always() && github.repository != 'DiluxOne/.github' && needs.review.result != 'skipped'
    uses: DiluxOne/.github/.github/workflows/auto-merge.yml@rc-v5
    with:
      risk: ${{ needs.review.outputs.risk }}
      complexity: ${{ needs.review.outputs.complexity }}
      floor: ${{ needs.review.outputs.floor }}
      trusted: ${{ needs.review.outputs.trusted }}
      blocking: ${{ needs.review.outputs.blocking }}
      description-ok: ${{ needs.review.outputs.description-ok }}
      enabled: ${{ needs.review.outputs.auto-merge }}
    secrets: inherit

  # An autopilot pull request whose review blocks: one round of fixes by the
  # autopilot (#83), which pushes and so runs this pipeline again; after its
  # rounds it hands the pull request to a person.
  autopilot-fix:
    needs: review
    # Only dilux-bot's own pull requests, and only for a new commit (an edit
    # of the description keeps the review's verdict and must not spend a
    # round).
    if: always() && github.repository != 'DiluxOne/.github' && needs.review.outputs.blocking == 'true' && contains(github.event.pull_request.labels.*.name, 'autopilot') && github.event.pull_request.user.login == 'dilux-bot[bot]' && github.event.action != 'edited'
    # The agent's jobs read the repository with the job's own token (#287).
    permissions:
      contents: read
    uses: DiluxOne/.github/.github/workflows/autopilot.yml@rc-v5
    with:
      mode: fix
      pr: ${{ format('{0}', github.event.pull_request.number) }}
    secrets: inherit
