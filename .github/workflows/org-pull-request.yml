name: Pull request (organisation)

# The pull request pipeline of every DiluxOne repository, in one place. The
# organisation ruleset "org: required workflow" requires this workflow, at
# `v7`, on every adopted repository's default branch, so it runs on each pull
# request with no file in the repository, in every one but the test
# repository (org.yml `test-repo`, #748): there the same jobs run from its own
# caller, workflow-templates/test-pull-request.yml, which the release lane
# moves to `@v7-next`, since this workflow is read at `v7` with its calls
# hard-wired to `@v7` and so could never try a candidate. Keep its `on:` and
# jobs and that template's in step (tests/workflows/test_test_repo_pipeline.py):
# the conventions with the accepted-issue gate, then the Claude review and
# the auto-merge decision; beside them, the "Test first" check (test-first.yml,
# #734: a fix or a feature's test fails at the base and passes at the head), the issues it closes go to its
# author when a member of the organisation (pull-request-assignee.yml, #73);
# and, in a private repository, a call that starts the organisation's VM its
# jobs wait for, instead of leaving them to runner-vm.yml's schedule
# (runner-wake.yml, #154).
# The job ids are the ones the repositories' own pull-request.yml used, so
# the check names stay "conventions / Conventions (branch, title, commits)",
# "conventions / Docs (links and names)" and "review / Claude review".
#
# Here, an edit of the title or description runs it too: the conventions check
# it, and the review spends nothing on a commit it already read
# (claude-review.yml keeps an edit in a concurrency group of its own, so
# nothing is cancelled; and a run of a commit that is no longer the head,
# as when a push follows the opening by seconds, reviews nothing and cancels
# nothing, and its auto-merge and fix round skip: the head's run does them,
# #888). In the other repositories, where the ruleset runs it,
# only a push does: not an edit, and not a draft marked ready, so the
# autopilot pushes an empty commit once it marks one ready (#269). The `on:`
# types below still list them for this repository; elsewhere they gave no run
# (DiluxOne/diluxone-users-wordpress#62: marked ready, then edited). Where it
# runs on them (the test repository's caller), the review skips an autopilot
# pull request marked ready: the push that follows, the agent's last commits
# with that empty commit on top, starts the one review (#820).
#
# A repository's own checks of its kind (a WordPress plugin's Plugin Check
# and suites, its release) stay in its own workflow; the review does not
# wait for them yet (docs/plans/org-first.md, step 6). On a fork's pull
# request the conventions and the gate run with a read-only token and no
# secret; the review, which needs secrets, skips forks.
# After the review, whom the pull request waits on goes on its board, with
# one mention, and into the organisation's "What waits" view (waiting,
# #564); a fork's is covered by issues.yml, by its metadata only.
# An autopilot pull request of this repository's own branch that changes
# the browser layer gets its before and after screenshots when it is
# marked ready (screenshots, pr-screenshots.yml, #564).
#
# This repository runs its own pipeline (pull-request.yml), which reviews
# changes to these workflows with the version in the pull request, so the
# jobs here skip DiluxOne/.github.

on:
  pull_request:
    # `dequeued` (#479): the merge queue dropped it; only autopilot-queue
    # runs then.
    types: [opened, synchronize, reopened, ready_for_review, edited, dequeued]
  # In a repository with a merge queue (#451), the group the queue builds
  # runs this workflow too, which its ruleset requires there as well: the
  # pull request's jobs (its conventions, its review, its merge) were done
  # on the pull request, so only `queue` runs, and the queue waits for it.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  conventions:
    if: github.event_name == 'pull_request' && github.event.action != 'dequeued' && github.repository != 'DiluxOne/.github'
    permissions:
      contents: read
      pull-requests: read # the pull request's timeline, for the base-branch check on `edited`
      issues: read # the issues it closes, for the accepted-issue gate
      actions: read # the run that opened a lane's issue (policy/autonomy.yml)
    uses: DiluxOne/.github/.github/workflows/conventions.yml@v7

  # The "Test first" check (#734, test-first.yml): a `fix` or `feat` pull
  # request carries a test that fails at its base and passes at its head,
  # where its declaration (`test-first:`, its kind's pack) says tests are.
  # On a fork's too: its tests run on GitHub's fresh runner, sandboxed, with
  # no secret. An edit runs it again only when it changes the title (the
  # type).
  test-first:
    if: github.event_name == 'pull_request' && github.event.action != 'dequeued' && github.repository != 'DiluxOne/.github' && (github.event.action != 'edited' || github.event.changes.title)
    permissions:
      contents: read
    uses: DiluxOne/.github/.github/workflows/test-first.yml@v7

  # The "Security gate" check (#956, security-gate.yml): leaked secrets,
  # insecure code, vulnerable dependencies and unsafe workflows, on what the
  # pull request adds or modifies, with no secret and a read-only token (a
  # fork's too). Under org.yml `security-gate: report` it never fails; the
  # review waits for it and reads its result in its brief.
  security-gate:
    if: github.event_name == 'pull_request' && github.event.action != 'dequeued' && github.repository != 'DiluxOne/.github'
    permissions:
      contents: read
    uses: DiluxOne/.github/.github/workflows/security-gate.yml@v7

  # The issues it closes go to its author, when a member of the
  # organisation (#73); on open, reopen, ready and a changed description.
  assignee:
    if: github.event_name == 'pull_request' && github.event.action != 'dequeued' && github.repository != 'DiluxOne/.github'
    permissions: {}
    uses: DiluxOne/.github/.github/workflows/pull-request-assignee.yml@v7
    secrets:
      DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}

  # The VM the private repositories' jobs run on is off while idle: start it
  # now (#154). On GitHub's runner, a few seconds; skipped where
  # DX_RUNNER_HEAVY names no self-hosted runner, so in every public repository. Not on `edited`: an
  # edit queues only the conventions, mostly right after the push or the
  # review that already woke the VM, and the schedule covers the rest, so
  # edits spend no minutes on it.
  wake-vm:
    if: github.repository != 'DiluxOne/.github' && github.event.action != 'edited' && github.event.action != 'dequeued'
    permissions: {}
    uses: DiluxOne/.github/.github/workflows/runner-wake.yml@v7
    secrets:
      DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}

  review:
    # order: the conventions gate passes first, so no review is paid for a
    # pull request it refuses; and the security gate (#956), whose result
    # the review reads in its brief.
    needs: [conventions, security-gate]
    # #820: not when an autopilot pull request is marked ready: the push
    # that follows, with the ready commit, starts the one review.
    if: github.event_name == 'pull_request' && github.event.action != 'dequeued' && github.repository != 'DiluxOne/.github' && !(github.event.action == 'ready_for_review' && contains(github.event.pull_request.labels.*.name, 'autopilot') && github.event.pull_request.user.login == vars.DX_BOT_LOGIN)
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: DiluxOne/.github/.github/workflows/claude-review.yml@v7
    with:
      # The repository's kind (kind: in .github/review-policy.yml) adds its
      # own profile to the general one.
      profile: general
    secrets: inherit

  auto-merge:
    # order: after the "Test first" check too (#842), whose verdict at the
    # head G7 reads for a criterion's test.
    needs: [review, test-first]
    # #888: not on a run whose commit is no longer the head (its review
    # was skipped); the head's run decides.
    if: always() && github.event_name == 'pull_request' && github.repository != 'DiluxOne/.github' && needs.review.result != 'skipped' && needs.review.outputs.current != 'false'
    # Its `repro` job reads the lane issue a reproduced bug's fix closes (#397).
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read # the head's check runs, for G7 (#842)
    uses: DiluxOne/.github/.github/workflows/auto-merge.yml@v7
    with:
      risk: ${{ needs.review.outputs.risk }}
      complexity: ${{ needs.review.outputs.complexity }}
      floor: ${{ needs.review.outputs.floor }}
      trusted: ${{ needs.review.outputs.trusted }}
      blocking: ${{ needs.review.outputs.blocking }}
      description-ok: ${{ needs.review.outputs.description-ok }}
      enabled: ${{ needs.review.outputs.auto-merge }}
    secrets: inherit

  # What waits on whom (#564, waiting-update.yml), after the review: whom
  # the pull request waits on now (a failed check, a thread, a person's
  # merge), on its board with one mention, and the organisation's view. A
  # fork's pull request has no secrets here: issues.yml covers it, by its
  # metadata only.
  waiting:
    # order: after the review, whose verdict and labels the board shows.
    needs: review
    if: always() && github.event_name == 'pull_request' && github.repository != 'DiluxOne/.github' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    uses: DiluxOne/.github/.github/workflows/waiting-update.yml@v7
    secrets:
      DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}

  # The before and after screenshots of an autopilot pull request that
  # changes the browser layer, when it is marked ready (#564,
  # pr-screenshots.yml): only dilux-bot's own branch here, never a fork's.
  screenshots:
    if: github.event_name == 'pull_request' && github.repository != 'DiluxOne/.github' && github.event.action == 'ready_for_review' && contains(github.event.pull_request.labels.*.name, 'autopilot') && github.event.pull_request.user.login == vars.DX_BOT_LOGIN && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    uses: DiluxOne/.github/.github/workflows/pr-screenshots.yml@v7
    secrets:
      DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}

  # An autopilot pull request whose review blocks: one round of fixes by the
  # autopilot (#83), which pushes and so runs this pipeline again; after its
  # rounds it hands the pull request to a person. So does one whose
  # conventions or security gate (#956) fail, or whose review ends without
  # a verdict (#741): a round
  # from the failed jobs' log. So does one whose review says its
  # description does not match (#924): the round rewrites it.
  autopilot-fix:
    # #741: after the conventions too, so their failure (the review is then
    # skipped) starts a round; and on a review that failed before its
    # verdict (no outputs) as on one that blocks.
    needs: [conventions, security-gate, review]
    # Only dilux-bot's own pull requests, only once ready (a draft's own run
    # checks its work), and for an edit only when its review read the pull
    # request in this run (`fresh`, #928): one that kept the push's verdict
    # must not spend a round, the push's run has it.
    # #888: nor on a run whose commit is no longer the head: the head's run
    # starts the round.
    if: always() && github.event_name == 'pull_request' && github.repository != 'DiluxOne/.github' && (needs.review.outputs.blocking == 'true' || needs.review.result == 'failure' || needs.conventions.result == 'failure' || needs.security-gate.result == 'failure' || needs.review.outputs.description-mismatch == 'true') && needs.review.outputs.current != 'false' && !github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'autopilot') && github.event.pull_request.user.login == vars.DX_BOT_LOGIN && (github.event.action != 'edited' || needs.review.outputs.fresh == 'true')
    # The agent's jobs read the repository with the job's own token (#287).
    permissions:
      contents: read
    uses: DiluxOne/.github/.github/workflows/autopilot.yml@v7
    with:
      mode: fix
      pr: ${{ format('{0}', github.event.pull_request.number) }}
      # #924 C3: the review read this description and said it does not
      # match: the round rewrites it (autopilot.py describe). One edited
      # since the review is unchecked, not wrong, and asks for no rewrite.
      description-ok: ${{ needs.review.outputs.description-mismatch == 'true' && 'false' || 'true' }}
    secrets: inherit

  # An autopilot pull request the merge queue dropped (#479): one round of
  # fixes, with the failed jobs' log of its last merge group, within the
  # rounds cap. autopilot.yml knows it from the event (`dequeued`), and runs
  # it only when a check failed there (not for a conflict, nor for a person
  # who took it out of the queue).
  autopilot-queue:
    if: github.event_name == 'pull_request' && github.event.action == 'dequeued' && github.repository != 'DiluxOne/.github' && contains(github.event.pull_request.labels.*.name, 'autopilot') && github.event.pull_request.user.login == vars.DX_BOT_LOGIN
    # The agent's jobs read the repository with the job's own token (#287).
    permissions:
      contents: read
    uses: DiluxOne/.github/.github/workflows/autopilot.yml@v7
    with:
      mode: fix
      pr: ${{ format('{0}', github.event.pull_request.number) }}
    secrets: inherit

  # The merge queue's group (#451): what this pipeline decides was decided
  # on each pull request in it, so the group only has to see this workflow
  # pass. Nothing is checked out and no secret is read.
  queue:
    if: github.event_name == 'merge_group' && github.repository != 'DiluxOne/.github'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: The pull requests in the group passed this pipeline
        env:
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          echo "Merge group $HEAD_REF: conventions, review and the merge decision ran on each pull request."
