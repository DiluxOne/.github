name: SVN credentials check

# Proves that SVN_USERNAME / SVN_PASSWORD (organisation secrets) authenticate
# against the wordpress.org plugin SVN, without publishing anything.
#
# It opens a commit activity (the first step of a commit, where the server
# checks credentials) and deletes it straight away. No revision is created and
# no plugin changes. Run it by hand after rotating the SVN password.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: SVN credentials check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open and abort a transaction
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "${SVN_USERNAME}" ] || { echo "::error::SVN_USERNAME is empty or not visible to this repository."; exit 1; }
          [ -n "${SVN_PASSWORD}" ] || { echo "::error::SVN_PASSWORD is empty or not visible to this repository."; exit 1; }
          # A DAV activity is where a commit starts and where the server checks
          # credentials. Created (201) means the login works; it is deleted at
          # once and nothing is ever committed.
          act="https://plugins.svn.wordpress.org/!svn/act/$(cat /proc/sys/kernel/random/uuid)"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -u "${SVN_USERNAME}:${SVN_PASSWORD}" -X MKACTIVITY "${act}")
          if [ "${code}" = 201 ]; then
            curl -sS -o /dev/null -u "${SVN_USERNAME}:${SVN_PASSWORD}" -X DELETE "${act}" || true
          fi
          case "${code}" in
            201) echo "Credentials accepted for ${SVN_USERNAME}: a commit activity was opened and deleted, nothing committed." ;;
            401) echo "::error::HTTP 401: wordpress.org rejected the username or password."; exit 1 ;;
            *)   echo "::error::Unexpected HTTP ${code}."; exit 1 ;;
          esac
