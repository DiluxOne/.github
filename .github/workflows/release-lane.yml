name: Release lane

# Not reusable: this repository's own (#563). Once the pull request pipeline
# is green on main, a fix reaches every repository with no person's step:
# scripts/release-lane.py plans what is releasable since the last vX.Y.Z,
# points the lightweight `v7-next` tag at a release candidate (main with the
# reusable workflows' inner calls at `@v7-next`, checked to differ in nothing
# else), plays every scenario of tests/release/scenarios.yml in the test
# repository (org.yml `test-repo`, whose callers move to `@v7-next` and back
# through pull requests the bot opens there and queues itself once their
# checks pass, after checking that they change nothing but the engine's ref:
# the auto-merge decision never merges a change to .github/workflows; never
# a write to its main) with the test identity's token, in groups that play
# at once, one job each (`move`, then `play`, a matrix on DX_RUNNER_HEAVY or
# ubuntu-latest, then `back`: release-scenarios.py groups; the `serial`
# scenarios one after another in one group), and only when all rows of the
# one table `act` merges from them pass (a group that left no results, a
# scenario with no row or a job that did not succeed is a failing row),
# and main is still the commit they tried, merges the release pull request, tags vX.Y.Z at its merge
# commit, moves `v7` (lightweight) and publishes the Release (or edits it
# when engine-release.yml, on the tag's push, made it first). The candidate's
# token has `workflows`: its commit rewrites workflow files, and it makes
# that commit through the API (scripts/api-commit.py), so GitHub signs it,
# as the organisation's ruleset requires on every branch. A scenario that fails: nothing is tagged, `v7` stays, and a
# bug names the scenario and its run; so does a scenarios job that runs out
# of time (the play step at 240 minutes, the job at 300), whose bug names
# the timeout (#690): only a run a person cancelled stays silent. A breaking change (`!`): the scenarios
# run, then the release issue opens for a person. After `v7` moves, the
# watch reads every adopted repository's runs for 30 minutes (a read-only
# token; its write token is this repository's alone) and, on the first that
# never started or failed in one of the engine's own steps, moves `v7`
# back to the previous release, opens a bug with the run's link and says so
# on the release (docs/versioning.md).
#
# It runs on main's own code, never a fork's: workflow_run of a push to main,
# or a maintainer's dispatch. The jobs that push tags and hold the test
# identity's token (DX_TEST_TOKEN) run in the `release` environment, which
# only main may use.

on:
  workflow_run:
    workflows: [Pull request]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-lane
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the labels of what merged (next-version.py)
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      release: ${{ steps.plan.outputs.release }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: What is releasable
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Main moved on since the green run: the next green run plans it.
          if [ -n "$HEAD_SHA" ] && [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "main is past the green run's commit; its own run plans it"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          plan=$(python3 scripts/release-lane.py plan --repo "$GITHUB_REPOSITORY")
          echo "$plan"
          { echo "plan=$plan"; echo "release=$(jq -r .release <<<"$plan")"; echo "sha=$(git rev-parse HEAD)"; } >> "$GITHUB_OUTPUT"

  candidate:
    name: Candidate at v7-next
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - name: App token (contents and workflows, this repository)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          # The candidate commit rewrites .github/workflows/*.yml (the inner
          # calls at @v7-next): GitHub refuses that push without it.
          permission-workflows: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: The release candidate, and v7-next at it
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
          # scripts/api-commit.py makes the candidate's commit through the
          # API, which GitHub signs (the ruleset refuses an unsigned one).
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DX_BOT_LOGIN: ${{ vars.DX_BOT_LOGIN }}
          DX_BOT_ID: ${{ vars.DX_BOT_ID }}
        run: |
          set -euo pipefail
          git config user.name "$DX_BOT_LOGIN"
          git config user.email "$DX_BOT_ID+$DX_BOT_LOGIN@users.noreply.github.com"
          printf '%s' "$PLAN" > "$RUNNER_TEMP/plan.json"
          python3 scripts/release-lane.py candidate --plan "$RUNNER_TEMP/plan.json"

  # The callers move to v7-next once, the groups of scenarios play at once
  # (one job each), and the callers come back once every group ended.
  move:
    name: Callers to v7-next in the test repository
    needs: [plan, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
      moved: ${{ steps.move.outputs.moved }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: The test repository
        id: test
        run: echo "repo=$(python3 scripts/org.py test-repo)" >> "$GITHUB_OUTPUT"

      # The groups of tests/release/scenarios.yml: the `serial` ones in one,
      # every other scenario in its own (release-scenarios.py groups).
      - name: The groups of scenarios
        id: groups
        run: echo "groups=$(python3 scripts/release-scenarios.py groups)" >> "$GITHUB_OUTPUT"

      # The callers move to v7-next, and back, through a pull request in the
      # test repository that goes through its merge queue: its rulesets
      # refuse a write to main, from anyone. The bot opens it, scoped to that
      # repository alone (the files are under .github/workflows/), and
      # merges it itself, never by auto-merge: it checks from GitHub that the
      # pull request changes nothing but the engine's ref in those callers,
      # waits for its required checks, and queues it at that head
      # (scripts/release-scenarios.py point_callers). It reads those checks
      # with this token, which asks for the check runs, the commit statuses
      # (#627) and the workflow runs behind them (#644).
      - name: App token (contents, pull requests, workflows, checks, statuses and actions, the test repository)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.test.outputs.repo }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-checks: read
          permission-statuses: read
          permission-actions: read

      # No scenario plays unless the callers reached v7-next (`moved`); one
      # that did not is a failing `callers` row the decision reads.
      - name: The callers at v7-next
        id: move
        env:
          DX_CALLERS_TOKEN: ${{ steps.app.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          TEST_REPO: ${{ steps.test.outputs.repo }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/move"
          if python3 scripts/release-scenarios.py move --repo "$OWNER/$TEST_REPO" --ref v7-next --moved "$RUNNER_TEMP/move/moved.json" --out "$RUNNER_TEMP/move/results.md"; then
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      # Even when cancelled: what moved is what `back` puts back.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scenarios-move
          path: ${{ runner.temp }}/move/
          if-no-files-found: warn

  play:
    name: Scenarios ${{ matrix.group.id }}
    needs: [plan, move]
    if: needs.move.outputs.moved == 'true'
    runs-on: ${{ vars.DX_RUNNER_HEAVY != '' && fromJSON(vars.DX_RUNNER_HEAVY) || 'ubuntu-latest' }}
    # Past it GitHub cancels the job, not the run: the decision still reads
    # it as a timeout and opens its bug (#690). The play step stops first
    # (its own timeout-minutes), leaving an hour for the results to be
    # uploaded. The act step's SCENARIOS_TIMEOUT and PLAY_TIMEOUT name these
    # two numbers in the bug.
    timeout-minutes: 300
    environment: release
    permissions:
      contents: read
    strategy:
      # One group's failure never cancels another's results.
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.move.outputs.groups) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: The test repository
        id: test
        run: echo "repo=$(python3 scripts/org.py test-repo)" >> "$GITHUB_OUTPUT"

      # The test identity's token alone: no App token is minted here.
      - name: Play the group's scenarios at v7-next
        id: play
        timeout-minutes: 240
        env:
          GH_TOKEN: ${{ secrets.DX_TEST_TOKEN }}
          GROUP: ${{ matrix.group.id }}
          OWNER: ${{ github.repository_owner }}
          TEST_REPO: ${{ steps.test.outputs.repo }}
        run: |
          set -uo pipefail
          python3 scripts/release-scenarios.py play --repo "$OWNER/$TEST_REPO" --ref v7-next --group "$GROUP" --out "$RUNNER_TEMP/results.md"
          # The decision is the act job's: a failed scenario is a bug, not a red lane.
          exit 0

      # A group that leaves no file (failed before it, timed out, cancelled)
      # is a failing row in the merged table (release-scenarios.py merge).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: scenarios-${{ matrix.group.id }}
          path: ${{ runner.temp }}/results.md
          if-no-files-found: error

  back:
    name: Callers back from v7-next
    needs: [plan, move, play]
    # always(): the callers come back even when every group failed.
    if: ${{ always() && needs.move.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: The test repository
        id: test
        run: echo "repo=$(python3 scripts/org.py test-repo)" >> "$GITHUB_OUTPUT"

      # A missing record of what moved is "could not tell", a failing
      # `callers` row (release-scenarios.py read_moved), never "nothing".
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: scenarios-move
          path: ${{ runner.temp }}/move

      # An App token lasts an hour and the scenarios can take longer: the
      # callers are put back with one minted after them.
      - name: App token (the same, to put the callers back)
        id: back
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.test.outputs.repo }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-checks: read
          permission-statuses: read
          permission-actions: read

      - name: The callers back from v7-next
        env:
          DX_CALLERS_TOKEN: ${{ steps.back.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          TEST_REPO: ${{ steps.test.outputs.repo }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/back"
          python3 scripts/release-scenarios.py back --repo "$OWNER/$TEST_REPO" --ref v7-next --moved "$RUNNER_TEMP/move/moved.json" --out "$RUNNER_TEMP/back/results.md"
          # A callers row that fails is the act job's to read, like a scenario's.
          exit 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: scenarios-back
          path: ${{ runner.temp }}/back/results.md
          if-no-files-found: error

  act:
    name: Release, bug or issue
    needs: [plan, move, play, back]
    # A job of the scenarios that failed is a bug to open, never a lane that
    # stops with none (#644): this job runs once the callers' move ended,
    # failed or not, and whatever the play and back jobs ended in. One that
    # ran past its timeout-minutes ends `cancelled` with the run going on: a
    # bug naming the timeout (#690). `!cancelled()` is the run's: a person
    # who cancels it releases nothing and opens nothing.
    if: ${{ !cancelled() && needs.plan.outputs.release == 'true' && (needs.move.result == 'success' || needs.move.result == 'failure' || needs.move.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
    outputs:
      do: ${{ steps.act.outputs.do }}
      version: ${{ steps.act.outputs.version }}
      previous: ${{ steps.act.outputs.previous }}
      moved_at: ${{ steps.act.outputs.moved_at }}
    steps:
      - name: App token (contents, pull requests and issues, this repository)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write # the release pull request, the tags, the Release
          permission-pull-requests: write
          permission-issues: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      # Every scenarios-* artifact, each in its own directory. A job that
      # failed before it wrote its results leaves none: the merge reads that
      # as a failing row, never as a pass.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: scenarios-*
          path: ${{ runner.temp }}/scenarios

      - name: What the scenarios say
        id: act
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PLAN: ${{ needs.plan.outputs.plan }}
          SCENARIO_GROUPS: ${{ needs.move.outputs.groups }}
          MOVE: ${{ needs.move.result }}
          PLAY: ${{ needs.play.result }}
          BACK: ${{ needs.back.result }}
          # The play job's timeout-minutes and its play step's.
          SCENARIOS_TIMEOUT: 300
          PLAY_TIMEOUT: 240
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DX_BOT_LOGIN: ${{ vars.DX_BOT_LOGIN }}
          DX_BOT_ID: ${{ vars.DX_BOT_ID }}
        run: |
          set -euo pipefail
          git config user.name "$DX_BOT_LOGIN"
          git config user.email "$DX_BOT_ID+$DX_BOT_LOGIN@users.noreply.github.com"
          printf '%s' "$PLAN" > "$RUNNER_TEMP/plan.json"
          # One table: every group's rows, the move's and the back's, and a
          # failing row for a group with no file, a scenario with no row, or
          # a job that did not succeed, with this run (#644).
          results="$RUNNER_TEMP/results.md"
          python3 scripts/release-scenarios.py merge --dir "$RUNNER_TEMP/scenarios" --groups "$SCENARIO_GROUPS" --job "move=$MOVE" --job "play=$PLAY" --job "back=$BACK" --run "$RUN_URL" --out "$results" >> "$GITHUB_STEP_SUMMARY" || true
          # Exit 1 with its JSON when v7 moved but the Release failed: the
          # outputs are written first, so the watch still runs.
          status=0
          out=$(python3 scripts/release-lane.py act --plan "$RUNNER_TEMP/plan.json" --results "$results" --repo "$GITHUB_REPOSITORY" --run "$RUN_URL") || status=$?
          echo "$out"
          if [ -n "$out" ]; then
            for key in "do" version previous moved_at; do echo "$key=$(jq -r --arg k "$key" '.[$k] // ""' <<<"$out")" >> "$GITHUB_OUTPUT"; done
          fi
          exit "$status"

  watch:
    name: Watch the repositories for 30 minutes
    needs: act
    # always(): v7 moved even when act failed after it (its Release).
    if: always() && needs.act.outputs.do == 'release' && needs.act.outputs.moved_at != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
    steps:
      - name: App token (every repository's runs, read only)
        id: read
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-actions: read
          permission-metadata: read
          permission-organization-custom-properties: read

      - name: App token (this repository's tags, issues and release)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write # moving v7 back, and the release's notes
          permission-issues: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Watch, and move v7 back on the first engine failure
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_READ_TOKEN: ${{ steps.read.outputs.token }}
          VERSION: ${{ needs.act.outputs.version }}
          PREVIOUS: ${{ needs.act.outputs.previous }}
          SINCE: ${{ needs.act.outputs.moved_at }}
        run: python3 scripts/release-lane.py watch --repo "$GITHUB_REPOSITORY" --version "$VERSION" --previous "$PREVIOUS" --since "$SINCE" --minutes 30 --every 120
