name: Nightly review

# The nightly review of existing code (#234, phase 13). Reusable, and called
# ONLY from a private repository (DiluxOne's is DiluxOne/security,
# workflow-templates/nightly-review.yml): what it finds can be a
# vulnerability, and a run's logs are as visible as its repository. It
# refuses to run anywhere else.
#
# Every night one repository of repos.yml with code (one a kind classifies,
# and this one), in turn (scripts/nightly-review.py pick), is reviewed whole
# by an agent within a budget. What it finds joins one list per repository,
# an issue in the calling repository, "Nightly review: <repository>": never
# one issue per finding. A maintainer picks what becomes work; an item they
# tick or strike out is never listed again, and one still open keeps the
# date it was first seen (the closed ones are kept in a hidden line of the
# body). A night whose agent did not finish, or gave no list, leaves the
# list as it was and fails.
#
# The agent reads the repository's own code, cloned with a token that reads
# only that repository; it changes nothing and its job's GITHUB_TOKEN holds
# no permission. The list is written after it, with a token for the calling
# repository's issues only. DX_AUTOPILOT=off stops it.

on:
  workflow_call:
    inputs:
      central-ref:
        description: The ref of DiluxOne/.github whose scripts run (the caller's major tag).
        type: string
        default: v5
      repository:
        description: The repository to review instead of today's turn (by hand).
        type: string
        default: ''
    secrets:
      DILUX_BOT_PRIVATE_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false

permissions: {}

jobs:
  review:
    name: Nightly review
    if: vars.DX_AUTOPILOT != 'off' && (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {}
    steps:
      - name: Only from a private repository
        run: |
          # Asked without a token: a private repository is not found (404).
          # Anything else (public, rate limited, unreachable) stops the run.
          code=$(curl -sS "https://api.github.com/repos/$GITHUB_REPOSITORY" -o /dev/null -w '%{http_code}' || echo 000)
          if [ "$code" != 404 ]; then
            echo "::error::nightly-review.yml runs only from a private repository (the API answered $code without a token): what it finds can be a vulnerability."; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref }}
          persist-credentials: false
          path: .dx-central

      - name: Today's repository
        id: pick
        env:
          ASKED: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          name=${ASKED:-$(python3 .dx-central/scripts/nightly-review.py pick)}
          [[ "$name" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Not a repository name: $name"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Reviewing $GITHUB_REPOSITORY_OWNER/$name."

      - name: dilux-bot token (read that repository)
        id: read
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.pick.outputs.name }}
          permission-contents: read

      - name: The code
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          NAME: ${{ steps.pick.outputs.name }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY_OWNER/$NAME" work
          git -C work remote set-url origin "https://github.com/$GITHUB_REPOSITORY_OWNER/$NAME"
          echo "head=$(git -C work rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          { echo "prompt<<DX_EOF"; python3 .dx-central/scripts/nightly-review.py prompt "$GITHUB_REPOSITORY_OWNER/$NAME"; echo "DX_EOF"; } >> "$GITHUB_OUTPUT"
        id: code

      - name: Claude reviews the code
        id: agent
        timeout-minutes: 40
        continue-on-error: true # the list says the night found nothing new
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ github.token }}
          prompt: |
            The repository is checked out in ./work; read it there.

            ${{ steps.code.outputs.prompt }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
            --max-budget-usd 2
            --allowedTools "Read,Glob,Grep"
            --json-schema '{"type":"object","additionalProperties":false,"required":["findings"],"properties":{"findings":{"type":"array","maxItems":20,"items":{"type":"object","additionalProperties":false,"required":["severity","file","title"],"properties":{"severity":{"type":"string","enum":["blocker","major","minor"]},"file":{"type":"string","maxLength":300},"line":{"type":"integer"},"title":{"type":"string","maxLength":300}}}}}}'

      # The calling repository's issues only, after the agent.
      - name: dilux-bot token (the list)
        id: write
        # A night that did not finish leaves the list as it was.
        if: steps.agent.outcome == 'success'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write

      - name: The list
        if: steps.agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.write.outputs.token }}
          NAME: ${{ steps.pick.outputs.name }}
          OUT: ${{ steps.agent.outputs.structured_output }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY_OWNER/$NAME"
          title="Nightly review: $NAME"
          printf '%s' "${OUT:-}" > "$RUNNER_TEMP/findings.json"
          # An answer with no findings list is not a clean night.
          jq -e '.findings | type == "array"' "$RUNNER_TEMP/findings.json" >/dev/null || { echo "::error::The agent gave no findings list; the list is as it was."; exit 1; }
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          : > "$RUNNER_TEMP/previous.md"
          [ -z "$n" ] || gh issue view "$n" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/previous.md"
          REPO="$repo" FINDINGS="$RUNNER_TEMP/findings.json" PREVIOUS="$RUNNER_TEMP/previous.md" DATE=$(date -u +%Y-%m-%d) \
            python3 .dx-central/scripts/nightly-review.py list > "$RUNNER_TEMP/body.md"
          if [ -n "$n" ]; then
            gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md" >/dev/null
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/body.md" >/dev/null
          fi
          echo "$(jq '.findings | length' "$RUNNER_TEMP/findings.json" 2>/dev/null || echo 0) findings tonight on $repo."

      - name: A night that did not finish
        if: steps.agent.outcome != 'success'
        env:
          NAME: ${{ steps.pick.outputs.name }}
        run: echo "::error::The review of $NAME did not finish; its list is as it was."; exit 1
