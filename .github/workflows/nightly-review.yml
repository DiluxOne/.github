name: Nightly review

# The nightly review of existing code (#234, phase 13). Reusable, and called
# ONLY from a private repository (DiluxOne's is DiluxOne/security,
# workflow-templates/nightly-review.yml): what it finds can be a
# vulnerability, and a run's logs are as visible as its repository. It
# refuses to run anywhere else.
#
# Every night one repository of repos.yml with code (one a kind classifies,
# and this one), in turn (scripts/nightly-review.py pick), is reviewed whole
# by an agent within a budget. What it finds joins one list per repository,
# an issue in the calling repository, "Nightly review: <repository>": never
# one issue per finding there; but a new blocker or major that is not about
# security is also opened as a Bug issue in the reviewed repository (every
# one, #247, #287), where the triage labels it and the usual bug path
# reproduces and fixes it; and a new blocker or major about security
# follows a report's path (#287): a draft security advisory in a public
# repository, opened with dilux-security's key and credited in its text to
# this review, which security-fix.yml then fixes; a `security` issue in a
# private one. What it opens carries `found-by:dilux-ai`. In a public repository, a second agent first
# judges whether publishing it could help an attacker; unsure, it stays in
# the private list. A maintainer picks what else becomes work; an item they
# tick or strike out is never listed again, and one still open keeps the
# date it was first seen (the closed ones are kept in a hidden line of the
# body). A night whose agent did not finish, or gave no list, leaves the
# list as it was and fails.
#
# The agent reads the repository's own code, cloned with a token that reads
# only that repository; it changes nothing and its job's GITHUB_TOKEN holds
# no permission. The list is written after it, with a token for the calling
# repository's issues only. DX_AUTOPILOT=off stops it.

on:
  workflow_call:
    inputs:
      central-ref:
        description: The ref of DiluxOne/.github whose scripts and policy run. Empty (the default) means the very commit this workflow runs from, job.workflow_sha, so a caller that pins a SHA or a tag runs that commit's scripts too (#287).
        type: string
        default: ''
      repository:
        description: The repository to review instead of today's turn (by hand).
        type: string
        default: ''
    secrets:
      DILUX_BOT_PRIVATE_KEY:
        required: true
      # dilux-security's key: a security finding's draft advisory (#287).
      DILUX_SECURITY_PRIVATE_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false

permissions: {}

jobs:
  review:
    name: Nightly review
    if: vars.DX_AUTOPILOT != 'off' && (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {}
    steps:
      - name: Only from a private repository
        run: |
          # Asked without a token: a private repository is not found (404).
          # Anything else (public, rate limited, unreachable) stops the run.
          code=$(curl -sS "https://api.github.com/repos/$GITHUB_REPOSITORY" -o /dev/null -w '%{http_code}' || echo 000)
          if [ "$code" != 404 ]; then
            echo "::error::nightly-review.yml runs only from a private repository (the API answered $code without a token): what it finds can be a vulnerability."; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref || job.workflow_sha }}
          persist-credentials: false
          path: .dx-central

      - name: Today's repository
        id: pick
        env:
          ASKED: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          name=${ASKED:-$(python3 .dx-central/scripts/nightly-review.py pick)}
          [[ "$name" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Not a repository name: $name"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Reviewing $GITHUB_REPOSITORY_OWNER/$name."

      - name: dilux-bot token (read that repository)
        id: read
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.pick.outputs.name }}
          permission-contents: read

      - name: The code
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          NAME: ${{ steps.pick.outputs.name }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY_OWNER/$NAME" work
          git -C work remote set-url origin "https://github.com/$GITHUB_REPOSITORY_OWNER/$NAME"
          echo "head=$(git -C work rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          { echo "prompt<<DX_EOF"; python3 .dx-central/scripts/nightly-review.py prompt "$GITHUB_REPOSITORY_OWNER/$NAME"; echo "DX_EOF"; } >> "$GITHUB_OUTPUT"
        id: code

      - name: Claude reviews the code
        id: agent
        timeout-minutes: 40
        continue-on-error: true # the list says the night found nothing new
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ github.token }}
          prompt: |
            The repository is checked out in ./work; read it there.

            ${{ steps.code.outputs.prompt }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
            --max-budget-usd 2
            --allowedTools "Read,Glob,Grep"
            --json-schema '{"type":"object","additionalProperties":false,"required":["findings"],"properties":{"findings":{"type":"array","maxItems":20,"items":{"type":"object","additionalProperties":false,"required":["severity","file","title","security","detail"],"properties":{"severity":{"type":"string","enum":["blocker","major","minor"]},"file":{"type":"string","maxLength":300},"line":{"type":"integer"},"title":{"type":"string","maxLength":300},"security":{"type":"boolean"},"detail":{"type":"string","maxLength":3000}}}}}}'

      # The reviewed repository's issues only, after the agent: its Bug
      # issues (#247).
      - name: dilux-bot token (the repository's bugs)
        id: bugs-token
        if: steps.agent.outcome == 'success'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.pick.outputs.name }}
          permission-issues: write

      # The calling repository's issues only, after the agent.
      - name: dilux-bot token (the list)
        id: write
        # A night that did not finish leaves the list as it was.
        if: steps.agent.outcome == 'success'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write

      - name: The candidates
        id: cand
        if: steps.agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.write.outputs.token }}
          NAME: ${{ steps.pick.outputs.name }}
          OUT: ${{ steps.agent.outputs.structured_output }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY_OWNER/$NAME"
          title="Nightly review: $NAME"
          printf '%s' "${OUT:-}" > "$RUNNER_TEMP/findings.json"
          # An answer with no findings list is not a clean night.
          jq -e '.findings | type == "array"' "$RUNNER_TEMP/findings.json" >/dev/null || { echo "::error::The agent gave no findings list; the list is as it was."; exit 1; }
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          echo "list=$n" >> "$GITHUB_OUTPUT"
          : > "$RUNNER_TEMP/previous.md"
          [ -z "$n" ] || gh issue view "$n" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/previous.md"
          # New blockers and majors the review says are not about security
          # (#247), every one (#287).
          REPO="$repo" FINDINGS="$RUNNER_TEMP/findings.json" PREVIOUS="$RUNNER_TEMP/previous.md" \
            python3 .dx-central/scripts/nightly-review.py bugs > "$RUNNER_TEMP/bugs.jsonl"
          # New security findings, blocker or major (#287): reported as such.
          REPO="$repo" FINDINGS="$RUNNER_TEMP/findings.json" PREVIOUS="$RUNNER_TEMP/previous.md" \
            python3 .dx-central/scripts/nightly-review.py vulns > "$RUNNER_TEMP/vulns.jsonl"
          # A public repository's issue is public: a second agent judges each
          # one first. Asked without a token, a private repository is not found.
          code=$(curl -sS "https://api.github.com/repos/$repo" -o /dev/null -w '%{http_code}' || echo 000)
          echo "public=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ "$code" != 404 ] && [ -s "$RUNNER_TEMP/bugs.jsonl" ]; then
            eof="DX_$(openssl rand -hex 16)"
            { echo "second<<$eof"; python3 .dx-central/scripts/nightly-review.py second < "$RUNNER_TEMP/bugs.jsonl"; echo "$eof"; } >> "$GITHUB_OUTPUT"
          fi

      # Before anything becomes a public issue: a second agent, which did not
      # review the code, says whether publishing it could help an attacker.
      # Unsure, no answer, or a failure: it stays in the private list.
      - name: A second opinion on security
        id: second
        if: steps.cand.outputs.second != ''
        continue-on-error: true
        timeout-minutes: 10
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.cand.outputs.second }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 5
            --max-budget-usd 0.5
            --allowedTools "Read"
            --json-schema '{"type":"object","additionalProperties":false,"required":["verdicts"],"properties":{"verdicts":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["i","safe"],"properties":{"i":{"type":"integer"},"safe":{"type":"boolean"}}}}}}'

      - name: The bugs and the list
        if: steps.cand.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.write.outputs.token }}
          BUGS_TOKEN: ${{ steps.bugs-token.outputs.token }}
          NAME: ${{ steps.pick.outputs.name }}
          LIST: ${{ steps.cand.outputs.list }}
          PUBLIC: ${{ steps.cand.outputs.public }}
          ASKED: ${{ steps.cand.outputs.second != '' }}
          VERDICT: ${{ steps.second.outputs.structured_output }}
          SECURITY_CLIENT_ID: ${{ vars.DILUX_SECURITY_CLIENT_ID }}
          SECURITY_KEY: ${{ secrets.DILUX_SECURITY_PRIVATE_KEY }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY_OWNER/$NAME"
          title="Nightly review: $NAME"
          if [ "$ASKED" = true ]; then
            printf '%s' "${VERDICT:-}" > "$RUNNER_TEMP/verdict.json"
            VERDICTS="$RUNNER_TEMP/verdict.json" python3 .dx-central/scripts/nightly-review.py safe < "$RUNNER_TEMP/bugs.jsonl" > "$RUNNER_TEMP/open.jsonl"
          elif [ "$PUBLIC" = true ]; then
            : > "$RUNNER_TEMP/open.jsonl"   # public with no second opinion: none
          else
            cp "$RUNNER_TEMP/bugs.jsonl" "$RUNNER_TEMP/open.jsonl"
          fi
          : > "$RUNNER_TEMP/issued.txt"
          # What DiluxOne's own AI found, for the statistics (#287).
          GH_TOKEN="$BUGS_TOKEN" gh label create "found-by:dilux-ai" --repo "$repo" --color 5319E7 --description "Found by DiluxOne's automated review" --force >/dev/null 2>&1 || true
          while IFS= read -r b; do
            [ -n "$b" ] || continue
            jq -r .issue_body <<<"$b" > "$RUNNER_TEMP/bug.md"
            if url=$(GH_TOKEN="$BUGS_TOKEN" gh issue create --repo "$repo" --title "$(jq -r .issue_title <<<"$b")" --body-file "$RUNNER_TEMP/bug.md" --label "found-by:dilux-ai"); then
              printf '%s\t%s\n' "$(jq -r .where <<<"$b")" "$url" >> "$RUNNER_TEMP/issued.txt"
            else
              echo "::warning::A finding could not be opened as a Bug in $repo; it stays in the list."
            fi
          done < "$RUNNER_TEMP/open.jsonl"
          # A security finding follows the path of a report (#287): a draft
          # advisory in a public repository, with dilux-security's key, where
          # security-fix.yml takes it; a `security` issue in a private one.
          if [ -s "$RUNNER_TEMP/vulns.jsonl" ]; then
            adv=""
            if [ "$PUBLIC" = true ] && [ -n "$SECURITY_CLIENT_ID" ] && [ -n "$SECURITY_KEY" ]; then
              adv=$(CLIENT_ID="$SECURITY_CLIENT_ID" PRIVATE_KEY="$SECURITY_KEY" REPOSITORIES="$NAME" bash .dx-central/scripts/app-token.sh mint '{"repository_advisories":"write","metadata":"read"}' || true)
            fi
            unset SECURITY_KEY
            while IFS= read -r v; do
              [ -n "$v" ] || continue
              url=""
              if [ "$PUBLIC" = true ]; then
                if [ -n "$adv" ]; then
                  made=$(jq -c .advisory <<<"$v" | GH_TOKEN="$adv" gh api -X POST "repos/$repo/security-advisories" --input - --jq '.ghsa_id + " " + .html_url' 2>/dev/null) || made=""
                  url=${made#* }
                  # Not confirmed yet, said here in the private repository,
                  # where no one the advisory is shared with can edit it.
                  if [ -n "$made" ]; then
                    gh label create "security:unvetted" --repo "$GITHUB_REPOSITORY" --color FBCA04 --force --description "A draft advisory not confirmed yet: triaged like a report, never patched" >/dev/null 2>&1 || true
                    python3 -c 'import sys, importlib.util as u; s = u.spec_from_file_location("a", ".dx-central/scripts/advisory.py"); m = u.module_from_spec(s); s.loader.exec_module(m); print(m.unvetted_body(sys.argv[1], sys.argv[2], "the nightly review found it."))' "$repo" "${made%% *}" > "$RUNNER_TEMP/unvetted.md"
                    # Unmarked, it would read as confirmed: withdrawn instead,
                    # and the finding stays in the private list.
                    if ! gh issue create --repo "$GITHUB_REPOSITORY" --title "Unvetted ${made%% *} in $repo" --label "security:unvetted" --body-file "$RUNNER_TEMP/unvetted.md" >/dev/null; then
                      GH_TOKEN="$adv" gh api -X PATCH "repos/$repo/security-advisories/${made%% *}" -f state=closed >/dev/null 2>&1 || true
                      echo "::warning::${made%% *} could not be marked unvetted here, so it was closed; the finding stays in the private list."
                      url=""
                    fi
                  fi
                fi
              else
                jq -r .issue_body <<<"$v" > "$RUNNER_TEMP/vuln.md"
                GH_TOKEN="$BUGS_TOKEN" gh label create security --repo "$repo" --color B60205 --description "A vulnerability report; a person merges its fix" --force >/dev/null 2>&1 || true
                url=$(GH_TOKEN="$BUGS_TOKEN" gh issue create --repo "$repo" --title "$(jq -r .issue_title <<<"$v")" --body-file "$RUNNER_TEMP/vuln.md" --label security --label "found-by:dilux-ai" 2>/dev/null) || url=""
              fi
              if [ -n "$url" ]; then
                printf '%s\t%s\n' "$(jq -r .where <<<"$v")" "$url" >> "$RUNNER_TEMP/issued.txt"
              else
                echo "::warning::A security finding could not be reported in $repo; it stays in the private list."
              fi
            done < "$RUNNER_TEMP/vulns.jsonl"
            [ -z "$adv" ] || curl -fsS -o /dev/null -X DELETE -H "Authorization: Bearer $adv" https://api.github.com/installation/token || true
          fi
          REPO="$repo" FINDINGS="$RUNNER_TEMP/findings.json" PREVIOUS="$RUNNER_TEMP/previous.md" ISSUED="$RUNNER_TEMP/issued.txt" DATE=$(date -u +%Y-%m-%d) \
            python3 .dx-central/scripts/nightly-review.py list > "$RUNNER_TEMP/body.md"
          if [ -n "$LIST" ]; then
            gh issue edit "$LIST" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md" >/dev/null
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/body.md" >/dev/null
          fi
          echo "$(jq '.findings | length' "$RUNNER_TEMP/findings.json") findings tonight on $repo; $(wc -l < "$RUNNER_TEMP/issued.txt") opened as Bug issues."

      - name: A night that did not finish
        if: steps.agent.outcome != 'success'
        env:
          NAME: ${{ steps.pick.outputs.name }}
        run: echo "::error::The review of $NAME did not finish; its list is as it was."; exit 1
