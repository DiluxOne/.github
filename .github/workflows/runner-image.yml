name: Runner image

# Not reusable. Builds the organisation's runner image (runner/Dockerfile),
# ghcr.io/diluxone/runner, the image every job on the organisation's VM runs
# in, one container per job (scripts/runner-vm/dx-runner-slot.sh). Every
# Monday, on a change to runner/ merged to main, and by hand. Runs here
# because this repository is public, so its minutes are free.
#
# Each build takes the latest actions/runner release (checked against the
# SHA-256 GitHub publishes for it) and the latest release of Node.js 22
# LTS (the line is NODE_MAJOR in the Dockerfile), then runs a
# smoke test on the image: git; the tools the workflows call (gh, yq,
# Python with PyYAML, msgfmt, shellcheck); the Docker CLI against a real
# daemon through the socket (as on the VM); Node; sudo; the runner's version;
# Chromium launching under Playwright; and PHP 7.4, 8.3 and 8.5 set up by
# setup-php (at the commit the workflows pin) with php -v and composer
# --version, after checking that php-builder's prebuilt 8.3 to 8.5 find every
# library they link against in the image (#145). Only a build that passes is
# promoted: tagged :stable (what the VM pulls on boot)
# and with its date and run (:YYYY-MM-DD.<run>, to go back to). A failed build leaves
# :stable as it was. On a pull request it builds and tests, and pushes
# nothing.
#
# No person approves a build: this is the `platform` lane of the autonomy
# plan (#78). Each build is its own issue of this repository, labelled
# `run:runner-image` (scripts/run-issue.sh, #188): a promoted one says its
# versions and digest and closes as completed; a failed one stays open with
# `needs:maintainer`, as a `platform` lane issue (accepted by policy), until
# a person or the lane fixes the image, or the next build that passes closes
# it. The closed issues are the record of
# every build. The package must be public once (package settings) so the VM
# pulls it without credentials.

on:
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches: [main]
    paths: ['runner/**', '.github/workflows/runner-image.yml']
  pull_request:
    paths: ['runner/**', '.github/workflows/runner-image.yml']
  workflow_dispatch:

permissions:
  contents: read

# Pull requests in their own group, so one never pushes a promotion out of
# the queue.
concurrency:
  group: runner-image-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/diluxone/runner

jobs:
  build:
    name: Build, test and promote
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push the image
      issues: write   # record the result
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Versions
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        # The runner release's body carries each package's SHA-256 between
        # <!-- BEGIN SHA linux-x64 --> and <!-- END SHA linux-x64 -->.
        run: |
          set -euo pipefail
          tag=$(gh api repos/actions/runner/releases/latest --jq .tag_name)
          body=$(gh api repos/actions/runner/releases/latest --jq .body)
          sha=$(sed -n 's/.*<!-- BEGIN SHA linux-x64 -->\([0-9a-f]\{64\}\)<!-- END SHA linux-x64 -->.*/\1/p' <<<"$body" | head -1)
          [ -n "$sha" ] || { echo "::error::No SHA-256 for linux-x64 in the runner release ${tag}"; exit 1; }
          { echo "runner=${tag#v}"; echo "runner_sha=$sha"; echo "date=$(date -u +%Y-%m-%d).$GITHUB_RUN_NUMBER"; } >> "$GITHUB_OUTPUT"
          echo "actions/runner ${tag}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: runner
          load: true
          push: false
          tags: ${{ env.IMAGE }}:candidate
          build-args: |
            RUNNER_VERSION=${{ steps.v.outputs.runner }}
            RUNNER_SHA256=${{ steps.v.outputs.runner_sha }}

      - name: Smoke test
        id: smoke
        env:
          RUNNER: ${{ steps.v.outputs.runner }}
        run: |
          set -euo pipefail
          gid=$(stat -c %g /var/run/docker.sock)
          docker run --rm --entrypoint bash --group-add "$gid" -e RUNNER \
            -v /var/run/docker.sock:/var/run/docker.sock "$IMAGE:candidate" -c '
            set -euo pipefail
            git --version
            docker version --format "Docker {{.Client.Version}} → daemon {{.Server.Version}}"
            docker run --rm hello-world >/dev/null; echo "a container runs through the socket"
            node --version
            gh --version | head -1; yq --version; python3 -c "import yaml; print(\"Python with PyYAML\")"; msgfmt --version | head -1; shellcheck --version | sed -n 2p
            sudo -n true; echo "sudo without a password"
            v=$(/home/runner/actions-runner/bin/Runner.Listener --version)
            [ "$v" = "$RUNNER" ] || { echo "runner $v, expected $RUNNER"; exit 1; }; echo "runner $v"
            cd "$(mktemp -d)"; npm init -y >/dev/null; npm install --silent playwright >/dev/null
            npx playwright install chromium >/dev/null
            node -e "require(\"playwright\").chromium.launch().then(b => b.close()).then(() => console.log(\"Chromium launches\"))"
          ' | tee smoke.txt

          # PHP the way a job on the VM gets it (#145): setup-php, at the
          # commit the organisation's workflows pin, in a fresh container per
          # version. On a self-hosted runner it takes 7.4 from ondrej's PPA
          # and 8.3 and up from php-builder's prebuilt builds, while an
          # apt-get of their libraries runs beside it that can fail without
          # stopping it. So first, before any apt-get, a prebuilt php and the
          # extensions it enables by default must find every shared library
          # they link against in the image itself.
          sp=$(grep -ohm1 'shivammathur/setup-php@[0-9a-f]\{40\}' .github/workflows/plugin-checks-wp.yml | cut -d@ -f2 || true)
          [ -n "$sp" ] || { echo "::error::No pinned setup-php in plugin-checks-wp.yml"; exit 1; }
          mkdir -p "$RUNNER_TEMP/setup-php"
          curl -fsSL --retry 5 --retry-all-errors "https://codeload.github.com/shivammathur/setup-php/tar.gz/$sp" \
            | tar -xz --strip-components=1 -C "$RUNNER_TEMP/setup-php"
          os=$(docker run --rm --entrypoint bash "$IMAGE:candidate" -c '. /etc/os-release; echo "$ID$VERSION_ID"')
          for v in 8.3 8.4 8.5; do
            mkdir -p "$RUNNER_TEMP/php-$v"
            curl -fsSL --retry 5 --retry-all-errors "https://github.com/shivammathur/php-builder/releases/download/$v/php_$v+$os.tar.zst" \
              | tar -I zstd -x -C "$RUNNER_TEMP/php-$v"
            docker run --rm --entrypoint bash -e V="$v" -v "$RUNNER_TEMP/php-$v:/php:ro" "$IMAGE:candidate" -c '
              set -euo pipefail
              ext=$(ls -d /php/usr/lib/php/20*/)
              files=("/php/usr/bin/php$V")
              for ini in /php/etc/php/"$V"/cli/conf.d/*.ini; do
                so="$ext$(basename "$ini" .ini | sed "s/^[0-9]*-//").so"
                [ -e "$so" ] && files+=("$so")
              done
              [ "${#files[@]}" -gt 1 ] || { echo "PHP $V (php-builder): no extension enabled by default found"; exit 1; }
              missing=$(for f in "${files[@]}"; do LD_LIBRARY_PATH=/php/usr/lib ldd "$f" | awk -v f="${f##*/}" "/not found/ {print f \": \" \$1}" || exit 1; done) \
                || { echo "PHP $V (php-builder): ldd could not read its files"; exit 1; }
              [ -z "$missing" ] || { echo "PHP $V (php-builder) misses in the image:"; echo "$missing"; exit 1; }
              echo "PHP $V (php-builder) and its $(( ${#files[@]} - 1 )) default extensions find their libraries"
            ' | tee -a smoke.txt
          done
          for v in 7.4 8.3 8.5; do
            docker run --rm --entrypoint bash -e V="$v" -v "$RUNNER_TEMP/setup-php:/setup-php:ro" "$IMAGE:candidate" -c '
              set -euo pipefail
              t=$(mktemp -d); cp -r /setup-php "$t/sp"
              export GITHUB_ENV=$t/env GITHUB_PATH=$t/path GITHUB_OUTPUT=$t/out RUNNER_TEMP=$t RUNNER_ENVIRONMENT=self-hosted GITHUB_ACTIONS=true RUNNER_OS=Linux
              touch "$GITHUB_ENV" "$GITHUB_PATH" "$GITHUB_OUTPUT"
              env "INPUT_PHP-VERSION=$V" INPUT_COVERAGE=none INPUT_TOOLS=composer:v2 INPUT_INI-FILE=production \
                node "$t/sp/dist/index.js" > "$t/log" 2>&1 || { cat "$t/log"; exit 1; }
              PATH="$(tr "\n" ":" < "$GITHUB_PATH")$PATH"
              got=$(php -r "echo PHP_MAJOR_VERSION, \".\", PHP_MINOR_VERSION;") || { cat "$t/log"; exit 1; }
              [ "$got" = "$V" ] || { echo "setup-php gave PHP $got, expected $V"; exit 1; }
              p=$(php -v) || { echo "setup-php $V: php -v failed"; exit 1; }
              c=$(composer --version 2>&1) || { echo "setup-php $V: composer --version failed"; echo "$c"; cat "$t/log"; exit 1; }
              echo "setup-php $V: $(head -1 <<<"$p"); $(head -1 <<<"$c")"
            ' | tee -a smoke.txt
          done
          {
            echo 'report<<SMOKE'
            cat smoke.txt
            echo 'SMOKE'
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Promote
        id: promote
        if: github.event_name != 'pull_request'
        env:
          DATE: ${{ steps.v.outputs.date }}
        run: |
          set -euo pipefail
          # The dated tag first: :stable moves only once the way back exists.
          for t in "$DATE" stable; do docker tag "$IMAGE:candidate" "$IMAGE:$t"; docker push -q "$IMAGE:$t"; done
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:stable")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Promoted $IMAGE:stable and :$DATE ($digest)"

      # dilux-bot opens the issues, so a failed build's issue is a `platform`
      # lane issue (policy/autonomy.yml): the lane checks it was opened by
      # that App from this workflow's run, named in the body.
      - name: dilux-bot token
        id: bot
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true # without it the build is still recorded, by the workflow's own token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write

      - name: Record the build
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
          OUTCOME: ${{ steps.promote.outcome }}
          DIGEST: ${{ steps.promote.outputs.digest }}
          RUNNER: ${{ steps.v.outputs.runner }}
          SMOKE: ${{ steps.smoke.outputs.report }}
          RUN: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          ai="🤖 AI-generated · Claude Opus 5.5 (Anthropic)"
          if [ "$OUTCOME" = success ]; then
            fence='```'
            printf 'Promoted to :stable: %s\n\nactions/runner %s\n\n%s\n%s\n%s\n\nRun: %s\n\n%s\n' "$DIGEST" "$RUNNER" "$fence" "$SMOKE" "$fence" "$RUN_URL" "$ai" |
              NEEDS=0 bash scripts/run-issue.sh open runner-image "Runner image, run $RUN: promoted"
            # The image builds again: a failed build's issue left open is settled.
            bash scripts/run-issue.sh settle runner-image "$RUN_URL"
          else
            # A failed build is the `platform` lane's work: the lane checks
            # that dilux-bot opened it from this run, named in the body.
            printf 'Not promoted; :stable stayed as it was. Fixing the image is work of the `platform` lane (policy/autonomy.yml): accepted by policy, no person needed to accept it. It closes when the fix merges, or when a later build passes.\n\nRun: %s\n\n<!-- dx-lane: platform run: %s -->\n\n%s\n' "$RUN_URL" "$RUN_URL" "$ai" |
              NEEDS=1 LABELS="lane:platform,accepted-by:policy" bash scripts/run-issue.sh open runner-image "Runner image, run $RUN: build failed"
          fi
