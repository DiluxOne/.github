name: Runner image

# Not reusable. Builds the organisation's runner image (runner/Dockerfile),
# ghcr.io/diluxone/runner, the image every job on the organisation's VM runs
# in, one container per job (scripts/runner-vm/dx-runner-slot.sh). Every
# Monday, on a change to runner/ merged to main, and by hand. Runs here
# because this repository is public, so its minutes are free.
#
# Each build takes the latest actions/runner release (checked against the
# SHA-256 GitHub publishes for it) and the latest Node.js LTS, then runs a
# smoke test on the image: git, the Docker CLI against a real daemon through
# the socket (as on the VM), Node, sudo, the runner's version, Chromium
# launching under Playwright, and PHP installed the way setup-php does. Only a
# build that passes is promoted: tagged :stable (what the VM pulls on boot)
# and with its date (:YYYY-MM-DD, to go back to). A failed build leaves
# :stable as it was. On a pull request it builds and tests, and pushes
# nothing.
#
# No person approves a build: this is the `platform` lane of the autonomy
# plan (#78). Each result is recorded on an issue of this repository: every
# promoted build as a comment on "Runner image" (versions and digest), every
# failed one on "Runner image: build failed" (with the run), both opened by
# the first build that needs them. The package must be public once (package
# settings) so the VM pulls it without credentials.

on:
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches: [main]
    paths: ['runner/**', '.github/workflows/runner-image.yml']
  pull_request:
    paths: ['runner/**', '.github/workflows/runner-image.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/diluxone/runner

jobs:
  build:
    name: Build, test and promote
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push the image
      issues: write   # record the result
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Versions
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        # The runner release's body carries each package's SHA-256 between
        # <!-- BEGIN SHA linux-x64 --> and <!-- END SHA linux-x64 -->.
        run: |
          set -euo pipefail
          tag=$(gh api repos/actions/runner/releases/latest --jq .tag_name)
          body=$(gh api repos/actions/runner/releases/latest --jq .body)
          sha=$(sed -n 's/.*<!-- BEGIN SHA linux-x64 -->\([0-9a-f]\{64\}\)<!-- END SHA linux-x64 -->.*/\1/p' <<<"$body" | head -1)
          [ -n "$sha" ] || { echo "::error::No SHA-256 for linux-x64 in the runner release ${tag}"; exit 1; }
          { echo "runner=${tag#v}"; echo "runner_sha=$sha"; echo "date=$(date -u +%Y-%m-%d)"; } >> "$GITHUB_OUTPUT"
          echo "actions/runner ${tag}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: runner
          load: true
          push: false
          tags: ${{ env.IMAGE }}:candidate
          build-args: |
            RUNNER_VERSION=${{ steps.v.outputs.runner }}
            RUNNER_SHA256=${{ steps.v.outputs.runner_sha }}

      - name: Smoke test
        id: smoke
        env:
          RUNNER: ${{ steps.v.outputs.runner }}
        run: |
          set -euo pipefail
          gid=$(stat -c %g /var/run/docker.sock)
          docker run --rm --entrypoint bash --group-add "$gid" -e RUNNER \
            -v /var/run/docker.sock:/var/run/docker.sock "$IMAGE:candidate" -c '
            set -euo pipefail
            git --version
            docker version --format "Docker {{.Client.Version}} → daemon {{.Server.Version}}"
            docker run --rm hello-world >/dev/null && echo "a container runs through the socket"
            node --version
            sudo -n true && echo "sudo without a password"
            v=$(/home/runner/actions-runner/bin/Runner.Listener --version); [ "$v" = "$RUNNER" ] && echo "runner $v"
            cd "$(mktemp -d)" && npm init -y >/dev/null && npm install --silent playwright >/dev/null
            npx playwright install chromium >/dev/null
            node -e "require(\"playwright\").chromium.launch().then(b => b.close()).then(() => console.log(\"Chromium launches\"))"
            sudo add-apt-repository -y ppa:ondrej/php >/dev/null 2>&1 && sudo apt-get update -qq && sudo apt-get install -y -qq php-cli >/dev/null
            php -r "echo \"PHP \", PHP_VERSION, PHP_EOL;"
          ' | tee smoke.txt
          {
            echo 'report<<SMOKE'
            cat smoke.txt
            echo 'SMOKE'
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Promote
        id: promote
        if: github.event_name != 'pull_request'
        env:
          DATE: ${{ steps.v.outputs.date }}
        run: |
          set -euo pipefail
          for t in stable "$DATE"; do docker tag "$IMAGE:candidate" "$IMAGE:$t"; docker push -q "$IMAGE:$t"; done
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:stable")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Promoted $IMAGE:stable and :$DATE ($digest)"

      - name: Record the build
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.promote.outcome }}
          DIGEST: ${{ steps.promote.outputs.digest }}
          RUNNER: ${{ steps.v.outputs.runner }}
          SMOKE: ${{ steps.smoke.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = success ]; then title="Runner image"; else title="Runner image: build failed"; fi
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ -z "$n" ]; then
            what="Every promoted build of ghcr.io/diluxone/runner, recorded by runner-image.yml."
            [ "$OUTCOME" = success ] || what="Builds of ghcr.io/diluxone/runner that failed and were not promoted; :stable stayed as it was. Close it once a build passes."
            n=$(gh issue create --title "$title" --body "$what

          🤖 AI-generated · Claude Opus 5.5 (Anthropic)" | sed 's#.*/##')
          fi
          if [ "$OUTCOME" = success ]; then
            fence='```'
            body=$(printf 'Promoted to :stable: %s\n\nactions/runner %s\n\n%s\n%s\n%s\n\n%s' "$DIGEST" "$RUNNER" "$fence" "$SMOKE" "$fence" "$RUN_URL")
          else
            body=$(printf 'Not promoted; :stable unchanged. Run: %s' "$RUN_URL")
          fi
          gh issue comment "$n" --body "$body"
