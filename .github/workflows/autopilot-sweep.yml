name: Autopilot in step with main

# Reusable, and run here every hour. A merge into main brings every open
# autopilot pull request it leaves behind or in conflict back in step on its
# own (#561, #556, #549), with no label a person adds: for each one,
# scripts/autopilot.py sweep (next-step's own answer) says `update`, and the
# bot merges main into it (GitHub's update-branch), or `continue`, and
# dilux-bot adds `autopilot:continue` to its issue, whose run merges main
# and leaves the conflict to the agent to resolve (a fix round, free: it
# only catches up with another merge, so `catchup` on the issue's board,
# set before the continue, makes it a free run, #563, #802). A draft only behind main,
# with no conflicting hunk, is updated the same way (#563): a step with no
# model, so no run is spent on it; a draft in conflict is left alone: its
# own run merges main first. A pull request whose issue has an autopilot run
# queued or in progress is not updated (#934, scripts/autopilot.py
# runs-busy, with the token's actions: read): the run's apply step would
# find its branch moved and lose the round; it is left for the next pass,
# and so is one whose runs cannot be read. A pull request whose state GitHub has not worked out yet is left
# to the next sweep. An issue that waits for another autopilot pull request
# on the engine's core (`core_wait` on its board, #563, #802) gets its
# `autopilot:continue` once no open one touches the core its Spec touches:
# here at once on a merge, within the hour on a close; of two waiters on a
# freed core, only the oldest of each repository starts (#832), and carries
# `core_started` on its board until its draft opens, its run waits on the
# core again or stops, or 6 hours pass: the next starts once that one's pull
# request merges or closes (scripts/autopilot.py core-next). Search gives 1000
# at most: when it found more accepted issues than it gave, or they cannot
# be counted, those read are started and the step fails (#811). An accepted
# issue whose run GitHub's API rate limit left to the next (#925:
# scripts/gh-wait.sh waited within its job's time, and the reset fell after
# it, so the run's `rate-limited` job wrote `rate_limited` on the
# issue's board once the limit reset) gets its
# `autopilot:continue` once that reset passed (scripts/autopilot.py sweep
# rate-limited); the run it starts clears the key.
# An accepted issue whose start was missed (#1002: an edit, a comment or a
# refused run that started nothing) gets its `autopilot:continue` once,
# with `swept_start` on its board, when next-step would start it, no run is
# queued or in progress and no autopilot pull request of it was closed
# unmerged by a person (scripts/autopilot.py sweep start, the step "Start a
# missed one").
#
# Until none is left (#802), it first moves the flow's old labels
# (`autopilot:run-N`, `free-N`, `round-N`, `waiting`, `answered`, `catchup`,
# `core-wait`) off every open item that still carries one, onto its board
# (scripts/receipts.py migrate: written, read back, and only then taken
# off); an item a run of the old engine labels during a deploy is caught
# the next hour. A later change removes that step.
#
#   a merge         from the `autopilot-sweep` job of each repository's
#                   issues.yml (workflow-templates/issues.yml, and its
#                   mirror here, #669): a pull request merged into the
#                   default branch (pull_request_target `closed`, metadata
#                   only, no code checked out) sweeps that one repository
#                   within minutes, with an App token for it alone.
#   schedule        every hour, for every repository of the organisation:
#                   the one a caller not yet in step misses is seen within
#                   the hour.
#   by hand         workflow_dispatch, every repository or one.
#
# It runs none of the caller's code: the engine's scripts, cloned at the
# commit this workflow runs from (job.workflow_sha) into .dx-central.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      repo:
        description: One repository (owner/name); empty for every one.
        type: string
        default: ''
  workflow_call:
    inputs:
      repo:
        type: string
        default: ''
    secrets:
      DILUX_BOT_PRIVATE_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: autopilot-sweep-${{ inputs.repo || 'all' }}
  cancel-in-progress: false

env:
  DX_BOT_LOGIN: ${{ vars.DX_BOT_LOGIN }}
  DX_BOT_APP: ${{ vars.DX_BOT_APP }}
  DX_BOT_ID: ${{ vars.DX_BOT_ID }}

jobs:
  sweep:
    name: Autopilot pull requests in step with main
    runs-on: ubuntu-latest # fresh: it holds the bot's key, with contents: write on the repository it sweeps, or on every one hourly (#287)
    timeout-minutes: 15
    steps:
      # One repository's merge: a token for it alone; the hourly run, the
      # organisation's.
      - name: Which repository
        id: where
        env:
          REPO: ${{ inputs.repo }}
        run: echo "name=${REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: App token
        id: bot
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.where.outputs.name }}
          permission-actions: read # the issue's autopilot runs in progress (#934)
          permission-contents: write # update-branch
          permission-issues: write # autopilot:continue on the issue
          permission-pull-requests: write

      - name: The organisation's scripts
        env:
          REF: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          git init -q .dx-central && git -C .dx-central fetch -q --depth 1 https://github.com/DiluxOne/.github "$REF" && git -C .dx-central checkout -q FETCH_HEAD
          test ! -f .dx-central/scripts/config-overlay.sh || bash .dx-central/scripts/config-overlay.sh .dx-central

      # #802: the flow's old labels onto the boards, before anything reads
      # one: the autopilot's open pull requests (their runs and rounds) and
      # the open issues that carry a wait's label. An item it cannot move
      # keeps its labels and is tried again next hour.
      - name: The flow's old labels onto the boards
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          # Scripts older than #802 (a REF before it) have no migration.
          grep -q '^FLOW_KEYS' .dx-central/scripts/receipts.py || { echo "The scripts at this ref keep the flow in labels: nothing to move."; exit 0; }
          if [ -n "$REPO" ]; then where=(--repo "$REPO"); else where=(--owner "$OWNER"); fi
          # Search gives 1000 at most: a list that reaches it is said, and
          # the rest are caught by the runs themselves (autopilot.yml
          # migrates its own items) or the next sweep.
          full() { [ "$(wc -l < "$1")" -lt 1000 ] || echo "::warning::$2: the search gave its 1000 at most; the rest wait for the next sweep."; }
          gh search prs "${where[@]}" --state open --label autopilot --limit 1000 --json repository,number \
            --jq '.[] | "\(.repository.nameWithOwner) \(.number) pr"' > "$RUNNER_TEMP/found.txt"
          full "$RUNNER_TEMP/found.txt" "the autopilot's open pull requests"; cat "$RUNNER_TEMP/found.txt" > "$RUNNER_TEMP/old.txt"
          for wait in waiting answered catchup core-wait; do
            gh search issues "${where[@]}" --state open --label "autopilot:$wait" --limit 1000 --json repository,number \
              --jq '.[] | "\(.repository.nameWithOwner) \(.number) issue"' > "$RUNNER_TEMP/found.txt"
            full "$RUNNER_TEMP/found.txt" "the open issues labelled autopilot:$wait"; cat "$RUNNER_TEMP/found.txt" >> "$RUNNER_TEMP/old.txt"
          done
          sort -u "$RUNNER_TEMP/old.txt" > "$RUNNER_TEMP/old-items.txt"
          while read -r repo n item <&3; do
            [ -n "$repo" ] || continue
            GITHUB_REPOSITORY="$repo" NUMBER="$n" ITEM="$item" python3 .dx-central/scripts/receipts.py migrate \
              || echo "::warning::$repo#$n: its old labels could not be moved onto its board; they stay, and the next sweep tries again."
          done 3< "$RUNNER_TEMP/old-items.txt"

      - name: Bring each one in step
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          # The catch-up and the wait for the core are on the issue's board
          # (#802), never in a label (#805).
          if [ -n "$REPO" ]; then where=(--repo "$REPO"); else where=(--owner "$OWNER"); fi
          gh search prs "${where[@]}" --state open --label autopilot --limit 100 --json repository,number \
            --jq '.[] | "\(.repository.nameWithOwner) \(.number)"' > "$RUNNER_TEMP/prs.txt"
          failed=""
          while read -r repo n <&3; do
            [ -n "$repo" ] || continue
            # GitHub works out the merge state after main moves: UNKNOWN
            # until then, read again; still unknown, the next sweep has it.
            for _ in 1 2 3 4 5; do
              pr=$(gh pr view "$n" --repo "$repo" --json number,isDraft,mergeStateStatus,labels,headRefOid,author,closingIssuesReferences) || { pr=""; break; }
              [ "$(jq -r .mergeStateStatus <<<"$pr")" = UNKNOWN ] || break
              sleep 5
            done
            [ -n "$pr" ] || { echo "::warning::$repo#$n could not be read."; continue; }
            issue=$(jq -r '.closingIssuesReferences[0].number // empty' <<<"$pr")
            issue_labels='[]'
            [ -z "$issue" ] || issue_labels=$(gh issue view "$issue" --repo "$repo" --json labels --jq '[.labels[].name]' || echo '[]')
            out=$(jq -n --argjson pr "$pr" --argjson labels "$issue_labels" '{pr: $pr, issue_labels: $labels}' | python3 .dx-central/scripts/autopilot.py sweep)
            what=${out%%$'\t'*}
            echo "$repo#$n: ${what:-nothing}: ${out#*$'\t'}"
            case $what in
              update)
                # #934: never under the issue's autopilot run (queued or in
                # progress): its apply step would find the branch moved and
                # the round would be lost. Left for the next pass; a read
                # that fails counts as busy too.
                if [ -n "$issue" ]; then
                  busy=$(GITHUB_REPOSITORY="$repo" NUMBER="$issue" python3 .dx-central/scripts/autopilot.py runs-busy) || busy="(unreadable)"
                  if [ -n "$busy" ]; then
                    echo "$repo#$n: left for the next pass: its issue's autopilot run $(tr '\n' ' ' <<<"$busy" | sed 's/ *$//') is in progress"
                    continue
                  fi
                fi
                gh api -X PUT "repos/$repo/pulls/$n/update-branch" -f expected_head_sha="$(jq -r .headRefOid <<<"$pr")" >/dev/null \
                  || echo "::warning::$repo#$n: main could not be merged into it." ;;
              continue)
                [ -n "$issue" ] || { echo "::warning::$repo#$n closes no issue: nothing to continue."; continue; }
                gh label create "autopilot:continue" --repo "$repo" --color 1D76DB --force --description "On an issue: the autopilot continues its draft pull request, or starts it" >/dev/null 2>&1 || true
                # The run it starts only catches up with another merge: free
                # (#563), `catchup` on the issue's board (#802), set first.
                if ! GITHUB_REPOSITORY="$repo" NUMBER="$issue" python3 .dx-central/scripts/receipts.py state set catchup=true; then
                  echo "::warning::$repo#$issue: its board could not be written; no continue."; continue
                fi
                # The continue not asked for, the catch-up comes off again
                # (a later continue may be a counted run) and the step fails.
                gh issue edit "$issue" --repo "$repo" --add-label "autopilot:continue" >/dev/null && continue
                echo "::warning::$repo#$issue: the continue could not be asked for; its catch-up comes off."
                failed="$failed $repo#$issue"
                GITHUB_REPOSITORY="$repo" NUMBER="$issue" python3 .dx-central/scripts/receipts.py state set catchup= || true ;;
            esac
          done 3< "$RUNNER_TEMP/prs.txt"
          # The issues that wait for a pull request on the core (#563): the
          # accepted open ones whose board says `core_wait` (#802). Search
          # gives 1000 at most: when it found more than it gave (its
          # total_count), or the count cannot be read, those read are still
          # started and the step then fails, so no issue waits unseen.
          waiting_on=accepted
          gh search issues "${where[@]}" --state open --label "$waiting_on" --limit 1000 --json repository,number \
            --jq '.[] | "\(.repository.nameWithOwner) \(.number)"' > "$RUNNER_TEMP/core.txt"
          if [ -n "$REPO" ]; then scope="repo:$REPO"; else scope="user:$OWNER"; fi
          total=$(gh api -X GET search/issues -f q="is:issue is:open label:\"$waiting_on\" $scope" -f per_page=1 --jq .total_count) || total=""
          given=$(wc -l < "$RUNNER_TEMP/core.txt")
          short=""
          case $total in
            ''|*[!0-9]*) short="the open issues labelled $waiting_on could not be counted, so an issue waiting on the core may be missed" ;;
            *) [ "$total" -le "$given" ] || short="the search found $total open issues labelled $waiting_on and gave $given: an issue past them waiting on the core is not started" ;;
          esac
          # One start per repository at a time, oldest first (#832 C1): the
          # waiters whose core is free and those already started
          # (`core_started`, until their draft opens) are read first, then
          # autopilot.py core-next says which one starts.
          : > "$RUNNER_TEMP/core-free.txt"
          : > "$RUNNER_TEMP/core-started.txt"
          while read -r repo n <&3; do
            [ -n "$repo" ] || continue
            st=$(GITHUB_REPOSITORY="$repo" NUMBER="$n" python3 .dx-central/scripts/receipts.py state get 2>/dev/null) || { echo "::warning::$repo#$n: its board could not be read."; continue; }
            at=$(jq -r '.core_started // empty' <<<"$st")
            [ -z "$at" ] || echo "$repo $n $at" >> "$RUNNER_TEMP/core-started.txt"
            # A run GitHub's API rate limit left to the next (#925,
            # `rate_limited` on its board, scripts/gh-wait.sh): once the
            # limit reset, dilux-bot asks the continue, whose run clears it.
            if [ "$(jq -c '.rate_limited // null' <<<"$st")" != null ]; then
              labels=$(gh issue view "$n" --repo "$repo" --json labels --jq '[.labels[].name] | join(",")') || labels=""
              rl=$(LABELS="$labels" python3 .dx-central/scripts/autopilot.py sweep rate-limited <<<"$st") || rl=""
              echo "$repo#$n: ${rl#*$'\t'}"
              if [ "${rl%%$'\t'*}" = continue ]; then
                gh label create "autopilot:continue" --repo "$repo" --color 1D76DB --force --description "On an issue: the autopilot continues its draft pull request, or starts it" >/dev/null 2>&1 || true
                gh issue edit "$n" --repo "$repo" --add-label "autopilot:continue" >/dev/null \
                  || { echo "::warning::$repo#$n: the continue could not be asked for; the next sweep tries again."; failed="$failed $repo#$n"; }
              fi
            fi
            waits=$(jq -c '.core_wait // null' <<<"$st")
            case $waits in null|false) continue ;; esac
            gh issue view "$n" --repo "$repo" --json body --jq .body > "$RUNNER_TEMP/body.md" || continue
            busy=$(GITHUB_REPOSITORY="$repo" BODY="$RUNNER_TEMP/body.md" python3 .dx-central/scripts/autopilot.py core-wait) || { echo "::warning::$repo#$n: the core could not be checked."; continue; }
            if [ -n "$busy" ]; then echo "$repo#$n: still waits for #$busy"; continue; fi
            echo "$repo $n $waits" >> "$RUNNER_TEMP/core-free.txt"
          done 3< "$RUNNER_TEMP/core.txt"
          jq -Rn --rawfile free "$RUNNER_TEMP/core-free.txt" --rawfile started "$RUNNER_TEMP/core-started.txt" '
            def rows(t): [t | split("\n")[] | select(length > 0) | split(" ")];
            {waiters: [rows($free)[] | {repo: .[0], number: (.[1] | tonumber)}],
             started: [rows($started)[] | {repo: .[0], number: (.[1] | tonumber), at: .[2]}]}' \
            | python3 .dx-central/scripts/autopilot.py core-next > "$RUNNER_TEMP/core-next.txt"
          while IFS=$'\t' read -r repo n what <&3; do
            [ -n "$repo" ] || continue
            case $what in
              expired)
                echo "$repo#$n: started on the core more than 6 hours ago with no draft: it no longer holds the queue"
                GITHUB_REPOSITORY="$repo" NUMBER="$n" python3 .dx-central/scripts/receipts.py state set core_started= >/dev/null \
                  || echo "::warning::$repo#$n: its board could not be written; its start is let go all the same." ;;
              first\ *)
                echo "$repo#$n: still waits, #${what#first } goes first" ;;
              start)
                waits=$(awk -v r="$repo" -v n="$n" '$1 == r && $2 == n {print $3; exit}' "$RUNNER_TEMP/core-free.txt")
                gh issue view "$n" --repo "$repo" --json body --jq .body > "$RUNNER_TEMP/body.md" || continue
                echo "$repo#$n: the core is free: it starts"
                started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                if ! GITHUB_REPOSITORY="$repo" NUMBER="$n" BODY="$RUNNER_TEMP/body.md" python3 .dx-central/scripts/receipts.py state set core_wait= "core_started=\"$started\""; then
                  echo "::warning::$repo#$n: its board could not be written; no continue."; continue
                fi
                gh label create "autopilot:continue" --repo "$repo" --color 1D76DB --force --description "On an issue: the autopilot continues its draft pull request, or starts it" >/dev/null 2>&1 || true
                gh issue edit "$n" --repo "$repo" --add-label "autopilot:continue" >/dev/null && continue
                # The continue not asked for, the wait goes back on and the
                # start comes off, so the next sweep starts it, and the step
                # fails.
                echo "::warning::$repo#$n: the continue could not be asked for; its wait goes back on."
                failed="$failed $repo#$n"
                GITHUB_REPOSITORY="$repo" NUMBER="$n" BODY="$RUNNER_TEMP/body.md" python3 .dx-central/scripts/receipts.py state set "core_wait=$waits" core_started= || true ;;
            esac
          done 3< "$RUNNER_TEMP/core-next.txt"
          [ -z "$failed" ] || echo "::error::the continue could not be asked for on$failed."
          [ -z "$short" ] || echo "::error::$short."
          [ -z "$failed$short" ] || exit 1

      # #1002 C3: an accepted issue whose start was missed (an edit, a
      # comment or a refused run that started nothing) is started once. Only
      # one the autopilot holds that next-step would start (scripts/
      # autopilot.py `sweep start`): nobody holds it (C4: no claim, no
      # assignee), no `needs-human` on it (C4), the seal matches, no
      # question waits, no pull request is on its way (a person's, or the
      # autopilot's own open draft), no run is queued or in
      # progress (a read that fails counts as busy), no wait of the passes
      # above is on its board, and no autopilot pull request of it was
      # closed unmerged by a person (the maintainer's answer on #1003: a
      # missed start is recovered, a decision never undone; read once per
      # repository). `swept_start` goes on its board before dilux-bot adds
      # `autopilot:continue`, and the sweep never clears it: one start per
      # issue, and a run refused again is left to a person.
      - name: Start a missed one
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          if [ -n "$REPO" ]; then where=(--repo "$REPO"); else where=(--owner "$OWNER"); fi
          : > "$RUNNER_TEMP/accepted.txt"
          for label in accepted accepted-by:policy; do
            gh search issues "${where[@]}" --state open --label "$label" --limit 1000 --json repository,number \
              --jq '.[] | "\(.repository.nameWithOwner) \(.number)"' >> "$RUNNER_TEMP/accepted.txt"
          done
          sort -u "$RUNNER_TEMP/accepted.txt" -o "$RUNNER_TEMP/accepted.txt"
          failed=""
          mkdir -p "$RUNNER_TEMP/prs"
          while read -r repo n <&3; do
            [ -n "$repo" ] || continue
            board=$(GITHUB_REPOSITORY="$repo" NUMBER="$n" python3 .dx-central/scripts/receipts.py state get 2>/dev/null) || { echo "::warning::$repo#$n: its board could not be read."; continue; }
            # The cheap ones first: the passes above have it, or it started once.
            [ "$(jq -r '[.swept_start, .core_wait, .core_started, .rate_limited] | map(select(. != null and . != false and . != "" and . != [])) | length' <<<"$board")" = 0 ] || continue
            gh issue view "$n" --repo "$repo" --json body,labels > "$RUNNER_TEMP/issue.json" || { echo "::warning::$repo#$n could not be read."; continue; }
            labels=$(jq -c '[.labels[].name]' "$RUNNER_TEMP/issue.json")
            ! jq -e 'index("lane:release") or index("autopilot:continue")' <<<"$labels" >/dev/null || continue
            jq -r '.body // ""' "$RUNNER_TEMP/issue.json" > "$RUNNER_TEMP/body.md"
            # The autopilot's pull requests, open and closed, once per
            # repository: `taken` leaves its own open draft out (#696).
            prs="$RUNNER_TEMP/prs/${repo//\//_}.json"
            if [ ! -f "$prs" ]; then
              gh pr list --repo "$repo" --state all --label autopilot --limit 500 --json number,body,state,mergedAt > "$prs.tmp" && mv "$prs.tmp" "$prs" \
                || { echo "unreadable" > "$prs"; }
            fi
            jq -e 'type == "array"' "$prs" >/dev/null 2>&1 || { echo "::warning::$repo: its autopilot pull requests could not be read; #$n is not started."; continue; }
            # The state next-step reads, gathered as the edit-start job of
            # issue-triage.yml gathers it.
            on=(env GITHUB_REPOSITORY="$repo" NUMBER="$n" BODY="$RUNNER_TEMP/body.md")
            lane=""; if LANE=$("${on[@]}" python3 .dx-central/scripts/autopilot.py lane 2>/dev/null); then lane=$LANE; fi
            holder=""; rc=0; why=$("${on[@]}" python3 .dx-central/scripts/autopilot.py holder) || rc=$?
            [ "$rc" -eq 0 ] || holder=$why
            seal=$("${on[@]}" python3 .dx-central/scripts/receipts.py verify-prd || true)
            ok=true; may=$("${on[@]}" LANE="$lane" python3 .dx-central/scripts/autopilot.py may-start) || ok=false
            taken=false; "${on[@]}" python3 .dx-central/scripts/autopilot.py taken >/dev/null || taken=true
            spec=false; ! grep -q '^### Spec: ' "$RUNNER_TEMP/body.md" || spec=true
            jq -n --arg lane "$lane" --arg holder "$holder" --arg seal "$seal" --argjson ok "$ok" --arg may "$may" \
              --argjson taken "$taken" --argjson spec "$spec" --argjson labels "$labels" --argjson board "$board" \
              '{issue: {state: "OPEN", labels: $labels, asked: ($board.asked // null),
                        assignees: (if $holder == "" then [] else ["the person who holds it"] end)},
                lane: $lane, may_start: [$ok, $may], seal: $seal, spec: $spec,
                prs: (if $taken then [{number: 0, state: "OPEN", author_type: "Bot", labels: ["autopilot"]}] else [] end)}' > "$RUNNER_TEMP/state.json"
            step=$(python3 .dx-central/scripts/autopilot.py next-step < "$RUNNER_TEMP/state.json" 2>/dev/null) \
              || { echo "::warning::$repo#$n: next-step could not say its next phase."; continue; }
            busy=""
            case $(jq -r .action <<<"$step") in
              spec|draft) busy=$("${on[@]}" python3 .dx-central/scripts/autopilot.py runs-busy) || busy="(unreadable)" ;;
            esac
            out=$(jq -n --argjson step "$step" --argjson board "$board" --argjson labels "$labels" --arg busy "$busy" \
              --slurpfile prs "$prs" --argjson number "$n" \
              '{step: $step, board: $board, labels: $labels, busy: $busy, prs: $prs[0], number: $number}' \
              | python3 .dx-central/scripts/autopilot.py sweep start) || { echo "::warning::$repo#$n: sweep start could not say."; continue; }
            [ "${out%%$'\t'*}" = start ] || { echo "$repo#$n: not started: ${out#*$'\t'}"; continue; }
            echo "$repo#$n: a missed start: it starts (${out#*$'\t'})"
            at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            if ! GITHUB_REPOSITORY="$repo" NUMBER="$n" python3 .dx-central/scripts/receipts.py state set "swept_start=\"$at\"" >/dev/null; then
              echo "::warning::$repo#$n: its board could not be written; no continue."; continue
            fi
            gh label create "autopilot:continue" --repo "$repo" --color 1D76DB --force --description "On an issue: the autopilot continues its draft pull request, or starts it" >/dev/null 2>&1 || true
            gh issue edit "$n" --repo "$repo" --add-label "autopilot:continue" >/dev/null && continue
            # The continue not asked for, the key comes off again, so the
            # next sweep tries it, and the step fails.
            echo "::warning::$repo#$n: the continue could not be asked for; its swept_start comes off."
            failed="$failed $repo#$n"
            GITHUB_REPOSITORY="$repo" NUMBER="$n" python3 .dx-central/scripts/receipts.py state set swept_start= >/dev/null || true
          done 3< "$RUNNER_TEMP/accepted.txt"
          [ -z "$failed" ] || { echo "::error::the missed start could not be asked for on$failed."; exit 1; }
