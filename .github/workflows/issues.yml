name: Issues

# This repository's own issues, through the same shared workflows every
# DiluxOne repository calls (workflow-templates/issues.yml), at the moving
# tag, job for job as the template (scripts/sync-repos.py check compares
# them): the triage when an issue opens, the reproduction of a report the
# triage calls a bug (or that a maintainer labels repro:run; with no unit
# tests here it ends green and the report waits for a person), and, when a
# person accepts one, the Platform Project (#9, repos.yml), its assignee
# (#73), the gate re-run on its pull requests, the PRD's seal, and the
# autopilot (issue-triage.yml calls it). Most of this repository is a
# protected path of policy/autonomy.yml, and an autopilot pull request that
# touches one is never merged by policy.

on:
  issues:
    types: [opened, labeled, closed]
  schedule:
    - cron: '0 13 * * *'

permissions:
  contents: read

jobs:
  triage:
    permissions:
      contents: read
      issues: write
    uses: DiluxOne/.github/.github/workflows/issue-triage.yml@v6
    with:
      support-url: https://github.com/DiluxOne/.github/blob/main/SUPPORT.md
    secrets: inherit

  repro:
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: DiluxOne/.github/.github/workflows/issue-repro.yml@v6
    secrets: inherit

  repro-triaged:
    needs: triage
    if: needs.triage.outputs.bug == 'true'
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: DiluxOne/.github/.github/workflows/issue-repro.yml@v6
    with:
      trigger: triage
      triage-bug: ${{ needs.triage.outputs.bug }}
    secrets: inherit

  accepted:
    permissions:
      actions: write
      issues: read
      pull-requests: read
    uses: DiluxOne/.github/.github/workflows/issue-accepted.yml@v6
    with:
      # Here the gate runs in this repository's own pipeline
      # (pull-request.yml); the organisation's skips this repository.
      workflow: Pull request
    secrets:
      DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
