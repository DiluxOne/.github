name: Issues

# This repository's own issues, through the same shared workflows every
# DiluxOne repository calls (workflow-templates/issues.yml), at the moving
# tag, job for job as the template (scripts/sync-repos.py check compares
# them): the triage when an issue opens, the reproduction of a report the
# triage calls a bug (or that a maintainer labels repro:run; with no unit
# tests here it ends green and the report waits for a person), the issue
# schema checked when a person opens or edits an issue not accepted yet
# (awaiting-acceptance or incomplete, #353), and, when a person accepts
# one, the Platform Project (#9, repos.yml), its assignee (#73), the gate
# re-run on its pull requests, the PRD's seal, and the autopilot
# (issue-triage.yml calls it); the claims (#488, issue-claim.yml): `/claim`
# and the other commands in comments, the form's checkbox, a person's pull
# request, and the daily reminders and releases. Most of this repository is a protected path
# of policy/autonomy.yml, and an autopilot pull request that touches one is
# never merged by policy.

on:
  issues:
    types: [opened, edited, labeled, closed]
  # Claims (#488): the commands in comments, and a person's pull request
  # (metadata only; its code is never checked out). The answers that shape
  # an `incomplete` issue (#588) are comments too.
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
  schedule:
    - cron: '0 13 * * *'

permissions:
  contents: read

jobs:
  triage:
    if: github.event_name == 'issues' || github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    uses: DiluxOne/.github/.github/workflows/issue-triage.yml@v7
    with:
      support-url: https://github.com/DiluxOne/.github/blob/main/SUPPORT.md
    secrets: inherit

  repro:
    if: github.event_name == 'issues'
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: DiluxOne/.github/.github/workflows/issue-repro.yml@v7
    secrets: inherit

  repro-triaged:
    needs: triage
    if: github.event_name == 'issues' && needs.triage.outputs.bug == 'true'
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: DiluxOne/.github/.github/workflows/issue-repro.yml@v7
    with:
      trigger: triage
      triage-bug: ${{ needs.triage.outputs.bug }}
    secrets: inherit

  accepted:
    # Comments too (#588): an `incomplete` issue's answers shape it.
    if: github.event_name == 'issues' || github.event_name == 'issue_comment'
    permissions:
      actions: write
      issues: read
      pull-requests: read
    uses: DiluxOne/.github/.github/workflows/issue-accepted.yml@v7
    with:
      # Here the gate runs in this repository's own pipeline
      # (pull-request.yml); the organisation's skips this repository.
      workflow: Pull request
    secrets:
      DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
      # The shaping's model, with no tools (#588).
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # A person claims an issue (#488): `/claim`, the form's checkbox, and the
  # daily reminders and releases; every release starts the autopilot. The
  # only job that runs on pull_request_target, and with `accepted` the only
  # ones on issue_comment. It inherits
  # the secrets (dilux-bot's key, and the Claude token for the autopilot it
  # starts) and never checks out a pull request's code: on
  # pull_request_target it reads the pull request's metadata only.
  claim:
    permissions:
      contents: read
    uses: DiluxOne/.github/.github/workflows/issue-claim.yml@v7
    secrets: inherit
