name: Issues

# This repository's own issues, through the same shared workflows every
# DiluxOne repository calls (workflow-templates/issues.yml), at the moving
# tag: the triage when an issue opens, and, when a person accepts one, the
# Platform Project (#9, repos.yml), the gate re-run on its pull requests, the
# PRD's seal, and the autopilot (issue-triage.yml calls it). Most of this
# repository is a protected path of policy/autonomy.yml, and an autopilot
# pull request that touches one is never merged by policy. No reproduction job: this repository has no
# plugin to reproduce a bug in.

on:
  issues:
    types: [opened, labeled, closed]
  schedule:
    - cron: '0 13 * * *'

permissions:
  contents: read

jobs:
  triage:
    permissions:
      contents: read
      issues: write
    uses: DiluxOne/.github/.github/workflows/issue-triage.yml@v5
    with:
      support-url: https://github.com/DiluxOne/.github/blob/main/SUPPORT.md
    secrets: inherit

  accepted:
    permissions:
      actions: write
      issues: read
      pull-requests: read
    uses: DiluxOne/.github/.github/workflows/issue-accepted.yml@v5
    secrets:
      DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
