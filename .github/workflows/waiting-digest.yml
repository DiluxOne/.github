name: What waits

# Not reusable. Every day, and by hand (#479, #564): the sweep of the "What
# waits" view, which waiting-update.yml rewrites on every event of an issue
# or a pull request: every open issue and pull request of the organisation
# that waits on someone, what blocks it (needs-human, the autopilot's
# question, an acceptance, an incomplete issue, a triage's question, a
# claim, a failed check, an unresolved thread, a draft, the checks, a
# person's merge), the action and its full URL, grouped by whom it waits
# on, in one issue of this repository, labelled `run:waiting` and pinned,
# whose body is rewritten every run (scripts/waiting.py publish): the place
# the maintainer reads. A run repairs what a missed event left. The issue
# is public, so a private repository's items are counted, never named. A
# search that fails fails the run and leaves the last body as it was.

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waiting-digest

jobs:
  digest:
    name: What waits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: App token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-issues: write
          permission-pull-requests: read
          permission-checks: read # the heads' checks, for a failed one
          permission-metadata: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Keep the issue up to date
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          VIEW_REPO: ${{ github.repository }}
        run: python3 scripts/waiting.py publish
