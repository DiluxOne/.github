name: Pull request comments

# This repository's own caller: a person who mentions @dilux-bot in a pull
# request gets an answer from the Claude reviewer (review-reply.yml).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  reply:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: ./.github/workflows/review-reply.yml
    with:
      profile: general
      central-ref: main
    secrets: inherit
