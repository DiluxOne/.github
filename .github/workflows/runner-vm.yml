name: Organisation VM

# Not reusable. The private repositories run the shared workflows on the
# organisation's own runners (all but the release, the credentials check and
# the reproduction, which handle secrets or code written from an issue's text
# and stay on GitHub's fresh runners): vm-gh-runner-01 in Azure, runner group
# private-repos-vm, label `diluxone`. Their jobs pick it when they see the
# organisation variable DX_RUNNER_HEAVY (#190: the runs-on value, as JSON:
# ["self-hosted","linux","x64","diluxone"]), which only the private
# repositories do. Public repositories, this one included, stay on GitHub's
# runners, free for them; that is also why this check runs here.
#
# The runners themselves are one-job containers (scripts/runner-vm/, the
# image from runner-image.yml); the VM brings itself to that state on every
# boot (scripts/runner-vm/provision.sh).
#
# Every five minutes from the clock in Azure (below), when dispatched with
# `start` by a private repository's
# pull request (runner-wake.yml, from the organisation's pipeline, #154), and
# by hand: when a private repository's job is waiting for a `diluxone` runner
# and the VM is off, it starts it; when the VM is on
# and nothing has run on it for IDLE_MINUTES (no runner process at work, the
# VM's own record of the last one), it cleans what jobs left (images only
# past 70% of the data disk) and deallocates it, so compute is paid only
# while jobs run. The VM is shared with AI Studio's runners: "nothing has run"
# counts theirs too, so neither side switches it off under the other.
#
# GitHub delays or skips schedules under load: from 10 to 15 October it ran
# this one 4 to 6 times a day of 144, and jobs that no pull request woke (an
# issue, a push, a re-run) waited hours (#183). So the clock is outside
# GitHub: an Azure Function (scripts/runner-vm/clock/,
# diluxone-runner-cl-prod-func) dispatches this workflow with `auto` every
# five minutes, as dilux-bot, and a pull request still wakes the VM at once
# (runner-wake.yml). The schedule here stays as the fallback if the Function
# stops. Every run also keeps one issue here, "Jobs waiting for the
# organisation's VM", listing the jobs queued for more than LONG_MINUTES
# with their links, closed when none waits that long (#154), and first
# cancels the runs of pull requests closed without merging, which nothing
# reads and which would hold the VM (#341). The decisions are
# scripts/runner-demand.sh, with its self-test.
#
# What runs there, and with what: the private repositories' jobs, the review
# and the issue triage among them, with the Claude token and dilux-bot's key.
# Those repositories take pull requests from the maintainer, the maintainer's
# agents and Dependabot alone (a private repository has no outside forks
# running its workflows), and AI Studio, the VM's other tenant, is the
# maintainer's too. Code anyone else writes never reaches it: the release,
# the credentials check and the reproduction stay on GitHub's fresh runners,
# so do the checks of the pull requests dilux-bot opens from a reproduction
# (scripts/runner-route.py decides from their branch and author, #167), and
# public repositories never see DX_RUNNER_HEAVY. A VM that hosted anyone else's
# code would need jobs that do not persist, one VM per job.
#
# Azure: OIDC federation (app gh-actions-dilux-runner-starter, a credential
# for this repository's main branch; role Virtual Machine Contributor on that
# VM alone). The IDs are variables, not secrets: none of them is a credential.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'auto (start when a job waits, deallocate when idle) | start | deallocate'
        type: choice
        options: [auto, start, deallocate]
        default: auto

permissions:
  contents: read

concurrency:
  group: runner-vm
  cancel-in-progress: false

env:
  IDLE_MINUTES: 20
  LONG_MINUTES: 15

jobs:
  vm:
    name: Start or deallocate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # the Azure login
      issues: write # the issue of jobs that waited too long, here
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: dilux-bot token (read the private repositories' runs)
        id: bot
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-actions: read
          permission-metadata: read

      - name: dilux-bot token (cancel the runs of closed pull requests)
        id: cancel
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-actions: write
          permission-pull-requests: read
          permission-metadata: read

      # Before the count, so a run nothing will read neither waits for the
      # VM nor holds it on (#341).
      - name: Runs of pull requests closed unmerged
        continue-on-error: true
        if: steps.cancel.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.cancel.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          bash scripts/runner-demand.sh stale > "$RUNNER_TEMP/stale.tsv" || echo "::warning::The runs of closed pull requests could not all be read or cancelled; the next run tries again."
          while IFS=$'\t' read -r repo id; do echo "Cancelled $OWNER/$repo run $id: its pull request is closed."; done < "$RUNNER_TEMP/stale.tsv"

      - name: Jobs waiting for the VM
        id: demand
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        # A run queued or in progress in a private repository, with a job
        # still queued whose labels ask for `diluxone`. Unsure (an API error)
        # counts as waiting: a VM left on costs less than jobs left stuck.
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::warning::No dilux-bot token: counted as waiting."; echo "waiting=unknown" >> "$GITHUB_OUTPUT"; exit 0; }
          bash scripts/runner-demand.sh scan > "$RUNNER_TEMP/waiting.tsv" || { echo "::warning::GitHub did not answer: counted as waiting."; echo "waiting=unknown" >> "$GITHUB_OUTPUT"; exit 0; }
          cut -f1,3 "$RUNNER_TEMP/waiting.tsv"
          waiting=$(wc -l < "$RUNNER_TEMP/waiting.tsv" | tr -d ' ')
          echo "$waiting job(s) waiting for the VM"
          echo "waiting=$waiting" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Start or deallocate
        env:
          RG: ${{ vars.RUNNER_VM_RG }}
          VM: ${{ vars.RUNNER_VM_NAME }}
          ACTION: ${{ github.event.inputs.action || 'auto' }}
          WAITING: ${{ steps.demand.outputs.waiting }}
        run: |
          set -euo pipefail
          power() { az vm get-instance-view -g "$RG" -n "$VM" --query "instanceView.statuses[?starts_with(code,'PowerState/')].code | [0]" -o tsv; }
          state=$(power)
          echo "VM: $state; waiting: $WAITING; action: $ACTION"
          if [ "$ACTION" = auto ]; then
            # Unsure starts a VM that is off, but does not keep one on: it
            # goes off only when idle, and the next run starts it again.
            ACTION=$(bash scripts/runner-demand.sh decide "$state" "${WAITING:-unknown}")
            case "$ACTION" in
              stay) echo "On, and jobs wait for it."; exit 0 ;;
              nothing) echo "Off, and nothing waits for it."; exit 0 ;;
            esac
          fi
          case "$ACTION" in
            start)
              [ "$state" = PowerState/running ] && { echo "Already on."; exit 0; }
              # Starting while it deallocates fails with AllocationFailed: wait it out.
              for i in $(seq 1 30); do [ "$state" != PowerState/deallocating ] && break; sleep 10; state=$(power); done
              for i in 1 2 3; do
                az vm start -g "$RG" -n "$VM" -o none && break
                [ "$i" = 3 ] && { echo "::error::The VM did not start after three tries."; exit 1; }
                sleep 60
              done
              echo "Started: its runners connect to GitHub as it boots." ;;
            deallocate-if-idle)
              # Asked of the VM itself: is a runner at work (ours or AI Studio's),
              # and when did one last work? Each job leaves a Worker_*.log in its
              # runner's _diag, written until the job ends, so the newest one
              # dates the last job, however short, between two of these runs.
              # Since the VM booted, at least: a fresh start counts as work.
              # shellcheck disable=SC2016 # runs on the VM, not here.
              verdict=$(az vm run-command invoke -g "$RG" -n "$VM" --command-id RunShellScript --query 'value[0].message' -o tsv --scripts '
                if pgrep -f Runner.Worker >/dev/null; then echo VERDICT=busy; exit 0; fi
                now=$(date +%s); boot=$(( now - $(cut -d. -f1 /proc/uptime) ))
                last=$( { find /data/runners/*/_diag /data/runners-dx/*/_diag -name "Worker_*.log" -printf "%T@\n"; find /var/lib/dx-runner/last-job -printf "%T@\n"; } 2>/dev/null | sort -n | tail -1 | cut -d. -f1)
                last=${last:-0}; [ "$last" -gt "$boot" ] || last=$boot
                echo "VERDICT=idle-for:$(( (now - last) / 60 ))"') || { echo "::warning::Could not ask the VM; it stays on."; exit 0; }
              verdict=$(sed -n 's/^VERDICT=//p' <<<"$verdict" | tail -1)
              echo "VM says: ${verdict:-nothing}"
              case "$verdict" in
                idle-for:*)
                  minutes=${verdict#idle-for:}
                  if [ "$minutes" -ge "$IDLE_MINUTES" ]; then
                    # Before it goes off, and only while nothing runs: what
                    # jobs left behind and nothing references. Every image goes
                    # only when the data disk is over 70% full, so the ones in
                    # daily use are not pulled again after every boot. A
                    # failed cleanup is logged and the VM goes off anyway.
                    # shellcheck disable=SC2016 # runs on the VM, not here.
                    az vm run-command invoke -g "$RG" -n "$VM" --command-id RunShellScript --query 'value[0].message' -o tsv --scripts '
                      pgrep -f Runner.Worker >/dev/null && { echo "busy: no cleanup"; exit 0; }
                      docker container prune -f >/dev/null; docker volume prune -f >/dev/null; docker image prune -f >/dev/null
                      docker builder prune -f --filter until=168h >/dev/null
                      used=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
                      [ "${used:-0}" -gt 70 ] && docker image prune -af >/dev/null
                      echo "cleaned; /data at $(df --output=pcent /data | tail -1 | tr -d " ")"' || echo "::warning::The cleanup failed; deallocating anyway."
                    az vm deallocate -g "$RG" -n "$VM" -o none --no-wait
                    echo "Idle for $minutes minutes: deallocating."
                  else
                    echo "Idle for $minutes minutes; it goes off at $IDLE_MINUTES."
                  fi ;;
                *) echo "Busy, or no answer: it stays on." ;;
              esac ;;
            deallocate)
              [ "$state" = PowerState/deallocated ] && { echo "Already off."; exit 0; }
              az vm deallocate -g "$RG" -n "$VM" -o none --no-wait
              echo "Deallocating." ;;
          esac

      # After the VM, so a failure here never keeps it from starting. Only
      # with a scan that answered: unsure says nothing either way.
      - name: Jobs that waited too long
        if: always() && steps.demand.outputs.waiting != '' && steps.demand.outputs.waiting != 'unknown'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          bash scripts/runner-demand.sh long "$LONG_MINUTES" "$(date +%s)" < "$RUNNER_TEMP/waiting.tsv" > "$RUNNER_TEMP/long.tsv"
          bash scripts/runner-demand.sh report "$RUNNER_TEMP/long.tsv"
