name: Pull request edited

# When the title or the description changes: the conventions, the review (which
# spends nothing on a commit it already read; it re-checks that the description
# still matches the code) and the auto-merge decision. Nothing else: the suites
# gave the code its verdict already and keep it. Same job ids as pull-request.yml
# so the rulesets see one set of checks.

on:
  pull_request:
    types: [edited]

permissions:
  contents: read

jobs:
  conventions:
    permissions:
      contents: read
      pull-requests: read # the pull request's timeline, for the base-branch check on `edited`
      issues: read # the issues it closes, for the accepted-issue gate
      actions: read # the run that opened a lane's issue (policy/autonomy.yml)
    uses: ./.github/workflows/conventions.yml
    with:
      retired-names: ''

  # The issues it closes go to its author, when a member (#73). The
  # script is read from main, like the review's: a pull request's own
  # copy runs only once merged.
  assignee:
    permissions: {}
    uses: ./.github/workflows/pull-request-assignee.yml
    with:
      central-ref: main
    secrets:
      DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}

  review:
    needs: [conventions]
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: ./.github/workflows/claude-review.yml
    with:
      profile: general
      central-ref: main
    secrets: inherit

  auto-merge:
    needs: review
    if: always() && needs.review.result != 'skipped'
    # Its `repro` job reads the lane issue a reproduced bug's fix closes (#397).
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/auto-merge.yml
    with:
      risk: ${{ needs.review.outputs.risk }}
      complexity: ${{ needs.review.outputs.complexity }}
      floor: ${{ needs.review.outputs.floor }}
      trusted: ${{ needs.review.outputs.trusted }}
      blocking: ${{ needs.review.outputs.blocking }}
      enabled: ${{ needs.review.outputs.auto-merge }}
      description-ok: ${{ needs.review.outputs.description-ok }}
    secrets: inherit
