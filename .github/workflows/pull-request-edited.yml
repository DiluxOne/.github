name: Pull request edited

# When the title or the description changes: the conventions, the review (which
# spends nothing on a commit it already read; it re-checks that the description
# still matches the code) and the auto-merge decision, and, when the title
# changed, the "Test first" check (#734), as the type decides it. Nothing else:
# the suites gave the code its verdict already and keep it. Same job ids as pull-request.yml
# so the rulesets see one set of checks. A review this run made (a
# description it had not read, or the `review:full` label) that blocks an
# autopilot pull request starts its fix round (autopilot-fix, #928), as a
# push's does in pull-request.yml; a verdict only reused from the push
# starts none, since the push's run has its round.

on:
  pull_request:
    types: [edited]

permissions:
  contents: read

jobs:
  conventions:
    permissions:
      contents: read
      pull-requests: read # the pull request's timeline, for the base-branch check on `edited`
      issues: read # the issues it closes, for the accepted-issue gate
      actions: read # the run that opened a lane's issue (policy/autonomy.yml)
    uses: ./.github/workflows/conventions.yml
    with:
      retired-names: ''

  # The title's type decides whether a test must fail at the base (#734).
  test-first:
    if: github.event.changes.title
    permissions:
      contents: read
    uses: ./.github/workflows/test-first.yml
    with:
      declaration-at-base: true

  # The issues it closes go to its author, when a member (#73). The
  # script is read from main, like the review's: a pull request's own
  # copy runs only once merged.
  assignee:
    permissions: {}
    uses: ./.github/workflows/pull-request-assignee.yml
    with:
      central-ref: main
    secrets:
      DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}

  review:
    # order: the conventions gate passes first, so no review is paid for a
    # pull request it refuses.
    needs: [conventions]
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: ./.github/workflows/claude-review.yml
    with:
      profile: general
      central-ref: main
    secrets: inherit

  auto-merge:
    # order: after the "Test first" check too (#842), whose verdict at the
    # head G7 reads for a criterion's test.
    needs: [review, test-first]
    if: always() && needs.review.result != 'skipped'
    # Its `repro` job reads the lane issue a reproduced bug's fix closes (#397).
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read # the head's check runs, for G7 (#842)
    uses: ./.github/workflows/auto-merge.yml
    with:
      risk: ${{ needs.review.outputs.risk }}
      complexity: ${{ needs.review.outputs.complexity }}
      floor: ${{ needs.review.outputs.floor }}
      trusted: ${{ needs.review.outputs.trusted }}
      blocking: ${{ needs.review.outputs.blocking }}
      enabled: ${{ needs.review.outputs.auto-merge }}
      description-ok: ${{ needs.review.outputs.description-ok }}
    secrets: inherit

  autopilot-fix:
    # #928 C5: pull-request.yml's guards (dilux-bot's own pull request,
    # with the `autopilot` label, ready, at its head, in this repository),
    # on a review that blocks or ended without its verdict, or found the
    # description wrong, and only one this run made (`fresh`): a verdict
    # reused from the push's run is the push's round's to fix. The round's
    # own guards (superseded, the rounds cap) are autopilot.yml's.
    needs: [conventions, review]
    if: always() && github.event_name == 'pull_request' && github.repository == 'DiluxOne/.github' && (needs.review.outputs.blocking == 'true' || needs.review.result == 'failure' || needs.review.outputs.description-mismatch == 'true') && needs.review.outputs.fresh == 'true' && needs.review.outputs.current != 'false' && !github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'autopilot') && github.event.pull_request.user.login == vars.DX_BOT_LOGIN
    # The agent's jobs read the repository with the job's own token (#287).
    permissions:
      contents: read
    uses: ./.github/workflows/autopilot.yml
    with:
      mode: fix
      pr: ${{ format('{0}', github.event.pull_request.number) }}
      # #924 C3: the review read this description and said it does not
      # match: the round rewrites it (autopilot.py describe).
      description-ok: ${{ needs.review.outputs.description-mismatch == 'true' && 'false' || 'true' }}
      central-ref: main
    secrets: inherit
