name: Conventions

# Reusable. The rules in CONTRIBUTING.md a machine can decide, on every pull
# request: branch name, pull request title (it becomes the squashed commit on
# main), every commit the branch adds (no Claude-Session trailer), and a
# description whose required sections are filled in (it becomes the commit
# body) and that carries no "Generated with" footer (AI is disclosed with
# the one sober line instead), and that it closes an issue a maintainer
# accepted (scripts/issue-gate.sh; the organisation's policy, `issue-gate`);
# that a docs pull request changes only documentation; and that one from an
# author who is not trusted stays under `max-changed-lines-untrusted`.
# The checks themselves are scripts/conventions.sh,
# which scripts/local-review.sh runs before a pull request is opened. Plus a docs check whenever the caller runs (pull requests and
# pushes to main): relative Markdown links resolve, and no retired product
# name comes back.
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review]  # and pull-request-edited.yml on `edited`
#   jobs:
#     conventions:
#       permissions: { contents: read, pull-requests: read, issues: read }
#       uses: DiluxOne/.github/.github/workflows/conventions.yml@v4
#       with:
#         retired-names: 'offload\+|dilux cloud'   # optional
#         required-sections: 'What changes,Why'   # the default
#         max-header: 100                         # the default
#         central-ref: v4                         # the default: where the script is read from;
#                                                 # keep it on the ref the workflow is pinned at

on:
  workflow_call:
    inputs:
      retired-names:
        description: Case-insensitive extended regex of names that must not appear in tracked files. Empty to skip.
        type: string
        default: ''
      required-sections:
        description: Comma-separated text of the description headings that must have content (matched inside "## " headings). Empty to skip.
        type: string
        default: 'What changes,Why'
      max-header:
        description: Maximum length of a PR title or commit header.
        type: number
        default: 100
      review-bot:
        description: The login of the App that posts the Claude review; only its comments carry a record the conventions trust.
        type: string
        default: 'dilux-bot[bot]'
      central-ref:
        description: Ref of DiluxOne/.github to read the conventions script from.
        type: string
        default: v4

permissions:
  contents: read

jobs:
  conventions:
    name: Conventions (branch, title, commits)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read # the pull request's timeline, for the base-branch check
      issues: read # the issues the pull request closes, for the accepted-issue gate
    steps:
      - name: No base-branch change since the last push
        # `edited` also fires when the base branch changes. The suites ran on
        # a merge with the old base and, on `edited`, do not run again
        # (pull-request-edited.yml), so this check fails until a push starts
        # them on the new merge: on every `edited` event, not only the one
        # that changed the base, because a later title edit re-runs this job
        # under the same id and would replace the failure. The fact comes
        # from the pull request's timeline, which is chronological: the last
        # base_ref_changed event must come before the last commit pushed
        # (committed, or head_ref_force_pushed). No run of any workflow is
        # consulted, so it holds whatever workflows the repository has.
        if: github.event.action == 'edited'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          order=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/timeline" --paginate | jq -r -s '[.[][] | .event] | to_entries | map(select(.value == "base_ref_changed" or .value == "committed" or .value == "head_ref_force_pushed")) | {retarget: (map(select(.value == "base_ref_changed") | .key) | max), pushed: (map(select(.value != "base_ref_changed") | .key) | max)} | "\(.retarget // -1) \(.pushed // -1)"')
          retarget=${order% *}; pushed=${order#* }
          if [ "$retarget" -lt 0 ]; then echo "The base branch never changed."; exit 0; fi
          if [ "$retarget" -gt "$pushed" ]; then
            echo "::error::The base branch changed (now $BASE) after the last push, so the suites ran against the old base. Push a commit (or merge the base) so they run against the new one."
            exit 1
          fi
          echo "The base changed and a push followed it: the suites ran against the current base."

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout the conventions script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          # This repository's own pull requests check themselves with their
          # own script: they can change this workflow anyway.
          ref: ${{ github.repository == 'DiluxOne/.github' && github.event.pull_request.head.sha || inputs.central-ref }}
          path: .dx-central
          persist-credentials: false

      - name: The accepted-issue gate and the size limit, as the base branch's policy says
        id: gate
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        # Read from the base branch, never the pull request's own copy: a
        # pull request cannot exempt itself by editing the policy.
        run: |
          git show "$BASE:.github/review-policy.yml" > "$RUNNER_TEMP/repo-policy.yml" 2>/dev/null || : > "$RUNNER_TEMP/repo-policy.yml"
          DEFAULT_POLICY=.dx-central/policy/review-policy.default.yml REPO_POLICY="$RUNNER_TEMP/repo-policy.yml" \
            POLICY_MODE=issue-gate python3 .dx-central/scripts/policy.py

      - name: An accepted issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REQUIRED: ${{ steps.gate.outputs.required }}
          LABEL: ${{ steps.gate.outputs.label }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: bash .dx-central/scripts/issue-gate.sh

      - name: The labels and the review's comments, as they are now
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EVENT_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        # The event carries the labels of the moment it fired, and a re-run
        # replays that event: a type:* label the review changed since would
        # read as the old one. Ask for them now, and for the comments, where
        # the review's last record says which commit it read.
        run: |
          if labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '[.[].name] | join(",")') \
             && gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate > "$RUNNER_TEMP/comments.json"; then
            echo "labels=$labels" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not read the pull request's labels and comments (the caller's job needs pull-requests: read); the event's labels are used, and a re-run may see a type:* label the review has changed since."
            echo "labels=$EVENT_LABELS" >> "$GITHUB_OUTPUT"
            echo '[]' > "$RUNNER_TEMP/comments.json"
          fi

      - name: Check branch, title and commits
        env:
          # Through env, never interpolated into the script: a title is
          # attacker-controlled text.
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
          MAX_HEADER: ${{ inputs.max-header }}
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          SECTIONS: ${{ inputs.required-sections }}
          LABELS: ${{ steps.live.outputs.labels }}
          COMMENTS_FILE: ${{ runner.temp }}/comments.json
          REVIEW_BOT: ${{ inputs.review-bot }}
          # Empty for a trusted author: the policy's max-changed-lines-untrusted.
          MAX_LINES: ${{ steps.gate.outputs.max_lines }}
        run: bash .dx-central/scripts/conventions.sh

  docs:
    name: Docs (links and names)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Relative links resolve
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --exclude-path node_modules --exclude-path vendor './**/*.md' './.github/**/*.md'
          fail: true

      - name: No retired product names
        if: inputs.retired-names != ''
        env:
          RETIRED: ${{ inputs.retired-names }}
        run: |
          # Every caller declares the names on a `retired-names:` line (the
          # main workflow and pull-request-edited.yml alike): those lines are
          # the exemption, not one file.
          if git grep -nIiE "$RETIRED" -- . | grep -vE '^[^:]+:[0-9]+:\s*retired-names:'; then
            echo "::error::A retired product name is back (see the lines above)."
            exit 1
          fi
