name: Pull request

# This repository's own pipeline: the same conventions and review every
# DiluxOne repository uses, plus a workflow linter. The reusable workflows are
# called from this commit (./.github/workflows/...), but the review profiles,
# the policy and the brief script are read from main, so a pull request cannot
# rewrite the rules that review it. The conventions script comes from the pull
# request itself: it can change conventions.yml anyway.

on:
  # An edit of the title or description is handled by pull-request-edited.yml.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conventions:
    permissions:
      contents: read
      pull-requests: read
      issues: read # the issues it closes, for the accepted-issue gate
      actions: read # the run that opened a lane's issue (policy/autonomy.yml)
    uses: ./.github/workflows/conventions.yml

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: Every shared job picks its runner, but those that stay on GitHub's
        # The private repositories' jobs run on the organisation's VM through
        # DX_RUNNER (runner-vm.yml), all with the one expression of
        # scripts/runner-route.py, which keeps dilux-bot's reproduction pull
        # requests off the VM (#167), or with the choice an earlier job of
        # the run made (autopilot.yml's `where`); the release, the credentials
        # check and the reproduction handle secrets or code written from an
        # issue's text and always stay on GitHub's fresh runners, and so does
        # the wake-up of the VM (#154), which cannot wait for the VM it starts.
        run: python3 scripts/runner-route.py check
      - name: No merge-conflict markers
        # A rebase resolved by hand can leave a conflict's markers (diff3's
        # base section among them) in a file that still parses (#152).
        run: |
          if git grep -nE '^(<{7}|[|]{7}|>{7})( |$)' -- .; then
            echo "::error::merge-conflict markers are committed (above)"; exit 1
          fi

  scripts:
    name: Scripts (self-tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/next-version.py --test
      - run: python3 scripts/release-gate.py --test
      - run: python3 scripts/release-issue.py --test
      - run: bash scripts/release-ready.sh --test
      - run: bash scripts/stamp-version.sh --test
      - run: bash scripts/release-markers.sh --test
      - run: bash scripts/conventions.sh --test
      - run: bash scripts/issue-gate.sh --test
      - run: bash scripts/issue-assignee.sh --test
      - run: bash scripts/review-brief.sh --test
      - run: bash scripts/local-review.sh --test
      - run: python3 scripts/policy.py --test
      - run: python3 scripts/surface.py --test
      - run: bash scripts/triage-reply.sh --test
      - run: bash scripts/required-plugins.sh --test
      - run: bash scripts/stage-plugin.sh --test
      - run: bash scripts/triage-act.sh --test
      - run: bash scripts/repro-trigger.sh --test
      - run: bash scripts/repro-sandbox.sh --test
      - run: python3 scripts/repro-lane.py --test
      - run: bash scripts/triage-brief.sh --test
      - run: python3 scripts/sync-repos.py --test
      - run: bash scripts/dx.sh --test
      - run: php scripts/review-rules.php --test
      - run: python3 scripts/test-targets.py --test
      - run: python3 scripts/php-versions.py --test
      - run: python3 scripts/setup-php-timeouts.py --test
      - run: python3 scripts/autonomy.py --test
      - run: python3 scripts/autonomy.py check
      - run: bash scripts/policy-digest.sh --test
      - run: bash scripts/run-issue.sh --test
      - run: python3 scripts/needed-a-person.py --test
      - run: python3 scripts/issue-schema.py --test
      - run: bash scripts/review-type.sh --test
      - run: python3 scripts/issue-schema.py form --check
      - run: python3 scripts/decision.py --test
      - run: python3 scripts/rules.py --test
      - run: python3 scripts/rules.py check
      - run: python3 scripts/repos-config.py --test
      - run: python3 scripts/repos-config.py check
      - run: python3 scripts/design-tokens.py --test
      - run: python3 scripts/design-tokens.py build --check
      # stylelint, as scripts/stylelint/package-lock.json pins it: every CSS
      # fixture of a design system through the configuration generated
      # from its rules.yml, and the plugins' check on a scratch repository.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --prefix scripts/stylelint --ignore-scripts --no-audit --no-fund
      - run: python3 scripts/design-lint.py --test
      - run: python3 scripts/receipts.py --test
      - run: python3 scripts/autopilot.py --test
      - run: python3 scripts/revert.py --test
      - run: python3 scripts/api-commit.py --test
      - run: bash scripts/runner-vm/dx-runner-slot.sh --test
      - run: bash scripts/runner-vm/provision.sh --test
      - run: python3 scripts/runner-vm/clock/clock.py --test
      - run: bash scripts/runner-vm/clock/deploy.sh --test
      - run: bash scripts/runner-demand.sh --test
      - run: bash scripts/kind.sh --test
      - run: python3 scripts/runner-route.py --test

  # The scripts a contributor runs on their own machine, on a stock macOS:
  # its bash is 3.2 and its tools are BSD's, so what only works with GNU
  # tools (sha256sum, sed -i without a suffix, …) fails here, not on a
  # contributor's laptop.
  scripts-macos:
    name: Scripts on macOS (the contributor's tools)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every `bash` the scripts call is the stock one too, not Homebrew's.
      - run: |
          mkdir -p "$RUNNER_TEMP/stock" && ln -sf /bin/bash "$RUNNER_TEMP/stock/bash"
          echo "$RUNNER_TEMP/stock" >> "$GITHUB_PATH"
      - run: bash --version | head -1
      - run: /bin/bash scripts/conventions.sh --test
      - run: /bin/bash scripts/issue-gate.sh --test
      - run: /bin/bash scripts/review-brief.sh --test
      - run: /bin/bash scripts/local-review.sh --test
      - run: python3 scripts/policy.py --test
      - run: python3 scripts/surface.py --test

  # The issues it closes go to its author, when a member (#73). The
  # script is read from main, like the review's: a pull request's own
  # copy runs only once merged.
  assignee:
    permissions: {}
    uses: ./.github/workflows/pull-request-assignee.yml
    with:
      central-ref: main
    secrets:
      DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}

  review:
    needs: [conventions, actionlint, scripts]
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: ./.github/workflows/claude-review.yml
    with:
      profile: general
      central-ref: main
    secrets: inherit

  auto-merge:
    needs: review
    if: always() && needs.review.result != 'skipped'
    uses: ./.github/workflows/auto-merge.yml
    with:
      risk: ${{ needs.review.outputs.risk }}
      complexity: ${{ needs.review.outputs.complexity }}
      floor: ${{ needs.review.outputs.floor }}
      trusted: ${{ needs.review.outputs.trusted }}
      blocking: ${{ needs.review.outputs.blocking }}
      description-ok: ${{ needs.review.outputs.description-ok }}
      enabled: ${{ needs.review.outputs.auto-merge }}
    secrets: inherit
