name: Plugin checks for coding agents

# Reusable. The checks of the ai-agent-plugin kind
# (kinds/ai-agent-plugin/pack.yml, #552), a plugin wired into coding agents
# (Claude Code, Codex, Copilot, Cursor, Gemini, OpenCode): its manifests,
# one per tool it declares, agreeing on its name, version and description
# (kinds/ai-agent-plugin/tools.yml, scripts/agent-manifests.py check), and
# the kind's review rules (what a plugin must never ship: a hook that pipes a
# download to a shell or writes outside the project, a skill that asks for
# root, a credential; kinds/ai-agent-plugin/rules.yml, run by
# scripts/review-rules.php's text adapter). Each job is its own status check.
# The repository's own suites stay its own workflows; its `make pre-pr`
# runs them beside these.
#
# The rules come from the pack, in this organisation's checkout, never from
# the pull request, so a pull request cannot exempt itself. The kind is
# checked against the repository's policy as it stands on the base branch
# (scripts/kind.sh): a repository that declares another kind fails.
#
#   jobs:
#     checks:
#       uses: DiluxOne/.github/.github/workflows/plugin-checks-ai.yml@v7
#
# (workflow-templates/plugin-checks-ai.yml; the conventions and the review
# are the organisation's required org-pull-request.yml.)

on:
  workflow_call:
    inputs:
      central-ref:
        description: The ref of DiluxOne/.github whose scripts and policy run. Empty (the default) means the very commit this workflow runs from, job.workflow_sha, so a caller that pins a SHA or a tag runs that commit's scripts too (#287).
        type: string
        default: ''
      kind:
        description: The kind of project whose rules these checks read (kinds/<kind>/). A repository whose policy declares another kind fails.
        type: string
        default: ai-agent-plugin

permissions:
  contents: read

jobs:
  manifests:
    name: Manifests of every tool
    # Every tool's manifest the plugin ships (.claude-plugin/plugin.json,
    # .codex-plugin/plugin.json, gemini-extension.json...) says the same
    # name, version and description; a failure names both files. The tools
    # and their fields are the pack's tools.yml, from this organisation's
    # checkout.
    runs-on: ${{ vars.DX_RUNNER_HEAVY != '' && !((github.event.pull_request.user.login == vars.DX_BOT_LOGIN && (startsWith(github.event.pull_request.head.ref, 'test/repro-issue-') || (contains(github.event.pull_request.head.ref, '/') && contains(github.event.pull_request.head.ref, '-the-bug-reproduced-from-')))) || (github.event.issue.user.login == vars.DX_BOT_LOGIN && (github.event.issue.pull_request || startsWith(github.event.issue.title, 'The bug reproduced from ')))) && fromJSON(vars.DX_RUNNER_HEAVY) || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref || job.workflow_sha }}
          path: .dx-central
          persist-credentials: false
      - name: The organisation's configuration (#197)
        run: test ! -f .dx-central/scripts/config-overlay.sh || bash .dx-central/scripts/config-overlay.sh
      - name: The manifests agree
        run: python3 .dx-central/scripts/agent-manifests.py check .

  review-rules:
    name: Review rules (${{ inputs.kind }})
    # What a plugin for coding agents must never ship, as data:
    # kinds/<kind>/rules.yml, run by the generic engine on the repository's
    # checkout (its tests, fixtures and changelog left out, as the rules
    # file says). An error fails, a warning is annotated.
    runs-on: ${{ vars.DX_RUNNER_HEAVY != '' && !((github.event.pull_request.user.login == vars.DX_BOT_LOGIN && (startsWith(github.event.pull_request.head.ref, 'test/repro-issue-') || (contains(github.event.pull_request.head.ref, '/') && contains(github.event.pull_request.head.ref, '-the-bug-reproduced-from-')))) || (github.event.issue.user.login == vars.DX_BOT_LOGIN && (github.event.issue.pull_request || startsWith(github.event.issue.title, 'The bug reproduced from ')))) && fromJSON(vars.DX_RUNNER_HEAVY) || 'ubuntu-latest' }}
    # The engine's PHP, set up on the organisation's runner image, which
    # carries none, can take minutes on a busy VM (#173).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base, for its policy.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref || job.workflow_sha }}
          path: .dx-central
          persist-credentials: false
      - name: The organisation's configuration (#197)
        run: test ! -f .dx-central/scripts/config-overlay.sh || bash .dx-central/scripts/config-overlay.sh
      - name: The kind
        id: kind
        env:
          KIND_DEFAULT: ${{ inputs.kind }}
          DEFAULT_POLICY: .dx-central/policy/review-policy.default.yml
          EVENT: ${{ github.event_name }}
        run: bash .dx-central/scripts/kind.sh
      # The engine's PHP: GitHub's runners carry one, the organisation's
      # runner image does not, by design.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: none
      - name: Check the rules
        env:
          KIND: ${{ steps.kind.outputs.kind }}
        run: php .dx-central/scripts/review-rules.php --kind "$KIND" --repo .
