name: WordPress plugin checks (fast)

# Reusable. The fast quality gates of the wordpress-plugin kind
# (kinds/wordpress-plugin/pack.yml): PHP syntax and unit tests on every
# supported PHP, PHPCS (with PHPCompatibility), PHPStan, Psalm taint
# analysis, i18n, Plugin Check on
# the shipped tree, the kind's review rules (what wordpress.org's review sends
# back and Plugin Check misses: kinds/wordpress-plugin/rules.yml, run by
# scripts/review-rules.php), readme/version alignment, and the version
# markers against what was released (scripts/release-markers.sh). Opt-in:
# the shipped translations complete, CodeQL, and a required plugin that
# wordpress.org does not have yet, from the organisation (Plugin Check
# needs it active). Each job is its own status check.
#
# The kind's settings (Plugin Check's strictness, categories and the codes it
# never reports) and its rules come from the pack, not from this file; a
# repository adds codes in its policy (`kind-settings:`), read from the base
# branch so a pull request cannot exempt itself. GitHub cannot choose a
# reusable workflow from data, so this file is the kind's battery by name.
#
# PHP, from the pack too (`settings.php`, #85; scripts/php-versions.py):
# every tool runs on `tools`, the latest PHP, and analyses for `minimum`,
# the oldest every plugin supports: PHPCS's PHPCompatibility gets it as
# testVersion, PHPStan as phpVersion (over the repository's own config),
# Psalm as --php-version. The syntax and unit-test jobs run on every release
# from the minimum to the tools' PHP. A plugin whose Requires PHP is still
# higher than the pack's minimum is checked from its own, with a warning,
# until it lowers it in its own pull request. Psalm 5 cannot run on a PHP
# newer than 8.3: a repository that still installs it gets 8.3 for Psalm,
# with a warning, until it requires vimeo/psalm ^6.14.2.
#
# The slow wp-env suites (integration, E2E) are plugin-tests-wp.yml, a
# separate workflow, so a caller can start the review as soon as these pass
# (`needs:`). Plugin Check is the one slow job here; it is skipped when the
# pull request changes neither code nor a file it reads (the `code` and
# `plugin-check` lists of the policy), and a skipped job satisfies the
# ruleset.
#
# The calling repository provides composer scripts `test:unit`, `lint`,
# `stan` and `psalm:taint` (each takes arguments after it: the checks add
# the PHP to analyse for), a phpstan.neon (or .neon.dist, .dist.neon) at its
# root, PHPCompatibilityWP in its PHPCS ruleset, a `.distignore` listing
# what never ships, and a `readme.txt`. The shipped tree every job reads is
# the checkout minus that `.distignore` (scripts/stage-plugin.sh), staged
# outside the checkout: a `build/` the plugin commits ships unless the
# `.distignore` lists it.
#
#   jobs:
#     checks:
#       uses: DiluxOne/.github/.github/workflows/plugin-checks-wp.yml@v5
#       with:
#         slug: diluxone-offload
#         version-constant: DILUXONE_OFFLOAD_VERSION   # optional
#         main-file: diluxone-offload.php              # default <slug>.php
#         translations-complete: true                  # optional: languages/*.po complete
#         codeql-languages: javascript-typescript      # optional: CodeQL on the code
#         # optional: a required plugin wordpress.org does not have (yet)
#         requires-plugins-from: diluxone-users=DiluxOne/diluxone-users-wordpress@main
#       secrets:
#         DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}   # with requires-plugins-from
#     tests:
#       uses: DiluxOne/.github/.github/workflows/plugin-tests-wp.yml@v5
#       with:                                    # optional: the suites mount it too
#         requires-plugins-from: diluxone-users=DiluxOne/diluxone-users-wordpress@main
#       secrets:
#         DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
#
# (workflow-templates/plugin-checks-wp.yml; the conventions and the review
# are the organisation's required org-pull-request.yml.)

on:
  workflow_call:
    inputs:
      slug:
        description: wordpress.org slug and text domain.
        type: string
        required: true
      main-file:
        description: Main plugin file. Defaults to <slug>.php.
        type: string
        default: ''
      version-constant:
        description: PHP constant that must equal the Version header. Empty to skip.
        type: string
        default: ''
      php-versions:
        description: Ignored, and annotated so the caller removes it; kept so a caller that still passes it does not fail. The PHP versions come from the pack (`settings.php`) and the plugin's Requires PHP (#85).
        type: string
        default: ''
      central-ref:
        description: Ref of DiluxOne/.github to read the policy from.
        type: string
        default: v5
      kind:
        description: The kind of project whose rules and settings these checks read (kinds/<kind>/). A repository whose policy declares another kind fails.
        type: string
        default: wordpress-plugin
      translations-complete:
        description: Fail when a locale the plugin ships (languages/*.po) is malformed, fuzzy, or misses a string the code has.
        type: boolean
        default: false
      codeql-languages:
        description: CodeQL languages to analyse (comma-separated, e.g. javascript-typescript); empty skips the job, and so does a private repository (CodeQL needs Code Security there). Results fail the check; nothing is uploaded to code scanning.
        type: string
        default: ''
      requires-plugins-from:
        description: The required plugins (Requires Plugins) wordpress.org does not have, one `<slug>=<owner>/<repo>@<ref>` per line, from repositories of this organisation. Plugin Check mounts their shipped tree beside the plugin instead of asking wordpress.org. Needs the DILUX_BOT_PRIVATE_KEY secret.
        type: string
        default: ''
    secrets:
      # Only with requires-plugins-from: a token that reads those repositories.
      DILUX_BOT_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  php:
    name: PHP versions
    # The PHP every job below runs on, from the pack (`settings.php`) and
    # the plugin's own Requires PHP (scripts/php-versions.py): `tools`, the
    # latest; `minimum`, the oldest the checks hold the code to; `versions`,
    # every release between them, for the syntax and unit-test jobs.
    runs-on: ${{ vars.DX_RUNNER == 'self-hosted' && fromJSON('["self-hosted","linux","x64","diluxone"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      tools: ${{ steps.php.outputs.tools }}
      minimum: ${{ steps.php.outputs.minimum }}
      versions: ${{ steps.php.outputs.versions }}
      phpstan: ${{ steps.php.outputs.phpstan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base, for its policy.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref }}
          path: .dx-central
          persist-credentials: false
      - name: The kind's settings
        id: kind
        env:
          KIND_DEFAULT: ${{ inputs.kind }}
          DEFAULT_POLICY: .dx-central/policy/review-policy.default.yml
          EVENT: ${{ github.event_name }}
        run: bash .dx-central/scripts/kind.sh
      - name: From the pack and the plugin's Requires PHP
        id: php
        # The plugin's Requires PHP is read from the change itself: the pull
        # request that lowers it is the one checked on the lower PHP.
        env:
          SETTINGS: ${{ steps.kind.outputs.settings }}
          MAIN: ${{ inputs.main-file != '' && inputs.main-file || format('{0}.php', inputs.slug) }}
          README: readme.txt
          PHP_VERSIONS: ${{ inputs.php-versions }}
        run: |
          [ -z "$PHP_VERSIONS" ] || echo "::warning::php-versions is ignored: the PHP versions come from the pack and the plugin's Requires PHP (DiluxOne/.github#85). Remove it from the caller."
          python3 .dx-central/scripts/php-versions.py

  syntax:
    name: PHP ${{ matrix.php }} syntax
    needs: php
    runs-on: ${{ vars.DX_RUNNER == 'self-hosted' && fromJSON('["self-hosted","linux","x64","diluxone"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.php.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The organisation's staging script alone (scripts/stage-plugin.sh).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref }}
          path: .dx-central
          persist-credentials: false
          sparse-checkout: scripts/stage-plugin.sh
          sparse-checkout-cone-mode: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: php -l on every shipped PHP file
        # Only what ships has to parse on the oldest PHP; tests and dev
        # tooling run on the PHP their own tools require.
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          tree=$(bash .dx-central/scripts/stage-plugin.sh "$SLUG")
          find "$tree" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null

  unit:
    name: PHP ${{ matrix.php }} unit tests
    needs: php
    runs-on: ${{ vars.DX_RUNNER == 'self-hosted' && fromJSON('["self-hosted","linux","x64","diluxone"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.php.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Composer cache directory
        id: cache-dir
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache-dir.outputs.dir }}
          key: composer-${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php-${{ matrix.php }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer test:unit

  static:
    name: ${{ matrix.gate.name }}
    needs: php
    runs-on: ${{ vars.DX_RUNNER == 'self-hosted' && fromJSON('["self-hosted","linux","x64","diluxone"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Each on the tools' PHP, analysing for the minimum (the `php` job).
        gate:
          - { name: PHPCS (WordPress Coding Standards), script: lint }
          - { name: PHPStan, script: stan }
          - { name: Psalm taint analysis, script: 'psalm:taint' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ needs.php.outputs.tools }}
          coverage: none
          tools: composer:v2
      - name: Composer cache directory
        id: cache-dir
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache-dir.outputs.dir }}
          key: composer-${{ runner.os }}-php-${{ needs.php.outputs.tools }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php-${{ needs.php.outputs.tools }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: What the repository installed
        id: installed
        # Two tools whose old major cannot do what the minimum asks, until
        # the repository moves (its own pull request, #85): Psalm 5 does not
        # run on a PHP newer than 8.3, so it gets 8.3; PHPCompatibility 9
        # (phpcompatibility-wp 2) knows no syntax newer than PHP 7.4, so PHP
        # 8 syntax passes it unseen. Both warn, neither fails.
        env:
          SCRIPT: ${{ matrix.gate.script }}
          TOOLS: ${{ needs.php.outputs.tools }}
          MINIMUM: ${{ needs.php.outputs.minimum }}
        run: |
          set -euo pipefail
          installed() { jq -r --arg n "$1" '(.packages // .)[] | select(.name == $n) | .version' vendor/composer/installed.json | sed 's/^v//'; }
          case "$SCRIPT" in
            psalm:taint)
              psalm=$(installed vimeo/psalm)
              case "$psalm" in
                4.*|5.*)
                  echo "::warning::Psalm $psalm cannot run on PHP $TOOLS, so it runs on PHP 8.3 until the repository requires vimeo/psalm ^6.14.2 and no config.platform.php holds its tools below PHP 8.1.31 (DiluxOne/.github#85)."
                  echo "php=8.3" >> "$GITHUB_OUTPUT" ;;
              esac ;;
            lint)
              compat=$(installed phpcompatibility/php-compatibility)
              case "$compat" in
                '') echo "::warning::No PHPCompatibility is installed: nothing holds the code to PHP $MINIMUM. Require phpcompatibility/phpcompatibility-wp ^3.0@alpha and add PHPCompatibilityWP to the PHPCS ruleset (DiluxOne/.github#85)." ;;
                9.*) echo "::warning::PHPCompatibility $compat knows no syntax newer than PHP 7.4, so PHP 8 syntax passes it unseen: require phpcompatibility/phpcompatibility-wp ^3.0@alpha, which brings PHPCompatibility 10 (DiluxOne/.github#85)." ;;
              esac ;;
          esac
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        if: steps.installed.outputs.php != ''
        with:
          php-version: ${{ steps.installed.outputs.php }}
          coverage: none
          tools: composer:v2
      - name: composer ${{ matrix.gate.script }}, for PHP ${{ needs.php.outputs.minimum }}
        env:
          SCRIPT: ${{ matrix.gate.script }}
          MINIMUM: ${{ needs.php.outputs.minimum }}
          PHPSTAN_VERSION: ${{ needs.php.outputs.phpstan }}
        run: |
          set -euo pipefail
          case "$SCRIPT" in
            lint)
              # Over the ruleset's own testVersion: the command line wins.
              composer lint -- --runtime-set testVersion "$MINIMUM-" ;;
            stan)
              # The repository's config, included, with the minimum's
              # phpVersion over its own.
              config=
              for f in phpstan.neon phpstan.neon.dist phpstan.dist.neon; do
                if [ -f "$f" ]; then config=$f; break; fi
              done
              [ -n "$config" ] || { echo "::error::No phpstan.neon (or phpstan.neon.dist, phpstan.dist.neon) at the repository's root: the checks give PHPStan the PHP to analyse for through it."; exit 1; }
              printf 'includes:\n  - %s\nparameters:\n  phpVersion: %s\n' "$GITHUB_WORKSPACE/$config" "$PHPSTAN_VERSION" > "$RUNNER_TEMP/dx-phpstan.neon"
              composer stan -- --configuration="$RUNNER_TEMP/dx-phpstan.neon" ;;
            psalm:taint)
              composer psalm:taint -- --php-version="$MINIMUM" ;;
          esac

  i18n:
    name: i18n (wp i18n make-pot)
    needs: php
    # Always there, so a failed `php` job fails this check instead of
    # skipping it (a skipped job satisfies the ruleset).
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.DX_RUNNER == 'self-hosted' && fromJSON('["self-hosted","linux","x64","diluxone"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: The PHP versions job
        env:
          RESULT: ${{ needs.php.result }}
        run: |
          [ "$RESULT" = success ] || { echo "::error::The PHP versions job did not succeed ($RESULT): nothing says which PHP to run on."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The organisation's staging script alone (scripts/stage-plugin.sh).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref }}
          path: .dx-central
          persist-credentials: false
          sparse-checkout: scripts/stage-plugin.sh
          sparse-checkout-cone-mode: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ needs.php.outputs.tools }}
          coverage: none
      # setup-php's `tools: wp-cli` asks for a release asset named wp-cli.phar,
      # which wp-cli's releases do not carry (it answered 404 on 2 October 2026). The
      # release is downloaded by name and checked against its SHA-512, the same
      # value wp-cli publishes in wp-cli/builds (wp-cli-release.phar.sha512).
      - name: WP-CLI 2.12.0
        env:
          WP_CLI_SHA512: be928f6b8ca1e8dfb9d2f4b75a13aa4aee0896f8a9a0a1c45cd5d2c98605e6172e6d014dda2e27f88c98befc16c040cbb2bd1bfa121510ea5cdf5f6a30fe8832
        run: |
          curl -fsSL -o "$RUNNER_TEMP/wp" https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          echo "$WP_CLI_SHA512  $RUNNER_TEMP/wp" | sha512sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/wp" /usr/local/bin/wp
          wp --version
      - name: Build the shipped tree
        id: tree
        env:
          SLUG: ${{ inputs.slug }}
        run: tree=$(bash .dx-central/scripts/stage-plugin.sh "$SLUG") && echo "dir=$tree" >> "$GITHUB_OUTPUT"
      - name: Extract strings; any warning fails
        env:
          SLUG: ${{ inputs.slug }}
          TREE: ${{ steps.tree.outputs.dir }}
        run: |
          set +e
          out=$(wp i18n make-pot "$TREE" "$TREE.pot" --slug="$SLUG" --domain="$SLUG" 2>&1); status=$?
          set -e
          echo "$out"
          [ "$status" -eq 0 ] || exit "$status"
          if printf '%s\n' "$out" | grep -E '^(Warning|Error):' >&2; then
            echo "::error::wp i18n make-pot reported warnings (missing translator comments, dynamic domains, concatenated strings)."
            exit 1
          fi
          count=$(grep -c '^msgid "' "$TREE.pot" || true)
          [ "$count" -gt 1 ] || { echo "::error::No translatable strings extracted."; exit 1; }
          echo "Extracted $count strings."

  changes:
    name: What changed
    # The slow, paid part of a pull request runs only when it changes code:
    # the `code` and `plugin-check` lists of the policy (the organisation's
    # defaults plus the repository's .github/review-policy.yml, read from
    # the base branch so a change cannot exempt itself). Anything else
    # (docs, translations, a readme) gets the fast checks and the review.
    # A push to main runs everything unless the commit is the squash merge of a
    # pull request of this repository whose checks ran on this very tree; a
    # weekly scheduled run covers drift. The gates below run on !cancelled()
    # and treat a missing answer as "run", so this job failing (or an older
    # central without the script) never skips a suite; a job skipped by
    # the answer satisfies the ruleset.
    runs-on: ${{ vars.DX_RUNNER == 'self-hosted' && fromJSON('["self-hosted","linux","x64","diluxone"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the pull request behind a push to main
      checks: read # and the checks of its head
    outputs:
      code: ${{ steps.changes.outputs.code }}
      plugin_check: ${{ steps.changes.outputs.plugin_check }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its two parents: enough for the diff.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref }}
          path: .dx-central
          persist-credentials: false
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_POLICY: .dx-central/policy/review-policy.default.yml
        run: bash .dx-central/scripts/changes.sh

  required-plugins:
    name: Required plugins (from the organisation)
    # Opt-in (`requires-plugins-from`). Plugin Check's action installs every
    # plugin the header requires from wordpress.org, and fails on one it does
    # not list yet (a free plugin still in review, an add-on's own base). Its
    # shipped tree is fetched here, with a dilux-bot token that reads those
    # repositories alone, in a job that never checks out the code under
    # check: the key never shares a job with a pull request's code. A fork's
    # pull request gets no secret, and this job fails for it. It runs when
    # Plugin Check does.
    needs: changes
    if: ${{ !cancelled() && inputs.requires-plugins-from != '' && (needs.changes.outputs.code != 'false' || needs.changes.outputs.plugin_check != 'false') }}
    runs-on: ${{ vars.DX_RUNNER == 'self-hosted' && fromJSON('["self-hosted","linux","x64","diluxone"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref }}
          path: .dx-central
          persist-credentials: false
      - name: The repositories
        id: repos
        env:
          REQUIRES: ${{ inputs.requires-plugins-from }}
          OWNER: ${{ github.repository_owner }}
          HAS_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != true ]; then
            echo "::error::requires-plugins-from needs the DILUX_BOT_PRIVATE_KEY secret (secrets: in the caller; a fork's pull request gets none)."
            exit 1
          fi
          list=$(bash .dx-central/scripts/required-plugins.sh repos)
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - name: dilux-bot token (read those repositories)
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DILUX_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repos.outputs.list }}
          permission-contents: read
      - name: Their shipped trees
        env:
          REQUIRES: ${{ inputs.requires-plugins-from }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: bash .dx-central/scripts/required-plugins.sh fetch "$RUNNER_TEMP/required-plugins"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: required-plugins-${{ inputs.slug }}
          path: ${{ runner.temp }}/required-plugins
          # A re-run of the failed jobs alone reuses this attempt's artifact.
          retention-days: 7
          include-hidden-files: true
          # A re-run of every job uploads it again under the same name.
          overwrite: true

  plugin-check:
    name: WordPress Plugin Check
    needs: [changes, required-plugins]
    if: ${{ !cancelled() && (needs.changes.outputs.code != 'false' || needs.changes.outputs.plugin_check != 'false') }}
    runs-on: ${{ vars.DX_RUNNER == 'self-hosted' && fromJSON('["self-hosted","linux","x64","diluxone"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base, for its policy.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref }}
          path: .dx-central
          persist-credentials: false
      - name: The kind's settings
        id: kind
        env:
          KIND_DEFAULT: ${{ inputs.kind }}
          DEFAULT_POLICY: .dx-central/policy/review-policy.default.yml
          EVENT: ${{ github.event_name }}
        run: bash .dx-central/scripts/kind.sh
      - name: Build the shipped tree (what wordpress.org receives)
        id: tree
        env:
          SLUG: ${{ inputs.slug }}
        run: tree=$(bash .dx-central/scripts/stage-plugin.sh "$SLUG") && echo "dir=$tree" >> "$GITHUB_OUTPUT"
      # A required plugin wordpress.org does not have: mounted from the
      # required-plugins job (a skipped job here would pass the check).
      - name: The required plugins arrived
        if: inputs.requires-plugins-from != ''
        env:
          RESULT: ${{ needs.required-plugins.result }}
        run: |
          [ "$RESULT" = success ] || { echo "::error::The required plugins could not be fetched (the Required plugins job: $RESULT)."; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: required
        if: inputs.requires-plugins-from != ''
        continue-on-error: true
        with:
          name: required-plugins-${{ inputs.slug }}
          path: ${{ runner.temp }}/required-plugins
      - name: The required plugins were downloaded
        if: inputs.requires-plugins-from != '' && steps.required.outcome == 'failure'
        run: |
          echo "::error::The required plugins' artifact could not be downloaded: gone (it lasts 7 days, and a re-run of the failed jobs alone reuses the first attempt's) or a download error. Re-run all jobs."
          exit 1
      - name: Mount them beside the plugin
        if: inputs.requires-plugins-from != ''
        run: bash .dx-central/scripts/required-plugins.sh wp-env "$RUNNER_TEMP/required-plugins"
      - uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          # Checking the built tree, not the repository, means no exclude
          # lists to keep in sync: only what ships is checked.
          # It is staged outside the checkout, under the runner's temporary
          # folder (scripts/stage-plugin.sh): the plugin's own build/ ships
          # unless its .distignore says otherwise (#172).
          build-dir: ${{ steps.tree.outputs.dir }}
          slug: ${{ inputs.slug }}
          # From the pack (kinds/<kind>/pack.yml, `settings.plugin-check`):
          # strict fails on every warning, as the reviewer does; the codes
          # ignored are the pack's plus the repository's own additions.
          categories: ${{ join(fromJSON(steps.kind.outputs.settings)['plugin-check'].categories, ',') }}
          include-experimental: ${{ fromJSON(steps.kind.outputs.settings)['plugin-check'].include-experimental }}
          strict: ${{ fromJSON(steps.kind.outputs.settings)['plugin-check'].strict }}
          ignore-codes: ${{ join(fromJSON(steps.kind.outputs.settings)['plugin-check'].ignore-codes, ',') }}

  review-rules:
    name: Review rules (${{ inputs.kind }})
    # What the kind's reviewers send back and the other gates miss, as data:
    # kinds/<kind>/rules.yml, each rule a finding from a real review, run by
    # the generic engine scripts/review-rules.php. Code rules read the
    # shipped tree; config rules (phpcs.xml) the repository; suppressions
    # are checked against the repository's .github/review-suppressions.yml.
    # An error fails, a warning is annotated. Cheap: every pull request.
    runs-on: ${{ vars.DX_RUNNER == 'self-hosted' && fromJSON('["self-hosted","linux","x64","diluxone"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref }}
          path: .dx-central
          persist-credentials: false
      - name: The kind
        id: kind
        env:
          KIND_DEFAULT: ${{ inputs.kind }}
          DEFAULT_POLICY: .dx-central/policy/review-policy.default.yml
          EVENT: ${{ github.event_name }}
        run: bash .dx-central/scripts/kind.sh
      # The engine's PHP, set up like every other PHP job's: GitHub's runners
      # carry one, the organisation's runner image does not, by design.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ fromJSON(steps.kind.outputs.settings).php.tools }}
          coverage: none
      - name: Build the shipped tree (what wordpress.org receives)
        id: tree
        env:
          SLUG: ${{ inputs.slug }}
        run: tree=$(bash .dx-central/scripts/stage-plugin.sh "$SLUG") && echo "dir=$tree" >> "$GITHUB_OUTPUT"
      - name: Check the rules
        env:
          TREE: ${{ steps.tree.outputs.dir }}
          KIND: ${{ steps.kind.outputs.kind }}
        run: php .dx-central/scripts/review-rules.php --kind "$KIND" --repo . --tree "$TREE"

  translations:
    name: Translations complete (languages/*.po)
    # Opt-in (`translations-complete: true`). The i18n job says every string
    # can be translated; this says the locales the plugin ships have been:
    # each languages/*.po parses, has nothing fuzzy, and, merged with the
    # strings the shipped code has today, misses none. Off, the job is
    # skipped, which satisfies a ruleset. On, a failed `php` job fails it.
    needs: php
    if: ${{ !cancelled() && inputs.translations-complete }}
    runs-on: ${{ vars.DX_RUNNER == 'self-hosted' && fromJSON('["self-hosted","linux","x64","diluxone"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: The PHP versions job
        env:
          RESULT: ${{ needs.php.result }}
        run: |
          [ "$RESULT" = success ] || { echo "::error::The PHP versions job did not succeed ($RESULT): nothing says which PHP to run on."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The organisation's staging script alone (scripts/stage-plugin.sh).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref }}
          path: .dx-central
          persist-credentials: false
          sparse-checkout: scripts/stage-plugin.sh
          sparse-checkout-cone-mode: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ needs.php.outputs.tools }}
          coverage: none
      # setup-php's `tools: wp-cli` asks for a release asset named wp-cli.phar,
      # which wp-cli's releases do not carry (it answered 404 on 2 October 2026). The
      # release is downloaded by name and checked against its SHA-512, the same
      # value wp-cli publishes in wp-cli/builds (wp-cli-release.phar.sha512).
      - name: WP-CLI 2.12.0
        env:
          WP_CLI_SHA512: be928f6b8ca1e8dfb9d2f4b75a13aa4aee0896f8a9a0a1c45cd5d2c98605e6172e6d014dda2e27f88c98befc16c040cbb2bd1bfa121510ea5cdf5f6a30fe8832
        run: |
          curl -fsSL -o "$RUNNER_TEMP/wp" https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          echo "$WP_CLI_SHA512  $RUNNER_TEMP/wp" | sha512sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/wp" /usr/local/bin/wp
          wp --version
      - name: gettext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext
      - name: Every shipped locale complete
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(languages/*.po)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::translations-complete is on and languages/ has no .po file to check."
            exit 1
          fi
          tree=$(bash .dx-central/scripts/stage-plugin.sh "$SLUG")
          wp i18n make-pot "$tree" "$tree.pot" --slug="$SLUG" --domain="$SLUG" >/dev/null
          fail=0
          for po in "${files[@]}"; do
            # As it is: parses, and nothing fuzzy or untranslated.
            own=$(msgfmt --check --statistics -o /dev/null "$po" 2>&1) || { echo "::error file=$po::$own"; fail=1; continue; }
            # Against today's code: a string the code has and the file does
            # not is untranslated here (no fuzzy matching: a guess is not a
            # translation).
            merged=$(mktemp)
            msgmerge --quiet --no-fuzzy-matching --no-wrap -o "$merged" "$po" "$tree.pot"
            now=$(msgfmt --statistics -o /dev/null "$merged" 2>&1)
            printf '%-40s %s | against the code: %s\n' "$po" "$own" "$now"
            case "$own $now" in
              *untranslated*|*fuzzy*) echo "::error file=$po::Incomplete: $now (update it from the code, translate, compile the .mo)."; fail=1 ;;
            esac
          done
          [ "$fail" -eq 0 ] && echo "Every shipped locale is complete."
          exit "$fail"

  codeql:
    name: CodeQL
    # Opt-in (`codeql-languages: javascript-typescript`, comma-separated for
    # more). The security-extended queries on the repository; any result
    # fails the check and is annotated. Nothing goes to code scanning: that
    # needs `security-events: write`, which a reusable workflow can only
    # use when every caller grants it, and existing callers do not.
    # Skipped in a private repository: the CodeQL action needs the paid Code
    # Security add-on there, even with nothing uploaded. A skipped required
    # check passes, so the review is not held back; it runs again once the
    # repository is public.
    if: inputs.codeql-languages != '' && !github.event.repository.private
    runs-on: ${{ vars.DX_RUNNER == 'self-hosted' && fromJSON('["self-hosted","linux","x64","diluxone"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ inputs.codeql-languages }}
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          upload: never
          output: ${{ runner.temp }}/codeql
      - name: Any result fails
        run: |
          set -euo pipefail
          count=0
          for sarif in "$RUNNER_TEMP"/codeql/*.sarif; do
            jq -r '.runs[] | .results[]? | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri // ""),line=\(.locations[0].physicalLocation.region.startLine // 1),title=CodeQL \(.ruleId)::\(.message.text | gsub("\n"; " "))"' "$sarif"
            count=$((count + $(jq '[.runs[] | .results[]?] | length' "$sarif")))
          done
          echo "$count result(s)."
          [ "$count" -eq 0 ]

  readme:
    name: readme.txt and versions
    runs-on: ${{ vars.DX_RUNNER == 'self-hosted' && fromJSON('["self-hosted","linux","x64","diluxone"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the labels of what merged give the version being released
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: ${{ inputs.central-ref }}
          path: .dx-central
          persist-credentials: false
      - name: Headers, version alignment, changelog
        env:
          MAIN: ${{ inputs.main-file != '' && inputs.main-file || format('{0}.php', inputs.slug) }}
          CONSTANT: ${{ inputs.version-constant }}
        run: |
          set -euo pipefail
          for h in "Contributors" "Tags" "Requires at least" "Tested up to" "Requires PHP" "Stable tag" "License"; do
            grep -qE "^${h}:" readme.txt || { echo "::error file=readme.txt::Missing header: ${h}"; exit 1; }
          done
          ! grep -qE '^\s*\*\s*Tested up to:' "$MAIN" || { echo "::error file=$MAIN::Tested up to belongs only in readme.txt."; exit 1; }
          stable=$(grep -oP '^Stable tag:\s*\K\S+' readme.txt)
          version=$(grep -oP '^\s*\*\s*Version:\s*\K\S+' "$MAIN")
          base=$(printf '%s' "$version" | sed -E 's/-(dev|alpha|beta|rc)([.0-9]*)?$//')
          if [ "$version" = "$base" ]; then
            [ "$stable" = "$base" ] || { echo "::error::Version $version has no pre-release suffix, so Stable tag ($stable) must equal it."; exit 1; }
          else
            [ "$(printf '%s\n%s\n' "$stable" "$base" | sort -V | tail -1)" = "$base" ] || { echo "::error::Version $version is behind Stable tag $stable."; exit 1; }
          fi
          if [ -n "$CONSTANT" ]; then
            constant=$(grep -oP "${CONSTANT}',\s*'\K[^']+" "$MAIN")
            [ "$constant" = "$version" ] || { echo "::error file=$MAIN::$CONSTANT ($constant) differs from Version ($version)."; exit 1; }
          fi
          grep -qE "^=\s*${stable}\s*=" readme.txt || { echo "::error file=readme.txt::No '= ${stable} =' changelog entry."; exit 1; }
          echo "readme.txt OK: Stable tag $stable, Version $version."
      - name: The markers name the released version
        # The three markers say the last version released, or, in the pull
        # request that releases the next one (it removes the `Unreleased.`
        # line) and on main after it merged, that next one; never a version
        # that is not one (scripts/release-markers.sh).
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN: ${{ inputs.main-file != '' && inputs.main-file || format('{0}.php', inputs.slug) }}
          CONSTANT: ${{ inputs.version-constant }}
          BASE: ${{ github.event.repository.default_branch }}
          PULL: ${{ github.event.pull_request.number }}
        # In a pull request its own labels count as if it had merged, so the
        # release pull request is checked against the version it will
        # release, its own version:* label included. A label alone does not
        # re-run the checks: set version:* before the last push. The review's
        # type:* arrives after this job ran, which is why the release pull
        # request contains nothing but the hold and the markers (a chore,
        # no bump of its own); anything that slips through is still refused
        # by the release job before SVN.
        run: |
          set -euo pipefail
          next=$(python3 .dx-central/scripts/next-version.py --repo "$GITHUB_REPOSITORY" --base "$BASE" ${PULL:+--with-pull "$PULL"} --json)
          bash .dx-central/scripts/release-markers.sh check . "$MAIN" "$CONSTANT" \
            "$(jq -r .last <<<"$next")" "$(jq -r .next <<<"$next")" "$(jq -r .pending <<<"$next")"

