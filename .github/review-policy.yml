# Almost everything in this repository decides how every other DiluxOne
# repository is built, checked, reviewed and released: it is high risk and a
# person merges it. The exceptions are the pages people read and nothing
# runs: README.md, docs/ and profile/ (the organisation's public page). A
# change to those alone can merge on its own, under the same conditions as
# anywhere else (low risk and complexity, nothing blocking, a trusted
# author, every check green).
#
# There is no "everything but" pattern, so this lists what is high risk: the
# root files one by one. A file added here is in no list until it is named,
# and `policy.py --test` fails until it is ("this repository: every file but
# its pages is high risk").
high-risk:
  # Workflows (.github/**), AGENTS.md and CLAUDE.md are the organisation's
  # defaults already.
  - "docs/agents.md"
  # Read by the review and the reproduction as the repository's rules
  # (review-brief.sh, issue-repro.yml), should this repository have them.
  - "docs/architecture.md"
  - "docs/testing-and-quality.md"
  # The model every agent reads from AGENTS.md, and the rules every change
  # meets: like the autonomy policy, a person merges them.
  - "docs/model.md"
  - "rules/**"
  - "kinds/**"
  # Every screen of every project associated with a system follows it
  # (repos.yml, design-system), its pages included: they are its rules.
  - "design-systems/**"
  - "policy/**"
  - "review-profiles/**"
  # The review's evaluation set and its baseline (#234): they decide
  # whether a change to the review may merge.
  - "evals/**"
  - "scripts/**"
  # The reproduction's examples and the tests CI runs (#376).
  - "tests/**"
  - "runner/**"
  - "workflow-templates/**"
  - "agents-block.md"
  # Rebuilt by scripts/changelog.py in the pull request that releases a
  # version, with what it releases.
  - "CHANGELOG.md"
  - "labels.yml"
  - "repos.yml"
  - "org.yml"
  - "CONTRIBUTING.md"
  - "SECURITY.md"
  - "SUPPORT.md"
  - "CODE_OF_CONDUCT.md"
  - "pull_request_template.md"
  - "LICENSE"
  - ".gitignore"

# How a bug in this repository is reproduced (#376, scripts/repro-ways.py,
# which says what each key means). It has no kind, so nothing else declares
# a way for it: a script's logic is a Python test that calls the script, and
# a workflow's wiring a Python test that runs the step with stubs. Both run
# with pytest, installed by `setup` before the test is in the tree, through
# scripts/repro-run.sh: no network, no secrets, a JUnit report.
repro:
  ways:
    python:
      layer: [logic, cli]
      noun: Python test
      test: tests/repro/test_issue_{n}.py
      needs: [scripts/]
      setup:
        - python3 -m pip install --quiet --disable-pip-version-check --target .dx-pytest pytest==9.1.1 PyYAML==6.0.3
      run: PYTHONPATH="$PWD/.dx-pytest" PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -p no:cacheprovider --rootdir=. -o junit_family=xunit1 --junitxml=build/dx-repro-junit.xml {test}
      junit: build/dx-repro-junit.xml
      minutes: 10
      list: ["tests/**"]
      example: tests/examples/test_logic.py
      guide: |
        A pytest test, in Python, of the script the report names, as the script's own `--test` cases
        check it: call its functions, or run it as a command, and assert what the report expected.
        - The scripts' names have hyphens: load one with importlib, as the example does
          (`spec_from_file_location` on `scripts/<name>.py`), from the repository's root
          (`Path(__file__).resolve().parents[2]`); a shell script runs with `subprocess.run(["bash", ...])`.
        - Feed it what the report describes (an environment through `monkeypatch.setenv` or `env=`,
          a file in `tmp_path`), never the network, `gh` or a token: it runs with neither.
        - A plain `assert` on the value the report expected, so the test FAILS while the bug is there
          (`pytest.raises` for an error the report expected). Any other exception (an ImportError, a
          TypeError, the CalledProcessError of `check=True`) is no verdict: run a command without
          `check` and assert on its `returncode` and output.
        - Small: one or two test functions, named after the expectation.
    workflow:
      layer: workflow
      noun: workflow test
      test: tests/repro/test_issue_{n}.py
      needs: [.github/workflows/]
      setup:
        - python3 -m pip install --quiet --disable-pip-version-check --target .dx-pytest pytest==9.1.1 PyYAML==6.0.3
      run: PYTHONPATH="$PWD/.dx-pytest" PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -p no:cacheprovider --rootdir=. -o junit_family=xunit1 --junitxml=build/dx-repro-junit.xml {test}
      junit: build/dx-repro-junit.xml
      minutes: 10
      list: [".github/workflows/*.yml", "workflow-templates/*.yml"]
      example: tests/examples/test_workflow.py
      # #841: a test that does not run the step's command (its `run:`, or a
      # script a workflow calls) through a process call (subprocess,
      # os.system) is broken, "the test runs no step", whatever its report
      # says.
      runs-step: true
      guide: |
        A pytest test that RUNS the step the report names and asserts on what it did. Asserting on the
        workflow's text alone is no reproduction, nor is running some other command (`echo hi`): a test
        that does not run the step's `run:` (or the script it calls) through `subprocess` is broken, "the
        test runs no step", whatever it asserts.
        - Read the workflow as YAML (PyYAML, `yaml.safe_load`) and find the step by its `name` or `id`,
          never by its position; take its `run:` script and its `env:`.
        - Run it with `subprocess.run(["bash", "-c", script], env=..., capture_output=True, text=True)`,
          from the repository's root (`Path(__file__).resolve().parents[2]`), without `check`, with
          stubs on PATH: a fake `gh`, `git`, `curl` (whatever the step calls) written in `tmp_path`,
          each one logging its arguments to a file and printing what the report's case needs. Give it
          the `${{ }}` values it reads as environment variables, and `GITHUB_OUTPUT` a file in
          `tmp_path`. Never the network nor a token: it runs with neither.
        - Assert on what the step did: the stub's log (the command and the flags the report says are
          missing or wrong), its exit code, its output, the lines it wrote to `$GITHUB_OUTPUT`.
        - When the logic lives in a script under scripts/ that the step calls, run that script as a command
          the same way (`subprocess.run(["python3", "scripts/<name>.py", ...])`, its stubs on PATH): a test
          that only calls its functions runs no step here. Name the script as its own argument, or as the
          command of a shell string (`bash -c "scripts/<name>.sh ..."`); a string that only mentions it
          (`bash -c "echo scripts/<name>.sh"`) runs no step.
        - Write the stubs and the `subprocess` call in the test file itself: the check reads only that
          file's own process calls, so a helper that runs the step for it (from another module) runs
          no step here. Never cut the workflow's text
          between two literals (`text[text.index("..."):text.index("...")]`, `text.split("...")[1]`): the
          scripts job refuses it (scripts/literal-slices.py, #845).
        - A plain `assert` on what the report expected, so the test FAILS while the bug is there.
        - Small: one or two test functions, named after the expectation.

# The "Test first" check (#734, scripts/test-first.py): a fix or a feature
# here carries a pytest test under tests/ that fails at the base and passes
# at the head, run by the `python` way above. At the base it fails on an
# assertion, a feature's as a fix's (#845): one that only breaks there (an
# ImportError, a missing file) asserted nothing. A script's own `--test` case
# cannot run at the base apart from its code, so it alone is no test here.
# The release scenarios, fixtures, the reproduction's examples and the
# review's evaluation set are never a test. Read from the base commit.
test-first:
  setup: []
  tests:
    - paths: ["tests/repro/**/test_*.py", "tests/workflows/test_*.py"]
      way: python
      # #842: the required check that runs them on every pull request, which
      # gate G7 waits on for a criterion's test (scripts/autopilot.py).
      check: "Scripts (self-tests)"
  not-tests: ["tests/release/**", "tests/**/fixtures/**", "scripts/fixtures/**", "tests/examples/**", "evals/**"]

# The docs map (#957, scripts/docs-check.py): the documentation check of the
# security gate asks a change to one of `paths` to change one of `docs` too,
# unless the description's What changes says why not (`Docs: none, <why>`).
# Read at the merge base, so a pull request cannot drop its own entry; a
# kind's pack can hold the same key for all its repositories.
docs-map:
  - paths: ["scripts/security-gate.py", "scripts/docs-check.py", "policy/security-gate.yml"]
    docs: ["docs/testing-and-quality.md", "docs/configuration.md"]
