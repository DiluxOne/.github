# Almost everything in this repository decides how every other DiluxOne
# repository is built, checked, reviewed and released: it is high risk and a
# person merges it. The exceptions are the pages people read and nothing
# runs: README.md, docs/ and profile/ (the organisation's public page). A
# change to those alone can merge on its own, under the same conditions as
# anywhere else (low risk and complexity, nothing blocking, a trusted
# author, every check green).
#
# There is no "everything but" pattern, so this lists what is high risk: the
# root files one by one. A file added here is in no list until it is named,
# and `policy.py --test` fails until it is ("this repository: every file but
# its pages is high risk").
high-risk:
  # Workflows (.github/**), AGENTS.md and CLAUDE.md are the organisation's
  # defaults already.
  - "docs/agents.md"
  # Read by the review and the reproduction as the repository's rules
  # (review-brief.sh, issue-repro.yml), should this repository have them.
  - "docs/architecture.md"
  - "docs/testing-and-quality.md"
  # The model every agent reads from AGENTS.md, and the rules every change
  # meets: like the autonomy policy, a person merges them.
  - "docs/model.md"
  - "rules/**"
  - "kinds/**"
  # Every screen of every project associated with a system follows it
  # (repos.yml, design-system), its pages included: they are its rules.
  - "design-systems/**"
  - "policy/**"
  - "review-profiles/**"
  # The review's evaluation set and its baseline (#234): they decide
  # whether a change to the review may merge.
  - "evals/**"
  - "scripts/**"
  # The reproduction's examples and the tests CI runs (#376).
  - "tests/**"
  - "runner/**"
  - "workflow-templates/**"
  - "agents-block.md"
  # Rebuilt by scripts/changelog.py in the pull request that releases a
  # version, with what it releases.
  - "CHANGELOG.md"
  - "labels.yml"
  - "repos.yml"
  - "org.yml"
  - "CONTRIBUTING.md"
  - "SECURITY.md"
  - "SUPPORT.md"
  - "CODE_OF_CONDUCT.md"
  - "pull_request_template.md"
  - "LICENSE"
  - ".gitignore"

# How a bug in this repository is reproduced (#376, scripts/repro-ways.py,
# which says what each key means). It has no kind, so nothing else declares
# a way for it: a script's logic is a Python test that calls the script, and
# a workflow's wiring a Python test that reads the workflow's file. Both run
# with pytest, installed by `setup` before the test is in the tree, through
# scripts/repro-run.sh: no network, no secrets, a JUnit report.
repro:
  ways:
    python:
      layer: [logic, cli]
      noun: Python test
      test: tests/repro/test_issue_{n}.py
      needs: [scripts/]
      setup:
        - python3 -m pip install --quiet --disable-pip-version-check --target .dx-pytest pytest==9.1.1 PyYAML==6.0.3
      run: PYTHONPATH="$PWD/.dx-pytest" PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -p no:cacheprovider --rootdir=. -o junit_family=xunit1 --junitxml=build/dx-repro-junit.xml {test}
      junit: build/dx-repro-junit.xml
      minutes: 10
      list: ["tests/**"]
      example: tests/examples/test_logic.py
      guide: |
        A pytest test, in Python, of the script the report names, as the script's own `--test` cases
        check it: call its functions, or run it as a command, and assert what the report expected.
        - The scripts' names have hyphens: load one with importlib, as the example does
          (`spec_from_file_location` on `scripts/<name>.py`), from the repository's root
          (`Path(__file__).resolve().parents[2]`); a shell script runs with `subprocess.run(["bash", ...])`.
        - Feed it what the report describes (an environment through `monkeypatch.setenv` or `env=`,
          a file in `tmp_path`), never the network, `gh` or a token: it runs with neither.
        - A plain `assert` on the value the report expected, so the test FAILS while the bug is there.
          An exception that is not an assertion (an ImportError, a TypeError) is no verdict.
        - Small: one or two test functions, named after the expectation.
    workflow:
      layer: workflow
      noun: workflow test
      test: tests/repro/test_issue_{n}.py
      needs: [.github/workflows/]
      setup:
        - python3 -m pip install --quiet --disable-pip-version-check --target .dx-pytest pytest==9.1.1 PyYAML==6.0.3
      run: PYTHONPATH="$PWD/.dx-pytest" PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -p no:cacheprovider --rootdir=. -o junit_family=xunit1 --junitxml=build/dx-repro-junit.xml {test}
      junit: build/dx-repro-junit.xml
      minutes: 10
      list: [".github/workflows/*.yml", "workflow-templates/*.yml"]
      example: tests/examples/test_workflow.py
      guide: |
        A pytest test that reads the workflow the report names as YAML (PyYAML, `yaml.safe_load`) and
        asserts its wiring: its triggers (`on:`), a job's or a step's `if:`, the order of the steps, the
        inputs and `env:` a step gets, the arguments a `run:` passes. It never runs the workflow.
        - PyYAML reads the key `on` as the boolean True: take the triggers with `wf.get("on", wf.get(True))`.
        - Find a step by its `name` or `id`, never by its position, and compare positions to assert an
          order: `names.index("A") < names.index("B")`.
        - For what a `run:` script does, assert on its text (the command and the flags the report says
          are missing or wrong); when the logic lives in a script under scripts/, test that script
          instead, as a logic bug.
        - A plain `assert` on what the report expected, so the test FAILS while the bug is there.
        - Small: one or two test functions, named after the expectation.
