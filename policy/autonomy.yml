# The autonomy policy: everything the organisation lets proceed without a
# person deciding comes from here, and nothing else does (the plan, #78).
# scripts/autonomy.py reads it, with a repository's own .github/autonomy.yml
# from the base branch, which makes it stricter: switch a lane off, narrow
# its repositories, lower what it may merge, turn the autopilot off, add
# protected paths. The one thing it may widen is what a lane merges on its
# own, and only where the lane sets a `ceiling`, never past it: `merge` is
# the organisation's default, `ceiling` the most any repository may raise it
# to. Anything else that would widen it is ignored, with a warning.
# `autonomy.py check` holds this file to its schema in CI.
#
# The golden rule: this file, the gates and the workflows that apply them
# (`constitution` below) are always accepted and merged by a person.
# Autonomy cannot widen itself. Every path here is also high risk in the
# review policy (this repository's or the default), so the auto-merge
# decision never merges them; scripts/autonomy.py's self-test fails if one is
# not. One narrow exception, the `org-sync` lane below: in a repository
# other than this one, it merges the files scripts/sync-repos.py keeps in
# step (callers under .github/workflows/, .github/CODEOWNERS, the dx:org
# block of AGENTS.md) only when they are what a commit a person already
# merged here holds, and never a change of permissions or secrets.
#
# The organisation variable DX_AUTOPILOT=off stops every autonomous action at
# once, without touching the checks: no lane accepts an issue, no agent
# starts, nothing merges by policy, no red default branch is reverted (G8),
# no runner image is promoted to :stable.
# Everything waits for a person, as before.

autopilot: true

# Review rounds the autopilot may spend fixing a blocked pull request before
# it hands it back to a person.
autopilot-rounds: 3
# Runs the autopilot may spend on one issue's draft pull request: the first,
# and each that continues it (`autopilot:continue`, added by a person or by
# the workflow when a run ran out of turns or time with criteria left). Past
# it, a person takes the pull request.
autopilot-runs: 5

constitution:
  - "policy/**"
  - ".github/**"
  - "scripts/**"
  - "kinds/**"
  - "review-profiles/**"
  - "AGENTS.md"
  - "CLAUDE.md"
  # The organisation's rules and the model every agent reads (#187).
  - "rules/**"
  - "docs/model.md"
  # Who the organisation and its App are (#191).
  - "org.yml"

# How the autopilot settles a choice the PRD and the Spec leave open, when
# there is more than one reasonable way (#247): `guided` stops and asks a
# maintainer, with the options and its recommendation, and goes on with
# their answer, written as they like; `full` picks one, logs it on the pull
# request and stops only when it is stuck. A repository's own file may
# choose either, up to `ceiling`.
autopilot-mode:
  default: guided
  ceiling: full

# An issue carrying one of these labels is always merged by a person,
# whatever its lane says (gate G7). `security` is always here (#194): in a
# private repository a vulnerability is reported as an issue with that label
# and goes through the usual lane, and its fix never merges on its own. A
# repository's own file may add labels, never remove one. It holds only for
# an issue that carries the label: a vulnerability someone files as a plain
# Bug, which the triage did not read as one, merges like any Bug until a
# person adds `security`.
person-merges: [security]

# A lane's issue is accepted by policy only when all of this holds, read from
# GitHub, never from the issue's text alone:
#   - the issue carries the lane's label (`lane:<name>`), and the last to add
#     it was the lane's App (origin.app), not a person and not another bot;
#   - the issue was opened by that App;
#   - its body names the workflow run that opened it
#     (<!-- dx-lane: <name> run: <run URL> -->), that run belongs to the same
#     repository, and its workflow (or one it calls) is one of origin.workflows;
#   - the lane is on, takes `accept: policy`, and covers the repository;
#   - the autopilot is on (here, the repository's own file and DX_AUTOPILOT).
# A sync lane (one whose origin has `runs`, org-sync) checks its own origin
# instead of a workflow run: see it below.
#
# merge: the most a pull request closing a lane's issue may be, as the review
# rates it, and still merge on its own (the autopilot, #83, applies it).
# ceiling: the most a repository's own file may raise `merge` to (#188); a
# lane without one is never raised. An issue marked Critical never merges on
# its own, whatever either says.
lanes:
  platform:
    description: The organisation's own machinery that a scheduled job keeps current, starting with the runner image.
    accept: policy
    origin:
      app: dilux-bot
      # org-drift.yml: the daily run's proposal of the new repositories
      # for repos.yml (scripts/detect.py, #191); repos.yml is high risk,
      # so a person still merges it.
      workflows: [runner-image.yml, org-drift.yml]
    repositories: [".github"]
    evidence: The workflow run that opened the issue, with its smoke test.
    # Also the limits of gate G8 (#142): a revert dilux-bot opens when a
    # merge turned a default branch red merges on its own only in these
    # repositories, within these caps (scripts/revert.py decide).
    merge: {max-risk: medium, max-complexity: medium}

  # The reproduction (issue-repro.yml) opens the lane's issue itself, never
  # the reporter: its PRD is fixed text and the reproduction's facts
  # (scripts/repro-lane.py), with the failing test as the specification. The
  # autopilot keeps that test, untrusted code, out of its working tree and
  # runs it only in the sandbox (scripts/repro-sandbox.sh); G7 merges only a
  # pull request that carries it with the SHA-256 the PRD sealed (#84).
  bugfix-reproduced:
    description: A reported bug that the reproduction confirmed with a failing test.
    accept: policy
    origin:
      app: dilux-bot
      workflows: [issue-repro.yml]
    repositories: ["*"]
    evidence: The failing test the reproduction wrote, named in the PRD with its SHA-256; the fix makes it pass in the sandbox, unchanged.
    merge: {max-risk: medium, max-complexity: medium}

  # Trust that remains (stated, not hidden): the autopilot acts with
  # dilux-bot's token, the same App that writes the receipts branch, so a
  # misled agent could write a seal; an App of its own for receipts is the
  # next step. What it can never do is merge a protected path or a Critical
  # issue, nor merge while the review blocks.
  human-issue:
    description: An issue a person accepted, worked by the autopilot (#83) to a merged pull request unless it is marked Critical or touches the protected paths.
    accept: human
    repositories: ["*"]
    merge: {max-risk: medium, max-complexity: high}
    ceiling: {max-risk: high, max-complexity: high}

  # An organisation decision carried out in each repository (#179, #189): a
  # native sub-issue of an issue a person accepted is accepted by policy, so
  # one decision needs one acceptance, not one per repository. Recognised
  # by its parent, not by a label. Accepted when all of this holds, read
  # from GitHub (scripts/autonomy.py, delegated_accepts()):
  #   - its parent is open, in this organisation, and carries `accepted`,
  #     added last by a person (a bot's never counts), and still there:
  #     a parent that loses it, or closes, takes the children's with it;
  #   - the sub-issue was opened by a member of the organisation, or by the
  #     lane's App;
  #   - its text was not edited after it was linked to the parent.
  # Merging is the same as for a person's issue: every gate, and a person
  # merges what the policy leaves to one.
  delegated:
    description: A sub-issue of an issue a person accepted, carrying out that decision in its repository.
    accept: policy
    origin:
      app: dilux-bot
      parent: accepted-by-a-person
    repositories: ["*"]
    evidence: The parent's acceptance by a person, read from its history, and the sub-issue's link to it.
    merge: {max-risk: medium, max-complexity: high}
    ceiling: {max-risk: high, max-complexity: high}

  # Mechanical sync pull requests (#155): the Task issue and the pull request
  # scripts/sync-repos.py opens in a repository (`files`, `callers`) to bring
  # it in line with a change a person already merged here. A maintainer runs
  # the script from their machine, so the issue is theirs and no workflow
  # run opened it: instead of `workflows`, the lane names who may run it
  # (`people`, beside its App) and each kind of run (`runs`): the branch its
  # pull request comes from and the only paths it may change. Accepted when
  # all of this holds (scripts/autonomy.py, sync_accepts()):
  #   - one of them opened the issue and added lane:org-sync last, and its
  #     text was never edited;
  #   - its Type is Task, and it carries the run's marker
  #     (<!-- dx-lane: org-sync sync: <kind> org: <commit> files: <hash> -->):
  #     a commit of this repository merged into main, and the run's
  #     fingerprint, the SHA-256 of what it wrote;
  #   - its pull request (for the gate and the merge): opened by the same
  #     account from the run's branch, adding or modifying only the run's
  #     paths, whose files give the same fingerprint. Anything else fails
  #     the lane, and the issue waits for a person to accept it.
  # Never in this repository. It merges on its own (auto-merge.yml,
  # autonomy.py lane-merge) only when the review does not block and its
  # description is true, within `merge`, and every file is what that commit
  # holds: CODEOWNERS as repos.yml has it, AGENTS.md with only its dx:org
  # block replaced by agents-block.md, and each caller job it changes a
  # template's job (workflow-templates/), but the inputs that are the
  # repository's, with nothing else in the file changed. A job that changes
  # its permissions or the secrets it passes, a new job among them, is high
  # risk: a person merges it. `max-risk: high` because the review's floor for
  # .github/** and AGENTS.md is high whatever the change; the checks above,
  # not the rating, are what hold it.
  org-sync:
    description: The issue and pull request scripts/sync-repos.py opens to bring a repository in line with a change merged here.
    accept: policy
    type: Task
    origin:
      app: dilux-bot
      people: [soydiloreto]
      script: scripts/sync-repos.py
      runs:
        files:
          branch: "chore/{issue}-org-shared-files"
          paths: [".github/CODEOWNERS", "AGENTS.md"]
        callers:
          branch: "ci/{issue}-org-workflow-callers"
          paths: [".github/workflows/*.yml", ".github/workflows/*.yaml"]
    repositories: ["*"]
    evidence: The merged commit of DiluxOne/.github the issue names, and the run's fingerprint, which the pull request's files must give again.
    merge: {max-risk: high, max-complexity: low}

  # The issue "Release X.Y.Z" (#82, the Release form, label lane:release):
  # a person's acceptance opens the release pull request
  # (issue-accepted.yml), and the release workflow publishes only a version
  # whose issue a person with the admin or maintain role accepted
  # (scripts/release-issue.py verify). The bot opens one only for a
  # version milestone a person closed (scripts/milestones.py, #192), and
  # nothing here can accept one.
  release:
    description: A release issue. Publishing to users is always a person's decision.
    accept: human
    repositories: ["*"]
    merge: {max-risk: none, max-complexity: none}
