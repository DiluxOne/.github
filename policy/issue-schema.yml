# The issue schema: the sections an issue's PRD and Spec are made of, in
# order, and what each must hold (the plan, #78; gate G1, and G3 for the
# Spec). One source: scripts/issue-schema.py checks an issue against it and
# writes the maintenance-task form from it (.github/ISSUE_TEMPLATE/task.yml,
# never edited by hand; CI fails when the form and this file disagree).
#
# An issue is "### " sections, one after another:
#   1. the report, if any: the sections the reporters' forms produce (a bug
#      report's "What happened?", a feature request's "What problem would
#      this solve?"…). Context for people; the agent never reads it;
#   2. the PRD, every section below in this order: what to build and why,
#      written or completed by the maintainer (or an agent with them) and
#      sealed when the issue is accepted (#81);
#   3. the Spec, written by the agent at G3: how, which files, which test
#      proves each criterion.
# Nothing else: text before the first section, an unknown heading or a
# section out of order fails the check. A doubt the PRD still marks
# ([Doubt: …], or [Duda: …]) fails it too (#193): what is not decided is
# settled before the issue is accepted. The only lines allowed outside a
# section's text are the organisation's markers (<!-- dx-… -->) and the AI
# line at the end.

prd:
  - id: problem
    heading: Problem
    description: What is wrong or missing today, and for whom. Facts, not the solution.
    required: true
  - id: scope
    heading: Scope
    description: What this issue changes, as a list.
    required: true
  - id: out-of-scope
    heading: Out of scope
    description: What it deliberately does not change.
    required: true
  - id: criteria
    heading: Acceptance criteria
    description: "One line per criterion, each with its ID and a verifiable form: C1: Given …, when …, then …"
    required: true
    format: criteria
  - id: criticality
    heading: Criticality
    description: Normal, or Critical (a person merges it).
    required: true
    format: one-of
    values: [Normal, Critical]
  # A decision several repositories carry out (#189): which ones, as rules
  # over what the organisation knows of each, every rule true at once. On
  # acceptance, scripts/decision.py opens a sub-issue in each, which the
  # delegated lane accepts; a repository that matches later gets its own on
  # the next daily run.
  - id: repositories
    heading: Repositories
    description: "Only for a decision that several repositories carry out: which ones, one rule per line, all of them true. `all`; `kind: <kind>`; `visibility: public` or `private`; `has: <file at the repository's root>`; `name: <repository>, <repository>`. Each gets a sub-issue of this one, accepted with it."
    required: false
    format: repositories

spec:
  - id: approach
    heading: "Spec: approach"
    description: How the change is made, in a few lines.
    required: true
  - id: files
    heading: "Spec: files"
    description: The files it touches.
    required: true
  - id: tests
    heading: "Spec: tests"
    description: "One line per criterion: C1 → the test that proves it."
    required: true
    format: covers-criteria

# The reporters' forms' sections, allowed before the PRD.
report:
  - What happened?
  - Steps to reproduce
  - Version
  - Logs or screenshots
  - Where?
  - What is missing, wrong or unclear?
  - What problem would this solve?
  - What would you like to happen?
  - What do you do today instead?
  - What and why

# The release issue (#82): publishing a version is a person's decision, and
# accepting this issue is it. It is not a PRD: its title is the version,
# exactly "Release X.Y.Z", and its label is the release lane's
# (policy/autonomy.yml), which is never accepted by policy. Accepting it
# opens the release pull request; the release workflow publishes only a
# version whose issue a person with the admin or maintain role accepted
# and whose title has not changed
# since (scripts/release-issue.py). scripts/issue-schema.py writes the
# Release form (.github/ISSUE_TEMPLATE/release.yml) from this.
release:
  title: "Release "
  label: "lane:release"
  sections:
    - id: notes
      heading: Notes
      description: Optional. Anything the person who accepts it should know (a date it must wait for, a version it follows). What the version brings is in the changelog, written as the changes merged.
      required: false
