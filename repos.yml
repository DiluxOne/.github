# The settings every repository of the organisation has, applied by
# scripts/sync-repos.py through the API. What GitHub lets the organisation
# hold itself (rulesets, issue types and fields, Projects, secrets, the
# community files of this repository) is not here.

# Repositories with no workflows of their own by design (the organisation's
# required pipeline still runs on their pull requests): the drift check does
# not ask them to call the shared ones.
no-workflows:
  - diluxone-wp-test   # a disposable environment to test by hand (its AGENTS.md)

# Repositories the script leaves alone.
exclude:
  - ards-web   # a client's site, moving to the maintainer's account (docs/plans/org-first.md)

# Every repository of the organisation and what it is (#191): its kinds of
# project (a pack in kinds/), each over the paths it covers, with the roles
# of those paths (which the rules in rules/ that name a role will reach,
# phase 6 of #184). A single-kind repository covers "**". A repository with
# no kinds is unclassified (the autopilot leaving it alone comes with phase
# 8). scripts/sync-repos.py reads the kind from here first.
# scripts/repos-config.py check holds this to its schema:
# known kinds, known roles, paths of one repository that never overlap.
# Where a repository's .github/review-policy.yml names a kind too, this wins.
repos:
  .github: {kinds: []}   # the organisation's own: its rules are its review policy
  dilux-agentic-workflow: {kinds: []}
  diluxone-comments-pro-wordpress: {kinds: [{kind: wordpress-plugin, paths: ["**"], roles: [back, front]}]}
  diluxone-comments-wordpress: {kinds: [{kind: wordpress-plugin, paths: ["**"], roles: [back, front]}]}
  diluxone-commerce-wordpress: {kinds: [{kind: wordpress-plugin, paths: ["**"], roles: [back, front]}]}
  diluxone-events-wordpress: {kinds: [{kind: wordpress-plugin, paths: ["**"], roles: [back, front]}]}
  diluxone-help-wordpress: {kinds: [{kind: wordpress-plugin, paths: ["**"], roles: [back, front]}]}
  diluxone-mail-wordpress: {kinds: [{kind: wordpress-plugin, paths: ["**"], roles: [back, front]}]}
  diluxone-multisite-user-sync-wordpress: {kinds: [{kind: wordpress-plugin, paths: ["**"], roles: [back, front]}]}
  diluxone-offload-wordpress: {kinds: [{kind: wordpress-plugin, paths: ["**"], roles: [back, front]}]}
  diluxone-platform: {kinds: []}
  diluxone-slider-wordpress: {kinds: [{kind: wordpress-plugin, paths: ["**"], roles: [back, front]}]}
  diluxone-support-wordpress: {kinds: [{kind: wordpress-plugin, paths: ["**"], roles: [back, front]}]}
  diluxone-users-pro-wordpress: {kinds: [{kind: wordpress-plugin, paths: ["**"], roles: [back, front]}]}
  diluxone-users-wordpress: {kinds: [{kind: wordpress-plugin, paths: ["**"], roles: [back, front]}]}
  diluxone-website: {kinds: []}
  diluxone-wp-test: {kinds: []}
  sandbox-wordpress-plugin: {kinds: [{kind: wordpress-plugin, paths: ["**"], roles: [back, front]}]}   # a toy plugin where the workflows are proved end to end (#287)
  security: {kinds: []}   # private: only the runs of security-fix.yml (#194)

# Which public Project of the organisation each repository's accepted issues
# land on (its number: github.com/orgs/DiluxOne/projects/<n>). One per
# product, the free plugin and its Pro add-on together. A repository not
# listed puts its issues on no Project.
projects:
  diluxone-offload-wordpress: 1
  diluxone-users-wordpress: 2
  diluxone-users-pro-wordpress: 2
  diluxone-multisite-user-sync-wordpress: 3
  diluxone-comments-wordpress: 4
  diluxone-comments-pro-wordpress: 4
  diluxone-help-wordpress: 5
  diluxone-support-wordpress: 6
  diluxone-commerce-wordpress: 7
  diluxone-slider-wordpress: 8
  diluxone-mail-wordpress: 10
  diluxone-events-wordpress: 12
  diluxone-website: 11
  .github: 9
  diluxone-wp-test: 9

# Which design system each repository's screens follow: one of
# design-systems/ here, or `local` (its own docs/design-system/, which may
# extend one of these; design-systems/README.md). A repository not listed
# has none.
design-system:
  diluxone-offload-wordpress: wordpress-admin
  diluxone-users-wordpress: wordpress-admin
  diluxone-users-pro-wordpress: wordpress-admin
  diluxone-multisite-user-sync-wordpress: wordpress-admin
  diluxone-comments-wordpress: wordpress-admin
  diluxone-comments-pro-wordpress: wordpress-admin
  diluxone-help-wordpress: wordpress-admin
  diluxone-support-wordpress: wordpress-admin
  diluxone-commerce-wordpress: wordpress-admin
  diluxone-events-wordpress: wordpress-admin
  diluxone-slider-wordpress: wordpress-admin
  diluxone-mail-wordpress: wordpress-admin

# Merging: squash only, the pull request's title and description as the
# commit, the branch deleted, auto-merge allowed (the policy decides when).
settings:
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  allow_auto_merge: true
  delete_branch_on_merge: true
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY
  has_issues: true
  has_wiki: false

# Security: Dependabot alerts and security updates everywhere; private
# vulnerability reporting, secret scanning and push protection where GitHub
# offers them (public repositories on this plan).
security:
  vulnerability_alerts: true
  automated_security_fixes: true
  private_vulnerability_reporting: public-only
  secret_scanning: public-only

# Files every repository carries because GitHub reads them only from the
# repository. They reach it as a pull request that closes an issue the
# script opens there, never straight to main.
files:
  .github/CODEOWNERS: |
    # Who is asked to review a pull request. The organisation's rulesets do
    # not require code-owner approval; this only puts every pull request in
    # the maintainer's queue. Kept in step by DiluxOne/.github
    # (scripts/sync-repos.py).
    * @soydiloreto

# Dependabot: every repository's .github/dependabot.yml is written from its
# kind's template (kinds/<kind>/dependabot.yml; a repository without a kind,
# or of a kind without one, gets policy/dependabot.default.yml) by
# `sync-repos.py dependabot`, as a pull request of its own (no lane covers it,
# so a person accepts its issue, unlike the files above), and the drift
# check reports one that differs. It carries only the ecosystems the
# repository has: github-actions always, npm with a package.json at its root,
# composer with a composer.json, docker with a Dockerfile. What a repository
# adds lives here and nowhere else, per ecosystem: `directories` (beside its
# root's; they turn the ecosystem on) and `ignore` (Dependabot's own
# entries). Nothing is ignored by default: every dependency is kept on its
# latest version.
dependabot:
  .github:
    docker:
      # The runner image's base (runner/Dockerfile), pinned by digest. Only
      # the digest of the Ubuntu release it is on moves by itself: a new
      # Ubuntu release (24.04 to 26.04) is a decision of ours, taken when what
      # the jobs install on it is published for it (above all what setup-php
      # installs from: the ondrej/php PPA and php-builder's prebuilt builds,
      # which the runner-image.yml smoke test sets PHP up from), and then made
      # by hand in the Dockerfile (docs/maintaining.md).
      directories: [/runner]
      ignore:
        - dependency-name: ubuntu
          update-types: ["version-update:semver-major", "version-update:semver-minor"]

# The workflow callers (workflow-templates/) every repository that calls the
# shared workflows keeps job for job, trigger for trigger and permission for permission (#329), as its template: the drift check
# compares them and `sync-repos.py callers` brings one in step, as a pull
# request that closes an issue it opens there. The templates in
# `every-repository` apply to each of them; any other template, to a
# repository that calls one of the shared workflows it calls.
# `repository-owned` names, for each template, the inputs it says to fill in:
# their values are the repository's, never compared and always kept. An input
# a repository passes that its template does not set (main-file,
# requires-plugins-from), and a job of its own, are its own too.
# `migrates-from` names the older majors whose migration asks a repository
# for nothing but its callers (docs/migrating.md): `callers` moves one at
# such a major to the current one in the same pull request, every call of
# the shared workflows, its own jobs' too (#320). Any other older major is
# migrated by hand first.
callers:
  migrates-from: [5]
  every-repository: [issues.yml, pull-request-comments.yml]
  repository-owned:
    issues.yml: [support-url]
    pull-request-comments.yml: [profile]
    plugin-checks-wp.yml: [slug, version-constant]
    release-wp.yml: [slug, version-constant, dry-run]
