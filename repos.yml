# The settings every repository of the organisation has, applied by
# scripts/sync-repos.py through the API. What GitHub lets the organisation
# hold itself (rulesets, issue types and fields, Projects, secrets, the
# community files of this repository) is not here.

# Repositories with no workflows of their own by design (the organisation's
# required pipeline still runs on their pull requests): the drift check does
# not ask them to call the shared ones.
no-workflows:
  - diluxone-wp-test   # a disposable environment to test by hand (its AGENTS.md)

# Repositories the script leaves alone.
exclude:
  - ards-web   # a client's site, moving to the maintainer's account (docs/plans/org-first.md)

# Every repository of the organisation, one entry each with all the
# organisation says of it (#191, #562), read through scripts/repos_conf.py:
#   kinds          its kinds of project (a pack in kinds/), each over the
#                  paths it covers, with the roles of those paths (which the
#                  rules in rules/ that name a role reach). A single-kind
#                  repository covers "**"; one with no kinds is
#                  unclassified. The kind is declared here only: a
#                  repository's .github/review-policy.yml `kind` is not read,
#                  and the drift check lists one that still names it.
#   project        the public Project of the organisation its accepted issues
#                  land on (github.com/orgs/DiluxOne/projects/<n>), one per
#                  product, the free plugin and its Pro add-on together;
#                  `sync-repos.py adopt` links it. None: no Project, and the
#                  drift check says so.
#   design-system  the design system its screens follow: one of
#                  design-systems/ here, or `local` (its own
#                  docs/design-system/, which may extend one of these;
#                  design-systems/README.md). None: no design system.
#   repro          how it reproduces a bug when neither its kind's pack nor
#                  its own .github/review-policy.yml says (#377): a `repro:`
#                  as that file takes it (scripts/repro-ways.py), the
#                  repository's own winning; `false` is none by design (the
#                  drift check does not list it, and the autopilot still
#                  does not take its bugs).
#   merge-queue    its exception to org.yml `merge-queue` (#451): `on`,
#                  `off` or `auto`, quoted (YAML reads a bare on/off as
#                  true/false).
#   pre-pr         `false`: no `make pre-pr` by design (#479,
#                  scripts/pre-pr.py), so the drift check does not list it
#                  nor does the conventions check fail its pull requests once
#                  org.yml `pre-pr` is `required`.
#   who-decides    its exception to org.yml `who-decides` (#588,
#                  scripts/deciders.py): `codeowners`, `acceptor` or
#                  `writers`.
#   dependabot     what its .github/dependabot.yml adds, per ecosystem (see
#                  `dependabot` below).
#   callers        the values of its callers' inputs (see `callers` below),
#                  over `callers: defaults`.
# scripts/repos-config.py check holds this to its schema: known kinds, known
# roles, paths of one repository that never overlap, known attributes.
repos:
  .github:   # the organisation's own: its rules are its review policy
    kinds: []
    project: 9
    merge-queue: "off"
    dependabot:
        docker:
          # The runner image's base (runner/Dockerfile), pinned by digest. Only
          # the digest of the Ubuntu release it is on moves by itself: a new
          # Ubuntu release (24.04 to 26.04) is a decision of ours, taken when what
          # the jobs install on it is published for it (above all what setup-php
          # installs from: the ondrej/php PPA and php-builder's prebuilt builds,
          # which the runner-image.yml smoke test sets PHP up from), and then made
          # by hand in the Dockerfile (docs/maintaining.md).
          directories: [/runner]
          ignore:
            - dependency-name: ubuntu
              update-types: ["version-update:semver-major", "version-update:semver-minor"]
  dilux-agentic-workflow: {kinds: [{kind: ai-agent-plugin, paths: ["**"], roles: [front]}]}   # DAW (#552)
  diluxone-comments-pro-wordpress: {kinds: [{kind: wordpress-plugin, paths: ["**"], roles: [back, front]}], project: 4, design-system: wordpress-admin}
  diluxone-comments-wordpress: {kinds: [{kind: wordpress-plugin, paths: ["**"], roles: [back, front]}], project: 4, design-system: wordpress-admin}
  diluxone-commerce-wordpress: {kinds: [{kind: wordpress-plugin, paths: ["**"], roles: [back, front]}], project: 7, design-system: wordpress-admin}
  diluxone-events-wordpress: {kinds: [{kind: wordpress-plugin, paths: ["**"], roles: [back, front]}], project: 12, design-system: wordpress-admin}
  diluxone-fm: {kinds: [], project: 13}
  diluxone-help-wordpress: {kinds: [{kind: wordpress-plugin, paths: ["**"], roles: [back, front]}], project: 5, design-system: wordpress-admin}
  diluxone-mail-wordpress: {kinds: [{kind: wordpress-plugin, paths: ["**"], roles: [back, front]}], project: 10, design-system: wordpress-admin}
  diluxone-mermaid: {kinds: [{kind: ai-agent-plugin, paths: ["**"], roles: [front]}]}
  diluxone-multisite-user-sync-wordpress: {kinds: [{kind: wordpress-plugin, paths: ["**"], roles: [back, front]}], project: 3, design-system: wordpress-admin}
  diluxone-offload-wordpress: {kinds: [{kind: wordpress-plugin, paths: ["**"], roles: [back, front]}], project: 1, design-system: wordpress-admin}
  diluxone-platform: {kinds: []}
  diluxone-plugins-ai: {kinds: [], repro: false}   # the catalog of the ai-agent-plugin kind (#552): its own pre-pr, agent-manifests.py catalog
  diluxone-slider-wordpress: {kinds: [{kind: wordpress-plugin, paths: ["**"], roles: [back, front]}], project: 8, design-system: wordpress-admin}
  diluxone-support-wordpress: {kinds: [{kind: wordpress-plugin, paths: ["**"], roles: [back, front]}], project: 6, design-system: wordpress-admin}
  diluxone-users-pro-wordpress: {kinds: [{kind: wordpress-plugin, paths: ["**"], roles: [back, front]}], project: 2, design-system: wordpress-admin}
  diluxone-users-wordpress: {kinds: [{kind: wordpress-plugin, paths: ["**"], roles: [back, front]}], project: 2, design-system: wordpress-admin}
  diluxone-website: {kinds: [], project: 11}
  diluxone-wp-test: {kinds: [], project: 9, repro: false, pre-pr: false}
  sandbox-wordpress-plugin: {kinds: [{kind: wordpress-plugin, paths: ["**"], roles: [back, front]}]}   # a toy plugin where the workflows are proved end to end (#287)
  security: {kinds: [], repro: false, pre-pr: false}   # private: only the runs of security-fix.yml (#194)


# Merging: squash only, the pull request's title and description as the
# commit, the branch deleted, auto-merge allowed (the policy decides when).
settings:
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  allow_auto_merge: true
  delete_branch_on_merge: true
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY
  has_issues: true
  has_wiki: false

# Security. Secret scanning and push protection come from the
# organisation's code security configuration named here, which
# `sync-repos.py security` attaches to each repository and keeps the default
# for new ones (#562): never a per-repository setting, which the
# enterprise's policy refuses (HTTP 422). Beside it, what a configuration
# does not hold: Dependabot alerts and security updates everywhere, and
# private vulnerability reporting where GitHub offers it (public
# repositories on this plan).
security:
  configuration: DiluxOne
  vulnerability_alerts: true
  automated_security_fixes: true
  private_vulnerability_reporting: public-only
  # Every outside contributor's workflow runs wait for a maintainer's
  # approval, not only a first-timer's (#488): GitHub's
  # fork-pr-contributor-approval, `all_external_contributors`, on public
  # repositories.
  fork_pr_approval: public-only

# Files every repository carries because GitHub reads them only from the
# repository. They reach it as a pull request that closes an issue the
# script opens there, never straight to main.
files:
  .github/CODEOWNERS: |
    # Who is asked to review a pull request. The organisation's rulesets do
    # not require code-owner approval; this only puts every pull request in
    # the maintainer's queue. Kept in step by DiluxOne/.github
    # (scripts/sync-repos.py).
    * @soydiloreto

# Dependabot: every repository's .github/dependabot.yml is written from its
# kind's template (kinds/<kind>/dependabot.yml; a repository without a kind,
# or of a kind without one, gets policy/dependabot.default.yml) by
# `sync-repos.py dependabot`, as a pull request of its own (the org-sync
# lane's `dependabot` run, #562), and the drift check reports one that
# differs. It carries only the ecosystems the repository has: github-actions
# always, npm with a package.json at its root, composer with a
# composer.json, docker with a Dockerfile. What a repository adds lives in
# its entry's `dependabot` and nowhere else, per ecosystem: `directories`
# (beside its root's; they turn the ecosystem on) and `ignore` (Dependabot's
# own entries). Nothing is ignored by default: every dependency is kept on
# its latest version.
#
# The workflow callers (workflow-templates/) every repository that calls the
# shared workflows keeps job for job, trigger for trigger and permission for permission (#329), as its template: the drift check
# compares them and `sync-repos.py callers` brings one in step, as a pull
# request that closes an issue it opens there. The templates in
# `every-repository` apply to each of them; any other template, to a
# repository that calls one of the shared workflows it calls.
# `repository-owned` names, for each template, the inputs it says to fill in:
# their values are the repository's, never compared and always kept. An input
# a repository passes that its template does not set (main-file,
# requires-plugins-from), and a job of its own, are its own too.
# `defaults` holds the organisation's value of each of those inputs, which a
# caller is written with (#562), so none is left a template's placeholder
# to fill by hand: a repository's entry's `callers` wins over it. `{slug}`
# is the repository's name without its `-wordpress` ending, `{SLUG}` the
# same in capitals with `_` for `-`. `dry-run` stays the templates' `true`:
# a release rehearses until the repository's entry sets `dry-run: false`,
# so no pull request merged by policy ever makes one publish.
# `migrates-from` names the older majors whose migration asks a repository
# for nothing but its callers (docs/migrating.md): `callers` moves one at
# such a major to the current one in the same pull request, every call of
# the shared workflows, its own jobs' too (#320). Any other older major is
# migrated by hand first.
callers:
  migrates-from: [5, 6]
  every-repository: [issues.yml, pull-request-comments.yml]
  repository-owned:
    issues.yml: [support-url]
    pull-request-comments.yml: [profile]
    plugin-checks-wp.yml: [slug, version-constant]
    release-wp.yml: [slug, version-constant, dry-run]
    release-ai.yml: [dry-run]
  defaults:
    support-url: https://github.com/DiluxOne/.github/blob/main/SUPPORT.md
    profile: general
    dry-run: true
    slug: "{slug}"
    version-constant: "{SLUG}_VERSION"
