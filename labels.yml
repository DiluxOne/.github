# Every label the organisation's workflows and people use, the same in every
# repository. scripts/sync-repos.py creates them or brings their colour and
# description in line; it never deletes a label a repository added, only the
# retired ones below.
#
# A label is a decision or a warning a person reads at a glance (#564):
# never a counter nor a step in between. Those live in the board's state
# (scripts/receipts.py `state`), the one bot comment of the issue or pull
# request.
#
# The issue's kind is not a label: it is the native issue Type (Feature,
# Bug, Task, Docs, set at the organisation). The type:* labels below are on
# pull requests only, where the review sets them from the diff.

# The maintainer's decision: a pull request may close this issue.
- {name: accepted, color: "0E8A16", description: "A maintainer accepted this issue; a pull request may close it"}
# Gate G1 before the decision (#353): checked when the issue opens and every
# time it is edited (issue-accepted.yml), one of the two at a time.
- {name: awaiting-acceptance, color: "FBCA04", description: "The issue follows the schema; it waits for a maintainer's decision"}
- {name: incomplete, color: "D4C5F9", description: "The issue does not follow the schema yet; a comment says what is missing"}

# The autonomy policy (policy/autonomy.yml): a lane's issue, and what was
# decided by policy rather than by a person (the weekly summary lists them).
- {name: "lane:platform", color: "1D76DB", description: "The organisation's own machinery, kept current by a weekly job"}
- {name: "lane:bugfix-reproduced", color: "1D76DB", description: "A bug the reproduction confirmed with a failing test"}
- {name: "lane:org-sync", color: "1D76DB", description: "Opened by scripts/sync-repos.py to bring this repository in line with DiluxOne/.github"}
- {name: "lane:adopt", color: "1D76DB", description: "Adopt <repository>: a maintainer accepting it adds it to repos.yml and adopts it (org-adopt.yml)"}
- {name: "lane:release", color: "1D76DB", description: "Release X.Y.Z: a person accepting it is the decision to publish"}
- {name: "lane:maintainer-bug", color: "1D76DB", description: "A Bug a maintainer wrote, accepted with its writing"}
- {name: "accepted-by:policy", color: "0E8A16", description: "Accepted by a lane of the autonomy policy, not by a person"}
- {name: "merged-by:policy", color: "0E8A16", description: "Merged by the autonomy policy, not by a person"}
- {name: autopilot, color: "1D76DB", description: "Opened by the autopilot from an accepted issue"}
- {name: needs-human, color: "D93F0B", description: "The autopilot handed this over to a person"}

# One issue per run of the bots' recurring work (scripts/run-issue.sh, #188):
# closed when the run needed no one, open with needs-human when it did.
- {name: "run:runner-image", color: "C5DEF5", description: "A build of the runner image (runner-image.yml)"}
- {name: "run:autonomy-digest", color: "C5DEF5", description: "A week's decisions by policy (autonomy-digest.yml)"}
- {name: "run:claims", color: "C5DEF5", description: "The daily list of claims (issue-claim.yml), one comment per repository"}
- {name: "run:waiting", color: "C5DEF5", description: "What waits on whom (waiting-digest.yml): one pinned issue, its body rewritten"}
- {name: "run:flow-numbers", color: "C5DEF5", description: "The week's numbers (flow-numbers.yml): one pinned issue, its body rewritten"}

# A person claims an issue (#488, issue-claim.yml): the autopilot steps aside.
- {name: claimed, color: "5319E7", description: "A person claimed it: the autopilot steps aside"}

# A vulnerability report (the triage, issue-triage.yml).
- {name: security, color: "B60205", description: "A vulnerability report; a person merges its fix"}

# The review, on pull requests (claude-review.yml).
- {name: "risk:low", color: "0E8A16", description: "Set by the Claude review"}
- {name: "risk:medium", color: "FBCA04", description: "Set by the Claude review"}
- {name: "risk:high", color: "D93F0B", description: "Set by the Claude review"}
- {name: "complexity:low", color: "0E8A16", description: "Set by the Claude review"}
- {name: "complexity:medium", color: "FBCA04", description: "Set by the Claude review"}
- {name: "complexity:high", color: "D93F0B", description: "Set by the Claude review"}
- {name: "type:breaking", color: "0075CA", description: "The kind of change, read from the diff by the Claude review"}
- {name: "type:feat", color: "0075CA", description: "The kind of change, read from the diff by the Claude review"}
- {name: "type:fix", color: "0075CA", description: "The kind of change, read from the diff by the Claude review"}
- {name: "type:perf", color: "0075CA", description: "The kind of change, read from the diff by the Claude review"}
- {name: "type:refactor", color: "0075CA", description: "The kind of change, read from the diff by the Claude review"}
- {name: "type:style", color: "0075CA", description: "The kind of change, read from the diff by the Claude review"}
- {name: "type:docs", color: "0075CA", description: "The kind of change, read from the diff by the Claude review"}
- {name: "type:test", color: "0075CA", description: "The kind of change, read from the diff by the Claude review"}
- {name: "type:ci", color: "0075CA", description: "The kind of change, read from the diff by the Claude review"}
- {name: "type:build", color: "0075CA", description: "The kind of change, read from the diff by the Claude review"}
- {name: "type:chore", color: "0075CA", description: "The kind of change, read from the diff by the Claude review"}
- {name: "type:revert", color: "0075CA", description: "The kind of change, read from the diff by the Claude review"}
- {name: "version:major", color: "B60205", description: "A maintainer makes the next release a major"}
- {name: "version:minor", color: "FBCA04", description: "A maintainer makes the next release a minor"}
- {name: "version:patch", color: "0E8A16", description: "A maintainer makes the next release a patch"}

# Dependabot and the weekly run.
- {name: dependencies, color: "0366D6", description: "Updates a dependency"}
- {name: github-actions, color: "000000", description: "Updates a GitHub Action"}
- {name: npm, color: "CB3837", description: "Updates an npm package"}
- {name: composer, color: "885630", description: "Updates a Composer package"}
- {name: docker, color: "2496ED", description: "Updates a Docker image"}
- {name: "ci:weekly", color: "B60205", description: "The weekly run failed"}

# Retired (#564): sync-repos.py first carries each one's state into the
# board of every open item that has it (`retired:`, the `state set` it
# writes; `add: KEY` adds the label's number to a list), then deletes the
# label in every repository, which takes it off every item. A trigger a
# person set with a label is a writer's comment now: /continue, /repro,
# /review full, /spike, /claim long.
- {name: "autopilot:run-*", retired: {add: runs}}
- {name: "autopilot:free-*", retired: {add: free}}
- {name: "autopilot:round-*", retired: {max: rounds}}
- {name: "autopilot:waiting", retired: {state: "waiting=true"}}
- {name: "autopilot:answered", retired: {state: "answered=true"}}
- {name: "autopilot:continue", retired: {}}
- {name: "needs:maintainer", retired: {}}
- {name: "claim:long", retired: {state: "claim_long=true"}}
- {name: "good first issue", retired: {}}
- {name: revert, retired: {state: "revert=true"}}
- {name: reverted, retired: {state: "reverted=true"}}
- {name: needs-triage, retired: {}}
- {name: needs-info, retired: {state: "verdict=needs-info"}}
- {name: spike, retired: {state: "spike=true"}}
- {name: by-design, retired: {state: "verdict=by-design"}}
- {name: pro-feature, retired: {state: "verdict=pro-feature"}}
- {name: planned, retired: {state: "verdict=planned"}}
- {name: exists-in-pro, retired: {state: "verdict=exists-in-pro"}}
- {name: question, retired: {state: "verdict=question"}}
- {name: enhancement, retired: {state: "verdict=enhancement"}}
- {name: duplicate, retired: {state: "verdict=duplicate"}}
- {name: "bug:unconfirmed", retired: {state: "repro=unconfirmed"}}
- {name: "bug:confirmed", retired: {state: "repro=confirmed"}}
- {name: could-not-reproduce, retired: {state: "repro=could-not-reproduce"}}
- {name: "repro:no-way", retired: {state: "repro=no-way"}}
- {name: "repro:run", retired: {}}
- {name: "repro:again", retired: {}}
- {name: "review:full", retired: {state: "review_full=true"}}
- {name: "layer:logic", retired: {state: "layer=logic"}}
- {name: "layer:browser", retired: {state: "layer=browser"}}
- {name: "layer:cli", retired: {state: "layer=cli"}}
- {name: "layer:api", retired: {state: "layer=api"}}
- {name: "layer:workflow", retired: {state: "layer=workflow"}}
