# The release scenarios (#563): what the release lane plays in the test
# repository (org.yml `test-repo`, kind engine-test) at `v7-next` before `v7`
# moves, and what the installer plays once (scripts/install.py apply).
# scripts/release-scenarios.py reads this file: `coverage` (in the scripts
# job) fails naming each pair of a reusable workflow and an event the test
# repository's callers wire (its pack's `callers`, and org-pull-request.yml;
# a `schedule` aside), and each transition of the autopilot's state machine
# (but those `statically:` holds, below),
# that no scenario covers, and each scenario that dispatches a workflow the
# test repository cannot run on demand; `run` plays them. Every other
# shipped caller (the products' batteries, the nightly and security runs)
# is held to the engine statically, by scripts/caller-contract.py check. The script's header says what each
# key means. A bug that reached the repositories after a release adds its
# scenario here in its fix (#585's is `caller-permission-585`).
#
# In the test repository the autopilot calls no model (its pack's
# `autopilot: fixed-change`), the test identity may accept (its pack's
# `identity`), and every issue and pull request a scenario opens is closed
# after it (`cleanup: after-run`).
#
# The lane plays every scenario at once, each in its own job
# (release-lane.yml `play`; release-scenarios.py groups, #694). Each writes
# only under its own directory of the test repository, scenarios/<id>/ (its
# fixed change too), and only core-one-at-a-time's is the core
# (kinds/engine-test/pack.yml, #709), so none waits on another's change;
# `partition` fails when two could write to the same part of the core, or
# another scenario writes under it (`core_problems`). Every body a scenario
# opens carries its `dx-scenario: <id>` mark first, so its next run closes
# what it left, and
# names its scenario where the triage reads it (#709): `Scenario: <id>.` as
# the first line of its first section, and an issue's title ends with
# `[<id>]` (but a release issue's, the version alone), so no two scenarios'
# issues read as duplicates.
#
# A scenario that reads the autopilot's result on an issue (its seal, the
# `autopilot` or core-wait label, its pull request) opens that issue plain,
# waits `until` the triage's verdict (`awaiting-acceptance`), accepts it
# then, so the acceptance seals the triaged body as a maintainer's would,
# and waits `until` the seal before the autopilot's result (#713:
# release-scenarios.py autopilot_problems); a `/claim` comes before the
# acceptance. A step with `of: before` acts on its first `before` issue.

# The bodies the scenarios open and edit with, by name.
bodies:
  complete-feature: |
    ### Problem

    The test repository has no greeting.

    ### Scope

    - A greeting file.

    ### Out of scope

    - Anything else.

    ### Acceptance criteria

    - C1: Given the repository, when it is read, then it has a greeting.

    ### Criticality

    Normal
  edited-feature: |
    ### Problem

    The test repository has no greeting, nor a farewell.

    ### Scope

    - A greeting file and a farewell file.

    ### Out of scope

    - Anything else.

    ### Acceptance criteria

    - C1: Given the repository, when it is read, then it has a greeting.

    ### Criticality

    Normal
  incomplete: |
    Something should be better.
  # A bug in the report's sections, then the PRD's (#694: the bug form's
  # and the schema's), so the triage takes it as a person's. Its file is
  # the one `bug-reproduced` lands on main first, which the test
  # repository's fixed reproduction reads (#707).
  bug: |
    ### What happened?

    `scenarios/bug-reproduced/greeting.md` says "helo".

    ### Steps to reproduce

    Read `scenarios/bug-reproduced/greeting.md`.

    ### Version

    The test repository's `main`.

    ### Problem

    The greeting says "helo" instead of "hello".

    ### Scope

    - The greeting's word.

    ### Out of scope

    - Anything else.

    ### Acceptance criteria

    - C1: Given the repository, when `scenarios/greeting.md` is read, then it says "hello".

    ### Criticality

    Normal
  bug-not-reproduced: |
    ### What happened?

    `scenarios/bug-not-reproduced/greeting.md` said "helo" once, in a run nobody kept.

    ### Steps to reproduce

    1. Read `scenarios/bug-not-reproduced/greeting.md` on `main`.
    2. See whether it says "helo" instead of "hello".

    ### Version

    The test repository's `main`.

    ### Problem

    The greeting said "helo" instead of "hello" once.

    ### Scope

    - The greeting's word.

    ### Out of scope

    - Anything else.

    ### Acceptance criteria

    - C1: Given the repository, when `scenarios/bug-not-reproduced/greeting.md` is read, then it says "hello".

    ### Criticality

    Normal
  # A decision's PRD (#713: the schema's, with its Repositories), naming
  # only the test repository, so it reaches no other.
  decision: |
    ### Problem

    The test repository has neither a greeting nor a farewell.

    ### Scope

    - A greeting file.
    - A farewell file.

    ### Out of scope

    - Anything else.

    ### Acceptance criteria

    - C1: Given the repository, when it is read, then it has a greeting and a farewell.

    ### Criticality

    Normal

    ### Repositories

    name: diluxone-test
  # The Release form's (#694): its one section, and its label below.
  release: |
    ### Notes

    None.
  # A maintenance task's (the Task and Docs forms' PRD), for a pull request
  # titled docs or ci.
  task: |
    ### Problem

    The scenarios' directory has no note.

    ### Scope

    - A note under the scenario's directory.

    ### Out of scope

    - Anything else.

    ### Acceptance criteria

    - C1: Given the repository, when the scenario's directory is read, then it has a note.

    ### Criticality

    Normal
  # `{issue}`: the issue the scenario opens for its pull request first;
  # `{files}`: one line per file its pull request adds or edits, its path
  # in backticks after a dash (#760: release-scenarios.py pull_files), so
  # its description says what its diff does. The template's sections, which the conventions check
  # asks of a person's.
  pull: |
    ## 📝 What changes

    Adds or edits, under the scenario's directory of the test repository:

    {files}

    ## 💡 Why

    Closes #{issue}

# The Type each body's form gives its issue (.github/ISSUE_TEMPLATE/*.yml
# `type:`), which `gh issue create` does not: the accepted-issue gate needs
# a Feature for a feat pull request and a Bug for a fix, and the autopilot
# names its draft after it. An issue's own `type:` overrides it.
types:
  complete-feature: Feature
  edited-feature: Feature
  bug: Bug
  bug-not-reproduced: Bug
  task: Task
  release: Task

# The transitions no scenario can cause in the test repository, each with
# the test that holds it instead (#707), as `schedule` is for the pairs:
# `coverage` counts them covered and refuses a scenario that claims one.
# `next_step:fix` is the fix round of a ready pull request whose review
# blocks at its head: the test repository's review is a model's, so no
# scenario can make it block on time, and its fixed change answers that
# round with a stop for a person (never a bug's fix, which the
# bugfix-reproduced lane writes through spec, draft and work).
statically:
  next_step:fix: "scripts/autopilot.py --test: next_step's case 'ready, the review blocks at its head' (fix), and '#563: a review round on the fixed change stops for a person'"

scenarios:
  # Issues, before acceptance.
  - id: issue-complete
    covers: [issue-triage.yml:issues, issue-accepted.yml:issues, issue-claim.yml:issues, issue-repro.yml:issues, waiting-update.yml:issues]
    opens: {issue: {title: "feat: a greeting", body: complete-feature}}
    # Its board says it waits on a maintainer's acceptance (#564).
    expect: {labels: [awaiting-acceptance], absent: [incomplete, accepted], comments: ["<!-- dx-board -->"]}
  - id: issue-incomplete
    covers: [issue-accepted.yml:issue_comment, waiting-update.yml:issue_comment]
    opens: {issue: {title: "something", body: incomplete}}
    steps: [{comment: "It should greet who opens the repository."}]
    expect: {labels: [incomplete], absent: [awaiting-acceptance]}
  # Accepted, sealed, and the autopilot starting.
  - id: accepted-spec
    covers: [next_step:wait:accept, next_step:spec]
    minutes: 15
    opens: {issue: {title: "feat: a greeting", body: complete-feature}}
    steps: [{until: {labels: [awaiting-acceptance]}}, {label: accepted}, {until: {comments: ["<!-- dx-prd-seal -->"]}}]
    # #764: the seal and the pull request the autopilot opens, never its
    # `autopilot` label, which a quick draft has moved past by the time the
    # lane looks.
    expect: {comments: ["<!-- dx-prd-seal -->"], pull: {closes: true}}
  - id: spec-to-draft
    covers: [next_step:draft, next_step:work, next_step:finish, pr-screenshots.yml:pull_request]
    minutes: 15
    opens: {issue: {title: "feat: a greeting, drafted", body: complete-feature}}
    steps: [{until: {labels: [awaiting-acceptance]}}, {label: accepted}, {until: {comments: ["<!-- dx-prd-seal -->"]}}]
    expect: {pull: {closes: true, branch: "^feat/[0-9]+-", title: "^feat(\\(.+\\))?: "}, comments: ["<!-- dx-prd-seal -->"]}
  # The first issue's draft (its fixed change under scenarios/, the test
  # repository's core: kinds/engine-test/pack.yml `core`) stays open while
  # the second is accepted, so the second waits for it. Each is accepted
  # after its triage (#713).
  - id: core-one-at-a-time
    covers: [next_step:wait:core]
    minutes: 15
    before: [{issue: {title: "feat: a greeting on the core, first", body: complete-feature}}]
    opens: {issue: {title: "feat: a greeting on the core, second", body: complete-feature}}
    # #694: until the first one's fixed change is on its pull request (its
    # box ticked), polled every 50 seconds (#726).
    steps: [{until: {of: before, labels: [awaiting-acceptance]}}, {label: accepted, of: before}, {until: {of: before, comments: ["<!-- dx-prd-seal -->"]}},
            {until: {of: before, pull: {closes: true, body: "\\[x\\] \\*\\*C1\\*\\*"}}},
            {until: {labels: [awaiting-acceptance]}}, {label: accepted}, {until: {comments: ["<!-- dx-prd-seal -->"]}}]
    expect: {comments: ["<!-- dx-autopilot-core -->"], labels: [autopilot:core-wait]}
  - id: prd-edited-after-acceptance
    covers: [next_step:wait:answer]
    minutes: 15
    opens: {issue: {title: "feat: a greeting, then edited", body: complete-feature}}
    steps: [{until: {labels: [awaiting-acceptance]}}, {label: accepted}, {until: {comments: ["<!-- dx-prd-seal -->"]}}, {edit: edited-feature}]
    expect: {absent: [accepted], waiting: true}
  # #713: what a decision gets in the test repository, the only one it
  # names: accepted and sealed, no sub-issue of another repository.
  - id: decision-sub-issues
    covers: []
    minutes: 15
    opens: {issue: {title: "Decision: a greeting and a farewell", body: decision}}
    steps: [{until: {labels: [awaiting-acceptance]}}, {label: accepted}, {until: {comments: ["<!-- dx-prd-seal -->"]}}]
    expect: {labels: [accepted], comments: ["<!-- dx-prd-seal -->"]}

  # Claims.
  - id: claim-and-release
    covers: [issue-claim.yml:issue_comment, next_step:wait:claim]
    # #713: claimed before it is accepted, so the autopilot steps aside.
    opens: {issue: {title: "feat: a greeting, claimed", body: complete-feature}}
    steps: [{comment: "/claim"}, {until: {labels: [claimed]}}, {label: accepted}, {comment: "/unclaim"}]
    expect: {absent: [claim:long]}
  - id: claim-pull-request
    covers: [issue-claim.yml:pull_request_target, waiting-update.yml:pull_request_target]
    # Claimed before it is accepted (`comments` go first), so the autopilot
    # steps aside and the hand-written pull request is the claimant's.
    opens: {pull: {title: "feat: a greeting by hand", body: pull, issue: {title: "feat: a greeting, claimed for a hand", body: complete-feature, labels: [accepted], comments: ["/claim"]}}}
    expect: {pull: {closes: true}}

  # Bugs.
  # The test repository's fixed reproduction (#707, its pack's `repro`)
  # fails while scenarios/<scenario>/greeting.md says "helo": this one
  # lands it on main before its issue opens; the other lands none. The fix
  # of a confirmed bug closes the lane's own issue, never the report, so
  # the report's verdict is what it expects; it causes no transition of its
  # own (`next_step:fix` is the review's round: `statically:`). That lane
  # issue carries no mark of its own: `clear` closes it from its report's
  # (release-scenarios.py lane_leftovers).
  - id: bug-reproduced
    covers: []
    minutes: 15
    before: [{lands: greeting, says: helo}]
    opens: {issue: {title: "fix: the greeting says helo", body: bug}}
    expect: {labels: [bug:confirmed], absent: [repro:no-way]}
  - id: bug-not-reproduced
    covers: []
    opens: {issue: {title: "fix: something failed once", body: bug-not-reproduced}}
    expect: {labels: [bug:unconfirmed, could-not-reproduce], absent: [bug:confirmed, repro:no-way]}

  # The autopilot's questions, stops and hints.
  - id: question-answered
    covers: []
    minutes: 15
    opens: {issue: {title: "feat: a greeting, asked", body: complete-feature}}
    steps: [{until: {labels: [awaiting-acceptance]}}, {label: accepted}, {until: {comments: ["<!-- dx-prd-seal -->"]}},
            {until: {pull: {closes: true}}}, {comment: "Option 1."}]
    expect: {absent: [autopilot:waiting, autopilot:continue], pull: {closes: true}}
  - id: stop-hint-continue
    covers: []
    minutes: 15
    opens: {issue: {title: "feat: a greeting, stopped", body: complete-feature}}
    steps: [{until: {labels: [awaiting-acceptance]}}, {label: accepted}, {until: {comments: ["<!-- dx-prd-seal -->"]}},
            {until: {pull: {closes: true}}}, {comment: "Hint: write it in scenarios/."}, {label: autopilot:continue}]
    expect: {absent: [needs-human], pull: {closes: true}}

  # The autopilot's pull request and main.
  # A `push` writes to the head branch of the pull request it observes;
  # `conflict` then lands the same file, otherwise, on main, and `behind`
  # lands a file of its own there: through a second pull request of the
  # scenario that merges (the rulesets refuse a write to main).
  - id: draft-in-conflict
    covers: [next_step:merge-main, next_step:merge-main:conflicted, sweep_step:continue]
    minutes: 15
    opens: {issue: {title: "feat: a greeting, in conflict", body: complete-feature}}
    steps: [{until: {labels: [awaiting-acceptance]}}, {label: accepted}, {until: {comments: ["<!-- dx-prd-seal -->"]}},
            {until: {pull: {closes: true}}}, {push: conflict}]
    expect: {pull: {closes: true}, absent: [needs-human]}
  - id: ready-behind-main
    covers: [next_step:merge-main:clean, sweep_step:update]
    minutes: 15
    opens: {issue: {title: "feat: a greeting, behind", body: complete-feature}}
    steps: [{until: {labels: [awaiting-acceptance]}}, {label: accepted}, {until: {comments: ["<!-- dx-prd-seal -->"]}},
            {until: {pull: {closes: true, body: "\\[x\\] \\*\\*C1\\*\\*"}}}, {push: behind}]
    expect: {pull: {closes: true}}

  # The review, the required checks and the merge queue.
  - id: review-changes-asked
    covers: [conventions.yml:pull_request, claude-review.yml:pull_request, autopilot.yml:pull_request, pull-request-assignee.yml:pull_request, runner-wake.yml:pull_request, waiting-update.yml:pull_request]
    opens: {pull: {title: "feat: a greeting with a secret", body: pull, issue: {title: "feat: a greeting with a secret", body: complete-feature, labels: [accepted]}}}
    steps: [{push: secret}]
    expect: {check: {conventions: success}}
  - id: review-replied
    covers: [review-reply.yml:issue_comment, review-reply.yml:pull_request_review_comment]
    opens: {pull: {title: "docs: a greeting", body: pull, issue: {title: "docs: a greeting", body: task, labels: [accepted]}}}
    steps: [{comment: "@dilux-bot why?"}]
    expect: {comments: ["<!-- dx-review"]}
  # #709: its conventions check reports as "conventions / Conventions
  # (branch, title, commits)" (`check_named`); a run GitHub holds for a
  # maintainer's approval of a fork's fails it at once, named.
  - id: fork-without-secrets
    covers: []
    opens: {pull: {title: "docs: a greeting from a fork", body: pull, fork: true, issue: {title: "docs: a greeting from a fork", body: task, labels: [accepted]}}}
    expect: {check: {conventions: success}, merged: false}
  - id: merge-queue
    covers: [runner-wake.yml:merge_group, next_step:queue, autopilot-sweep.yml:pull_request_target]
    opens: {pull: {title: "docs: a greeting, queued", body: pull, issue: {title: "docs: a greeting, queued", body: task, labels: [accepted]}}}
    steps: [{label: risk:low}]
    expect: {merged: true}
  - id: low-risk-merges
    covers: [auto-merge.yml:pull_request, next_step:wait:merge]
    opens: {pull: {title: "docs: a greeting, low risk", body: pull, issue: {title: "docs: a greeting, low risk", body: task, labels: [accepted]}}}
    expect: {merged: true}
  # #764: its one path, scenarios/high-risk-waits/pull.md, is high risk
  # for kind engine-test (kinds/engine-test/surface.yml `high-risk`), so
  # the review's floor is high from the path (`coverage`: risk_problems).
  - id: high-risk-waits
    covers: []
    opens: {pull: {title: "ci: a greeting in a workflow", body: pull, issue: {title: "ci: a greeting in a workflow", body: task, labels: [accepted]}}}
    expect: {merged: false, labels: [risk:high]}

  # A release, the drift check and adopting.
  - id: release-issue
    covers: []
    opens: {issue: {title: "Release 0.0.1", body: release, labels: [lane:release, accepted]}}
    # #713: the test identity has the write role, and only admin or
    # maintain approves a release: it gets the refusal
    # (issue-accepted.yml's "No release pull request"), and no pull request.
    expect: {comments: ["**No release pull request:**"], pull: false}
  - id: drift-and-adopt
    covers: []
    opens: {issue: {title: "chore: the drift check and adopting", body: complete-feature}}
    expect: {labels: [awaiting-acceptance]}

  # #585: a caller that does not grant a permission the engine asks for:
  # every repository's Issues workflow failed at startup.
  - id: caller-permission-585
    covers: []
    opens: {issue: {title: "feat: a greeting, with the adopted callers", body: complete-feature}}
    expect: {labels: [awaiting-acceptance]}
