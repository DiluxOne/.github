name: Security patches

# A security patch on the version in production, from the shared workflow
# in DiluxOne/.github (#247). Only in the PRIVATE repository that holds the
# security fixes (DiluxOne/security, beside security-fix.yml): until its
# veto window closes, a patch exists nowhere public, and the shared
# workflow refuses to run from a public repository. Once a fix recorded
# here passed its checks and its advisory is a draft, the patch is built on
# the version in production and checked, the maintainers are told when it
# publishes, and unless one adds `patch:hold` to its issue it is pushed to
# security/X.Y.Z in the public repository, released from there, and its
# advisory published.

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-patch
  cancel-in-progress: false

jobs:
  patch:
    # A schedule runs on the default branch; a dispatch, only from it.
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
    uses: DiluxOne/.github/.github/workflows/security-patch.yml@v5
    secrets:
      DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
