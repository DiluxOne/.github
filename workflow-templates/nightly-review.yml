name: Nightly review

# The nightly review of existing code, from the shared workflow in
# DiluxOne/.github (#234). Only in a PRIVATE repository that does nothing
# else (DiluxOne/security): what it finds can be a vulnerability, and the
# shared workflow refuses to run from a public one. Each night one
# repository is reviewed whole; its findings join one list per repository,
# an issue here, for a maintainer to pick from.

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      repository:
        description: The repository to review instead of today's turn (its name).
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: nightly-review
  cancel-in-progress: false

jobs:
  review:
    # A schedule runs on the default branch; a dispatch, only from it.
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    permissions: {}
    uses: DiluxOne/.github/.github/workflows/nightly-review.yml@v6
    with:
      repository: ${{ inputs.repository || '' }}
    secrets:
      DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
      DILUX_SECURITY_PRIVATE_KEY: ${{ secrets.DILUX_SECURITY_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
