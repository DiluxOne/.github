name: Security fixes

# A security advisory's fix, written in its temporary private fork, from the
# shared workflow in DiluxOne/.github (#194). Only in a PRIVATE repository
# that does nothing else (DiluxOne/security): the runs' logs and artifacts
# carry embargoed vulnerabilities, and the shared workflow refuses to run
# from a public one. A maintainer accepting an advisory (starting its
# temporary private fork on its page) starts its fix; a maintainer merges it and publishes the advisory from its
# page.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-fix
  cancel-in-progress: false

jobs:
  fix:
    # A schedule runs on the default branch; a dispatch, only from it.
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
    uses: DiluxOne/.github/.github/workflows/security-fix.yml@v5
    secrets:
      DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
