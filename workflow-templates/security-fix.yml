name: Security fixes

# A security advisory's fix, written in this private repository, from the
# shared workflow in DiluxOne/.github (#194). Only in a PRIVATE repository
# that does nothing else (DiluxOne/security): the runs' logs and artifacts
# carry embargoed vulnerabilities, and the shared workflow refuses to run
# from a public one. An advisory in triage or draft starts its fix, which
# lands here as an issue and a branch; one in triage is triaged first and
# moved to draft when it is reproduced and fixed; a fix whose checks fail
# goes back to the agent when a maintainer answers on its issue here what to
# change (the comment starts a run). security-patch.yml then
# publishes it once a maintainer approves it (DiluxOne/.github#247, #287).
# The advisories are read and moved with dilux-security's key, which lives
# only here.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  # A maintainer's answer on a failed fix's issue sends it back now, not
  # at the next hour (DiluxOne/.github#313).
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: security-fix
  cancel-in-progress: false

jobs:
  fix:
    # A schedule and a comment run on the default branch; a dispatch, only
    # from it. The bot's own comments start nothing.
    if: (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch) && (github.event_name != 'issue_comment' || github.event.comment.user.type != 'Bot')
    permissions:
      contents: read
    uses: DiluxOne/.github/.github/workflows/security-fix.yml@v7
    secrets:
      DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
      DILUX_SECURITY_PRIVATE_KEY: ${{ secrets.DILUX_SECURITY_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
