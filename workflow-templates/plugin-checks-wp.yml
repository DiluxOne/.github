name: Plugin checks

# The checks of a WordPress plugin, from the shared workflows in
# DiluxOne/.github: the fast quality gates and the slow wp-env suites, on
# every pull request (where the repository has a merge queue, the slow
# suites run in the queue's group instead, #451), on a push to the default
# branch, once a week and by hand. The conventions, the accepted-issue gate, the Claude review and the
# auto-merge decision are the organisation's (org-pull-request.yml, required
# by its ruleset): nothing of them here. Fill in slug and version-constant,
# and declare the kind in .github/review-policy.yml (`kind: wordpress-plugin`).
# The PHP versions are the kind's, not the caller's: every tool on the
# latest, the code held to the pack's minimum (kinds/wordpress-plugin/pack.yml).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # A merge queue's group (#451): the checks it requires run on it too, and
  # where the repository has a queue the slow suites run here, not on the
  # pull request.
  merge_group:
    types: [checks_requested]
  push:
    branches: [$default-branch]
  # Once a week, and by hand, everything runs whatever changed: the suites
  # against today's WordPress and tools. A failure opens (or updates) one issue.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    permissions:
      contents: read
      pull-requests: read # the push to main looks up the pull request it came from
      checks: read # and the checks of its head
    uses: DiluxOne/.github/.github/workflows/plugin-checks-wp.yml@v6
    with:
      slug: my-plugin
      version-constant: MY_PLUGIN_VERSION
      # translations-complete: true               # the plugin ships languages/*.po
      # codeql-languages: javascript-typescript   # CodeQL on the plugin's scripts
      # A required plugin (Requires Plugins) wordpress.org does not have yet:
      # requires-plugins-from: base-plugin=DiluxOne/base-plugin-wordpress@main
    # secrets:
    #   DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}   # with requires-plugins-from

  tests:
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: DiluxOne/.github/.github/workflows/plugin-tests-wp.yml@v6
    # One check per target and suite. Left out: integration on a network,
    # and `npx playwright test` on a single site.
    # with:
    #   integration-targets: '["single","network"]'
    #   e2e-suites: >-
    #     [{"name":"single","site":"single","run":"npx playwright test"},
    #      {"name":"network","site":"network","run":"npx playwright test -c playwright.network.config.ts","results":"build/e2e-network-results"}]
    #   # An add-on: the plugin it needs, mounted and activated before it.
    #   requires-plugins-from: base-plugin=DiluxOne/base-plugin-wordpress@main
    # secrets:
    #   DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}   # with requires-plugins-from

  weekly-failure:
    needs: [checks, tests]
    if: ${{ !cancelled() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    permissions:
      contents: read
      issues: write
    uses: DiluxOne/.github/.github/workflows/weekly-failure.yml@v6
    secrets:
      DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
