name: Issues

# What happens to an issue, from the shared workflows in DiluxOne/.github: the
# triage classifies it when it opens (from docs/roadmap.md and the docs) and
# the reproduction job tries to write a failing unit test when the triage
# labels it bug:unconfirmed. Fill in support-url.

on:
  issues:
    types: [opened, labeled]
  schedule:
    - cron: '0 13 * * *'

permissions:
  contents: read

jobs:
  triage:
    permissions:
      contents: read
      issues: write
    uses: DiluxOne/.github/.github/workflows/issue-triage.yml@v1
    with:
      support-url: https://example.com/support
    secrets: inherit

  repro:
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: DiluxOne/.github/.github/workflows/issue-repro.yml@v1
    secrets: inherit
