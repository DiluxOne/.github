name: Pull request

# Every check a pull request to this WordPress plugin goes through, from the
# shared workflows in DiluxOne/.github: conventions, the fast quality gates,
# then the Claude review and the auto-merge decision, with the slow wp-env
# suites running alongside the review. Fill in slug, version-constant and
# retired-names, and declare the kind in .github/review-policy.yml
# (`kind: wordpress-plugin`): its rules and settings live in
# DiluxOne/.github's kinds/wordpress-plugin/.

on:
  # An edit of the title or description is handled by pull-request-edited.yml
  # (conventions, review and the auto-merge decision only), so the suites keep
  # the verdict they gave the code.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [$default-branch]
  # Once a week, and by hand, everything runs whatever changed: the suites
  # against today's WordPress and tools. A failure opens (or updates) one issue.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conventions:
    permissions:
      contents: read
      pull-requests: read # the pull request's timeline, for the base-branch check on `edited`
      issues: read # the issues it closes, for the accepted-issue gate
    uses: DiluxOne/.github/.github/workflows/conventions.yml@v4
    with:
      retired-names: '' # e.g. 'old product name|OLD_PREFIX_'; empty to skip

  checks:
    permissions:
      contents: read
      pull-requests: read # the push to main looks up the pull request it came from
      checks: read # and the checks of its head
    uses: DiluxOne/.github/.github/workflows/plugin-checks-wp.yml@v4
    with:
      slug: my-plugin
      version-constant: MY_PLUGIN_VERSION
      # translations-complete: true               # the plugin ships languages/*.po
      # codeql-languages: javascript-typescript   # CodeQL on the plugin's scripts

  tests:
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: DiluxOne/.github/.github/workflows/plugin-tests-wp.yml@v4
    # One check per target and suite. Left out: integration on a network,
    # and `npx playwright test` on a single site.
    # with:
    #   integration-targets: '["single","network"]'
    #   e2e-suites: >-
    #     [{"name":"single","site":"single","run":"npx playwright test"},
    #      {"name":"network","site":"network","run":"npx playwright test -c playwright.network.config.ts","results":"build/e2e-network-results"}]

  review:
    needs: [conventions, checks]
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: DiluxOne/.github/.github/workflows/claude-review.yml@v4
    with:
      profile: plugin-wp # the wordpress-plugin kind's profile; `kind: wordpress-plugin` in .github/review-policy.yml does the same
    secrets: inherit

  auto-merge:
    needs: review
    if: always() && needs.review.result != 'skipped'
    uses: DiluxOne/.github/.github/workflows/auto-merge.yml@v4
    with:
      risk: ${{ needs.review.outputs.risk }}
      complexity: ${{ needs.review.outputs.complexity }}
      floor: ${{ needs.review.outputs.floor }}
      trusted: ${{ needs.review.outputs.trusted }}
      blocking: ${{ needs.review.outputs.blocking }}
      description-ok: ${{ needs.review.outputs.description-ok }}
      enabled: ${{ needs.review.outputs.auto-merge }}
    secrets: inherit

  weekly-failure:
    needs: [checks, tests]
    if: ${{ !cancelled() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    permissions:
      contents: read
      issues: write
    uses: DiluxOne/.github/.github/workflows/weekly-failure.yml@v4
