name: Pull request

# Every check a pull request to this WordPress plugin goes through, from the
# shared workflows in DiluxOne/.github: conventions, the fast quality gates,
# then the Claude review and the auto-merge decision, with the slow wp-env
# suites running alongside the review. Fill in slug, version-constant and
# retired-names.

on:
  # An edit of the title or description is handled by pull-request-edited.yml
  # (conventions, review and the auto-merge decision only), so the suites keep
  # the verdict they gave the code.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [$default-branch]
  # Once a week, and by hand, everything runs whatever changed: the suites
  # against today's WordPress and tools. A failure opens (or updates) one issue.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conventions:
    uses: DiluxOne/.github/.github/workflows/conventions.yml@v1
    with:
      retired-names: '' # e.g. 'old product name|OLD_PREFIX_'; empty to skip

  checks:
    permissions:
      contents: read
      pull-requests: read # the push to main looks up the pull request it came from
    uses: DiluxOne/.github/.github/workflows/plugin-checks-wp.yml@v1
    with:
      slug: my-plugin
      version-constant: MY_PLUGIN_VERSION

  tests:
    permissions:
      contents: read
      pull-requests: read
    uses: DiluxOne/.github/.github/workflows/plugin-tests-wp.yml@v1

  review:
    needs: [conventions, checks]
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: DiluxOne/.github/.github/workflows/claude-review.yml@v1
    with:
      profile: plugin-wp
    secrets: inherit

  auto-merge:
    needs: review
    if: always() && needs.review.result != 'skipped'
    uses: DiluxOne/.github/.github/workflows/auto-merge.yml@v1
    with:
      risk: ${{ needs.review.outputs.risk }}
      complexity: ${{ needs.review.outputs.complexity }}
      floor: ${{ needs.review.outputs.floor }}
      trusted: ${{ needs.review.outputs.trusted }}
      blocking: ${{ needs.review.outputs.blocking }}
      description-ok: ${{ needs.review.outputs.description-ok }}
      enabled: ${{ needs.review.outputs.auto-merge }}
    secrets: inherit

  weekly-failure:
    needs: [checks, tests]
    if: ${{ !cancelled() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    permissions:
      contents: read
      issues: write
    uses: DiluxOne/.github/.github/workflows/weekly-failure.yml@v1
